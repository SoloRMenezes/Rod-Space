<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .piano {
            display: flex;
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            position: relative;
        }

        .key {
            width: 50px;
            height: 200px;
            background: linear-gradient(to bottom, #eee 0%, #fff 100%);
            border: 1px solid #94a3b8;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            color: #64748b;
            font-weight: bold;
            transition: transform 0.05s, box-shadow 0.05s, background 0.1s;
            user-select: none;
            position: relative;
        }

        .key.black {
            width: 34px;
            height: 120px;
            background: linear-gradient(to bottom, #334155 0%, #1e293b 100%);
            border: none;
            margin-left: -17px;
            margin-right: -17px;
            z-index: 2;
            color: #94a3b8;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .piano { padding: 35px; }
            .key { width: 80px; height: 300px; font-size: 1.2rem; }
            .key.black { width: 54px; height: 180px; margin-left: -27px; margin-right: -27px; }
        }

        .key:active, .key.active {
            background: #8fc0e3;
            color: #020617;
            transform: translateY(6px);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }

        .key.black:active, .key.black.active {
            background: #475569;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="piano">
        <div class="key" data-note="261.63" data-key="a">A</div>
        <div class="key black" data-note="277.18" data-key="w">W</div>
        <div class="key" data-note="293.66" data-key="s">S</div>
        <div class="key black" data-note="311.13" data-key="e">E</div>
        <div class="key" data-note="329.63" data-key="d">D</div>
        <div class="key" data-note="349.23" data-key="f">F</div>
        <div class="key black" data-note="369.99" data-key="t">T</div>
        <div class="key" data-note="392.00" data-key="g">G</div>
        <div class="key black" data-note="415.30" data-key="y">Y</div>
        <div class="key" data-note="440.00" data-key="h">H</div>
        <div class="key black" data-note="466.16" data-key="u">U</div>
        <div class="key" data-note="493.88" data-key="j">J</div>
        <div class="key" data-note="523.25" data-key="k">K</div>
        <div class="key black" data-note="554.37" data-key="o">O</div>
        <div class="key" data-note="587.33" data-key="l">L</div>
        <div class="key black" data-note="622.25" data-key="p">P</div>
        <div class="key" data-note="659.25" data-key="ç">Ç</div>
    </div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isSustaining = false;
    let isSoft = false;
    const activeNotes = new Set();

    function playPianoNote(freq) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        
        const osc = audioCtx.createOscillator();
        const masterGain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        
        const volume = isSoft ? 0.15 : 0.4;
        // Natural decay is short (1.5s), Sustained decay is long (4.0s)
        const decayTime = isSustaining ? 4.0 : (isSoft ? 0.4 : 1.5);

        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(volume, now + 0.02);
        
        // Always set an exponential ramp to stop so notes don't ring forever
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + decayTime);

        osc.connect(masterGain);
        masterGain.connect(audioCtx.destination);
        
        osc.start(now);
        osc.stop(now + decayTime);
        
        const noteObj = { osc, gain: masterGain, startTime: now };
        activeNotes.add(noteObj);

        // Cleanup the set once the note has naturally faded out
        setTimeout(() => activeNotes.delete(noteObj), decayTime * 1000);
    }

    function stopSustain() {
        const now = audioCtx.currentTime;
        activeNotes.forEach(note => {
            // Quickly fade out whatever is currently ringing when Shift is released
            note.gain.gain.cancelScheduledValues(now);
            note.gain.gain.setValueAtTime(note.gain.gain.value, now);
            note.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
            note.osc.stop(now + 0.3);
        });
        activeNotes.clear();
    }

    const handleInput = (el) => {
        if (!el) return;
        playPianoNote(parseFloat(el.dataset.note));
        el.classList.add('active');
    };

    const removeActive = (el) => el && el.classList.remove('active');

    document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('mousedown', () => handleInput(key));
        key.addEventListener('mouseup', () => removeActive(key));
        key.addEventListener('mouseleave', () => removeActive(key));
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Shift') {
            isSustaining = true;
            return;
        }
        if (e.key === 'Control') {
            isSoft = true;
            return;
        }
        if (e.repeat) return;
        const keyVal = e.key === 'Ç' || e.key === 'ç' ? 'ç' : e.key.toLowerCase();
        const keyEl = document.querySelector(`.key[data-key="${keyVal}"]`);
        handleInput(keyEl);
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'Shift') {
            isSustaining = false;
            stopSustain();
            return;
        }
        if (e.key === 'Control') {
            isSoft = false;
            return;
        }
        const keyVal = e.key === 'Ç' || e.key === 'ç' ? 'ç' : e.key.toLowerCase();
        const keyEl = document.querySelector(`.key[data-key="${keyVal}"]`);
        removeActive(keyEl);
    });
</script>
  <script src="assets/language-toggle.js" defer></script>
</body>
</html>
