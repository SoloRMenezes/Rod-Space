<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;color:#edf0ed;font:15px system-ui,sans-serif;touch-action:none}main{position:fixed;inset:0}.controls{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px;padding:6px;background:#101618cc;border:1px solid #52605c;border-radius:9px;backdrop-filter:blur(8px)}button{font:inherit;color:inherit;background:#222a2b;border:1px solid #64716e;border-radius:6px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{color:#17211d;background:#bbddcb}label{display:flex;align-items:center}.controls label span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}input{accent-color:#bbddcb;width:78px}.piano{position:absolute;inset:0;display:flex;width:100%;padding:0;background:#080b0d;touch-action:none;user-select:none;-webkit-user-select:none}.key{flex:1;min-width:0;height:100%;padding:0;border:1px solid #89938f;border-top:0;border-radius:0 0 6px 6px;background:#eeeae0;color:transparent;touch-action:none}.key.black{position:absolute;top:0;width:6%;height:62%;z-index:2;background:#252c2c;color:transparent;border-color:#060909;box-shadow:0 6px 0 #080b0d}.key.active{background:#b4dcca;box-shadow:inset 0 8px 14px #36483d66}.key.black.active{background:#638e7b;box-shadow:0 2px 0 #080b0d}.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}@media(max-width:600px){.controls{top:auto;bottom:max(8px,env(safe-area-inset-bottom));padding:4px}.controls button{padding:7px 9px}.controls input{width:62px}.key.black{height:58%;width:6.5%}}
</style>
<link rel="stylesheet" href="assets/rod-space-home.css">
<script defer src="assets/rod-space-home.js"></script>
</head>
<body><main>
<div class="controls"><button id="sustain" aria-pressed="false">Sustain</button><label><span>Volume</span><input id="volume" aria-label="Volume" type="range" min="0" max="100" value="65"></label></div>
<div class="piano" id="piano" aria-label="Piano keyboard"></div>
<div id="status" class="visually-hidden" role="status"></div>
</main>
<script>
const notes=[['C4','a',60],['C♯','w',61],['D4','s',62],['D♯','e',63],['E4','d',64],['F4','f',65],['F♯','t',66],['G4','g',67],['G♯','y',68],['A4','h',69],['A♯','u',70],['B4','j',71],['C5','k',72],['C♯','o',73],['D5','l',74],['D♯','p',75],['E5',';',76]];
const piano=document.getElementById('piano'), sustainButton=document.getElementById('sustain'), volume=document.getElementById('volume');
const keyMap=new Map(), held=new Map(), voices=new Set();let audio,master,compressor,sustain=false,shift=false;
let white=0;
for(const [name,letter,midi] of notes){const black=name.includes('♯');const key=document.createElement('button');key.className='key'+(black?' black':'');key.dataset.midi=midi;key.setAttribute('aria-label',name+' ('+letter.toUpperCase()+')');if(black)key.style.left=`calc(${white/10*100}% - 3%)`;else white++;keyMap.set(letter,key);piano.append(key);}
keyMap.set('ç',keyMap.get(';'));
function ensureAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=Number(volume.value)/100*.32;compressor=audio.createDynamicsCompressor();master.connect(compressor);compressor.connect(audio.destination);}if(audio.state==='suspended')audio.resume().catch(()=>{document.getElementById('status').textContent='Tap a key to enable sound.';});}
function paint(key){key.classList.toggle('active',[...held.values()].some(v=>v.key===key));}
function release(voice,immediate=false){if(voice.released)return;voice.released=true;const t=audio.currentTime;voice.gain.gain.cancelScheduledValues(t);voice.gain.gain.setTargetAtTime(.0001,t,immediate?.015:.12);for(const osc of voice.oscs)osc.stop(t+(immediate?.08:.7));}
function noteOff(id){const v=held.get(id);if(!v)return;held.delete(id);paint(v.key);if(!sustain&&!shift)release(v);}
function noteOn(id,key){if(held.get(id)?.key===key)return;noteOff(id);if(!key)return;try{ensureAudio();}catch{document.getElementById('status').textContent='Audio is unavailable in this browser.';return;}if(voices.size>=32)release([...voices].find(v=>!v.released)||[...voices][0],true);
const gain=audio.createGain(),t=audio.currentTime,f=440*2**((Number(key.dataset.midi)-69)/12);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.55,t+.008);gain.gain.exponentialRampToValueAtTime(.18,t+.3);gain.gain.exponentialRampToValueAtTime(.001,t+7);gain.connect(master);
const partials=[];const oscs=[1,2,3].map((harmonic,i)=>{const osc=audio.createOscillator(),partial=audio.createGain();osc.type='sine';osc.frequency.value=f*harmonic;partials.push(partial);partial.gain.value=[1,.24,.08][i];osc.connect(partial);partial.connect(gain);osc.start(t);osc.stop(t+8);osc.onended=()=>{osc.disconnect();partial.disconnect();};return osc;});
const voice={key,gain,oscs,released:false};oscs[0].onended=()=>{oscs[0].disconnect();partials[0].disconnect();gain.disconnect();voices.delete(voice);};voices.add(voice);held.set(id,voice);paint(key);document.getElementById('status').textContent='';}
function updateSustain(){sustainButton.setAttribute('aria-pressed',String(sustain||shift));if(!sustain&&!shift)for(const v of voices)if(![...held.values()].includes(v))release(v);}
sustainButton.onclick=()=>{sustain=!sustain;updateSustain();};volume.oninput=()=>{if(master)master.gain.setTargetAtTime(Number(volume.value)/100*.32,audio.currentTime,.02);};
piano.addEventListener('pointerdown',e=>{if(e.button!==0)return;const key=e.target.closest('.key');if(!key)return;e.preventDefault();piano.setPointerCapture(e.pointerId);noteOn('p'+e.pointerId,key);});
piano.addEventListener('pointermove',e=>{if(!piano.hasPointerCapture(e.pointerId))return;const key=document.elementFromPoint(e.clientX,e.clientY)?.closest('.key');noteOn('p'+e.pointerId,key&&piano.contains(key)?key:null);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])piano.addEventListener(event,e=>noteOff('p'+e.pointerId));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='Shift'){shift=true;updateSustain();return;}const key=keyMap.get(e.key.toLowerCase());if(key&&!e.repeat){e.preventDefault();noteOn('k'+e.code,key);}});
addEventListener('keyup',e=>{if(e.key==='Shift'){shift=false;updateSustain();}noteOff('k'+e.code);});
function silence(){for(const id of [...held.keys()])noteOff(id);for(const v of voices)release(v,true);shift=false;updateSustain();}
addEventListener('blur',silence);document.addEventListener('visibilitychange',()=>{if(document.hidden)silence();});
</script></body></html>
