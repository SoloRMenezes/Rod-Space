<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111518;color:#edf0ed;font:15px system-ui,sans-serif}
body{height:100svh;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(4px,1vw,12px) max(5px,env(safe-area-inset-right)) clamp(4px,1vw,12px) max(5px,env(safe-area-inset-left));touch-action:manipulation}
main{width:100%;height:100%;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.piano{position:relative;display:flex;width:100%;max-width:none;height:min(76svh,660px);padding:clamp(4px,.75vw,10px);background:#080b0d;border-radius:9px;touch-action:none;user-select:none;-webkit-user-select:none}
.key{flex:1;min-width:0;height:100%;padding:0 0 clamp(7px,1.5vh,16px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;border:1px solid #99a39f;border-radius:0 0 5px 5px;background:#eeeae0;color:#424b48;touch-action:none;font:clamp(11px,1.5vw,18px) system-ui,sans-serif}
.key.black{position:absolute;top:clamp(4px,.75vw,10px);width:6%;height:60%;z-index:2;background:#252c2c;color:#d4ddd8;border-color:#060909;box-shadow:0 5px 0 #080b0d}
.key.active{background:#b4dcca;color:#162a21;box-shadow:inset 0 5px 8px #36483d55}
.key.black.active{background:#638e7b;color:white;box-shadow:0 2px 0 #080b0d}
.key small{opacity:.6;font-size:clamp(8px,.95vw,11px)}
#status{position:absolute;bottom:2px;left:0;right:0;color:#dbb583;text-align:center;font-size:12px;pointer-events:none}
#status:empty{display:none}
@media(max-width:700px){
 body{padding:3px max(3px,env(safe-area-inset-right)) 3px max(3px,env(safe-area-inset-left))}
 .piano{height:83svh;padding:5px 3px 3px;border-radius:5px}
 .key{font-size:clamp(9px,2.55vw,14px);padding-bottom:7px;gap:3px}
 .key.black{top:5px;height:58%;font-size:clamp(8px,2.2vw,11px)}
 .key small{display:none}
}
@media(orientation:landscape) and (max-height:600px){
 .piano{height:94svh;padding:4px 3px 3px}
 .key{padding-bottom:5px}
 .key.black{top:4px;height:60%}
}
@media(max-width:350px){
 .key{font-size:9px}
 .key.black{font-size:8px}
}
</style>
</head>
<body><main>
<div class="piano" id="piano" aria-label="Piano keyboard"></div>
<div id="status" role="status" aria-live="polite"></div>
</main>
<script>
const notes=[['C4','a',60],['C♯','w',61],['D4','s',62],['D♯','e',63],['E4','d',64],['F4','f',65],['F♯','t',66],['G4','g',67],['G♯','y',68],['A4','h',69],['A♯','u',70],['B4','j',71],['C5','k',72],['C♯','o',73],['D5','l',74],['D♯','p',75],['E5',';',76]];
const piano=document.getElementById('piano');
const keyMap=new Map(), held=new Map(), voices=new Set();let audio,master,compressor,shift=false;
let white=0;
for(const [name,letter,midi] of notes){const black=name.includes('♯');const key=document.createElement('button');key.className='key'+(black?' black':'');key.dataset.midi=midi;key.setAttribute('aria-label',name+' ('+letter.toUpperCase()+')');key.innerHTML=name+'<small>'+letter.toUpperCase()+'</small>';if(black)key.style.left=`calc(3px + (100% - 6px) * ${white/10} - 3%)`;else white++;keyMap.set(letter,key);piano.append(key);}
keyMap.set('ç',keyMap.get(';'));
function ensureAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.65*.32;compressor=audio.createDynamicsCompressor();master.connect(compressor);compressor.connect(audio.destination);}if(audio.state==='suspended')audio.resume().catch(()=>{document.getElementById('status').textContent='Tap a key to enable sound.';});}
function paint(key){key.classList.toggle('active',[...held.values()].some(v=>v.key===key));}
function release(voice,immediate=false){if(voice.released)return;voice.released=true;const t=audio.currentTime;voice.gain.gain.cancelScheduledValues(t);voice.gain.gain.setTargetAtTime(.0001,t,immediate?.015:.12);for(const osc of voice.oscs)osc.stop(t+(immediate?.08:.7));}
function noteOff(id){const v=held.get(id);if(!v)return;held.delete(id);paint(v.key);if(!shift)release(v);}
function noteOn(id,key){if(held.get(id)?.key===key)return;noteOff(id);if(!key)return;try{ensureAudio();}catch{document.getElementById('status').textContent='Audio is unavailable in this browser.';return;}if(voices.size>=32)release([...voices].find(v=>!v.released)||[...voices][0],true);
const gain=audio.createGain(),t=audio.currentTime,f=440*2**((Number(key.dataset.midi)-69)/12);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.55,t+.008);gain.gain.exponentialRampToValueAtTime(.18,t+.3);gain.gain.exponentialRampToValueAtTime(.001,t+7);gain.connect(master);
const partials=[];const oscs=[1,2,3].map((harmonic,i)=>{const osc=audio.createOscillator(),partial=audio.createGain();osc.type='sine';osc.frequency.value=f*harmonic;partials.push(partial);partial.gain.value=[1,.24,.08][i];osc.connect(partial);partial.connect(gain);osc.start(t);osc.stop(t+8);osc.onended=()=>{osc.disconnect();partial.disconnect();};return osc;});
const voice={key,gain,oscs,released:false};oscs[0].onended=()=>{oscs[0].disconnect();partials[0].disconnect();gain.disconnect();voices.delete(voice);};voices.add(voice);held.set(id,voice);paint(key);document.getElementById('status').textContent='';}
function updateSustain(){if(!shift)for(const v of voices)if(![...held.values()].includes(v))release(v);}

piano.addEventListener('pointerdown',e=>{if(e.button!==0)return;const key=e.target.closest('.key');if(!key)return;e.preventDefault();piano.setPointerCapture(e.pointerId);noteOn('p'+e.pointerId,key);});
piano.addEventListener('pointermove',e=>{if(!piano.hasPointerCapture(e.pointerId))return;const key=document.elementFromPoint(e.clientX,e.clientY)?.closest('.key');noteOn('p'+e.pointerId,key&&piano.contains(key)?key:null);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])piano.addEventListener(event,e=>noteOff('p'+e.pointerId));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='Shift'){shift=true;updateSustain();return;}const key=keyMap.get(e.key.toLowerCase());if(key&&!e.repeat){e.preventDefault();noteOn('k'+e.code,key);}});
addEventListener('keyup',e=>{if(e.key==='Shift'){shift=false;updateSustain();}noteOff('k'+e.code);});
function silence(){for(const id of [...held.keys()])noteOff(id);for(const v of voices)release(v,true);shift=false;updateSustain();}
addEventListener('blur',silence);document.addEventListener('visibilitychange',()=>{if(document.hidden)silence();});
</script><script src="rod-space-app-menu.js"></script></body></html>
