<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .piano {
            display: flex;
            background: #020617;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            position: relative;
        }

        .key {
            width: 60px;
            height: 220px;
            background: linear-gradient(to bottom, #eee 0%, #fff 100%);
            border: 1px solid #94a3b8;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            color: #64748b;
            font-weight: bold;
            transition: transform 0.05s, box-shadow 0.05s;
            user-select: none;
            position: relative;
        }

        .key.black {
            width: 40px;
            height: 135px;
            background: linear-gradient(to bottom, #334155 0%, #1e293b 100%);
            border: none;
            margin-left: -20px;
            margin-right: -20px;
            z-index: 2;
            color: #94a3b8;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        .key:active, .key.active {
            background: #8fc0e3;
            color: #020617;
            transform: translateY(4px);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }

        .key.black:active, .key.black.active {
            background: #475569;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="piano">
        <div class="key" data-note="261.63" data-key="a">A</div>
        <div class="key black" data-note="277.18" data-key="w">W</div>
        <div class="key" data-note="293.66" data-key="s">S</div>
        <div class="key black" data-note="311.13" data-key="e">E</div>
        <div class="key" data-note="329.63" data-key="d">D</div>
        <div class="key" data-note="349.23" data-key="f">F</div>
        <div class="key black" data-note="369.99" data-key="t">T</div>
        <div class="key" data-note="392.00" data-key="g">G</div>
        <div class="key black" data-note="415.30" data-key="y">Y</div>
        <div class="key" data-note="440.00" data-key="h">H</div>
        <div class="key black" data-note="466.16" data-key="u">U</div>
        <div class="key" data-note="493.88" data-key="j">J</div>
        <div class="key" data-note="523.25" data-key="k">K</div>
        <div class="key black" data-note="554.37" data-key="o">O</div>
        <div class="key" data-note="587.33" data-key="l">L</div>
        <div class="key black" data-note="622.25" data-key="p">P</div>
        <div class="key" data-note="659.25" data-key="ç">Ç</div>
    </div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPianoNote(freq) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const now = audioCtx.currentTime;
        
        // Main Oscillator (Body of the note)
        const osc = audioCtx.createOscillator();
        const masterGain = audioCtx.createGain();
        
        // Piano-like timbre uses a square wave filtered down or a triangle wave
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        
        // Attack, Decay, Sustain, Release (ADSR)
        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(0.4, now + 0.02); // Quick attack
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5); // Long decay
        
        // Add a second oscillator for harmonics (richer sound)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 2, now); // Octave up
        gain2.gain.setValueAtTime(0.1, now);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

        osc.connect(masterGain);
        osc2.connect(gain2);
        gain2.connect(masterGain);
        masterGain.connect(audioCtx.destination);
        
        osc.start(now);
        osc2.start(now);
        osc.stop(now + 1.5);
        osc2.stop(now + 1.5);
    }

    const handleInput = (el) => {
        if (!el) return;
        playPianoNote(parseFloat(el.dataset.note));
        el.classList.add('active');
    };

    const removeActive = (el) => el && el.classList.remove('active');

    // Mouse/Touch
    document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('mousedown', () => handleInput(key));
        key.addEventListener('mouseup', () => removeActive(key));
        key.addEventListener('mouseleave', () => removeActive(key));
        key.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            handleInput(key); 
        }, {passive: false});
        key.addEventListener('touchend', () => removeActive(key));
    });

    // Keyboard
    window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        const keyVal = e.key === 'Ç' || e.key === 'ç' ? 'ç' : e.key.toLowerCase();
        const keyEl = document.querySelector(`.key[data-key="${keyVal}"]`);
        handleInput(keyEl);
    });

    window.addEventListener('keyup', (e) => {
        const keyVal = e.key === 'Ç' || e.key === 'ç' ? 'ç' : e.key.toLowerCase();
        const keyEl = document.querySelector(`.key[data-key="${keyVal}"]`);
        removeActive(keyEl);
    });
</script>
</body>
</html>
