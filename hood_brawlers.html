<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hood Brawlers: Pro Edition</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            border: 6px solid #222;
            width: 1024px;
            height: 576px;
            background: #000;
            border-radius: 8px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            backdrop-filter: blur(4px);
        }

        #start-screen {
            display: flex;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }

        #char-select-screen {
            display: none;
            flex-direction: row;
            background: #0f172a;
        }

        .select-half {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            transition: all 0.3s;
        }

        .ui-layer {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
            z-index: 2;
        }

        .health-wrapper {
            width: 420px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .health-bar-bg {
            width: 100%;
            height: 35px;
            background: #111;
            border: 3px solid #333;
            position: relative;
            overflow: hidden;
            transform: skewX(-15deg);
        }

        .health-bar-ghost {
            position: absolute;
            height: 100%;
            background: #ff4757;
            width: 100%;
            transition: width 0.8s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .health-bar {
            position: absolute;
            height: 100%;
            width: 100%;
            transition: width 0.1s ease-out;
            z-index: 1;
        }

        #p1-health { background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%); }
        #p2-health { background: linear-gradient(90deg, #f85032 0%, #e73827 100%); }

        #timer {
            width: 80px;
            height: 80px;
            background: #222;
            border: 4px solid #fde047;
            color: #fde047;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            margin: 0 20px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.3);
        }

        .player-label {
            position: absolute;
            bottom: -25px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
        }
        #p1-label { left: 0; color: #00d2ff; }
        #p2-label { right: 0; color: #f85032; }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            text-align: center;
            display: none;
            text-shadow: 0 0 30px rgba(0,0,0,1);
            z-index: 10;
            font-weight: 900;
        }

        .btn {
            padding: 15px 45px;
            font-size: 20px;
            cursor: pointer;
            background: #fde047;
            border: none;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            margin-top: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 0 #ca8a04;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ca8a04;
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .color-option {
            width: 45px;
            height: 45px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 50%;
        }

        .color-option.selected {
            border-color: #fff;
            transform: scale(1.2);
        }

        .opening-title {
            font-size: 100px;
            margin-bottom: 20px;
            font-style: italic;
            background: linear-gradient(#fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        canvas { display: none; }

        .preview-box {
            width: 120px;
            height: 220px;
            border: 4px solid #334155;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="start-screen" class="screen">
            <h1 class="opening-title">HOOD BRAWLERS</h1>
            <p style="color: #64748b; margin-top: -10px; letter-spacing: 5px;">STREET FIGHTER PROTO</p>
            <button class="btn" onclick="showCharacterSelect()">Start Game</button>
        </div>

        <div id="char-select-screen" class="screen">
            <div class="select-half" id="p1-select">
                <h2 style="color: #00d2ff; margin-bottom: 30px;">P1 SELECT</h2>
                <div id="p1-preview" class="preview-box"></div>
                <div class="color-picker-grid" id="p1-pickers"></div>
                <button class="btn" id="p1-ready-btn" onclick="setReady(1)">Ready Up</button>
            </div>
            <div class="select-half" id="p2-select">
                <h2 style="color: #f85032; margin-bottom: 30px;">P2 SELECT</h2>
                <div id="p2-preview" class="preview-box"></div>
                <div class="color-picker-grid" id="p2-pickers"></div>
                <button class="btn" id="p2-ready-btn" onclick="setReady(2)">Ready Up</button>
            </div>
        </div>

        <div class="ui-layer" id="game-ui" style="display: none;">
            <div class="health-wrapper">
                <div class="health-bar-bg">
                    <div id="p1-ghost" class="health-bar-ghost"></div>
                    <div id="p1-health" class="health-bar"></div>
                </div>
                <div class="player-label" id="p1-label">Player 1</div>
            </div>
            
            <div id="timer">99</div>

            <div class="health-wrapper">
                <div class="health-bar-bg" style="transform: skewX(15deg);">
                    <div id="p2-ghost" class="health-bar-ghost" style="right: 0;"></div>
                    <div id="p2-health" class="health-bar" style="right: 0;"></div>
                </div>
                <div class="player-label" id="p2-label">Player 2</div>
            </div>
        </div>
        
        <div id="game-over">
            <span id="winner-text" style="color: #fde047;">DRAW</span><br>
            <button class="btn" onclick="resetToMenu()">Return to Menu</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024;
        canvas.height = 576;

        const gravity = 0.8;
        let animationId;
        let p1Ready = false;
        let p2Ready = false;
        let gameOver = false;
        let timer = 99;
        let timerId;

        const COLORS = [
            '#3498db', '#e74c3c', '#2ecc71', 
            '#f1c40f', '#9b59b6', '#1abc9c', 
            '#ecf0f1', '#e67e22', '#34495e'
        ];
        
        let characterData = JSON.parse(localStorage.getItem('hood_brawl_config')) || {
            p1: '#3498db',
            p2: '#e74c3c'
        };

        function saveConfig() {
            localStorage.setItem('hood_brawl_config', JSON.stringify(characterData));
        }

        function showCharacterSelect() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('char-select-screen').style.display = 'flex';
            renderPickers();
            updatePreviews();
        }

        function renderPickers() {
            [1, 2].forEach(pNum => {
                const container = document.getElementById(`p${pNum}-pickers`);
                container.innerHTML = '';
                COLORS.forEach(color => {
                    const opt = document.createElement('div');
                    opt.className = 'color-option';
                    if (characterData[`p${pNum}`] === color) opt.classList.add('selected');
                    opt.style.backgroundColor = color;
                    opt.onclick = () => {
                        characterData[`p${pNum}`] = color;
                        saveConfig();
                        renderPickers();
                        updatePreviews();
                    };
                    container.appendChild(opt);
                });
            });
        }

        function updatePreviews() {
            [1, 2].forEach(pNum => {
                const preview = document.getElementById(`p${pNum}-preview`);
                preview.innerHTML = '';
                const miniCanvas = document.createElement('canvas');
                miniCanvas.width = 100;
                miniCanvas.height = 200;
                preview.appendChild(miniCanvas);
                const mCtx = miniCanvas.getContext('2d');
                
                const dummy = new Fighter({ position: { x: 20, y: 20 }, velocity: { x: 0, y: 0 } });
                dummy.color = characterData[`p${pNum}`];
                dummy.draw(mCtx, true);
            });
        }

        function setReady(pNum) {
            const btn = document.getElementById(`p${pNum}-ready-btn`);
            if (pNum === 1) p1Ready = true;
            else p2Ready = true;
            btn.style.background = '#2ecc71';
            btn.innerText = 'LOCKED';
            if (p1Ready && p2Ready) setTimeout(startGame, 500);
        }

        function decreaseTimer() {
            if (timer > 0) {
                timerId = setTimeout(decreaseTimer, 1000);
                timer--;
                document.getElementById('timer').innerText = timer;
            } else if (!gameOver) determineWinner();
        }

        function determineWinner() {
            gameOver = true;
            clearTimeout(timerId);
            document.getElementById('game-over').style.display = 'block';
            if (player1.health === player2.health) document.getElementById('winner-text').innerText = "TIE GAME";
            else if (player1.health > player2.health) document.getElementById('winner-text').innerText = "P1 WINS";
            else document.getElementById('winner-text').innerText = "P2 WINS";
        }

        function startGame() {
            gameOver = false;
            timer = 99;
            document.getElementById('timer').innerText = timer;
            document.getElementById('char-select-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-over').style.display = 'none';
            canvas.style.display = 'block';
            player1.reset({ x: 150, y: 0 }, characterData.p1);
            player2.reset({ x: 814, y: 0 }, characterData.p2);
            decreaseTimer();
            gameLoop();
        }

        function resetToMenu() {
            cancelAnimationFrame(animationId);
            clearTimeout(timerId);
            p1Ready = false; p2Ready = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-ui').style.display = 'none';
            canvas.style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }

        function drawBackground() {
            // Sky Gradient
            const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
            sky.addColorStop(0, '#020617');
            sky.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Moon
            ctx.fillStyle = '#fefce8';
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#fefce8';
            ctx.beginPath();
            ctx.arc(850, 100, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Stars
            ctx.fillStyle = '#fff';
            for(let i=0; i<30; i++) {
                let sX = (Math.sin(i * 1234) * 0.5 + 0.5) * canvas.width;
                let sY = (Math.cos(i * 5678) * 0.5 + 0.5) * 300;
                ctx.fillRect(sX, sY, 2, 2);
            }

            // Distant City (Darker)
            ctx.fillStyle = '#0f172a';
            const bWidths = [120, 180, 150, 200, 140, 160];
            let currentX = 20;
            bWidths.forEach((w, i) => {
                let h = 200 + (Math.sin(i) * 100);
                ctx.fillRect(currentX, canvas.height - 80 - h, w, h);
                
                // Dim windows
                ctx.fillStyle = 'rgba(253, 224, 71, 0.1)';
                for(let win=0; win<5; win++) {
                    ctx.fillRect(currentX + 15, canvas.height - 80 - h + 30 + (win*40), w - 30, 10);
                }
                ctx.fillStyle = '#0f172a';
                currentX += w + 40;
            });

            // Mid City (More detail)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, canvas.height - 300, 150, 220);
            ctx.fillRect(200, canvas.height - 380, 250, 300);
            ctx.fillRect(550, canvas.height - 320, 180, 240);
            ctx.fillRect(850, canvas.height - 400, 180, 320);

            // Windows with light
            ctx.fillStyle = '#eab308';
            ctx.fillRect(250, canvas.height - 350, 20, 30);
            ctx.fillRect(280, canvas.height - 350, 20, 30);
            ctx.fillRect(900, canvas.height - 370, 30, 40);

            // Rooftop Floor
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            // Floor Detail (Grip/Texture)
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 80);
                ctx.lineTo(i - 40, canvas.height);
                ctx.stroke();
            }

            // Top edge line
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, canvas.height - 85, canvas.width, 5);
        }

        class Fighter {
            constructor({ position, velocity, isPlayer2 = false }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 60;
                this.height = 150;
                this.health = 100;
                this.isPlayer2 = isPlayer2;
                this.isCrouching = false;
                this.isAttacking = false;
                this.isWinner = false;
                this.attackType = null;
                this.frame = 0;
                this.facing = isPlayer2 ? 'left' : 'right';
                this.attackBox = { position: { x: 0, y: 0 }, width: 100, height: 50 };
                this.skinTone = '#ffdbac';
            }

            reset(pos, color) {
                this.position = pos; this.velocity = { x: 0, y: 0 };
                this.health = 100; this.color = color;
                this.isWinner = false; this.isAttacking = false;
                this.facing = this.isPlayer2 ? 'left' : 'right';
            }

            draw(targetCtx = ctx, isStatic = false) {
                this.frame += isStatic ? 0.02 : 0.12;
                const breathe = Math.sin(this.frame) * 3;
                const legMove = Math.cos(this.frame) * 12;
                
                let x = this.position.x;
                let y = this.position.y;
                let h = this.height;
                let w = this.width;

                if (this.isCrouching) { h *= 0.6; y += 60; }
                if (this.isWinner) y += Math.sin(this.frame * 2) * 15;

                // Player Shadow / Ground Glow
                if (!isStatic) {
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(x + 30, canvas.height - 75, 40, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                targetCtx.save();
                if (this.facing === 'left') {
                    targetCtx.translate(x + w, 0);
                    targetCtx.scale(-1, 1);
                    x = 0;
                }

                // Legs
                targetCtx.fillStyle = '#1e293b'; 
                const onGround = this.position.y >= (canvas.height - 80 - this.height - 1);
                const isMoving = Math.abs(this.velocity.x) > 0;
                let lLegOff = (isMoving && onGround) ? legMove : 0;
                let rLegOff = (isMoving && onGround) ? -legMove : 0;
                targetCtx.fillRect(x + 12 + lLegOff, y + h - 45, 16, 45);
                targetCtx.fillRect(x + 32 + rLegOff, y + h - 45, 16, 45);

                // Shoes
                targetCtx.fillStyle = '#000';
                targetCtx.fillRect(x + 10 + lLegOff, y + h - 5, 20, 8);
                targetCtx.fillRect(x + 30 + rLegOff, y + h - 5, 20, 8);

                // Shirt
                targetCtx.fillStyle = this.color;
                targetCtx.beginPath();
                targetCtx.roundRect(x + 5, y + 40 + breathe, 50, h - 85 - breathe, 5);
                targetCtx.fill();

                // Arms
                targetCtx.fillStyle = this.color;
                if (this.isAttacking && this.attackType === 'punch') {
                    targetCtx.fillRect(x + 40, y + 55 + breathe, 45, 18);
                    targetCtx.fillStyle = this.skinTone;
                    targetCtx.fillRect(x + 85, y + 55 + breathe, 15, 18);
                } else {
                    targetCtx.fillRect(x - 5, y + 60 + breathe, 15, 35);
                    targetCtx.fillStyle = this.skinTone;
                    targetCtx.fillRect(x - 5, y + 95 + breathe, 15, 12);
                }

                // Head
                targetCtx.fillStyle = this.skinTone;
                targetCtx.beginPath();
                targetCtx.arc(x + 30, y + 20 + breathe, 22, 0, Math.PI * 2);
                targetCtx.fill();

                // Hair
                targetCtx.fillStyle = '#2d1b1a';
                targetCtx.beginPath();
                targetCtx.arc(x + 30, y + 15 + breathe, 23, Math.PI, 0);
                targetCtx.fill();

                // Face
                targetCtx.fillStyle = '#000';
                targetCtx.fillRect(x + 38, y + 15 + breathe, 4, 4);
                targetCtx.beginPath();
                targetCtx.arc(x + 40, y + 28 + breathe, 5, 0.2, Math.PI - 0.2);
                targetCtx.stroke();

                targetCtx.restore();

                if (this.isAttacking) {
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(this.attackBox.position.x, this.attackBox.position.y, this.attackBox.width, this.attackBox.height);
                }
            }

            update() {
                this.draw();
                if (gameOver) return;
                this.attackBox.position.x = this.facing === 'left' ? this.position.x - this.attackBox.width : this.position.x + this.width;
                this.attackBox.position.y = this.position.y + (this.attackType === 'punch' ? 45 : 100);
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;
                if (this.position.y + this.height + this.velocity.y >= canvas.height - 80) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - 80 - this.height;
                } else this.velocity.y += gravity;
                if (this.position.x < 0) this.position.x = 0;
                if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;
            }

            attack(type) {
                if (this.isAttacking || gameOver) return;
                this.attackType = type;
                this.isAttacking = true;
                this.attackBox.width = (type === 'kick') ? 140 : 100;
                setTimeout(() => { this.isAttacking = false; }, 150);
            }
        }

        const player1 = new Fighter({ position: { x: 150, y: 0 }, velocity: { x: 0, y: 0 } });
        const player2 = new Fighter({ position: { x: 814, y: 0 }, velocity: { x: 0, y: 0 }, isPlayer2: true });

        const keys = {
            a: { pressed: false }, d: { pressed: false }, s: { pressed: false },
            k: { pressed: false }, l: { pressed: false }, ç: { pressed: false }
        };

        function detectCollision(attacker, target) {
            return (
                attacker.isAttacking &&
                attacker.attackBox.position.x < target.position.x + target.width &&
                attacker.attackBox.position.x + attacker.attackBox.width > target.position.x &&
                attacker.attackBox.position.y < target.position.y + target.height &&
                attacker.attackBox.position.y + attacker.attackBox.height > target.position.y
            );
        }

        function gameLoop() {
            animationId = window.requestAnimationFrame(gameLoop);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            player1.update();
            player2.update();

            if (!gameOver) {
                player1.velocity.x = 0; player1.isCrouching = keys.s.pressed;
                if (keys.a.pressed) { player1.velocity.x = -8; player1.facing = 'left'; }
                if (keys.d.pressed) { player1.velocity.x = 8; player1.facing = 'right'; }

                player2.velocity.x = 0; player2.isCrouching = keys.l.pressed;
                if (keys.k.pressed) { player2.velocity.x = -8; player2.facing = 'left'; }
                if (keys.ç.pressed) { player2.velocity.x = 8; player2.facing = 'right'; }

                if (detectCollision(player1, player2)) {
                    player1.isAttacking = false; player2.health -= 10;
                    document.getElementById('p2-health').style.width = player2.health + '%';
                    setTimeout(() => document.getElementById('p2-ghost').style.width = player2.health + '%', 400);
                }
                if (detectCollision(player2, player1)) {
                    player2.isAttacking = false; player1.health -= 10;
                    document.getElementById('p1-health').style.width = player1.health + '%';
                    setTimeout(() => document.getElementById('p1-ghost').style.width = player1.health + '%', 400);
                }
                if (player1.health <= 0 || player2.health <= 0) determineWinner();
            }
        }

        window.addEventListener('keydown', (event) => {
            if (gameOver) return;
            const key = event.key.toLowerCase();
            if (key === 'a') keys.a.pressed = true;
            if (key === 'd') keys.d.pressed = true;
            if (key === 's') keys.s.pressed = true;
            if (key === 'w' && player1.position.y > 300) player1.velocity.y = -20;
            if (key === 'q') player1.attack('punch');
            if (key === 'e') player1.attack('kick');
            if (key === 'k') keys.k.pressed = true;
            if (key === 'ç') keys.ç.pressed = true;
            if (key === 'l') keys.l.pressed = true;
            if (key === 'o' && player2.position.y > 300) player2.velocity.y = -20;
            if (key === 'i') player2.attack('punch');
            if (key === 'p') player2.attack('kick');
        });

        window.addEventListener('keyup', (event) => {
            const key = event.key.toLowerCase();
            if (key === 'a') keys.a.pressed = false; if (key === 'd') keys.d.pressed = false; if (key === 's') keys.s.pressed = false;
            if (key === 'k') keys.k.pressed = false; if (key === 'ç') keys.ç.pressed = false; if (key === 'l') keys.l.pressed = false;
        });

        updatePreviews();
    </script>
</body>
</html>
