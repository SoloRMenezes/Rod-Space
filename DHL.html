    // --- THEME SWITCHER INTEGRATION ---
    function ThemeToggle() {
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('theme_preference');
        return saved ? saved === 'dark' : true; // Default dark
      });

      useEffect(() => {
        const root = document.documentElement;
        const body = document.body;
        if (isDark) {
          root.classList.add('dark');
          body.classList.add('dark');
          body.classList.add('dark-theme');
          body.classList.remove('light-theme');
          localStorage.setItem('theme_preference', 'dark');
        } else {
          root.classList.remove('dark');
          body.classList.remove('dark');
          body.classList.add('light-theme');
          body.classList.remove('dark-theme');
          localStorage.setItem('theme_preference', 'light');
        }
      }, [isDark]);

      return (
        <button
          onClick={() => setIsDark(!isDark)}
          id="theme-toggle-btn"
          className="w-10 h-10 rounded-xl flex items-center justify-center border border-zinc-200 dark:border-white/10 bg-white/90 dark:bg-black/30 backdrop-blur text-zinc-600 dark:text-zinc-400 hover:text-purple-600 dark:hover:text-purple-400 transition-all cursor-pointer shadow-sm hover:scale-105"
          aria-label="Toggle theme mode"
        >
          {isDark ? <Icon name="sun" className="w-5 h-5" /> : <Icon name="moon" className="w-5 h-5" />}
        </button>
      );
    }

                      {isExpanded && (

    // --- SECTION: PLAYER ---
    function PlayerSection({ activeEpisode, setActiveEpisode, isPlaying, setIsPlaying, setCurrentTab }) {
      const audioRef = useRef(null);
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [hasError, setHasError] = useState(false);
      const [bars, setBars] = useState(new Array(24).fill(15));

      // Autoplay states
      const [countdownValue, setCountdownValue] = useState(0);
      const [autoplayActive, setAutoplayActive] = useState(false);
      const [nextEpisodeToPlay, setNextEpisodeToPlay] = useState(null);
      const [showSuggestion, setShowSuggestion] = useState(false);

      // Procedural sound wave visualizer effects
      useEffect(() => {
        let timer;
        if (isPlaying && !hasError) {
          timer = setInterval(() => {
            setBars(prev => prev.map(() => Math.floor(Math.random() * 32) + 6));
          }, 110);
        } else {
          setBars(new Array(24).fill(10));
        }
        return () => clearInterval(timer);
      }, [isPlaying, hasError]);

      // Control audio tag play state
      useEffect(() => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.play().catch(() => {
              setHasError(true);
              setIsPlaying(false);
            });
          } else {
            audioRef.current.pause();
          }
        }
      }, [isPlaying, activeEpisode.id]);

      // Sync volume level
      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = isMuted ? 0 : volume;
        }
      }, [volume, isMuted]);

      const cancelAutoplay = () => {
        setAutoplayActive(false);
        setCountdownValue(0);
        setNextEpisodeToPlay(null);
      };

      // Reset countdown on manual episode selection
      useEffect(() => {
        cancelAutoplay();
        setShowSuggestion(false);
        setHasError(false);
        setCurrentTime(0);
      }, [activeEpisode.id]);

      // Autoplay countdown logic
      useEffect(() => {
        let timer;
        if (autoplayActive && countdownValue > 0) {
          timer = setInterval(() => {
            setCountdownValue(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setAutoplayActive(false);
                if (nextEpisodeToPlay) {
                  setActiveEpisode(nextEpisodeToPlay);
                  setIsPlaying(true);
                }
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [autoplayActive, countdownValue, nextEpisodeToPlay]);

      const handleAudioEnded = () => {
        const currentIndex = EPISODES.findIndex(ep => ep.id === activeEpisode.id);
        const nextEp = (currentIndex !== -1 && currentIndex < EPISODES.length - 1) ? EPISODES[currentIndex + 1] : null;

        if (nextEp) {
          setNextEpisodeToPlay(nextEp);
          setCountdownValue(8);
          setAutoplayActive(true);
          setShowSuggestion(false);
        } else {
          setNextEpisodeToPlay(null);
          setAutoplayActive(false);
          setShowSuggestion(true);
        }
      };

      const handlePlayPause = () => {
        if (autoplayActive) {
          cancelAutoplay();
        }
        setIsPlaying(!isPlaying);
      };

      const handleTimeUpdate = () => {
        if (audioRef.current) {
          setCurrentTime(audioRef.current.currentTime);
        }
      };

      const handleLoadedMetadata = () => {
        if (audioRef.current) {
          setDuration(audioRef.current.duration || 0);
          setHasError(false);
        }
      };

      const handleAudioError = () => {
        setHasError(true);
        setIsPlaying(false);
      };

      const handleSeek = (e) => {
        const value = parseFloat(e.target.value);
        if (audioRef.current) {
          audioRef.current.currentTime = value;
          setCurrentTime(value);
        }
      };

      const formatTime = (seconds) => {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      return (
        <div className="space-y-6">
          <div>
            <h1 className="font-display text-4xl font-extrabold tracking-tight text-zinc-900 dark:text-zinc-50 mb-2">
              Lounge Player
            </h1>
            <p className="text-zinc-500 dark:text-zinc-400 text-lg">
              Stream latest episodes featuring unhinged comments, dynamic visuals, and ambient logs.
            </p>
          </div>

          {/* Autoplay Banner */}
          {autoplayActive && nextEpisodeToPlay && (
            <div className="p-5 rounded-3xl border border-purple-500/30 bg-purple-50/50 dark:bg-purple-950/20 backdrop-blur-md flex flex-col sm:flex-row items-center justify-between gap-4 animate-pulse">
              <div className="flex items-center gap-3.5 text-center sm:text-left">
                <div className="w-12 h-12 rounded-full border-4 border-purple-600 border-t-transparent animate-spin flex items-center justify-center shrink-0">
                  <span className="font-mono font-black text-sm text-purple-700 dark:text-purple-400 rotate-[-15deg]">
                    {countdownValue}
                  </span>
                </div>
                <div className="space-y-1">
                  <p className="text-xs font-mono font-bold uppercase tracking-widest text-purple-600 dark:text-purple-400">
                    Next Track Autoplay
                  </p>
                  <h4 className="font-display font-extrabold text-sm text-zinc-800 dark:text-zinc-200">
                    EP {nextEpisodeToPlay.episodeNumber}: {nextEpisodeToPlay.title}
                  </h4>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={cancelAutoplay}
                  className="px-4 py-2 rounded-xl text-xs font-bold font-mono uppercase tracking-wider text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-200 border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-all cursor-pointer"
                >
                  Cancel
                </button>
                <button
                  onClick={() => {
                    const ep = nextEpisodeToPlay;
                    cancelAutoplay();
                    setActiveEpisode(ep);
                    setIsPlaying(true);
                  }}
                  className="px-4 py-2 rounded-xl text-xs font-bold font-mono uppercase tracking-wider bg-purple-600 text-white hover:bg-purple-500 shadow-md shadow-purple-500/15 transition-all cursor-pointer"
                >
                  Play Now
                </button>
              </div>
            </div>
          )}

          {/* Fallback Suggestions */}
          {showSuggestion && (
            <div className="p-6 rounded-3xl border border-dashed border-zinc-200 dark:border-white/10 bg-zinc-50/50 dark:bg-black/35 backdrop-blur-md space-y-4">
              <div className="flex items-center gap-2 text-purple-600 dark:text-purple-400">
                <Icon name="sparkles" className="w-5 h-5 shrink-0" />
                <h4 className="font-display font-extrabold text-base">You've reached the end of the Vault!</h4>
              </div>
              <p className="text-xs text-zinc-500 dark:text-zinc-400 leading-relaxed">
                We couldn't find a sequential episode. But don't worry, the conversation never stops at the Lounge! Here are some unhinged recommendations for you:
              </p>
              <div className="grid gap-4 sm:grid-cols-2">
                <div className="p-4 rounded-2xl border border-zinc-150 dark:border-zinc-800/80 bg-white/90 dark:bg-zinc-950/40 flex flex-col justify-between space-y-3">
                  <div className="space-y-1">
                    <span className="px-2 py-0.5 font-mono text-[9px] font-bold uppercase rounded bg-purple-50 dark:bg-purple-950 text-purple-600 dark:text-purple-400 border border-purple-200/30 dark:border-purple-800/30">
                      Discuss Related Topic
                    </span>
                    <p className="font-medium text-xs text-zinc-700 dark:text-zinc-300 leading-relaxed pt-1.5 italic">
                      "AI is going to make us all incredibly lazy rather than making us efficient."
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      localStorage.setItem('active_selected_topic', 'AI is going to make us all incredibly lazy rather than making us efficient.');
                      setCurrentTab('topics');
                    }}
                    className="w-full text-center py-2 rounded-xl text-xs font-bold font-mono uppercase tracking-wider bg-purple-600/10 text-purple-600 hover:bg-purple-600/20 dark:bg-purple-500/10 dark:text-purple-400 dark:hover:bg-purple-500/20 transition cursor-pointer"
                  >
                    Spin Topic Machine
                  </button>
                </div>

                <div className="p-4 rounded-2xl border border-zinc-150 dark:border-zinc-800/80 bg-white/90 dark:bg-zinc-950/40 flex flex-col justify-between space-y-3">
                  <div className="space-y-1">
                    <span className="px-2 py-0.5 font-mono text-[9px] font-bold uppercase rounded bg-zinc-100 dark:bg-zinc-850 text-zinc-500 dark:text-zinc-400 border border-zinc-200/40 dark:border-zinc-850/40">
                      Popular Past Episode
                    </span>
                    <h5 className="font-display font-bold text-xs text-zinc-800 dark:text-zinc-200 pt-1.5 leading-tight">
                      EP 02: The IB Nightmare & Survival Guide
                    </h5>
                    <p className="text-[11px] text-zinc-400 dark:text-zinc-500 line-clamp-2">
                      Is the IB Diploma a scam? The crew shares tips and trauma.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      const ep2 = EPISODES.find(e => e.id === 'ep-02');
                      if (ep2) {
                        setActiveEpisode(ep2);
                        setIsPlaying(true);
                        setShowSuggestion(false);
                      }
                    }}
                    className="w-full text-center py-2 rounded-xl text-xs font-bold font-mono uppercase tracking-wider bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-750 text-zinc-700 dark:text-zinc-300 transition cursor-pointer"
                  >
                    Play Episode 2
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Main player controls card */}
          <div className="border border-zinc-200 dark:border-white/10 rounded-3xl bg-white dark:bg-black/40 backdrop-blur-xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
            <audio
              ref={audioRef}
              src={activeEpisode.audioUrl}
              onTimeUpdate={handleTimeUpdate}
              onLoadedMetadata={handleLoadedMetadata}
              onError={handleAudioError}
              onEnded={handleAudioEnded}
              preload="metadata"
            />

            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-zinc-200/60 dark:border-zinc-800/60">
              <div className="flex items-start gap-4">
                <div className={`w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center text-white border border-purple-500/20 shrink-0 ${isPlaying ? 'animate-spin' : ''}`} style={{ animationDuration: '6s' }}>
                  <Icon name="disc" className="w-8 h-8" />
                </div>
                <div>
                  <span className="px-2 py-0.5 font-mono text-[9px] font-bold uppercase rounded bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-400 border border-purple-100 dark:border-purple-900/30">
                    Episode {activeEpisode.episodeNumber}
                  </span>
                  <h3 className="font-display font-black text-xl text-zinc-800 dark:text-zinc-100 mt-2 leading-none">
                    {activeEpisode.title}
                  </h3>
                  <p className="text-xs text-zinc-500 dark:text-zinc-400 mt-1.5 italic">
                    {activeEpisode.subtitle}
                  </p>
                </div>
              </div>

              {/* Streaming state tag */}
              <div className="flex flex-col items-start md:items-end gap-1 font-mono shrink-0">
                <span className="text-[10px] uppercase font-bold text-zinc-400 dark:text-zinc-500">
                  Broadcast Stream
                </span>
                <span className={`text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full ${hasError ? 'bg-red-50 dark:bg-red-950 text-red-600 dark:text-red-400' : isPlaying ? 'bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 animate-pulse' : 'bg-zinc-100 dark:bg-zinc-900 text-zinc-500'}`}>
                  ● {hasError ? 'Error (Helix Fallback Active)' : isPlaying ? 'Streaming Live' : 'Paused'}
                </span>
              </div>
            </div>

            {/* Slider Timeline */}
            <div className="space-y-2 mt-6">
              <div className="flex items-center justify-between font-mono text-xs text-zinc-500 dark:text-zinc-400">
                <span>{formatTime(currentTime)}</span>
                <span>{formatTime(duration)}</span>
              </div>
              <input
                type="range"
                min="0"
                max={duration || 100}
                value={currentTime}
                onChange={handleSeek}
                className="w-full accent-purple-600 dark:accent-purple-500 bg-zinc-200 dark:bg-zinc-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            {/* Interactive Player controls row */}
            <div className="flex flex-wrap items-center justify-between gap-4 mt-6 pt-2">
              <div className="flex items-center gap-3">
                <button
                  onClick={handlePlayPause}
                  className="w-12 h-12 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center shadow-lg shadow-purple-500/20 transition hover:scale-105 cursor-pointer"
                >
                  {isPlaying ? <Icon name="pause" className="w-5 h-5" /> : <Icon name="play" className="w-5 h-5 ml-0.5" />}
                </button>

                <div className="flex items-center gap-2 px-3 py-2 border border-zinc-200/50 dark:border-zinc-800/60 bg-zinc-50/50 dark:bg-zinc-900/30 rounded-xl">
                  <button
                    onClick={() => setIsMuted(!isMuted)}
                    className="text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-200 transition shrink-0 cursor-pointer"
                  >
                    {isMuted || volume === 0 ? <Icon name="volumex" className="w-4 h-4" /> : <Icon name="volume2" className="w-4 h-4" />}
                  </button>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value={volume}
                    onChange={(e) => {
                      setVolume(parseFloat(e.target.value));
                      setIsMuted(false);
                    }}
                    className="w-16 accent-purple-600 bg-zinc-200 dark:bg-zinc-800 h-1 rounded cursor-pointer"
                  />
                </div>
              </div>

              {/* Dynamic Soundwave visuals */}
              <div className="flex items-end gap-0.5 h-10 w-44 shrink-0 overflow-hidden select-none">
                {bars.map((barHeight, bIdx) => (
                  <div
                    key={bIdx}
                    className="flex-1 rounded-t bg-purple-600/30 dark:bg-purple-500/35 group-hover:bg-purple-500 transition-all duration-100"
                    style={{ height: `${barHeight}%` }}
                  />
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- SECTION: TOPIC MACHINE ---
    function TopicMachine() {
      const [currentTopic, setCurrentTopic] = useState('Ready to get unhinged? Click Generate!');
      const [isSpinning, setIsSpinning] = useState(false);
      const [topicSearchQuery, setTopicSearchQuery] = useState('');
      const [justLoadedTopic, setJustLoadedTopic] = useState(false);

      // Custom topics state
      const [customTopics, setCustomTopics] = useState(() => {
        const saved = localStorage.getItem('custom_topics');
        return saved ? JSON.parse(saved) : { School: [], Controversial: [], Media: [], Games: [] };
      });

      const [newTopicText, setNewTopicText] = useState('');
      const [newTopicCat, setNewTopicCat] = useState('School');
      const [addSuccess, setAddSuccess] = useState(false);

      useEffect(() => {
        const activeSelectedTopic = localStorage.getItem('active_selected_topic');
        if (activeSelectedTopic) {
          setCurrentTopic(activeSelectedTopic);
          localStorage.removeItem('active_selected_topic');
        }
      }, []);

      const saveCustomTopic = (e) => {
        e.preventDefault();
        if (!newTopicText.trim()) return;

        const updated = { ...customTopics };
        if (!updated[newTopicCat]) updated[newTopicCat] = [];
        updated[newTopicCat].push(newTopicText.trim());

        setCustomTopics(updated);
        localStorage.setItem('custom_topics', JSON.stringify(updated));
        setNewTopicText('');
        setAddSuccess(true);
        setTimeout(() => setAddSuccess(false), 2000);
      };

      const handleClearCustomTopics = () => {
        const cleared = { School: [], Controversial: [], Media: [], Games: [] };
        setCustomTopics(cleared);
        localStorage.removeItem('custom_topics');
      };

      const handleSpin = () => {
        setIsSpinning(true);
        let counter = 0;
        
        // Merge topics
        const list = [];
        Object.entries(FALLBACK_TOPICS).forEach(([cat, topics]) => {
          topics.forEach(t => list.push(t));
        });
        Object.entries(customTopics).forEach(([cat, topics]) => {
          topics.forEach(t => list.push(t));
        });

        const timer = setInterval(() => {
          const rand = list[Math.floor(Math.random() * list.length)];
          setCurrentTopic(rand);
          counter++;
          if (counter > 15) {
            clearInterval(timer);
            setIsSpinning(false);
          }
        }, 80);
      };

      return (
        <div className="space-y-6">
          <div>
            <h1 className="font-display text-4xl font-extrabold tracking-tight text-zinc-900 dark:text-zinc-50 mb-2">
              Topic Machine
            </h1>
            <p className="text-zinc-500 dark:text-zinc-400 text-lg">
              Spin the randomized engine to load spicy discussion topics for immediate debate.
            </p>
          </div>

          {/* Main Spinner display panel */}
          <div id="topic-display-panel" className="border border-zinc-200 dark:border-purple-500/40 rounded-3xl bg-white dark:bg-black/40 backdrop-blur-xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
            <div className="min-h-[180px] sm:min-h-[220px] rounded-2xl border-2 border-dashed border-zinc-200 dark:border-purple-500/30 bg-zinc-100/85 dark:bg-black/60 flex flex-col items-center justify-center p-6 sm:p-8 text-center relative overflow-hidden">
              <span className="text-[10px] font-mono font-bold tracking-widest text-purple-600 dark:text-purple-400 uppercase mb-4">
                Active Lounge Argument
              </span>
              <p className={`font-display font-black text-lg sm:text-2xl leading-snug transition-all duration-150 ${isSpinning ? 'text-purple-600 scale-95 opacity-50 blur-[1px]' : 'text-zinc-800 dark:text-zinc-100'}`}>
                {currentTopic}
              </p>
            </div>

            <div className="flex justify-center mt-6">
              <button
                onClick={handleSpin}
                disabled={isSpinning}
                className={`px-8 py-4 rounded-2xl font-bold font-mono uppercase tracking-wider text-sm flex items-center gap-3 transition-all cursor-pointer shadow-lg hover:scale-103 ${isSpinning ? 'bg-purple-900/40 text-purple-300' : 'bg-purple-600 text-white hover:bg-purple-500 shadow-purple-500/15'}`}
              >
                <Icon name="refresh" className={`w-5 h-5 ${isSpinning ? 'animate-spin' : ''}`} />
                <span>{isSpinning ? 'Spinning...' : 'Spin the Machine'}</span>
              </button>
            </div>
          </div>

          {/* Search & Browse */}
          <div className="border border-zinc-200 dark:border-white/10 rounded-3xl bg-white dark:bg-black/45 backdrop-blur-md p-6 space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h3 className="font-display text-lg font-bold text-zinc-800 dark:text-zinc-100 flex items-center gap-2">
                  <Icon name="search" className="w-5 h-5 text-purple-500" />
                  <span>Search & Browse Unhinged Topics</span>
                </h3>
                <p className="text-xs text-zinc-400 dark:text-zinc-500 leading-relaxed">
                  Search topics by keywords within their descriptions and instantly load them into the machine.
                </p>
              </div>
              
              <div className="relative max-w-xs w-full">
                <Icon name="search" className="absolute left-3 top-2.5 h-3.5 w-3.5 text-zinc-400 dark:text-zinc-500" />
                <input
                  type="text"
                  placeholder="Search topics by keyword..."
                  value={topicSearchQuery}
                  onChange={(e) => setTopicSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-4 py-1.5 border border-zinc-200 dark:border-white/10 rounded-xl bg-white/90 dark:bg-black/40 backdrop-blur-md text-xs text-zinc-800 dark:text-zinc-200 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-purple-500/50 transition-all"
                />
              </div>
            </div>

            {justLoadedTopic && (
              <div className="text-xs text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1">
                <Icon name="check-circle" className="w-4 h-4" /> Loaded topic successfully! Scroll up to see.
              </div>
            )}

            <div className="max-h-[220px] overflow-y-auto space-y-2 pr-1">
              {(() => {
                const list = [];
                Object.entries(FALLBACK_TOPICS).forEach(([cat, topics]) => {
                  topics.forEach(t => list.push({ text: t, category: cat }));
                });
                Object.entries(customTopics).forEach(([cat, topics]) => {
                  topics.forEach(t => {
                    if (!list.some(item => item.text === t)) {
                      list.push({ text: t, category: cat });
                    }
                  });
                });

                const filtered = list.filter(item =>
                  item.text.toLowerCase().includes(topicSearchQuery.toLowerCase())
                );

                if (filtered.length === 0) {
                  return (
                    <div className="text-center py-8 text-xs text-zinc-400 dark:text-zinc-500">
                      No unhinged topics found matching "{topicSearchQuery}"
                    </div>
                  );
                }

                return filtered.map((item, idx) => (
                  <button
                    key={idx}
                    onClick={() => {
                      setCurrentTopic(item.text);
                      setJustLoadedTopic(true);
                      setTimeout(() => setJustLoadedTopic(false), 2000);
                      document.getElementById('topic-display-panel')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }}
                    className="w-full text-left p-3 bg-zinc-50 hover:bg-purple-50/30 dark:bg-zinc-900/40 dark:hover:bg-purple-950/20 border border-zinc-150 dark:border-zinc-800/50 hover:border-purple-500/30 rounded-xl flex items-center justify-between gap-4 transition-all group cursor-pointer focus:outline-none"
                  >
                    <p className="font-medium text-xs text-zinc-700 dark:text-zinc-300 leading-relaxed group-hover:text-purple-600 dark:group-hover:text-purple-400 transition-colors">
                      {item.text}
                    </p>
                    <span className="px-1.5 py-0.5 font-mono text-[8px] font-bold uppercase rounded bg-zinc-200/50 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 shrink-0 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                      {item.category}
                    </span>
                  </button>
                ));
              })()}
            </div>
          </div>

          {/* Submit topic */}
          <div className="border border-zinc-200 dark:border-white/10 rounded-3xl bg-white/60 dark:bg-black/45 backdrop-blur-md p-6">
            <h3 className="font-display text-lg font-bold text-zinc-800 dark:text-zinc-100 mb-2">
              Contribute a spicy topic
            </h3>
            <p className="text-xs text-zinc-400 dark:text-zinc-500 leading-relaxed mb-4">
              Add your own unhinged topics to the local instance database. Your contributions will immediately load into the wheel below.
            </p>

            <form onSubmit={saveCustomTopic} className="space-y-4">
              <div className="flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  placeholder="e.g. Pineapple belongs on top of everything, including spaghetti..."
                  value={newTopicText}
                  onChange={(e) => setNewTopicText(e.target.value)}
                  className="flex-1 px-4 py-3 border border-zinc-200 dark:border-white/10 rounded-2xl bg-white/60 dark:bg-black/40 backdrop-blur-md text-sm text-zinc-850 dark:text-zinc-200 placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-purple-500/50"
                />
                
                <select
                  value={newTopicCat}
                  onChange={(e) => setNewTopicCat(e.target.value)}
                  className="px-4 py-3 border border-zinc-200 dark:border-white/10 rounded-2xl bg-white/60 dark:bg-black/40 backdrop-blur-md text-sm text-zinc-800 dark:text-zinc-300 focus:outline-none cursor-pointer"
                >
                  <option value="School">School</option>
                  <option value="Controversial">Controversial</option>
                  <option value="Media">Media</option>
                  <option value="Games">Games</option>
                </select>

                <button
                  type="submit"
                  className="px-6 py-3 rounded-2xl bg-zinc-900 hover:bg-purple-600 dark:bg-zinc-800 dark:hover:bg-purple-600 text-white font-bold text-sm font-mono uppercase tracking-wider flex items-center justify-center gap-2 transition duration-200 cursor-pointer shrink-0 shadow-sm"
                >
                  <Icon name="send" className="w-4 h-4" />
                  <span>Submit</span>
                </button>
              </div>

              {addSuccess && (
                <div className="text-xs text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1">
                  <Icon name="check-circle" className="w-4 h-4" /> Added successfully!
                </div>
              )}
            </form>

            {/* Clear database fallback */}
            {Object.values(customTopics).some(arr => arr.length > 0) && (
              <div className="pt-4 border-t border-zinc-100 dark:border-zinc-900/50 mt-4 flex justify-end">
                <button
                  onClick={handleClearCustomTopics}
                  className="px-3 py-1.5 rounded-xl border border-dashed border-rose-200 hover:border-rose-300 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-[10px] font-bold font-mono uppercase tracking-widest hover:bg-rose-50/50 dark:hover:bg-rose-950/25 flex items-center gap-1.5 cursor-pointer"
                >
                  <Icon name="trash" className="w-3.5 h-3.5" /> Reset Custom Database
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- SECTION: THE VAULT ---
    function VaultSection({ setActiveEpisode, setIsPlaying, setCurrentTab }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTag, setSelectedTag] = useState(null);
      const [expandedNotesId, setExpandedNotesId] = useState(null);

      const allTags = Array.from(new Set(EPISODES.flatMap(ep => ep.tags)));

      const filteredEpisodes = EPISODES.filter(ep => {
        const matchesSearch = 
          ep.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          ep.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
          ep.episodeNumber.includes(searchQuery);
        
        const matchesTag = selectedTag ? ep.tags.includes(selectedTag) : true;
        
        return matchesSearch && matchesTag;
      });

      const handlePlayNow = (episode) => {
        setActiveEpisode(episode);
        setIsPlaying(true);
        setCurrentTab('player');
      };

      const toggleNotes = (id) => {
        setExpandedNotesId(prev => (prev === id ? null : id));
      };

      return (
        <div className="space-y-6">
          <div>
            <h1 className="font-display text-4xl font-extrabold tracking-tight text-zinc-900 dark:text-zinc-50 mb-2">
              The Vault
            </h1>
            <p className="text-zinc-500 dark:text-zinc-400 text-lg">
              Explore past discussions, episode show notes, and dynamic transcripts.
            </p>
          </div>

          <div className="grid gap-4 md:grid-cols-3">
            <div className="relative md:col-span-2">
              <Icon name="search" className="absolute left-4 top-3.5 h-4 w-4 text-zinc-400 dark:text-zinc-500" />
              <input
                type="text"
                placeholder="Search past segments, notes, or titles..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-11 pr-4 py-3 border border-zinc-200 dark:border-white/10 rounded-2xl bg-white/90 dark:bg-black/40 backdrop-blur-md text-sm text-zinc-800 dark:text-zinc-200 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-purple-500/50 transition-all"
              />
            </div>

            {selectedTag && (
              <button
                onClick={() => setSelectedTag(null)}
                className="px-4 py-3 rounded-2xl border border-dashed border-rose-200 dark:border-rose-900/40 bg-rose-50/50 dark:bg-rose-950/20 text-rose-600 dark:text-rose-400 font-bold text-xs font-mono uppercase tracking-wider hover:bg-rose-100 dark:hover:bg-rose-950/40 transition cursor-pointer text-center"
              >
                Clear Filters [x]
              </button>
            )}
          </div>

          {/* Tag Chips */}
          <div className="flex gap-2 overflow-x-auto pb-1">
            {allTags.map(tag => {
              const isSelected = selectedTag === tag;
              return (
                <button
                  key={tag}
                  onClick={() => setSelectedTag(isSelected ? null : tag)}
                  className={`px-3.5 py-1.5 rounded-full text-xs font-bold border flex items-center gap-1.5 transition shrink-0 cursor-pointer ${
                    isSelected
                      ? 'bg-purple-100 dark:bg-purple-950/50 border-purple-400 dark:border-purple-800/80 text-purple-700 dark:text-purple-400'
                      : 'bg-white dark:bg-zinc-900 border-zinc-250 dark:border-zinc-850 text-zinc-500 dark:text-zinc-400 hover:border-zinc-300 dark:hover:border-zinc-750'
                  }`}
                >
                  <Icon name="tag" className="w-3 h-3 opacity-60" />
                  <span>{tag}</span>
                </button>
              );
            })}
          </div>

          <div className="space-y-4">
            {filteredEpisodes.length === 0 ? (
              <div className="h-64 border border-dashed border-zinc-200 dark:border-zinc-800 rounded-3xl flex flex-col items-center justify-center text-center p-6">
                <Icon name="search" className="w-12 h-12 text-zinc-300 dark:text-zinc-700 mb-3" />
                <p className="font-bold text-zinc-700 dark:text-zinc-300">No matching episodes</p>
                <p className="text-sm text-zinc-400 dark:text-zinc-500 mt-1 max-w-sm">
                  We couldn't find any segments matching your query. Check spelling or clear your filter.
                </p>
              </div>
            ) : (
              filteredEpisodes.map((ep) => {
                const isNotesExpanded = expandedNotesId === ep.id;
                return (
                  <div
                    key={ep.id}
                    className="border border-zinc-200 dark:border-white/10 rounded-3xl bg-white dark:bg-black/45 backdrop-blur-md p-5 sm:p-6 hover:shadow-2xl hover:border-purple-500/20 dark:hover:border-purple-500/30 transition-all duration-300 flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div className="flex items-center gap-2">
                          <span className="px-2.5 py-0.5 text-[10px] font-mono font-bold uppercase tracking-wider rounded-md bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-400 border border-purple-200/20 dark:border-purple-800/20">
                            Episode {ep.episodeNumber}
                          </span>
                          {ep.tags.map(t => (
                            <span 
                              key={t} 
                              onClick={() => setSelectedTag(t)}
                              className="text-[10px] text-zinc-400 dark:text-zinc-500 font-mono hover:underline cursor-pointer"
                            >
                              #{t}
                            </span>
                          ))}
                        </div>

                        <div className="flex items-center gap-4 text-xs font-mono font-semibold text-zinc-400 dark:text-zinc-500">
                          <span className="flex items-center gap-1">
                            <Icon name="calendar" className="w-3.5 h-3.5" />
                            {ep.date}
                          </span>
                          <span className="flex items-center gap-1">
                            <Icon name="clock" className="w-3.5 h-3.5" />
                            {ep.duration}
                          </span>
                        </div>
                      </div>

                      <h3 className="font-display text-xl font-bold text-zinc-800 dark:text-zinc-100 leading-snug">
                        {ep.title}
                      </h3>
                      <p className="text-zinc-400 dark:text-zinc-500 text-xs italic mt-0.5 mb-3">
                        {ep.subtitle}
                      </p>

                      <p className="text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed mb-4">
                        {ep.description}
                      </p>
                    </div>

                    <div className="border-t border-zinc-100 dark:border-zinc-900/50 pt-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mt-2">
                      <button
                        onClick={() => toggleNotes(ep.id)}
                        className="inline-flex items-center gap-1.5 text-xs font-bold text-zinc-500 dark:text-zinc-400 hover:text-purple-600 dark:hover:text-purple-400 cursor-pointer text-left focus:outline-none"
                      >
                        <Icon name="book-open" className="w-4 h-4" />
                        <span>{isNotesExpanded ? 'Hide Show Notes' : 'View Show Notes & Highlights'}</span>
                        <Icon name="chevron-down" className={`w-3.5 h-3.5 transition-transform duration-200 ${isNotesExpanded ? 'transform rotate-180 text-purple-500' : ''}`} />
                      </button>

                      <button
                        onClick={() => handlePlayNow(ep)}
                        className="px-5 py-2.5 rounded-xl bg-zinc-900 dark:bg-zinc-800 hover:bg-purple-600 dark:hover:bg-purple-600 hover:scale-103 text-white font-bold text-xs flex items-center justify-center gap-2 transition-all duration-200 cursor-pointer shadow-sm focus:outline-none"
                      >
                        <Icon name="play" className="w-3.5 h-3.5 fill-current" />
                        <span>Play Segment</span>
                      </button>
                    </div>

                    {isNotesExpanded && (
                      <div className="mt-4 p-4 rounded-2xl bg-zinc-50 dark:bg-zinc-900/40 border border-zinc-150 dark:border-zinc-850/80 space-y-4">
                        {ep.highlights && ep.highlights.length > 0 && (
                          <div className="space-y-1.5">
                            <h4 className="text-xs font-mono font-bold uppercase tracking-wider text-purple-600 dark:text-purple-400 flex items-center gap-1.5">
                              <Icon name="list-plus" className="w-3.5 h-3.5" /> Track Highlights
                            </h4>
                            <ul className="list-disc list-inside space-y-1 text-xs text-zinc-600 dark:text-zinc-450 leading-relaxed pl-1">
                              {ep.highlights.map((high, index) => (
                                <li key={index} className="marker:text-purple-500">{high}</li>
                              ))}
                            </ul>
                          </div>
                        )}

                        {ep.notes && (
                          <div className="space-y-1 pt-1.5 border-t border-zinc-200/50 dark:border-zinc-800/50">
                            <h4 className="text-xs font-mono font-bold uppercase tracking-wider text-purple-600 dark:text-purple-400">
                              Host / Producer Log
                            </h4>
                            <p className="text-xs text-zinc-500 dark:text-zinc-400 leading-relaxed italic">
                              "{ep.notes}"
                            </p>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APPLICATION LAYOUT ---
    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [activeEpisode, setActiveEpisode] = useState(EPISODES[0]);
      const [isPlaying, setIsPlaying] = useState(false);

      const NAV_ITEMS = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'player', label: 'Lounge Player', icon: 'play-circle' },
        { id: 'topics', label: 'Topic Machine', icon: 'sparkles' },
        { id: 'archive', label: 'The Vault', icon: 'folder-closed' }
      ];

      return (
        <div className="min-h-screen w-full flex flex-col md:flex-row text-zinc-900 dark:text-zinc-100 antialiased selection:bg-purple-500/20 transition-colors duration-300">
          
          {/* MOBILE TOP HEADER */}
          <header className="flex md:hidden items-center justify-between px-6 py-4 border-b border-zinc-200 dark:border-white/10 bg-white/90 dark:bg-black/40 backdrop-blur sticky top-0 z-50">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-white font-black font-display text-sm tracking-tighter">
                DH
              </div>
              <span className="font-display font-extrabold text-base tracking-tight brand-gradient">
                Da Homie Lounge
              </span>
            </div>
            <ThemeToggle />
          </header>

          {/* DESKTOP SIDEBAR */}
          <aside className="hidden md:flex flex-col justify-between w-64 shrink-0 bg-white/90 dark:bg-black/40 backdrop-blur-xl border-r border-zinc-200 dark:border-white/10 p-6 sticky top-0 h-screen overflow-y-auto">
            <div className="space-y-8">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white font-black font-display text-lg tracking-tighter shadow-md shadow-purple-500/10">
                    DH
                  </div>
                  <div className="leading-none">
                    <span className="font-display font-extrabold text-base tracking-tight brand-gradient block">
                      Da Homie Lounge
                    </span>
                    <span className="text-[10px] font-mono uppercase tracking-wider text-purple-600 dark:text-purple-400 font-bold mt-0.5 block">
                      Unfiltered HQ
                    </span>
                  </div>
                </div>
              </div>

              <nav className="space-y-1.5" aria-label="Desktop Main Navigation">
                {NAV_ITEMS.map((item) => {
                  const isActive = currentTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setCurrentTab(item.id)}
                      className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-xl font-bold text-sm transition-all duration-200 group cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-500/30 ${
                        isActive
                          ? 'bg-purple-50 dark:bg-purple-950/40 text-purple-600 dark:text-purple-400 border border-purple-100 dark:border-purple-900/30'
                          : 'text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-200 hover:bg-zinc-50 dark:hover:bg-zinc-900/50'
                      }`}
                    >
                      <Icon name={item.icon} className={`w-5 h-5 shrink-0 transition-transform group-hover:scale-105 ${
                        isActive ? 'text-purple-600 dark:text-purple-400' : 'text-zinc-400 dark:text-zinc-500'
                      }`} />
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="space-y-4 pt-6 border-t border-zinc-150 dark:border-white/10">
              <div className="flex items-center justify-between gap-4 px-2">
                <span className="text-xs font-semibold text-zinc-400 dark:text-zinc-500">
                  Appearance
                </span>
                <ThemeToggle />
              </div>

              {activeEpisode && (
                <div 
                  onClick={() => setCurrentTab('player')}
                  className="p-3 bg-white hover:bg-white/90 dark:bg-white/5 dark:hover:bg-white/10 rounded-2xl border border-zinc-150 dark:border-white/10 flex items-center gap-3 cursor-pointer group transition duration-200 shadow-sm"
                >
                  <div className="relative shrink-0">
                    <div className={`w-9 h-9 rounded-lg bg-purple-600/15 flex items-center justify-center text-purple-600 dark:text-purple-400 border border-purple-500/20 ${isPlaying ? 'animate-spin' : ''}`} style={{ animationDuration: '6s' }}>
                      <Icon name="disc" className="w-5 h-5" />
                    </div>
                    {isPlaying && (
                      <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border border-white dark:border-zinc-950 animate-ping"></span>
                    )}
                  </div>
                  <div className="min-w-0 flex-1">
                    <p className="text-[10px] font-mono font-bold text-purple-600 dark:text-purple-400 uppercase tracking-wide">
                      Now Playing
                    </p>
                    <p className="text-xs font-bold text-zinc-800 dark:text-zinc-200 truncate group-hover:text-purple-600 dark:group-hover:text-purple-400 transition-colors">
                      {activeEpisode.title}
                    </p>
                  </div>
                  <Icon name="chevron-right" className="w-4 h-4 text-zinc-400 dark:text-zinc-600 group-hover:translate-x-0.5 transition-transform" />
                </div>
              )}
            </div>
          </aside>

          {/* MAIN WORKSPACE AREA */}
          <main className="flex-1 min-w-0 overflow-y-auto px-4 py-8 sm:p-8 md:p-12 pb-32 md:pb-20 h-screen relative">
            <div className="max-w-4xl mx-auto">
              {currentTab === 'home' && <CastSection />}
              {currentTab === 'player' && (
                <PlayerSection
                  activeEpisode={activeEpisode}
                  setActiveEpisode={setActiveEpisode}
                  isPlaying={isPlaying}
                  setIsPlaying={setIsPlaying}
                  setCurrentTab={setCurrentTab}
                />
              )}
              {currentTab === 'topics' && <TopicMachine />}
              {currentTab === 'archive' && (
                <VaultSection
                  setActiveEpisode={setActiveEpisode}
                  setIsPlaying={setIsPlaying}
                  setCurrentTab={setCurrentTab}
                />
              )}
            </div>

            {/* Immersive Status Bar */}
            <div className="hidden lg:flex absolute bottom-6 right-8 gap-4 font-mono text-[10px] text-zinc-400 dark:text-slate-400 uppercase tracking-widest opacity-80 pointer-events-none">
              <span>128Kbps Streaming</span>
              <span>•</span>
              <span>Live in Tokyo</span>
              <span>•</span>
              <span>WCAG AA Certified</span>
            </div>
          </main>

          {/* MOBILE BOTTOM NAVIGATION */}
          <nav 
            id="mobile-nav"
            className="md:hidden fixed bottom-0 left-0 right-0 z-50 border-t border-zinc-200 dark:border-white/10 bg-white/90 dark:bg-black/60 backdrop-blur shadow-2xl px-2 pt-2.5 pb-[calc(10px+env(safe-area-inset-bottom))] flex justify-around"
            aria-label="Mobile Bottom Navigation"
          >
            {NAV_ITEMS.map((item) => {
              const isActive = currentTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setCurrentTab(item.id)}
                  className={`flex flex-col items-center gap-1.5 px-3 py-1.5 text-center cursor-pointer transition-all ${
                    isActive
                      ? 'text-purple-600 dark:text-purple-400 scale-105 font-bold'
                      : 'text-zinc-400 dark:text-zinc-500 hover:text-zinc-600'
                  }`}
                >
                  <div className="relative">
                    <Icon name={item.icon} className={`w-5 h-5 transition`} />
                    {item.id === 'player' && isPlaying && (
                      <span className="absolute -top-1 -right-1 w-2 h-2 bg-emerald-500 rounded-full border border-white dark:border-zinc-950 animate-ping"></span>
                    )}
                  </div>
                  <span className="text-[10px] font-mono tracking-wide">
                    {item.label === 'Lounge Player' ? 'Player' : item.label === 'Topic Machine' ? 'Machine' : item.label === 'The Vault' ? 'Vault' : item.label}
                  </span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
