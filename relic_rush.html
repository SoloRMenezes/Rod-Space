      const selectSkill = (choice) => {
        sfx.playSpecial();
        const activePlayer = window.activePlayer;
        if (activePlayer) choice.effect(activePlayer);
        setLevelUpChoices(null);
        setGameActive(true);
      };

      const handleUpdateHUD = (lvl, kills, crystalsEarned) => {
        setCurrentLevel(lvl);
        setCurrentKills(kills);
        setRunCrystals(crystalsEarned);
      };

      const getSkinsDisplayTitle = (id) => {
        if (id === "vanguard") return "Vanguard Gold";
        if (id === "void_raider") return "Void Raider";
        if (id === "crimson_knight") return "Crimson Knight";
        if (id === "neon_phantom") return "Neon Phantom";
        return id;
      };

      return (
        <div className="relative w-screen h-screen flex justify-center items-center bg-[#050508] overflow-hidden select-none font-sans">
          <div className="relative w-full h-full max-w-[800px] max-h-[1000px] sm:max-h-[700px] border-0 sm:border-2 border-[#1a1a26] bg-[#0c0c10] overflow-hidden flex flex-col shadow-2xl rounded-none sm:rounded-2xl">
            
            {/* HUD Mute triggers */}
            <div className="absolute top-4 left-4 right-4 flex justify-between items-center z-50 pointer-events-auto">
              {screen === "start" && (
                <button
                  onClick={toggleMute}
                  className="p-2.5 rounded-xl bg-[#13131c] border border-[#2d2d3f] text-slate-400 hover:text-white transition-all cursor-pointer"
                >
                  <Icon name={isMuted ? "volumex" : "volume2"} className="w-5 h-5" />
                </button>
              )}
            </div>

            {/* Menu Launcher */}
            {screen === "start" && (
              <div className="absolute inset-0 z-40 bg-[#07070a] flex flex-col justify-between p-6 md:p-10 select-none">
                <div className="absolute -top-40 left-1/2 -translate-x-1/2 w-80 h-80 bg-yellow-500/10 blur-[120px] rounded-full pointer-events-none" />
                <div className="absolute -bottom-40 left-1/2 -translate-x-1/2 w-80 h-80 bg-yellow-400/5 blur-[120px] rounded-full pointer-events-none" />

                <div className="flex justify-between items-center text-xs text-slate-500 border-b border-[#1c1c24] pb-3 font-mono">
                  <span>PROTOTYPE v1.5 [STANDALONE]</span>
                  <span className="text-yellow-400 font-extrabold flex items-center gap-1">
                    <Icon name="coins" className="w-3.5 h-3.5" />
                    {crystals} COINS
                  </span>
                </div>

                <div className="my-auto text-center flex flex-col items-center">
                  <div className="p-3 bg-yellow-400/5 border border-yellow-400/10 rounded-3xl mb-4">
                    <Icon name="swords" className="w-12 h-12 text-yellow-400" />
                  </div>
                  <h1 className="text-4xl md:text-6xl font-black tracking-widest text-yellow-400 font-display leading-none mb-2">
                    RELIC<br />RUSH
                  </h1>
                  <p className="text-xs text-slate-400 tracking-wider font-mono max-w-md uppercase">
                    INFINITE ROGUELITE EXPEDITION
                  </p>

                  {/* Best stats score */}
                  {(highScore.kills > 0 || highScore.lvl > 1) && (
                    <div className="mt-6 px-4 py-2 rounded-xl bg-[#12121a] border border-[#232333] text-xs font-mono text-slate-400 flex items-center gap-4">
                      <span className="flex items-center gap-1 text-slate-500">
                        <Icon name="award" className="w-4 h-4 text-yellow-400" />
                        BEST RUN:
                      </span>
                      <span>LVL <strong className="text-white">{highScore.lvl}</strong></span>
                      <span>KILLS <strong className="text-white">{highScore.kills}</strong></span>
                    </div>
                  )}

                  <div className="mt-3 text-[10px] font-mono text-slate-500 uppercase tracking-widest">
                    Armor: <span className="text-yellow-400 font-extrabold">{getSkinsDisplayTitle(cosmetics.equippedSkin)}</span>
                    {cosmetics.equippedTrail !== "none" && (
                      <> | Trail: <span className="text-cyan-400 font-extrabold">{cosmetics.equippedTrail}</span></>
                    )}
                  </div>
                </div>

                {/* Operations instruction card */}
                <div className="bg-[#0e0e13] border border-[#1b1b26] p-4 rounded-xl text-center mb-6">
                  <p className="text-[10px] text-slate-500 font-mono uppercase tracking-wider mb-2">
                    OPERATIONAL CONTROLS
                  </p>
                  <div className="text-xs text-slate-300 font-bold flex justify-center items-center">
                    <span className="bg-[#181824] px-4 py-2 rounded-xl border border-[#2b2b3c] font-mono text-yellow-400 shadow flex items-center gap-2">
                      <span className="inline-block w-2.5 h-2.5 rounded-full bg-yellow-400" />
                      DRAG ANYWHERE TO MOVE
                    </span>
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row gap-3">
                  <button
                    onClick={handleStartGame}
                    className="flex-1 bg-yellow-400 hover:bg-yellow-300 text-black font-black py-4 px-6 rounded-xl hover:scale-102 active:scale-95 transition-all text-center flex items-center justify-center gap-2 text-sm tracking-wider uppercase cursor-pointer"
                  >
                    <Icon name="play" className="w-4 h-4" />
                    START EXPEDITION
                  </button>
                  <button
                    onClick={handleOpenShop}
                    className="flex-1 bg-[#13131c] hover:bg-[#1a1a27] border border-[#2d2d3e] hover:border-slate-500 text-white font-extrabold py-4 px-6 rounded-xl hover:scale-102 active:scale-95 transition-all text-center flex items-center justify-center gap-2 text-sm tracking-wider uppercase cursor-pointer"
                  >
                    <Icon name="coins" className="w-4 h-4 text-yellow-400" />
                    COMMISSARY
                  </button>
                </div>
              </div>
            )}

            {/* Persistence Store */}
            {screen === "shop" && (
              <Shop
                upgrades={upgrades}
                crystals={crystals}
                onPurchase={handleBuyUpgrade}
                cosmetics={cosmetics}
                onBuyCosmetic={handleBuyCosmetic}
                onEquipCosmetic={handleEquipCosmetic}
                onClose={handleCloseShop}
              />
            )}

            {/* Core gameplay HUD HUD */}
            {screen === "playing" && (
              <div className="absolute top-0 left-0 right-0 p-4 z-30 pointer-events-none flex flex-col gap-2">
                <div className="flex justify-between items-center">
                  <div className="bg-[#0b0b0f]/85 border border-[#1b1b26] px-3 py-1 rounded-lg text-xs font-black tracking-wider text-slate-300 backdrop-blur-md">
                    LVL <span className="text-yellow-400 font-mono">{currentLevel}</span>
                  </div>

                  <div className="flex gap-2 pointer-events-auto">
                    <button
                      onClick={() => { setPaused((p) => !p); sfx.playHit(); }}
                      className="p-1.5 rounded-lg bg-[#0b0b0f]/90 border border-[#232333] text-slate-300 hover:text-white transition-all cursor-pointer"
                    >
                      <Icon name={paused ? "play" : "pause"} className="w-4 h-4" />
                    </button>
                    <button
                      onClick={toggleMute}
                      className="p-1.5 rounded-lg bg-[#0b0b0f]/90 border border-[#232333] text-slate-400 hover:text-white transition-all cursor-pointer"
                    >
                      <Icon name={isMuted ? "volumex" : "volume2"} className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="bg-[#0b0b0f]/85 border border-[#1b1b26] px-3 py-1 rounded-lg text-xs font-black tracking-wider text-slate-300 backdrop-blur-md flex items-center gap-1">
                    KILLS <span className="text-red-500 font-mono">{currentKills}</span>
                  </div>

                  <div className="bg-[#0b0b0f]/85 border border-[#1b1b26] px-3 py-1 rounded-lg text-xs font-black tracking-wider text-slate-300 backdrop-blur-md flex items-center gap-1.5">
                    <Icon name="coins" className="w-3.5 h-3.5 text-yellow-400" />
                    <span className="text-yellow-400 font-mono">{runCrystals}</span>
                  </div>
                </div>

                <div className="w-full bg-slate-900/60 h-1 rounded-full overflow-hidden border border-slate-950/20 backdrop-blur-md">
                  <div id="xp-bar-fill" className="h-full bg-cyan-400 transition-all duration-300" style={{ width: "0%" }} />
                </div>

                <div className="flex items-center gap-2">
                  <Icon name="heart" className="w-4 h-4 text-red-500" />
                  <div className="w-36 bg-slate-900/60 h-2 rounded-full overflow-hidden border border-slate-950/20 backdrop-blur-md">
                    <div id="hp-bar-fill" className="h-full bg-red-500 transition-all duration-100" style={{ width: "100%" }} />
                  </div>
                </div>
              </div>
            )}

            {/* Vector Sandbox canvas overlay */}
            <GameCanvas
              upgrades={upgrades}
              active={gameActive}
              paused={paused}
              equippedSkin={cosmetics.equippedSkin}
              equippedTrail={cosmetics.equippedTrail}
              onGameOver={handleGameOver}
              onLevelUp={handleLevelUp}
              onEarnCrystals={handleEarnCrystals}
              onUpdateHUD={handleUpdateHUD}
            />

            {/* Midgame Levelup choices */}
            {levelUpChoices && (
              <div className="absolute inset-0 bg-slate-950/90 flex flex-col justify-center items-center z-[110] p-6 text-center select-none">
                <h2 className="text-2xl font-black text-yellow-400 tracking-widest font-display mb-1 flex items-center gap-2">
                  RELIC ACQUIRED
                </h2>
                <p className="text-xs text-slate-400 tracking-wider uppercase font-mono mb-8">
                  Select an adaptation upgrade
                </p>

                <div className="flex flex-col gap-4 w-full max-w-sm">
                  {levelUpChoices.map((choice) => {
                    const isLegendary = choice.rarity === "legendary";
                    const isRare = choice.rarity === "rare";

                    return (
                      <div
                        key={choice.id}
                        onClick={() => selectSkill(choice)}
                        className={`p-4 rounded-2xl border transition-all duration-200 cursor-pointer text-left hover:-translate-y-1 ${
                          isLegendary ? "bg-yellow-950/20 border-yellow-500 hover:border-yellow-300 hover:bg-yellow-950/40 shadow-lg shadow-yellow-950/30" : isRare ? "bg-cyan-950/20 border-cyan-500 hover:border-cyan-300 hover:bg-cyan-950/40" : "bg-slate-900/40 border-[#2d2d3e] hover:border-slate-400 hover:bg-slate-900/80"
                        }`}
                      >
                        <div className="flex justify-between items-center mb-1">
                          <span className={`text-[9px] font-black tracking-widest uppercase px-2 py-0.5 rounded ${isLegendary ? "bg-yellow-400 text-black" : isRare ? "bg-cyan-400 text-black" : "bg-slate-800 text-slate-400"}`}>
                            {choice.rarity}
                          </span>
                        </div>
                        <h3 className="font-extrabold text-sm text-slate-200">{choice.title}</h3>
                        <p className="text-xs text-slate-400 mt-1">{choice.desc}</p>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Pause popup panel */}
            {paused && screen === "playing" && (
              <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-center items-center z-[100] p-6 text-center select-none">
                <h2 className="text-3xl font-black text-yellow-400 tracking-widest font-display mb-1">
                  EXPEDITION PAUSED
                </h2>
                <p className="text-xs text-slate-400 tracking-wider uppercase font-mono mb-6">
                  Press 'P' or click resume to return
                </p>
                <div className="flex flex-col gap-3 w-full max-w-xs">
                  <button
                    onClick={() => { setPaused(false); sfx.playSpecial(); }}
                    className="bg-yellow-400 hover:bg-yellow-300 text-black font-black py-3 px-6 rounded-xl transition-all uppercase tracking-wider text-sm cursor-pointer"
                  >
                    RESUME
                  </button>
                  <button
                    onClick={() => window.location.reload()}
                    className="bg-slate-800 hover:bg-slate-700 text-white font-black py-3 px-6 rounded-xl transition-all uppercase tracking-wider text-sm cursor-pointer"
                  >
                    QUIT TO MENU
                  </button>
                </div>
              </div>
            )}

            {/* Game Over Screen */}
            {screen === "gameover" && (
              <div className="absolute inset-0 bg-[#07070a]/95 flex flex-col justify-center items-center z-[120] p-6 text-center select-none">
                <div className="p-4 bg-red-500/10 border border-red-500/20 rounded-full mb-4">
                  <Icon name="swords" className="w-10 h-10 text-red-500" />
                </div>

                <h1 className="text-4xl font-black text-red-500 tracking-wider font-display mb-1">
                  EXPEDITION FAILED
                </h1>
                <p className="text-xs text-slate-500 font-mono uppercase tracking-wider mb-8">
                  Your shield critical systems collapsed
                </p>

                <div className="grid grid-cols-2 gap-4 bg-[#0e0e13] border border-[#1b1b26] p-6 rounded-2xl w-full max-w-sm mb-8 font-mono">
                  <div className="text-left">
                    <span className="text-[10px] text-slate-500 uppercase">Level Reached</span>
                    <p className="text-2xl font-black text-white">{currentLevel}</p>
                  </div>
                  <div className="text-left">
                    <span className="text-[10px] text-slate-500 uppercase">Enemies Cleared</span>
                    <p className="text-2xl font-black text-red-400">{currentKills}</p>
                  </div>
                  <div className="text-left border-t border-[#1b1b26] pt-4 col-span-2">
                    <span className="text-[10px] text-slate-500 uppercase">Crystals Recovered</span>
                    <p className="text-2xl font-black text-yellow-400 flex items-center gap-1">
                      💰 {runCrystals}
                    </p>
                  </div>
                </div>

                <button
                  onClick={() => window.location.reload()}
                  className="w-full max-w-sm bg-yellow-400 hover:bg-yellow-300 text-black font-black py-4 px-6 rounded-xl hover:scale-102 active:scale-95 transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-2 cursor-pointer font-display"
                >
                  <Icon name="rotate" className="w-4 h-4 text-black" />
                  MENU
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
  <script>
    (function() {
      try {
        const code = document.getElementById('game-source').textContent;
        const compiled = Babel.transform(code, {
          presets: [
            [Babel.availablePresets['react'], { runtime: 'classic' }]
          ]
        }).code;
        const script = document.createElement('script');
        script.textContent = compiled;
        document.body.appendChild(script);
      } catch (err) {
        console.error("Babel compilation error:", err);
        const errorDiv = document.createElement('div');
        errorDiv.style.color = '#ef4444';
        errorDiv.style.padding = '24px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.textContent = 'Babel Standalone Compilation Error:\n' + err.stack;
        document.body.appendChild(errorDiv);
      }
    })();
  </script>
</body>
</html>
