<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b42e8">
  <title>Party Space</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#fff1d6;color:#19182d;font:16px system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(1080px,calc(100% - 32px));margin:auto}.topbar{height:70px;background:#5b42e8;color:white;display:flex;align-items:center;border-bottom:4px solid #19182d}.topbar .shell{display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:1000;letter-spacing:-1px}.brand span{color:#ffe44c}.back{padding:9px 14px;border:2px solid #19182d;background:#fff1d6;color:#19182d;border-radius:999px;font-weight:800;box-shadow:3px 3px 0 #19182d}.hero{position:relative;margin:32px 0 42px;padding:clamp(34px,7vw,72px);overflow:hidden;background:#ff625d;border:3px solid #19182d;border-radius:28px;box-shadow:8px 8px 0 #19182d}.hero:before,.hero:after{position:absolute;font-size:clamp(80px,18vw,190px);font-weight:1000;color:#ffe44c;line-height:1;transform:rotate(-12deg)}.hero:before{content:'✦';right:8%;top:-24%}.hero:after{content:'●';right:25%;bottom:-48%;color:#63dcff}.eyebrow{position:relative;z-index:1;display:inline-block;padding:7px 11px;background:#19182d;color:white;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{position:relative;z-index:1;max-width:650px;font-size:clamp(48px,9vw,88px);line-height:.92;letter-spacing:-5px;margin:18px 0}.hero p{position:relative;z-index:1;max-width:510px;margin:0;font-size:clamp(18px,2.5vw,23px);font-weight:650;line-height:1.35}.games{padding-bottom:70px}.games h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}.card{min-height:300px;padding:24px;background:#63dcff;border:3px solid #19182d;border-radius:22px;display:flex;flex-direction:column;box-shadow:6px 6px 0 #19182d;transition:transform .16s ease,box-shadow .16s ease}.card:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #19182d}.card-top{display:flex;justify-content:space-between;align-items:center}.pill{padding:6px 9px;border:2px solid #19182d;border-radius:999px;background:#fff1d6;font-size:11px;font-weight:900;text-transform:uppercase}.lock{font-size:13px;font-weight:800}.icon{width:64px;height:64px;margin:32px 0 18px;display:grid;place-items:center;background:#5b42e8;border:3px solid #19182d;border-radius:18px;font-size:34px}.card h3{font-size:34px;letter-spacing:-1.5px;margin:0 0 4px}.card p{margin:0;font-weight:650}.play{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:3px solid #19182d;padding-top:16px;font-weight:950}.empty{min-height:300px;border:3px dashed #aaa089;border-radius:22px;display:grid;place-items:center;color:#817863;text-align:center;padding:28px;font-weight:750}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 20px}.toolbar select,.filter-btn{border:2px solid #19182d;background:#fff1d6;color:#19182d;border-radius:999px;padding:9px 13px;font:800 13px system-ui;cursor:pointer}.filter-btn.active{background:#19182d;color:#fff}.card-actions{display:flex;gap:8px}.card-action{width:36px;height:36px;border:2px solid #19182d;border-radius:50%;background:#fff1d6;font-size:17px;cursor:pointer}.card-action.active{background:#ffe44c}.launch-date{font-size:12px;font-weight:850;opacity:.65;margin-top:8px}.empty-results{grid-column:1/-1;padding:48px;text-align:center;border:3px dashed #aaa089;border-radius:22px;font-weight:800}.footer-note{padding:26px 0 34px;color:#776f5e;font-size:13px}@media(max-width:560px){.topbar{height:62px}.hero{margin-top:20px;padding:34px 26px;border-radius:20px;box-shadow:5px 5px 0 #19182d}.hero h1{letter-spacing:-3px}.hero:before{right:-4%;top:-15%}.hero:after{display:none}.card{min-height:260px;box-shadow:5px 5px 0 #19182d}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell"><div class="brand">PARTY <span>SPACE</span></div><a class="back" href="./">Rod Space</a></div></header>
  <main class="shell">
    <section class="hero"><div class="eyebrow">Pass it around</div><h1>Games hit different together.</h1><p>Pick something, hand over the phone, and make questionable decisions.</p></section>
    <section class="games">
      <h2>Games</h2>
      <div class="toolbar" aria-label="Game sorting and filters">
        <select id="party-sort" aria-label="Sort games"><option value="newest">Newest launch</option><option value="oldest">Oldest launch</option><option value="az">A–Z</option></select>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="favourites">★ Starred</button>
        <button class="filter-btn" data-filter="pinned">📌 Pinned</button>
        <select id="party-category" aria-label="Filter by category"><option value="all">All categories</option></select>
      </div>
      <div id="party-grid" class="grid"></div>
    </section>
    <div class="footer-note" style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center"><span>PARTY SPACE · A ROD SPACE COLLECTION</span><a href="https://www.instagram.com/solormenezes2/" target="_blank" rel="noopener" style="font-weight:900;color:#19182d">@solormenezes2</a></div>
  </main>
  <script>
    const games=[
      {id:'shit-spiral',name:'Shit Spiral',desc:'Rank the misery',href:'shit-spiral.html',icon:'🌀',category:'Ranking game',date:'2026-09-21'},
      {id:'nextup',name:'NextUp',desc:'Pass the mic',href:'nextup/index.html',icon:'🎙️',category:'Music',date:'2026-08-27'},
      {id:'karaoke-night',name:'Karaoke Night',desc:'Sing along',href:'KaraokeApp/index.html',icon:'🎤',category:'Music',date:'2026-05-11'},
      {id:'impostor',name:'Impostor',desc:'Find the liar',href:'impostor.html',icon:'🔪',category:'Social deduction',date:'2026-03-20'},
      {id:'truth-or-dare',name:'Truth or Dare',desc:'Choose carefully',href:'truth-or-dare.html',icon:'😈',category:'Party classic',date:'2026-02-26'},
      {id:'whos-more-likely',name:"Who's More Likely?",desc:'Expose your friends',href:'whos-more-likely.html',icon:'🤔',category:'Group game',date:'2026-02-26'},
      {id:'sidequests',name:'Side Quests',desc:'Break the routine',href:'sidequests.html',icon:'🏆',category:'Challenges',date:'2026-02-02'},
      {id:'darts',name:'Darts',desc:'Test your aim',href:'darts.html',icon:'🎯',category:'Local versus',date:'2026-01-26'},
      {id:'tic-tac-toe',name:'Tic Tac Toe',desc:'Ruthless rematches',href:'tic-tac-toe.html',icon:'✕○',category:'Local versus',date:'2026-01-26'},
      {id:'dots-boxes',name:'Dots & Boxes',desc:'Claim every box',href:'dots&boxes.html',icon:'▦',category:'Local versus',date:'2026-01-26'},
      {id:'theft',name:'Theft',desc:'Steal the diamond',href:'theft.html',icon:'🥷',category:'Local versus',date:'2026-01-26'},
      {id:'cards-against',name:'Cards Against Boredom',desc:'Brutal party cards',href:'cards-against-boredom.html',icon:'🃏',category:'Card game',date:'2026-01-25'},
      {id:'would-you-rather',name:'Would You Rather',desc:'Pick a side',href:'would-you-rather.html',icon:'🤷',category:'Choices',date:'2026-01-22'}
    ];
    const loadSet=key=>{try{return new Set(JSON.parse(localStorage.getItem(key))||[])}catch{return new Set()}};
    const favourites=loadSet('party_space_favourites'),pinned=loadSet('party_space_pins');let filter='all';
    const grid=document.getElementById('party-grid'),sort=document.getElementById('party-sort'),category=document.getElementById('party-category');
    [...new Set(games.map(game=>game.category))].sort().forEach(value=>category.insertAdjacentHTML('beforeend',`<option value="${value}">${value}</option>`));
    function save(key,set){localStorage.setItem(key,JSON.stringify([...set]))}
    function toggle(kind,id,event){event.preventDefault();event.stopPropagation();const set=kind==='star'?favourites:pinned;set.has(id)?set.delete(id):set.add(id);save(kind==='star'?'party_space_favourites':'party_space_pins',set);render()}
    function render(){
      let visible=games.filter(game=>(category.value==='all'||game.category===category.value)&&(filter==='all'||(filter==='favourites'?favourites:pinned).has(game.id)));
      visible.sort((a,b)=>sort.value==='az'?a.name.localeCompare(b.name):sort.value==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
      visible.sort((a,b)=>Number(pinned.has(b.id))-Number(pinned.has(a.id)));
      grid.innerHTML=visible.length?visible.map(game=>`<a class="card" href="${game.href}"><div class="card-top"><span class="pill">${game.category}</span><span class="card-actions"><button class="card-action ${favourites.has(game.id)?'active':''}" onclick="toggle('star','${game.id}',event)" aria-label="Star ${game.name}">★</button><button class="card-action ${pinned.has(game.id)?'active':''}" onclick="toggle('pin','${game.id}',event)" aria-label="Pin ${game.name}">📌</button></span></div><div class="icon">${game.icon}</div><h3>${game.name}</h3><p>${game.desc}</p><div class="launch-date">Launched ${new Date(game.date+'T00:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'})}</div><div class="play"><span>Play</span><span>→</span></div></a>`).join(''):'<div class="empty-results">No games match this filter.</div>';
    }
    document.querySelectorAll('.filter-btn').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('.filter-btn').forEach(item=>item.classList.toggle('active',item===button));render()});
    sort.onchange=category.onchange=render;render();
  </script>
</body>
</html>
