<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Quests</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-mute: #64748b;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: #ffffff;
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --shadow: rgba(15, 23, 42, 0.08);
            --accent: #3b82f6;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --text-main: #f8fafc;
            --text-sub: #e2e8f0;
            --text-mute: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-blue: #3b82f6;
            --primary-hover: #60a5fa;
            --shadow: rgba(0, 0, 0, 0.4);
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 0;
            margin: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease;
            overflow-x: hidden;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: rotate(15deg) scale(1.1);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        /* Start Screen */
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            padding: 20px;
        }

        .start-screen h1 {
            font-size: clamp(3em, 10vw, 5em);
            margin: 0;
            font-weight: 900;
            background: linear-gradient(to bottom right, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .start-screen p {
            font-size: 1.2em;
            color: var(--text-mute);
            margin: 10px 0 0;
            font-weight: 500;
        }

        #questBox {
            margin-top: 60px;
            padding: 20px 48px;
            font-size: 1.1em;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 260px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            letter-spacing: 0.02em;
        }

        #questBox:hover {
            background: var(--primary-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.5);
        }

        /* Updated Skills Button Styling */
        #skillsBox {
            margin-top: 20px;
            padding: 20px 48px;
            font-size: 1.1em;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 260px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            letter-spacing: 0.02em;
        }

        #skillsBox:hover {
            background: var(--primary-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.5);
        }

        /* Quest Screen */
        .quest-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 80px 24px;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
        }

        .quest-header {
            margin-bottom: 40px;
        }

        .quest-header h2 {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .quest-header h1 {
            font-size: 2.5em;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        #quest {
            font-size: 1.25em;
            line-height: 1.7;
            padding: 48px;
            border: 1px solid var(--card-border);
            border-radius: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            width: 100%;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px var(--shadow);
            color: var(--text-sub);
            position: relative;
            transition: all 0.3s ease;
        }

        #quest::before {
            content: '“';
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 4em;
            font-family: serif;
            opacity: 0.1;
            color: var(--accent);
        }

        .daily-note {
            font-size: 0.9em;
            color: var(--text-mute);
            margin-top: 32px;
            max-width: 400px;
            line-height: 1.6;
            font-weight: 500;
        }

        .back-btn {
            margin-top: 40px;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-mute);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: var(--text-main);
            background: var(--card-bg);
        }
        
        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .quest-screen {
            animation: reveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .sun-icon { display: none; }
        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg class="moon-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
        <svg class="sun-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
        </svg>
    </button>

    <div class="start-screen" id="startScreen">
        <h1>Side Quests</h1>
        <p>Stop Auto-Pilot. One mission at a time.</p>
        <button id="questBox" onclick="startQuests()">Unlock Today's Quest</button>
        <button id="skillsBox" onclick="startSkills()">Unlock Today's Skill</button>
    </div>

    <div class="quest-screen" id="questScreen">
        <div class="quest-header">
            <h2 id="objectiveHeader">Current Objective</h2>
            <h1 id="dateHeader">Today's Mission</h1>
        </div>
        <div id="quest">Loading your mission...</div>
        <div class="daily-note" id="dailyNote">A new side quest unlocks automatically every 24 hours. Good luck, explorer.</div>
        <button class="back-btn" onclick="goBackHome()">Back Home</button>
    </div>

    <script>
const quests = [
    "Speed Sprint: Pick a safe 100–200 m stretch and sprint safely.",
    "Wheel Lift Drill: Lift your front wheel slightly over bumps or curbs along the path.",
    "Tight Corner Figure-8: Ride figure-8s through tight turns between street markers or trees.",
    "Hill Repeats: Use any slight incline and ride up and down 3–5 times.",
    "Timed Loop: Complete a familiar loop faster than before, focusing on smooth pedalling.",
    "Obstacle Slalom: Weave between imaginary cones or natural obstacles without braking.",
    "Obstacle Line Ride: Ride a precise line along curbs, pavement edges, or narrow paths.",
    "Mini Hill + Climb Sprint: Pick a hill or steps (push bike if needed) and sprint up, then coast down.",
    "Figure-8 Drill: Ride a figure-8 around 2 landmarks multiple times to improve control.",
    "Bike Circuit Challenge: Combine 2–3 elements (sprint, hill, obstacle slalom) along your route.",
    "Beach Sprint Challenge: Sprint 50–100 m on sand, focus on keeping balance.",
    "Sand Obstacle Ride: Create small mounds or tracks in sand and ride over them carefully.",
    "Wind Resistance Drill: Ride against the wind for 30–60 seconds, maintain steady cadence.",
    "Balance Wheelie Practice: Hold a short wheelie along a straight, safe path.",
    "Park Push-Up Circuit: Do 10 push-ups at 3 different Vilamoura spots, each at least 3 minutes bike apart.",
    "Mini Sprint Circuit: Run 50–100 m back and forth 5 times in a safe location.",
    "Wall Sit Challenge: Hold a wall sit for 90 seconds.",
    "Rock Skip Challenge: Find 10 flat stones and see how many times you can skip them across water.",
    "Mini Sand Sculpture: Build a creative sand sculpture using only hands and natural materials.",
    "Stick Tower: Collect sticks, leaves, and stones to build a tower at least 50 cm high.",
    "Beach Treasure Hunt: Hide a small object and try to find it again blindfolded or timed.",
    "DIY Obstacle Course: Use natural objects to build a 3–5 station outdoor course combining jumps, balance, and throws.",
    "Mini Raft Float: Construct a tiny floating raft using sticks/leaves and see if it floats across a shallow water patch.",
    "Message in a Bottle: Write a short note, seal it in a bottle, and place it on the sand safely.",
    "Natural Paint: Use wet sand or mud to create patterns or shapes on rocks or the beach.",
    "Shadow Tracing: Use sunlight to trace shadows of objects or yourself, move and re-trace them creatively.",
    "Rock Stack Challenge: Stack 5–10 stones on top of each other as high as possible without falling.",
    "Beach Bowling: Use a round stone and create a line of smaller stones as pins, try to knock them down.",
    "Shell Art: Collect shells and arrange them into a pattern or simple artwork on sand.",
    "Beach Push-Up Circuit: 10 push-ups, 10 squats, 10 lunges, repeated 3 times at different sand spots.",
    "Jump/Step Drill: Use curbs, low walls, or steps—jump on/off 10 times.",
    "Balance Beam: Walk along a curb or low wall without stepping off.",
    "Stair Repeats: Run up and walk down a safe set of stairs 3–5 times.",
    "Nature Object Tower: Level 1: stack 3 objects; Level 2: stack 5 objects; Level 3: stack 7 objects creatively.",
    "Shadow Run: Run along streets or parks, timing steps to avoid sunlight patches.",
    "Mini Climb Challenge: Climb low walls, steps, or playground structures safely (no jumping from height).",
    "Fitness Circuit Combo: Combine push-ups, jumps, balance, mini sprints, or stacking objects in a self-made outdoor obstacle course."
];

// Theme Management
function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    setTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
    setTheme(savedTheme);
} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    setTheme('dark');
}

// Modified getDailyQuest: Returns the same quest for the whole day, changes after midnight.
function getDailyQuest() {
    const queueKey = 'questQueue';
    const lastQuestKey = 'lastQuest';
    const lastQuestDateKey = 'lastQuestDate';

    // Today's date as YYYY-MM-DD
    const now = new Date();
    const todayStr = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');

    // Check if we have a quest for today
    const lastQuestDate = localStorage.getItem(lastQuestDateKey);
    const lastQuestIdx = localStorage.getItem(lastQuestKey);
    if (lastQuestDate === todayStr && lastQuestIdx !== null && !isNaN(Number(lastQuestIdx))) {
        // Use the same quest for today
        return quests[Number(lastQuestIdx)];
    }

    // Otherwise, get the next quest from the queue
    let queue = JSON.parse(localStorage.getItem(queueKey));
    if (!Array.isArray(queue) || queue.length === 0) {
        // Initialize a new shuffled queue of quest indices
        queue = [];
        for (let i = 0; i < quests.length; i++) {
            queue.push(i);
        }
        // Shuffle the queue using Fisher-Yates
        for (let i = queue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [queue[i], queue[j]] = [queue[j], queue[i]];
        }
    }

    // Pop the next quest index from the queue
    const questIndex = queue.shift();

    // Save the updated queue and today's quest to localStorage
    localStorage.setItem(queueKey, JSON.stringify(queue));
    localStorage.setItem(lastQuestKey, questIndex);
    localStorage.setItem(lastQuestDateKey, todayStr);

    return quests[questIndex];
}

function startQuests() {
    const now = new Date();
    const options = { month: 'long', day: 'numeric' };
    document.getElementById('dateHeader').innerText = now.toLocaleDateString(undefined, options);
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('questScreen').style.display = 'flex';
    document.getElementById('quest').innerText = getDailyQuest();
    document.getElementById('objectiveHeader').innerText = "Current Objective";
    document.getElementById('dateHeader').style.fontSize = "2.5em";
    document.getElementById('dailyNote').innerText = "A new side quest unlocks automatically every 24 hours. Good luck, explorer.";
    // Remove any skills-specific state
    document.getElementById('learntBtn')?.remove();
}

// --- Skills Feature ---
const skills = [
    "Learn to juggle 3 objects (start with rolled up socks or balls).",
    "Learn the basics of origami: fold a paper crane or frog.",
    "Learn a simple card trick and perform it for someone.",
    "Learn to whistle loudly using your fingers.",
    "Learn to tie a bowline knot and explain its use.",
    "Learn to balance a broom or stick vertically on your palm for 30 seconds.",
    "Learn to write your name in Morse code.",
    "Learn to do a basic coin flip and catch with one hand.",
    "Learn to spin a book or notebook on your finger for 10 seconds.",
    "Learn to solve a Rubik's Cube (or just one side).",
    "Learn to make a paper airplane that flies at least 5 meters.",
    "Learn to shuffle a deck of cards with the bridge finish.",
    "Learn to do a wall handstand (hold for 10 seconds).",
    "Learn to balance on one foot with eyes closed for 30 seconds.",
    "Learn to do a forward roll safely on grass or soft surface.",
    "Learn to recite the NATO phonetic alphabet (Alpha, Bravo, Charlie, ...).",
    "Learn to tie your shoes with the 'Ian Knot' (fastest shoelace knot).",
    "Learn to do a basic yoga pose (tree, warrior, or downward dog).",
    "Learn to clap rhythm patterns (e.g., 3-3-2 or 4-4 time).",
    "Learn to draw a simple cartoon character from memory.",
    "Learn to snap your fingers with both hands.",
    "Learn to touch your toes with straight legs (stretch safely).",
    "Learn to count to 10 in a new language.",
    "Learn to do a two-finger push-up (knees allowed).",
    "Learn to fold a T-shirt in under 5 seconds (Japanese method).",
    "Learn to make a shadow animal with your hands and a flashlight.",
    "Learn to balance a spoon on your nose for 10 seconds.",
    "Learn to do a basic beatbox rhythm.",
    "Learn to do a squat jump and land softly 10 times.",
    "Learn to identify 3 local plants or trees by leaf shape.",
    "Learn to do a plank for 1 minute with good form.",
    "Learn to make a friendship bracelet or simple knot bracelet.",
    "Learn to do a 'magic' disappearing coin trick.",
    "Learn to recite a short poem or tongue-twister from memory.",
    "Learn to spin a pencil around your thumb.",
    "Learn to do a basic self-massage (shoulders or hands).",
    "Learn to throw and catch a ball with your non-dominant hand 10 times.",
    "Learn to draw a map of your neighborhood from memory.",
    "Learn to do a standing long jump and measure your distance.",
    "Learn to toss a playing card into a cup from 1 meter away.",
    "Learn to balance a stack of 5 coins on your elbow and catch them.",
    "Learn to do a safe backward roll or backward somersault (on grass).",
    "Learn to make a simple musical instrument (shaker, drum, etc).",
    "Learn to identify 3 constellations in the night sky.",
    "Learn to mimic 3 bird calls or animal sounds.",
    "Learn to do 10 push-ups with perfect form.",
    "Learn to draw a self-portrait (cartoon or realistic).",
    "Learn to do a basic magic knot for joining two ropes.",
    "Learn to spin in place 10 times without getting dizzy.",
];

function getDailySkillIndex() {
    // Use a similar approach as quests: fixed skill per day, rotates through skills
    const skillDateKey = 'lastSkillDate';
    const skillIdxKey = 'lastSkillIdx';
    const today = new Date();
    const todayStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');
    let savedDate = localStorage.getItem(skillDateKey);
    let savedIdx = localStorage.getItem(skillIdxKey);
    if (savedDate === todayStr && savedIdx !== null && !isNaN(Number(savedIdx))) {
        return Number(savedIdx);
    }
    // Rotate through skills in order
    let idx = 0;
    if (savedIdx !== null && !isNaN(Number(savedIdx))) {
        idx = (Number(savedIdx) + 1) % skills.length;
    }
    localStorage.setItem(skillDateKey, todayStr);
    localStorage.setItem(skillIdxKey, idx);
    // Reset learnt status for the new day
    localStorage.removeItem('skillLearnt_' + todayStr);
    return idx;
}

function startSkills() {
    const now = new Date();
    const options = { month: 'long', day: 'numeric' };
    document.getElementById('dateHeader').innerText = now.toLocaleDateString(undefined, options) + " – Skill";
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('questScreen').style.display = 'flex';
    document.getElementById('objectiveHeader').innerText = "Skill Challenge";
    document.getElementById('dateHeader').style.fontSize = "2em";
    document.getElementById('dailyNote').innerText = "A new skill challenge unlocks every 24 hours. Can you master them all?";
    renderSkillAndButton();
}

function renderSkillAndButton() {
    const skillIdx = getDailySkillIndex();
    const today = new Date();
    const todayStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');
    const skillText = skills[skillIdx];
    const questDiv = document.getElementById('quest');
    // Only show skill text in the grey box
    questDiv.innerText = skillText;
    // Remove any previous button/message outside quest box
    document.getElementById('learntBtn')?.remove();
    const dailyNote = document.getElementById('dailyNote');
    // Remove any previous congrats message outside quest box
    Array.from(document.querySelectorAll('.skill-complete-msg')).forEach(el => el.remove());
    // Add "Mark as Learnt" button (or message) below the grey box, above the daily note
    if (!localStorage.getItem('skillLearnt_' + todayStr)) {
        const btn = document.createElement('button');
        btn.id = 'learntBtn';
        btn.innerText = "Mark Skill as Learnt";
        btn.style.marginTop = "32px";
        btn.style.padding = "14px 38px";
        btn.style.background = "var(--primary-blue)";
        btn.style.color = "#fff";
        btn.style.border = "none";
        btn.style.borderRadius = "100px";
        btn.style.fontWeight = "700";
        btn.style.fontSize = "1em";
        btn.style.cursor = "pointer";
        btn.onclick = markSkillLearnt;
        // Insert button just before the dailyNote
        dailyNote.parentNode.insertBefore(btn, dailyNote);
    } else {
        // Already learnt: show a congrats message
        const doneMsg = document.createElement('div');
        doneMsg.className = "skill-complete-msg";
        doneMsg.innerText = "✅ Skill completed! Well done.";
        doneMsg.style.marginTop = "32px";
        doneMsg.style.color = "var(--accent)";
        doneMsg.style.fontWeight = "700";
        doneMsg.style.fontSize = "1.1em";
        // Insert message just before the dailyNote
        dailyNote.parentNode.insertBefore(doneMsg, dailyNote);
    }
}

function markSkillLearnt() {
    const today = new Date();
    const todayStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');
    localStorage.setItem('skillLearnt_' + todayStr, '1');
    renderSkillAndButton();
}

function goBackHome() {
    // Remove skill button/message if any (outside the quest box)
    document.getElementById('learntBtn')?.remove();
    Array.from(document.querySelectorAll('.skill-complete-msg')).forEach(el => el.remove());
    // Reset quest text
    document.getElementById('quest').innerText = "Loading your mission...";
    document.getElementById('questScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
}
    </script>
  <script src="assets/language-switcher.js" defer></script>
</body>
</html>
