{d:'Core',m:2,q:'Simplify a<sup>9</sup> ÷ (a<sup>3</sup> × a<sup>−2</sup>).',a:'a<sup>8</sup>',w:'The denominator is a<sup>1</sup>, so a<sup>9</sup> ÷ a = a<sup>8</sup>.'},
{d:'Core',m:2,q:'Simplify (m<sup>−2</sup>)<sup>3</sup> × m<sup>8</sup>.',a:'m<sup>2</sup>',w:'Multiply the first indices: −2 × 3 = −6. Then −6 + 8 = 2.'},
{d:'Core',m:2,q:'Write 5p<sup>−4</sup> using only positive indices.',a:'<span class="math-frac"><span>5</span><span>p<sup>4</sup></span></span>',w:'p<sup>−4</sup> = <span class="math-frac"><span>1</span><span>p<sup>4</sup></span></span>, so 5p<sup>−4</sup> = <span class="math-frac"><span>5</span><span>p<sup>4</sup></span></span>.'},
{d:'Core',m:2,q:'Simplify (3x<sup>2</sup>)<sup>3</sup>.',a:'27x<sup>6</sup>',w:'Cube both factors: 3<sup>3</sup>x<sup>2×3</sup> = 27x<sup>6</sup>.'},
{d:'Core',m:2,q:'Simplify 18y<sup>7</sup> ÷ 6y<sup>−2</sup>.',a:'3y<sup>9</sup>',w:'18 ÷ 6 = 3 and 7 − (−2) = 9.'},
{d:'Core',m:2,q:'Simplify (2a<sup>3</sup>b<sup>−1</sup>)(4a<sup>−5</sup>b<sup>4</sup>) using positive indices.',a:'8b<sup>3</sup>/a<sup>2</sup>',w:'Coefficients give 8. For a: 3 − 5 = −2; for b: −1 + 4 = 3.'},
{d:'Core',m:3,q:'Simplify (12p<sup>5</sup>q<sup>−2</sup>)/(3p<sup>−1</sup>q<sup>3</sup>) using positive indices.',a:'4p<sup>6</sup>/q<sup>5</sup>',w:'12 ÷ 3 = 4, p<sup>5−(−1)</sup> = p<sup>6</sup>, and q<sup>−2−3</sup> = q<sup>−5</sup>.'},

{d:'Core',m:2,q:'Evaluate 27<sup>−2/3</sup>.',a:'1/9',w:'27<sup>1/3</sup> = 3, so 27<sup>2/3</sup> = 9. The negative index gives 1/9.'},
{d:'Core',m:2,q:'Write ∛(x<sup>5</sup>) as a power of x.',a:'x<sup>5/3</sup>',w:'A cube root is a power of 1/3, so (x<sup>5</sup>)<sup>1/3</sup> = x<sup>5/3</sup>.'},
{d:'Core',m:2,q:'Write 1/√(a<sup>3</sup>) as a single power of a.',a:'a<sup>−3/2</sup>',w:'√(a<sup>3</sup>) = a<sup>3/2</sup>; taking the reciprocal changes the sign.'},

{d:'Exam',m:3,q:'Find k if x<sup>k</sup> × x<sup>3−2k</sup> = x<sup>−5</sup> for all x ≠ 0.',a:'k = 8',w:'The left index is k + 3 − 2k = 3 − k. Set 3 − k = −5.'},
{d:'Exam',m:4,q:'Find n if (x<sup>n+2</sup>)<sup>3</sup>/x<sup>2n−1</sup> = x<sup>14</sup>.',a:'n = 7',w:'The resulting index is 3(n + 2) − (2n − 1) = n + 7. Set n + 7 = 14.'},
{d:'Exam',m:4,q:'Simplify ((2x<sup>−1/2</sup>)<sup>3</sup>)/(4x<sup>−2</sup>) using positive indices.',a:'2√x',w:'The coefficient is 8/4 = 2. The x index is −3/2 − (−2) = 1/2, giving 2x<sup>1/2</sup>.'},
{d:'Exam',m:4,q:'Simplify ((9a<sup>4</sup>)<sup>1/2</sup>)/(3a<sup>−1</sup>), given a &gt; 0.',a:'a<sup>3</sup>',w:'The numerator is 3a<sup>2</sup>. Dividing by 3a<sup>−1</sup> gives a<sup>2−(−1)</sup> = a<sup>3</sup>.'},
{d:'Exam',m:4,q:'Simplify (8x<sup>−6</sup>)<sup>−2/3</sup> using positive indices.',a:'x<sup>4</sup>/4',w:'8<sup>−2/3</sup> = (2)<sup>−2</sup> = 1/4 and x<sup>(−6)(−2/3)</sup> = x<sup>4</sup>.'},
{d:'Exam',m:4,q:'Simplify (16x<sup>12</sup>y<sup>−8</sup>)<sup>3/4</sup> using positive indices.',a:'8x<sup>9</sup>/y<sup>6</sup>',w:'16<sup>3/4</sup> = 8, x<sup>12×3/4</sup> = x<sup>9</sup>, y<sup>−8×3/4</sup> = y<sup>−6</sup>.'},

{d:'Challenge',m:5,q:'Given a &gt; 0 and a ≠ 1, solve a<sup>3x−2</sup> = a<sup>x+6</sup>.',a:'x = 4',w:'Equal positive bases give equal indices: 3x − 2 = x + 6.'},
{d:'Challenge',m:5,q:'Simplify ((x<sup>2/3</sup>y<sup>−1/2</sup>)<sup>−3</sup>)/(x<sup>−1</sup>y<sup>2</sup>) using positive indices.',a:'1/(xy<sup>1/2</sup>)',w:'The numerator becomes x<sup>−2</sup>y<sup>3/2</sup>. Division gives x<sup>−1</sup>y<sup>−1/2</sup>.'},
{d:'Challenge',m:6,q:'Given p<sup>x</sup> = q and p<sup>y</sup> = r, express p<sup>2x−3y</sup> in terms of q and r.',a:'q<sup>2</sup>/r<sup>3</sup>',w:'p<sup>2x−3y</sup> = (p<sup>x</sup>)<sup>2</sup>/(p<sup>y</sup>)<sup>3</sup>.'},
{d:'Challenge',m:6,q:'Prove that (x<sup>n+1</sup> − x<sup>n−1</sup>)/x<sup>n−1</sup> is independent of n, for x ≠ 0.',a:'x<sup>2</sup> − 1',w:'Divide each term by x<sup>n−1</sup>: x<sup>(n+1)−(n−1)</sup> − x<sup>(n−1)−(n−1)</sup> = x<sup>2</sup> − 1.'}
];
const state={course:'p1',mode:'textbook',topic:'indices',marks:{}};const shelf=document.getElementById('shelfScreen'),reader=document.getElementById('reader'),lesson=document.getElementById('lesson'),contents=document.getElementById('contents');const key=(m,c)=>`mathsShelf:${m}:${c}:complete`;const marksKey=(c,t)=>`mathsShelf:exercise:${c}:${t}:marks`;const done=(m,c)=>JSON.parse(localStorage.getItem(key(m,c))||'[]');const savedMarks=(c,t)=>JSON.parse(localStorage.getItem(marksKey(c,t))||'{}');function saveMarks(){localStorage.setItem(marksKey(state.course,state.topic),JSON.stringify(state.marks))}function complete(m,c,t,v=true){let s=new Set(done(m,c));v?s.add(t):s.delete(t);localStorage.setItem(key(m,c),JSON.stringify([...s]))}
function openBook(c,m,t){state.course=c;state.mode=m;state.topic=courses[c].topics.some(x=>x[0]===t)?t:courses[c].topics[0][0];state.marks=m==='exercise'?savedMarks(c,state.topic):{};shelf.classList.add('hidden');reader.classList.add('show');document.documentElement.style.setProperty('--book-color',courses[c].color);renderContents();renderLesson();scrollTo(0,0)}window.openMathsBook=openBook;function goShelf(){reader.classList.remove('show');shelf.classList.remove('hidden');contents.classList.remove('open');scrollTo(0,0)}
function renderContents(){let c=courses[state.course],finished=done(state.mode,state.course),b=c.boundaries;bookChip.textContent=`${c.short} ${state.mode==='textbook'?'TEXTBOOK':'EXERCISES'}`;bookChip.style.background=c.color;edgeCourse.textContent='TEXTBOOK';edgeMode.textContent='EXERCISES';edgeCourse.classList.toggle('muted',state.mode!=='textbook');edgeMode.classList.toggle('muted',state.mode!=='exercise');edgeCourse.title='Open textbook for this topic';edgeMode.title='Open exercises for this topic';gradeCard.innerHTML=`<div class="grade-card-head"><strong>June 2026 boundaries</strong><span>RAW / ${b.max}</span></div><div class="grade-row">${['A','B','C','D','E'].map(g=>`<div class="grade-boundary"><b>${g}</b><span>${b[g]}</span></div>`).join('')}</div>`;chapterList.innerHTML=`<div class="part">${state.mode==='textbook'?'THEORY':'PRACTICE'} CHAPTERS</div>`+c.topics.map(([id,title],i)=>`<button class="chapter ${id===state.topic?'active':''}" data-topic="${id}"><span class="status-dot ${finished.includes(id)?'complete':''}"></span><span class="chapter-number">${String(i+1).padStart(2,'0')}</span><span class="chapter-title">${title}</span></button>`).join('')}
function reveals(x,p,i){return `<div class="q-actions"><button data-reveal="${p}a${i}">Show answer</button><button data-reveal="${p}w${i}">Show working</button></div><div class="reveal answer" id="${p}a${i}"><b>Answer:</b> ${x.a}</div><div class="reveal working" id="${p}w${i}"><b>Working:</b> ${x.w}</div>`}function checkQ(x,i){return `<div class="question"><div class="question-row"><span class="q-number">${String(i+1).padStart(2,'0')}</span><span class="q-text">${x.q}</span></div>${reveals(x,'t',i)}</div>`}function activeExercises(){return state.topic==='indices'?exercises:(window.mathsTopicContent[state.topic]?.exercises||[])}function exerciseQ(x,i,total){const band=i===0?`<div class="exercise-band">Practice set <span>Questions 1–${total}</span></div>`:'';return `${band}<div class="exercise-question"><div class="mark-stack"><span class="q-number">${String(i+1).padStart(2,'0')}</span><button class="mark tick" data-mark="right" data-index="${i}" aria-label="Mark correct">✓</button><button class="mark cross" data-mark="wrong" data-index="${i}" aria-label="Mark incorrect">✕</button></div><div><div class="question-meta"><span class="difficulty">${x.d}</span><span class="marks">${x.m} marks</span></div><div class="q-text">${x.q}</div>${reveals(x,'e',i)}</div></div>`}
function footer(i){let t=courses[state.course].topics,p=t[i-1],n=t[i+1];return `<footer class="page-footer"><button class="next" data-topic="${p?.[0]||''}" ${p?'':'disabled'}>${p?'← '+p[1]:''}</button><span class="page-no">Chapter ${String(i+1).padStart(2,'0')}</span><button class="next" data-topic="${n?.[0]||''}" ${n?'':'disabled'}>${n?n[1]+' →':'End of book'}</button></footer>`}
function renderLesson(){let c=courses[state.course],i=c.topics.findIndex(x=>x[0]===state.topic);state.mode==='textbook'?renderText(c,i):renderExercise(c,i)}
function renderText(c,i){if(state.topic==='indices'){lesson.innerHTML=`<div class="lesson-top"><span class="eyebrow">${c.name} · Chapter 01</span></div><h1>Indices</h1><p class="lead">Indices are a compact way to show repeated multiplication. Their laws let you simplify expressions without expanding every power.</p><div class="rule"></div><h2>The laws of indices</h2><p>When multiplying powers with the same base, add the indices. When dividing them, subtract the indices.</p><div class="formula">x<sup>a</sup> × x<sup>b</sup> = x<sup>a+b</sup> &nbsp;&nbsp;&nbsp; x<sup>a</sup> ÷ x<sup>b</sup> = x<sup>a−b</sup></div><p>A power raised to another power multiplies the indices. A negative index gives the reciprocal, while an index of zero gives 1.</p><div class="formula">(x<sup>a</sup>)<sup>b</sup> = x<sup>ab</sup> &nbsp;&nbsp;&nbsp; x<sup>−a</sup> = <span class="math-frac"><span>1</span><span>x<sup>a</sup></span></span> &nbsp;&nbsp;&nbsp; x<sup>0</sup> = 1</div><div class="note"><b>Watch out</b><span>You can only add or subtract indices when the base is the same.</span></div><section class="example"><div class="example-label">WORKED EXAMPLE</div><h3>Simplify (3x<sup>4</sup> × 2x<sup>3</sup>) ÷ x<sup>2</sup></h3><ol class="steps"><li>Multiply the coefficients: 3 × 2 = 6.</li><li>Add the numerator indices to get x<sup>7</sup>.</li><li>Subtract the denominator index to get x<sup>5</sup>.</li></ol><div class="formula">Answer: 6x<sup>5</sup></div></section><section class="practice"><div class="practice-head"><h2>Check your understanding</h2><span>3 quick checks</span></div>${checks.map(checkQ).join('')}</section>${footer(i)}`;return}const t=window.mathsTopicContent[state.topic],title=c.topics[i][1];lesson.innerHTML=`<div class="lesson-top"><span class="eyebrow">${c.name} · Chapter ${String(i+1).padStart(2,'0')}</span></div><h1>${title}</h1><p class="lead">${t.intro}</p><div class="rule"></div>${t.sections.map(s=>`<h2>${s.title}</h2><p>${s.body}</p><div class="formula">${s.formula}</div>${s.diagram||''}`).join('')}<section class="example"><div class="example-label">WORKED EXAMPLE</div><h3>${t.example.q}</h3><ol class="steps">${t.example.steps.map(step=>`<li>${step}</li>`).join('')}</ol><div class="formula">Answer: ${t.example.answer}</div></section><section class="practice"><div class="practice-head"><h2>Check your understanding</h2><span>${t.checks.length} quick checks</span></div>${t.checks.map(checkQ).join('')}</section>${footer(i)}`}
function renderExercise(c,i){state.marks=savedMarks(state.course,state.topic);const list=activeExercises(),title=c.topics[i][1];lesson.innerHTML=`<div class="lesson-top"><span class="eyebrow">${c.name} · Exercise ${String(i+1).padStart(2,'0')}</span></div><h1>${title} practice</h1><p class="lead">These ${list.length} questions move from core fluency to exam-style reasoning. Check the answer and full method, then mark your result honestly. You need at least 70% to complete the chapter.</p><div class="exercise-intro"><div class="score-box" id="liveScore">${Object.values(state.marks).filter(x=>x==='right').length}/${list.length}</div><div><b>Practice progression</b><br><span>Core → exam standard → challenge. Use ✓ if correct and ✕ if you need more practice.</span></div></div>${list.map((x,n)=>exerciseQ(x,n,list.length)).join('')}<div class="score-result" id="scoreResult"><h3 id="resultTitle"></h3><div class="result-metrics"><div class="metric"><strong id="resultScore"></strong><span>SCORE</span></div><div class="metric"><strong id="resultPercent"></strong><span>PERCENTAGE</span></div><div class="metric"><strong id="resultGrade"></strong><span>EST. GRADE</span></div></div><p id="resultText"></p><p class="grade-note" id="gradeNote"></p></div>${footer(i)}`;document.querySelectorAll('[data-mark]').forEach(button=>button.classList.toggle('selected',state.marks[button.dataset.index]===button.dataset.mark))}
function estimatedGrade(course,percent){const b=courses[course].boundaries,scaled=percent/100*b.max;for(const grade of ['A','B','C','D','E'])if(scaled>=b[grade])return grade;return'U'}
function finish(){const total=activeExercises().length;if(Object.keys(state.marks).length!==total)return;let right=Object.values(state.marks).filter(x=>x==='right').length,percent=right/total*100,pass=percent>=70,r=scoreResult,c=courses[state.course],b=c.boundaries,currentTopic=state.topic,currentIndex=c.topics.findIndex(x=>x[0]===currentTopic);complete('exercise',state.course,currentTopic,pass);r.className=`score-result show ${pass?'pass':'fail'}`;resultTitle.textContent=pass?'Chapter complete ✓':'Chapter not complete yet';resultScore.textContent=`${right} / ${total}`;resultPercent.textContent=`${percent.toFixed(1)}%`;resultGrade.textContent=estimatedGrade(state.course,percent);gradeNote.textContent=`Estimated using June 2026 Pearson Edexcel IAL ${c.short} raw boundaries out of ${b.max}: A ${b.A}, B ${b.B}, C ${b.C}, D ${b.D}, E ${b.E}.`;if(pass){resultText.textContent=c.topics[currentIndex+1]?'Opening the next topic…':'You have reached the end of this book.';renderContents();if(c.topics[currentIndex+1])setTimeout(()=>{state.topic=c.topics[currentIndex+1][0];state.marks=savedMarks(state.course,state.topic);renderContents();renderLesson();scrollTo({top:0,behavior:'smooth'})},900)}else{localStorage.removeItem(marksKey(state.course,currentTopic));state.marks={};liveScore.textContent=`0/${total}`;document.querySelectorAll('.mark').forEach(button=>button.classList.remove('selected'));resultText.textContent='Below 70%: this attempt has reset to 0 so you can try the chapter again.';renderContents()}}
document.querySelectorAll('.book').forEach(b=>b.onclick=()=>openBook(b.dataset.course,b.dataset.mode));document.addEventListener('click',e=>{if(e.target.closest('#edgeCourse')){openBook(state.course,'textbook',state.topic);return}if(e.target.closest('#edgeMode')){openBook(state.course,'exercise',state.topic);return}let ch=e.target.closest('[data-topic]');if(ch&&ch.dataset.topic){if(state.mode==='textbook'&&state.topic!==ch.dataset.topic)complete('textbook',state.course,state.topic);state.topic=ch.dataset.topic;state.marks=state.mode==='exercise'?savedMarks(state.course,state.topic):{};renderContents();renderLesson();contents.classList.remove('open');scrollTo({top:0,behavior:'smooth'});return}let rv=e.target.closest('[data-reveal]');if(rv){let t=document.getElementById(rv.dataset.reveal),show=!t.classList.contains('show');t.classList.toggle('show',show);rv.setAttribute('aria-expanded',show);let ans=rv.dataset.reveal.includes('a');rv.textContent=show?(ans?'Hide answer':'Hide working'):(ans?'Show answer':'Show working');return}let m=e.target.closest('[data-mark]');if(m){state.marks[m.dataset.index]=m.dataset.mark;saveMarks();m.parentElement.querySelectorAll('.mark').forEach(x=>x.classList.toggle('selected',x===m));liveScore.textContent=`${Object.values(state.marks).filter(x=>x==='right').length}/${activeExercises().length}`;finish()}});document.getElementById('shelfButton').onclick=goShelf;document.getElementById('menuToggle').onclick=()=>contents.classList.toggle('open');document.getElementById('homeLink').onclick=e=>{e.preventDefault();location.assign(['index','html'].join('.'))};
</script><script src="maths-shelf-3d.js"></script></body></html>
