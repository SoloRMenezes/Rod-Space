<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Force Pad · Rod Space</title><style>
:root{color-scheme:dark;--bg:#0b0e12;--text:#f6f8fb;--muted:#7f8b9b;--green:#58d6a7}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none}main{height:100%;display:grid;place-items:center;text-align:center;padding:32px}.reading{cursor:pointer;outline:none}.value{font:800 clamp(110px,24vw,260px)/.8 ui-monospace,SFMono-Regular,monospace;letter-spacing:-.09em}.unit{margin-left:.16em;font:800 clamp(22px,4vw,42px)/1 system-ui;color:var(--muted)}.hint{height:24px;margin:34px 0 0;color:var(--muted);font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.04em}.ready{color:var(--green)}.blocked{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center}.blocked.show{display:grid}.blocked a{color:var(--green)}
</style></head><body><main><div class="reading" id="reading" role="button" tabindex="0" aria-label="Zero scale"><span class="value" id="value">0.0</span><span class="unit">g</span><p class="hint" id="hint">Keep one finger touching the trackpad</p></div></main><section class="blocked" id="blocked"><div><p>Force Pad needs the Rod Space Mac app.</p><a href="index.html">Back to Rod Space</a></div></section><script src="offline.js?v=4"></script><script>
const value=document.getElementById('value'),hint=document.getElementById('hint');if(!window.__rodSpaceMacApp)document.getElementById('blocked').classList.add('show');let zero=null,lastRaw=null,contactId=null,lastPosition=null,rawHistory=[];const median=values=>{const sorted=[...values].sort((a,b)=>a-b);return sorted[Math.floor(sorted.length/2)]||0};const render=()=>{const grams=median(rawHistory)-zero;value.textContent=(Math.abs(grams)<.5?0:grams).toFixed(1)};const noContact=()=>{zero=null;lastRaw=null;contactId=null;lastPosition=null;rawHistory=[];value.textContent='0.0';hint.textContent='Keep a conductive contact on the trackpad';hint.classList.remove('ready')};window.__rodSpaceNativeScale={update(touches){if(!touches?.length){noContact();return}let touch=touches.find(item=>item.id===contactId);if(!touch&&lastPosition)touch=[...touches].sort((a,b)=>(a.x-lastPosition.x)**2+(a.y-lastPosition.y)**2-((b.x-lastPosition.x)**2+(b.y-lastPosition.y)**2))[0];if(!touch)touch=touches[0];if(touch.id!==contactId){contactId=touch.id;rawHistory=[]}lastPosition={x:touch.x,y:touch.y};const raw=Number(touch.pressure)||0;lastRaw=raw;rawHistory.push(raw);if(rawHistory.length>15)rawHistory.shift();if(zero===null)zero=median(rawHistory);hint.textContent='Weighing · click the number or press Space to zero';hint.classList.add('ready');render()}};const tare=()=>{if(lastRaw===null)return;zero=median(rawHistory);value.textContent='0.0';hint.textContent='Zeroed';setTimeout(()=>{if(lastRaw!==null)hint.textContent='Weighing · click the number or press Space to zero'},450)};document.getElementById('reading').addEventListener('click',tare);addEventListener('keydown',event=>{if(event.code==='Space'||event.key===' '){event.preventDefault();event.stopImmediatePropagation();if(!event.repeat)tare()}},true);
</script><script src="rod-space-app-menu.js"></script></body></html>
