<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0904">
<title>D&D Player</title>
<style>
:root { --bg:#0e0904; --card:#1b1208; --gold:#c9a227; --text:#f0e2c0; --muted:#9e8660; --border:#4a3218; --red:#a92d25; --green:#23834c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; background:radial-gradient(ellipse 150% 50% at 50% 0,#342208,var(--bg) 58%); color:var(--text); font-family:system-ui,-apple-system,sans-serif; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
button,input { font:inherit; } button { touch-action:manipulation; }
.top { max-width:520px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; height:54px; }
.brand { color:var(--gold); font-weight:950; letter-spacing:.12em; font-size:13px; }
.status { color:#ffad54; font-size:10px; font-weight:900; letter-spacing:.1em; }.status.online { color:#63dc8a; }
.card { max-width:520px; margin:0 auto 14px; background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:0 14px 40px #0008; }
.identity { padding:20px 18px 16px; text-align:center; }
.title { display:inline-block; background:var(--gold); color:#111; border-radius:99px; padding:5px 16px; font-size:10px; font-weight:950; letter-spacing:.1em; text-transform:uppercase; }
.name { width:100%; margin:12px 0 6px; background:transparent; border:0; outline:0; color:#fff; font-size:30px; font-weight:950; text-align:center; }
.meta { color:var(--muted); font-size:12px; font-weight:700; }
.hp { padding:0 18px 18px; }.hp-line { display:flex; justify-content:space-between; align-items:end; margin-bottom:8px; }.hp-number { color:#fff; font-size:24px; font-weight:950; }.hp-number small { color:var(--muted); font-size:12px; }
.hp-track { height:12px; background:#050302; border:1px solid var(--border); border-radius:99px; overflow:hidden; }.hp-fill { height:100%; background:linear-gradient(90deg,#1c743e,#39b96b); transition:width .25s; }
.action { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }.amount { grid-column:1/-1; width:100%; border:1px solid var(--border); background:#080604; color:#fff; border-radius:10px; padding:13px; text-align:center; font-size:20px; font-weight:900; outline:0; }
.btn { border:0; border-radius:10px; color:#fff; padding:14px; font-weight:900; }.damage { background:var(--red); }.heal { background:var(--green); }
.section { border-top:1px solid var(--border); padding:16px 18px; }.section-head { display:flex; justify-content:space-between; align-items:center; color:var(--gold); font-size:11px; font-weight:950; letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }
.conditions { display:flex; flex-wrap:wrap; gap:7px; }.condition { padding:7px 10px; background:#0b0805; color:var(--muted); border:1px solid var(--border); border-radius:8px; font-size:11px; font-weight:800; }.condition.active { color:#fff; background:#245a8c; border-color:#5ba7e9; }
.inventory { display:flex; flex-direction:column; gap:7px; }.item { display:flex; justify-content:space-between; align-items:center; background:#0b0805; padding:11px 12px; border-radius:9px; }.remove { border:0; background:transparent; color:#df5e54; font-size:18px; }
.item { align-items:flex-start; gap:10px; }.item-main { flex:1; min-width:0; }.item-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }.item-actions button,.item-actions select,.combat-actions button,.chest-open { border:1px solid var(--border); background:#241b10; color:var(--text); border-radius:8px; padding:8px; font-size:11px; font-weight:900; }.item-actions .use,.chest-open { background:var(--gold); color:#111; }.combat-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }.combat-actions button { min-height:48px; }.chest { margin:14px 18px; padding:20px; border:2px solid var(--gold); border-radius:14px; text-align:center; background:radial-gradient(circle at 50% 10%,#5b3510,#130b04 68%); }.chest-icon { position:relative; width:112px; height:78px; margin:18px auto 24px; border:5px solid #3b210b; border-radius:8px 8px 14px 14px; background:repeating-linear-gradient(90deg,#a45a16 0 28px,#d48929 28px 34px); box-shadow:inset 0 8px #e7a33d,0 12px 20px #000b; }.chest-icon:before { content:''; position:absolute; left:-5px; right:-5px; top:-29px; height:38px; border:5px solid #3b210b; border-radius:55px 55px 4px 4px; background:linear-gradient(#d98b2d,#8f4810); }.chest-icon:after { content:'◆'; position:absolute; left:39px; top:20px; width:25px; height:30px; display:grid; place-items:center; border:4px solid #3b210b; border-radius:4px; background:#f0c33a; color:#3b210b; font-size:12px; }.dead { color:#ff6b61; font-weight:950; }.turn-note { color:var(--muted); font-size:12px; margin-bottom:10px; }
.add-row { display:flex; gap:8px; margin-top:10px; }.add-row input { min-width:0; flex:1; border:1px solid var(--border); background:#080604; color:#fff; border-radius:9px; padding:11px; outline:0; }.add-row button { border:0; background:var(--gold); color:#111; border-radius:9px; padding:0 16px; font-weight:950; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }.stat { background:#0b0805; border:1px solid #332513; border-radius:10px; padding:10px 6px; text-align:center; }.stat span { display:block; color:var(--muted); font-size:9px; font-weight:900; text-transform:uppercase; }.stat strong { font-size:19px; color:#fff; }
.empty { color:var(--muted); font-size:13px; padding:8px 0; }.error { max-width:520px; margin:20vh auto 0; text-align:center; padding:24px; }.error h1 { color:var(--gold); margin-bottom:10px; }
.switch { border:1px solid var(--border); background:#171007; color:var(--gold); border-radius:8px; padding:7px 10px; font-size:10px; font-weight:900; }
.chooser { max-width:520px; margin:8vh auto 0; }.chooser h1 { color:var(--gold); font-size:26px; margin-bottom:6px; }.chooser>p { color:var(--muted); margin-bottom:20px; }
.profile-list { display:flex; flex-direction:column; gap:9px; }.profile-row { display:flex; gap:7px; }.profile { flex:1; display:flex; align-items:center; gap:12px; text-align:left; border:1px solid var(--border); background:var(--card); color:#fff; border-radius:13px; padding:14px; }
.delete-profile { width:44px; border:1px solid var(--border); background:#24100c; color:#dc6a60; border-radius:11px; font-size:18px; }
.profile-icon { width:42px; height:42px; display:grid; place-items:center; background:#0a0704; border-radius:10px; font-size:21px; }.profile-info { flex:1; }.profile-info strong,.profile-info small { display:block; }.profile-info small { color:var(--muted); margin-top:3px; }.profile-arrow { color:var(--gold); font-size:20px; }
.create-box { margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:13px; }.create-box h2 { font-size:13px; color:var(--gold); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }.create-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.create-grid input,.create-grid select { min-width:0; background:#080604; color:#fff; border:1px solid var(--border); border-radius:9px; padding:12px; }.create-grid input { grid-column:1/-1; }.create-grid button,.guest { border:0; border-radius:9px; padding:13px; font-weight:900; }.create-grid button { grid-column:1/-1; background:var(--gold); color:#111; }.guest { width:100%; margin-top:10px; background:#2b2116; color:var(--text); border:1px solid var(--border); }
.limit { color:var(--muted); font-size:11px; margin-top:8px; text-align:center; }
.class-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }.class-pick { border:1px solid var(--border); background:var(--card); color:#fff; border-radius:11px; padding:16px 10px; font-weight:900; }
</style>
</head>
<body><div id="app"></div>
<script>
const STATS=['Health','Energy','Speed','Strength','Magic','Presence'],PROFILE_KEY='dnd_character_presets';
const MULTIPLIERS={Human:[1.2,1.2,1.2,1.2,1.2,1.2],Vessel:[1.1,1.8,1.1,1.1,2,1.8],Elf:[1.3,1.7,1.8,1.2,1.9,1.5],Orc:[1.9,1.2,1.4,2,1.1,1.2],Titan:[2,1.1,1.1,2,1.1,1.2],Fae:[1.1,1.9,2,1.1,1.8,1.7],Automaton:[1.7,1.5,1.2,1.8,1.6,1.1]};
const CLASSES={Fighter:[1,1,1,4,1,1],Barbarian:[3,1,1,2,1,1],Rogue:[1,1,3,1,1,2],Ranger:[2,1,2,2,1,1],Wizard:[1,2,1,1,3,1],Cleric:[2,1,1,1,2,2],Paladin:[2,1,1,2,1,2],Bard:[1,2,1,1,2,2]};
let profiles=loadProfiles(),playerId=0,player=null,online=false,patchTimer=0,currentProfileId='',eventStream=null,sessionState={players:[],monsters:[],turn:-1};
function loadProfiles(){try{const value=JSON.parse(localStorage.getItem(PROFILE_KEY)||'[]');return Array.isArray(value)?value.slice(0,5):[]}catch{return[]}}
function saveProfiles(){localStorage.setItem(PROFILE_KEY,JSON.stringify(profiles.slice(0,5)))}
function maxHP(p){const mult=(MULTIPLIERS[p.race]||MULTIPLIERS.Human)[0];return 10+Math.round((p.invest?.[0]||1)*mult*5)+((Number(p.level)||1)*10)}
function esc(value=''){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function showChooser(){
 if(eventStream){eventStream.close();eventStream=null} player=null;playerId=0;online=false;currentProfileId='';history.replaceState(null,'',location.pathname);
 document.getElementById('app').innerHTML=`<main class="chooser"><h1>Choose your character</h1><p>Select who you are bringing into this game.</p><div class="profile-list">${profiles.map(profile=>`<div class="profile-row"><button class="profile" onclick="joinCharacter('${profile.characterId}')"><span class="profile-icon">🛡️</span><span class="profile-info"><strong>${esc(profile.name)}</strong><small>${esc(profile.race)} ${esc(profile.className||'Adventurer')} · Level ${profile.level}</small></span><span class="profile-arrow">›</span></button><button class="delete-profile" aria-label="Delete ${esc(profile.name)}" onclick="deleteCharacter('${profile.characterId}')">×</button></div>`).join('')}</div>${profiles.length<5?`<div class="create-box"><h2>New character · ${profiles.length}/5</h2><div class="create-grid"><input id="preset-name" maxlength="40" placeholder="Character name"><select id="preset-race" aria-label="Race">${Object.keys(MULTIPLIERS).map(race=>`<option>${race}</option>`).join('')}</select><select id="preset-class" aria-label="Class">${Object.keys(CLASSES).map(name=>`<option>${name}</option>`).join('')}</select><button onclick="createCharacter()">CREATE & JOIN</button></div></div>`:'<div class="limit">Five saved characters — the maximum.</div>'}<button class="guest" onclick="joinGuest()">CONTINUE AS GUEST</button></main>`;
}
function createCharacter(){
 const name=document.getElementById('preset-name').value.trim();if(!name||profiles.length>=5)return;
 const race=document.getElementById('preset-race').value,className=document.getElementById('preset-class').value,characterId=crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`;
 const character={characterId,name,race,className,level:1,invest:[...CLASSES[className]],inventory:[],conds:[]};character.currentHP=maxHP(character);profiles.push(character);saveProfiles();connect(character,false);
}
function joinCharacter(id){const character=profiles.find(item=>item.characterId===id);if(!character)return;if(!CLASSES[character.className])return showClassChoice(id);connect(character,false)}
function showClassChoice(id){const character=profiles.find(item=>item.characterId===id);if(!character)return showChooser();document.getElementById('app').innerHTML=`<main class="chooser"><h1>Choose ${esc(character.name)}'s class</h1><p>This sets the character's starting strengths.</p><div class="class-grid">${Object.keys(CLASSES).map(name=>`<button class="class-pick" onclick="setCharacterClass('${id}','${name}')">${name}</button>`).join('')}</div><button class="guest" onclick="showChooser()">BACK</button></main>`}
function setCharacterClass(id,className){const character=profiles.find(item=>item.characterId===id);if(!character||!CLASSES[className])return;character.className=className;character.invest=[...CLASSES[className]];character.currentHP=maxHP(character);saveProfiles();connect(character,false)}
function deleteCharacter(id){const character=profiles.find(item=>item.characterId===id);if(character&&confirm(`Delete ${character.name}?`)){profiles=profiles.filter(item=>item.characterId!==id);saveProfiles();showChooser()}}
function joinGuest(){connect({characterId:'guest',name:'Guest',race:'Human',className:'Adventurer',level:1,invest:[1,1,1,1,1,1],currentHP:26,inventory:[],conds:[]},true)}
function render(){
 if(!player)return showError('Joining the party…','Keep this page open while it connects to the DM.');
 const maximum=maxHP(player),hp=Math.max(0,Math.min(maximum,Number(player.currentHP)||0)),mults=MULTIPLIERS[player.race]||MULTIPLIERS.Human,effective=(player.invest||[1,1,1,1,1,1]).map((value,index)=>Math.round(value*mults[index])),inventory=player.inventory||[],others=(sessionState.players||[]).filter(entry=>Number(entry.id)!==playerId),aliveMonsters=(sessionState.monsters||[]).filter(monster=>Number(monster.cur)>0),isTurn=Number(sessionState.players?.[sessionState.turn]?.id)===playerId,canAct=isTurn&&!player.acted&&hp>0;
 const recipients=others.map(entry=>`<option value="${entry.id}">${esc(entry.name)}</option>`).join('');
 document.getElementById('app').innerHTML=`<header class="top"><div class="brand">⚔ PLAYER</div><button class="switch" onclick="showChooser()">SWITCH</button><div class="status ${online?'online':''}">${online?'LAN LIVE':'CONNECTING'}</div></header><main class="card"><div class="identity"><span class="title">${player.guest?'Guest · ':''}${esc(player.race||'Human')} ${esc(player.className||'Adventurer')} · Level ${Number(player.level)||1}</span><div class="name">${esc(player.name)}</div><div class="meta">${hp<=0?'<span class="dead">DEAD — you need a Phoenix Down</span>':'Your character sheet'}</div></div><div class="hp"><div class="hp-line"><strong>Health</strong><div class="hp-number">${hp} <small>/ ${maximum} HP</small></div></div><div class="hp-track"><div class="hp-fill" style="width:${maximum?hp/maximum*100:0}%"></div></div></div>${player.chest?.length?`<div class="chest"><div class="chest-icon" aria-hidden="true"></div><strong>You found a chest!</strong><p class="turn-note">Its contents are unique to your character.</p><button class="chest-open" onclick="sendAction('open-chest')">OPEN CHEST</button></div>`:''}<section class="section"><div class="section-head"><span>Combat actions</span><span>${player.acted&&isTurn?'Action used':isTurn?'Your turn':aliveMonsters.length?'Waiting':'No encounter'}</span></div><div class="turn-note">Attacks and skills now damage the enemy automatically. One action per turn.</div><div class="combat-actions"><button onclick="sendAction('combat',{move:'attack'})" ${!canAct||!aliveMonsters.length?'disabled':''}>⚔ Attack</button><button onclick="sendAction('combat',{move:'skill'})" ${!canAct||!aliveMonsters.length?'disabled':''}>✨ ${esc(player.className||'Class')} Skill</button><button onclick="sendAction('combat',{move:'defend'})" ${!canAct?'disabled':''}>🛡 Defend</button></div></section><section class="section"><div class="section-head"><span>Conditions</span><span>Automatic each turn</span></div><div class="conditions">${['Regen','Blessed','Shield','Hasted','Poisoned','Cursed'].map(c=>`<span class="condition ${(player.conds||[]).includes(c)?'active':''}">${c}</span>`).join('')}</div></section><section class="section"><div class="section-head"><span>Stats</span><span>${esc(player.className||'Adventurer')}</span></div><div class="stats">${STATS.map((name,i)=>`<div class="stat"><span>${name}</span><strong>${effective[i]}</strong></div>`).join('')}</div></section><section class="section"><div class="section-head"><span>Inventory</span><span>${inventory.length} items</span></div><div class="inventory">${inventory.length?inventory.map((item,i)=>`<div class="item"><div class="item-main"><strong>🎒 ${esc(item)}</strong><div class="item-actions"><button class="use" onclick="sendAction('use',{itemIndex:${i}})">USE</button>${others.length?`<select id="give-${i}" aria-label="Give ${esc(item)} to">${recipients}</select><button onclick="giveItem(${i})">GIVE</button>`:''}<button onclick="sendAction('discard',{itemIndex:${i}})">DISCARD</button></div></div></div>`).join(''):'<div class="empty">Your inventory is empty. Only discoveries and other players can give you items.</div>'}</div></section></main>`;
}
function showError(title,message){document.getElementById('app').innerHTML=`<div class="error"><h1>${title}</h1><p>${message}</p><button class="guest" onclick="showChooser()">BACK</button></div>`}
function storeCurrent(){if(!currentProfileId||!player||player.guest)return;const index=profiles.findIndex(item=>item.characterId===currentProfileId);if(index>=0){profiles[index]={...profiles[index],name:player.name,race:player.race,className:player.className,level:player.level,invest:player.invest,currentHP:player.currentHP,inventory:player.inventory,conds:player.conds};saveProfiles()}}
async function sendAction(type,extra={}){try{const response=await fetch('/api/dnd/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,playerId,...extra})});if(!response.ok)throw Error((await response.json()).error||'Action failed');acceptState(await response.json())}catch(error){alert(error.message)}}
function giveItem(index){const targetId=Number(document.getElementById(`give-${index}`).value);sendAction('give',{itemIndex:index,targetId})}
function acceptState(payload){sessionState=payload?.state||sessionState;const found=sessionState.players?.find(item=>Number(item.id)===playerId);if(found){player=found;online=true;storeCurrent();render()}}
async function connect(character,guest){
 currentProfileId=guest?'':character.characterId;showError('Joining the party…','Sending your character to the DM.');
 try{let deviceId=localStorage.getItem('dnd_phone_id');if(!deviceId){deviceId=crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`;localStorage.setItem('dnd_phone_id',deviceId)}const joined=await fetch('/api/dnd/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId,character,guest})});if(!joined.ok)throw new Error();const payload=await joined.json();playerId=Number(payload.player.id);acceptState(payload);eventStream=new EventSource('/api/dnd/events');eventStream.addEventListener('state',event=>acceptState(JSON.parse(event.data)));eventStream.onopen=()=>{online=true;render()};eventStream.onerror=()=>{online=false;render()}}catch{showError('DM is offline','Connect to the same Wi-Fi as the DM and try again.')}
}
showChooser();
</script></body></html>
