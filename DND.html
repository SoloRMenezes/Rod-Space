<script>
(() => {
  const query = new URLSearchParams(location.search);
  const phoneUA = /iPhone|iPod|Android.+Mobile|Windows Phone/i.test(navigator.userAgent);
  const mobileHint = navigator.userAgentData?.mobile === true;
  const wantsPlayer = query.has('player') || ((phoneUA || mobileHint) && query.get('mode') !== 'dm');
  if (wantsPlayer) {
    const playerPage = new URL('DNDC.html', location.href);
    playerPage.search = location.search;
    location.replace(playerPage);
  }
})();
</script>

<style>
:root {
  --bg: #0e0904; --surface: #1b1208; --card: #271a0b;
  --gold: #c9a227; --gold2: #e8c547; --text: #f0e2c0;
  --muted: #9e8660; --border: #5a3c1a; --red: #c0392b; --blue: #3498db;
}
* { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
body {
  background: var(--bg); color: var(--text); font-family: 'Segoe UI', serif;
  background-image: radial-gradient(ellipse 180% 60% at 50% 0%, #2e1d08 0%, #0e0904 55%);
  font-size: 15px; overflow-x: hidden;
}

/* ── MODALS ── */
.modal {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; flex-direction: column; padding: 20px;
}
.modal.open { display: flex; }
.modal-content { background: var(--surface); border: 2px solid var(--gold); border-radius: 20px; width: 95%; max-width: 700px; padding: 25px; max-height: 85vh; overflow-y: auto; }

/* ── LOOT OVERLAY ── */
#chest-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
#chest-overlay.open { display: flex; }
#big-chest { font-size: 120px; cursor: pointer; animation: shake 0.5s infinite; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }
#floating-chest { display: none; position: fixed; bottom: 30px; left: 30px; z-index: 500; font-size: 60px; cursor: pointer; filter: drop-shadow(0 0 15px var(--gold)); animation: float 2s infinite ease-in-out; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ── LAYOUT ── */
#header { padding: 12px 20px; border-bottom: 2px solid var(--gold); background: #1b1208; display: flex; justify-content: space-between; align-items: center; }
#main { display: grid; grid-template-columns: 1fr 380px; gap: 15px; padding: 15px; }
@media (max-width: 1024px) { #main { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.panel-header { background: rgba(0,0,0,0.4); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--gold); text-transform: uppercase; font-weight: 900; }

/* ── PARTY ── */
#players-grid { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.p-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; position: relative; }
.p-card.active-turn { border: 2px solid var(--gold); background: #301e0a; }
.p-card.dead,.m-card.dead { opacity:.58; filter:saturate(.45); }.dead-label { color:#ff655d; font-weight:950; letter-spacing:.08em; }
.p-name-in { background: none; border: none; color: #fff; font-size: 20px; font-weight: 900; width: 80%; }
.p-cond-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.p-tag { font-size: 10px; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; opacity: 0.3; font-weight: bold; }
.p-tag.active { opacity: 1; background: var(--blue); color: #fff; border-color: #fff; }

/* ── MONSTERS ── */
#monster-list { padding: 12px; max-height: 400px; overflow-y: auto; }
.m-card { background: #312010; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
.cond-tag { font-size: 10px; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; opacity: 0.3; font-weight: bold; }
.cond-tag.active { opacity: 1; background: var(--gold); color: #000; border-color: var(--gold); }

/* ── UI ELEMENTS ── */
.dice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; }
.dice-btn { padding: 12px; background: #241508; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-weight: 900; }
.atk-btn { grid-column: span 4; background: var(--red); color: #fff; height: 60px; font-size: 20px; font-weight: 900; margin-top: 8px; border-radius: 10px; border: none; }
.btn-gold { background: var(--gold); color: #000; font-weight: bold; padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; }
.connection { font: 800 11px 'Segoe UI', sans-serif; letter-spacing: .08em; color: #ffb347; }
.connection.online { color: #69db8c; }
.join-url { color: #222; background: #fff; padding: 10px; border-radius: 8px; max-width: min(90vw, 560px); overflow-wrap: anywhere; text-align: center; font: 700 13px system-ui; }
.adventure-actions { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:12px; }.adventure-actions button { min-height:48px; }.discovery { margin:0 12px 12px; padding:12px; border:1px solid var(--border); border-radius:9px; background:#0b0805; color:var(--text); line-height:1.4; }.hp-readout { min-width:100px; text-align:right; font-size:20px; font-weight:900; }.chest-mark { font-size:18px; filter:drop-shadow(0 3px 4px #000); }
</style>

<!-- MAIN UI -->
<div id="header">

    <button onclick="toggleModal('world-modal', true)" style="background:rgba(0,0,0,0.3); padding:8px 15px; border-radius:10px; border:1px solid var(--gold); color:var(--gold); font-size:14px; cursor:pointer; font-weight:bold;">

<div id="main">
  <div id="left-col">
    <div class="panel">

<script>
const PRESETS = [
  { n: "Goblin", hp: 12, atk: "Scimitar", dmg:[2,6] }, { n: "Orc", hp: 22, atk: "Greataxe", dmg:[4,9] },
  { n: "Zombie", hp: 30, atk: "Slam", dmg:[3,7] }, { n: "Vampire", hp: 84, atk: "Bite", dmg:[6,12] },
  { n: "Red Dragon", hp: 156, atk: "Fire Breath", dmg:[10,20] }, { n: "Skeleton", hp: 16, atk: "Bow", dmg:[2,7] },
  { n: "Lich", hp: 110, atk: "Disintegrate", dmg:[8,16] }, { n: "Kraken", hp: 190, atk: "Tentacle", dmg:[9,18] }
];
const P_CONDS = ["Regen", "Blessed", "Shield", "Hasted", "Poisoned", "Cursed"];
const M_CONDS = ["Blinded", "Poisoned", "Stunned", "Prone", "Burning"];

function normalizeState(state) {
  const base = { players: [], monsters: [], logs: [], turn: -1, bag: [], loc: "Forest", weath: "Sunny", discovery: '' };
  const next = { ...base, ...(state || {}) };
  next.players = next.players.map(player => ({
    race: 'Human', className: 'Adventurer', level: 1, invest: [1,1,1,1,1,1], currentHP: 26, inventory: [], conds: [], chest: [], ...player
  }));
  next.monsters = next.monsters.map(monster => ({ potions: 1, conds: [], ...monster }));
  return next;
}

let S = normalizeState(JSON.parse(localStorage.getItem('dnd_dm_vLogic')) || {
  players: [], monsters: [], logs: [], turn: -1, bag: [], loc: "Forest", weath: "Sunny" 
});
let lanConnected = false;
let applyingRemoteState = false;
let saveTimer = 0;
let lanOrigin = location.origin;

function save() {
  localStorage.setItem('dnd_dm_vLogic', JSON.stringify(S));
  render();
  if (!applyingRemoteState && lanConnected) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => fetch('/api/dnd/state', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S)
    }).catch(() => setConnection(false)), 80);
  }
}

function setConnection(online) {
  lanConnected = online;
  const el = document.getElementById('connection');
  el.textContent = online ? 'LAN LIVE' : 'LOCAL ONLY';
  el.classList.toggle('online', online);
}

function applyRemote(payload) {
  if (!payload || !payload.state) return;
  applyingRemoteState = true;
  S = normalizeState(payload.state);
  localStorage.setItem('dnd_dm_vLogic', JSON.stringify(S));
  render();
  applyingRemoteState = false;
  setConnection(true);
}

async function connectLAN() {
  try {
    const infoResponse = await fetch('/api/dnd/info', { cache: 'no-store' });
    if (infoResponse.ok) lanOrigin = (await infoResponse.json()).lanOrigin || location.origin;
    const response = await fetch('/api/dnd/state', { cache: 'no-store' });
    if (!response.ok || !response.headers.get('content-type')?.includes('application/json')) throw new Error('No LAN host');
    const remote = await response.json();
    const remoteIsEmpty = !remote.state.players.length && !remote.state.monsters.length && !remote.state.logs.length;
    const localHasGame = S.players.length || S.monsters.length || S.logs.length;
    if (remoteIsEmpty && localHasGame) {
      const seeded = await fetch('/api/dnd/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S) });
      applyRemote(await seeded.json());
    } else {
      applyRemote(remote);
    }
    const events = new EventSource('/api/dnd/events');
    events.addEventListener('state', event => applyRemote(JSON.parse(event.data)));
    events.onopen = () => setConnection(true);
    events.onerror = () => setConnection(false);
  } catch { setConnection(false); }
}
function log(msg, type='norm') {
  const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  S.logs.unshift({ t, msg, type });
  save();
}

function toggleModal(id, open) { document.getElementById(id).classList.toggle('open', open); }

function maxHP(player) {
  const raceHealth = { Human:1.2, Vessel:1.1, Elf:1.3, Orc:1.9, Titan:2, Fae:1.1, Automaton:1.7 }[player.race] || 1.2;
  return 10 + Math.round((player.invest?.[0] || 1) * raceHealth * 5) + ((Number(player.level) || 1) * 10);
}
function esc(value=''){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function changeHP(target, amount) { target.currentHP = Math.max(0, Math.min(maxHP(target), Number(target.currentHP || 0) + amount)); }
function damageMonster(monster, amount) { monster.cur = Math.max(0, Math.min(Number(monster.hp), Number(monster.cur || 0) - amount)); }
function livingPlayers(){ return S.players.filter(player => Number(player.currentHP) > 0); }
function livingMonsters(){ return S.monsters.filter(monster => Number(monster.cur) > 0); }

function nextTurn() {
  if (!livingPlayers().length) { log('☠️ The whole party is down.', 'atk'); return; }
  let attempts = 0;
  do { S.turn = (S.turn + 1) % S.players.length; attempts += 1; } while (Number(S.players[S.turn].currentHP) <= 0 && attempts <= S.players.length);
  const p = S.players[S.turn];
  p.acted = false;
  if (p.conds.includes('Poisoned')) { changeHP(p, -2); log(`🤢 ${p.name} takes 2 poison damage.`, 'atk'); }
  if (p.conds.includes('Cursed')) { changeHP(p, -1); log(`🌑 ${p.name} takes 1 curse damage.`, 'atk'); }
  if (p.conds.includes('Regen') && p.currentHP > 0) { changeHP(p, 3); log(`✨ ${p.name} regenerates 3 HP.`); }
  if (S.turn === 0) S.monsters.forEach(monster => {
    if (monster.cur <= 0) return;
    if (monster.conds.includes('Poisoned')) { damageMonster(monster, 2); log(`🤢 ${monster.n} takes 2 poison damage.`, 'atk'); }
    if (monster.conds.includes('Burning')) { damageMonster(monster, 3); log(`🔥 ${monster.n} takes 3 burning damage.`, 'atk'); }
  });
  if (p.currentHP <= 0) log(`☠️ ${p.name} has died.`, 'atk');
  else log(`>> Turn: ${p.name}`);
  save();
}

function playerAtk() {
  const p = S.players[S.turn];
  const monster = livingMonsters()[0];
  if (!p || p.currentHP <= 0 || !monster) return;
  const r = Math.floor(Math.random()*20)+1;
  const hit = r + (p.conds.includes('Blessed') ? 3 : 0) >= 9;
  const damage = hit ? (Number(p.invest?.[3]) || 1) + 3 + Math.floor(Math.random()*6) + (r === 20 ? 6 : 0) : 0;
  damageMonster(monster, damage);
  p.acted = true;
  log(hit ? `⚔️ ${p.name} hits ${monster.n} for ${damage}.` : `❌ ${p.name} misses ${monster.n}.`, 'atk');
  if (monster.cur === 0) log(`☠️ ${monster.n} is defeated!`, 'atk');
  document.getElementById('dice-res').textContent = r;
  save();
}

function monsterAtk(mIdx) {
  const m = S.monsters[mIdx];
  const target = S.players[S.turn]?.currentHP > 0 ? S.players[S.turn] : livingPlayers()[0];
  if (!m || m.cur <= 0 || !target) return;
  if (m.conds.includes('Stunned')) { log(`🚫 ${m.n} loses its turn while stunned.`, 'atk'); return; }
  if (m.conds.includes('Blinded') && Math.random() < .5) { log(`🌫️ ${m.n} misses ${target.name}.`, 'atk'); return; }
  let dmg = m.dmg ? m.dmg[0] + Math.floor(Math.random() * (m.dmg[1] - m.dmg[0] + 1)) : 3 + Math.floor(Math.random()*6);
  if (target.conds.includes('Shield')) { dmg = Math.ceil(dmg / 2); target.conds.splice(target.conds.indexOf('Shield'), 1); }
  changeHP(target, -dmg);
  log(`🐉 ${m.n} uses ${m.atk} on ${target.name} for ${dmg} damage.`, 'atk');
  if (target.currentHP === 0) log(`☠️ ${target.name} has died.`, 'atk');
  save();
}
function monsterPotion(mIdx){const monster=S.monsters[mIdx];if(!monster||monster.cur<=0||monster.cur>=monster.hp||monster.potions<=0)return;monster.cur=Math.min(monster.hp,Number(monster.cur)+10);monster.potions-=1;log(`🧪 ${monster.n} drinks a potion and heals 10 HP.`,'atk');save()}

const LOOT = ['Health Potion','Health Potion','Greater Healing Potion','Phoenix Down','Antidote','Regen Herb','Shield Charm','Lucky Coin','Bomb','Fire Flask','Smoke Bomb'];
function randomLoot(){const count=1+Math.floor(Math.random()*3),items=[];while(items.length<count)items.push(LOOT[Math.floor(Math.random()*LOOT.length)]);return items}
function findChest(){
  const eligible=livingPlayers(); if(!eligible.length)return;
  eligible.forEach(player=>player.chest=randomLoot());
  S.discovery=`🧰 The party discovered ${eligible.length} locked chest${eligible.length===1?'':'s'}. Each player received different loot on their phone.`;
  log('🧰 The DM revealed personal chests for the party.'); save();
}
const EVENTS=['A wounded courier offers a reward for safe passage.','A sealed stone door has three glowing runes and no visible handle.','Tracks split toward a ruined tower and a torch-lit cave.','A merchant offers one item in exchange for a dangerous favour.','The party hears someone calling for help beyond the fog.','An ancient shrine offers power, but asks for a sacrifice.'];
function exploreEvent(){S.discovery=`🗺️ ${EVENTS[Math.floor(Math.random()*EVENTS.length)]}`;log(S.discovery);save()}
function shortRest(){livingPlayers().forEach(player=>changeHP(player,Math.max(3,Math.ceil(maxHP(player)*.25))));S.discovery='🔥 The party rests and recovers 25% of maximum HP.';log(S.discovery);save()}
function triggerTrap(){const victims=livingPlayers();if(!victims.length)return;const victim=victims[Math.floor(Math.random()*victims.length)],damage=3+Math.floor(Math.random()*8);changeHP(victim,-damage);S.discovery=`⚠️ ${victim.name} triggered a trap and lost ${damage} HP.`;log(S.discovery,'atk');save()}

function addPlayer() {
  const id = Date.now();
  S.players.push({ id, name: 'Hero', conds: [], race: 'Human', className: 'Adventurer', level: 1, invest: [1,1,1,1,1,1], currentHP: 26, inventory: [] });
  save();
}

function showPlayerQR(id) {
  toggleModal('qr-modal', true);
  document.getElementById('qr-code').innerHTML = '';
  const playerURL = `${lanOrigin}${location.pathname}?player=${id}`;
  document.getElementById('join-url').textContent = playerURL;
  new QRCode(document.getElementById('qr-code'), { text: playerURL, width: 200, height: 200 });
}

function summon(idx) {
  const p = PRESETS[idx];
  S.monsters.push({ id: Date.now(), ...p, cur: p.hp, conds: [], potions: 1 });
  log(`Summoned ${p.n}`);
  toggleModal('bestiary-modal', false);
  save();
}

function roll(s) {
  const r = Math.floor(Math.random()*s)+1;
  document.getElementById('dice-res').textContent = r;
  log(`Roll d${s}: [${r}]`);
}

function render() {
  document.getElementById('loc-display').textContent = S.loc;
  document.getElementById('weath-display').textContent = S.weath;
  document.getElementById('loc-select').value = S.loc;
  document.getElementById('weath-select').value = S.weath;

  // Players
  document.getElementById('players-grid').innerHTML = S.players.map((p, i) => `
    <div class="p-card ${S.turn === i ? 'active-turn' : ''} ${Number(p.currentHP)<=0?'dead':''}">
      <div style="position:absolute; right:10px; top:10px; display:flex; gap:10px;">
        ${p.clientId ? '<span title="Phone connected" style="color:#69db8c; font-size:16px;">● 📱</span>' : `<button title="Show player QR" style="background:none; border:none; color:var(--gold); font-size:18px;" onclick="showPlayerQR(${p.id})">📱</button>`}
        <button title="Remove player" style="background:none; border:none; color:var(--red); font-size:18px;" onclick="S.players.splice(${i},1);save()">✕</button>
      </div>
      <div class="p-name-in">${esc(p.name)} ${Number(p.currentHP)<=0?'<span class="dead-label">· DEAD</span>':''}</div>
      <div style="display:flex; gap:14px; margin-top:5px; color:var(--muted); font-size:11px; font-weight:bold;">
        <span>❤️ ${Math.max(0,Number(p.currentHP)||0)} / ${maxHP(p)} HP</span><span>🎒 ${(p.inventory || []).length} items</span>${p.chest?.length?'<span class="chest-mark">🧰 CHEST WAITING</span>':''}<span>${p.guest ? 'Guest · ' : ''}${esc(p.race || 'Human')} ${esc(p.className || 'Adventurer')} · Lv ${p.level || 1}</span>
      </div>
      <div class="p-cond-bar">
        ${P_CONDS.map(c => `<div class="p-tag ${p.conds.includes(c)?'active':''}" onclick="const idx=S.players[${i}].conds.indexOf('${c}'); if(idx>-1) S.players[${i}].conds.splice(idx,1); else S.players[${i}].conds.push('${c}'); save()">${c}</div>`).join('')}
      </div>
    </div>`).join('');

  // Monsters
  document.getElementById('monster-list').innerHTML = S.monsters.map((m, mIdx) => `
    <div class="m-card ${Number(m.cur)<=0?'dead':''}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:22px; font-weight:900; color:var(--red);">🐉 ${esc(m.n)} ${Number(m.cur)<=0?'<small class="dead-label">DEAD</small>':''}</span>
        <button class="btn-gold" style="padding:5px 10px; font-size:11px;" onclick="monsterAtk(${mIdx})" ${Number(m.cur)<=0?'disabled':''}>ATTACK</button>
        <button class="btn-gold" style="padding:5px 10px; font-size:11px;" onclick="monsterPotion(${mIdx})" ${Number(m.cur)<=0||Number(m.cur)>=Number(m.hp)||Number(m.potions)<=0?'disabled':''}>POTION ${m.potions||0}</button>
        <button style="background:none; border:none; color:#fff; opacity:0.3; font-size:20px;" onclick="S.monsters.splice(${mIdx},1);save()">✕</button>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <span style="font-size:12px; color:var(--muted)">Skill: ${esc(m.atk)}</span>
        <div class="hp-readout">${Math.max(0,Number(m.cur)||0)} / ${m.hp}</div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;">
        ${M_CONDS.map(c => `<div class="cond-tag ${m.conds.includes(c)?'active':''}" onclick="const idx=S.monsters[${mIdx}].conds.indexOf('${c}'); if(idx>-1) S.monsters[${mIdx}].conds.splice(idx,1); else S.monsters[${mIdx}].conds.push('${c}'); save()">${c}</div>`).join('')}
      </div>
    </div>`).join('');

  document.getElementById('discovery-text').textContent = S.discovery || 'Choose what the party discovers next.';

  document.getElementById('bestiary-inject').innerHTML = PRESETS.map((p, i) => `
    <button style="background:#241508; border:2px solid var(--border); color:#fff; padding:15px; border-radius:10px; text-align:left; font-size:18px; font-weight:bold;" onclick="summon(${i})">${p.n} <span style="color:var(--red); float:right;">${p.hp}</span></button>`).join('');

  document.getElementById('chronicle-list').innerHTML = S.logs.map(l => `<div style="color:${l.type==='atk'?'#ff6b6b':'#ccc'}; margin-bottom:5px;">[${esc(l.t)}] ${esc(l.msg)}</div>`).join('');
  document.getElementById('turn-name').textContent = S.players[S.turn] ? `${S.players[S.turn].name}${Number(S.players[S.turn].currentHP)<=0?' · DEAD':''}` : 'WAITING...';
}

function newSession() { if(confirm('Wipe everything?')) { S={players:[],monsters:[],logs:[],turn:-1,bag:[],loc:"Forest",weath:"Sunny",discovery:''}; save(); } }
render();
connectLAN();
</script>
</body>
</html>
