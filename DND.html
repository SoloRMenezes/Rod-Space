<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0804">
<title>D&D Adventure</title>
<script>
(() => {
  const query = new URLSearchParams(location.search);
  const phone = navigator.userAgentData?.mobile === true || /iPhone|iPod|Android.+Mobile|Windows Phone/i.test(navigator.userAgent);
  const page = query.has('player') || (phone && query.get('mode') !== 'dm') ? 'DNDC.html' : 'dnd-ai.html';
  const target = new URL(page, location.href);
  target.search = location.search;
  location.replace(target);
})();
</script>
</head>
<body></body>
</html>
