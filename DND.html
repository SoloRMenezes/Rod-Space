<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ DM COMMAND CENTER</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0e0904; --surface: #1b1208; --card: #271a0b;
  --gold: #c9a227; --gold2: #e8c547; --text: #f0e2c0;
  --muted: #9e8660; --border: #5a3c1a; --red: #c0392b; --blue: #3498db;
}
* { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
body {
  background: var(--bg); color: var(--text); font-family: 'Segoe UI', serif;
  background-image: radial-gradient(ellipse 180% 60% at 50% 0%, #2e1d08 0%, #0e0904 55%);
  font-size: 15px; overflow-x: hidden;
}

/* ── MODALS ── */
.modal {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; flex-direction: column; padding: 20px;
}
.modal.open { display: flex; }
.modal-content { background: var(--surface); border: 2px solid var(--gold); border-radius: 20px; width: 95%; max-width: 700px; padding: 25px; max-height: 85vh; overflow-y: auto; }

/* ── LOOT OVERLAY ── */
#chest-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
#chest-overlay.open { display: flex; }
#big-chest { font-size: 120px; cursor: pointer; animation: shake 0.5s infinite; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }
#floating-chest { display: none; position: fixed; bottom: 30px; left: 30px; z-index: 500; font-size: 60px; cursor: pointer; filter: drop-shadow(0 0 15px var(--gold)); animation: float 2s infinite ease-in-out; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ── LAYOUT ── */
#header { padding: 12px 20px; border-bottom: 2px solid var(--gold); background: #1b1208; display: flex; justify-content: space-between; align-items: center; }
#main { display: grid; grid-template-columns: 1fr 380px; gap: 15px; padding: 15px; }
@media (max-width: 1024px) { #main { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.panel-header { background: rgba(0,0,0,0.4); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--gold); text-transform: uppercase; font-weight: 900; }

/* ── PARTY ── */
#players-grid { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.p-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; position: relative; }
.p-card.active-turn { border: 2px solid var(--gold); background: #301e0a; }
.p-name-in { background: none; border: none; color: #fff; font-size: 20px; font-weight: 900; width: 80%; }
.p-cond-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.p-tag { font-size: 10px; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; opacity: 0.3; font-weight: bold; }
.p-tag.active { opacity: 1; background: var(--blue); color: #fff; border-color: #fff; }

/* ── MONSTERS ── */
#monster-list { padding: 12px; max-height: 400px; overflow-y: auto; }
.m-card { background: #312010; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
.cond-tag { font-size: 10px; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border); cursor: pointer; opacity: 0.3; font-weight: bold; }
.cond-tag.active { opacity: 1; background: var(--gold); color: #000; border-color: var(--gold); }

/* ── UI ELEMENTS ── */
.dice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px; }
.dice-btn { padding: 12px; background: #241508; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-weight: 900; }
.atk-btn { grid-column: span 4; background: var(--red); color: #fff; height: 60px; font-size: 20px; font-weight: 900; margin-top: 8px; border-radius: 10px; border: none; }
.btn-gold { background: var(--gold); color: #000; font-weight: bold; padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; }
</style>
</head>
<body>

<!-- WORLD PORTAL POPUP -->
<div id="world-modal" class="modal">
  <div class="modal-content">
    <h2 style="color:var(--gold); border-bottom:2px solid var(--gold); padding-bottom:10px; margin-bottom:20px;">🌍 WORLD SETTINGS</h2>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
      <div>
        <label style="font-size:12px; color:var(--muted);">LOCATION</label>
        <select id="loc-select" style="width:100%; padding:15px; background:#000; color:#fff; border:1px solid var(--border); border-radius:8px;" onchange="S.loc=this.value;save()">
          <option>Forest</option><option>Tavern</option><option>Beach</option><option>Ocean</option><option>Dungeon</option><option>Mountain</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:var(--muted);">WEATHER</label>
        <select id="weath-select" style="width:100%; padding:15px; background:#000; color:#fff; border:1px solid var(--border); border-radius:8px;" onchange="S.weath=this.value;save()">
          <option>Sunny</option><option>Rainy</option><option>Foggy</option><option>Stormy</option><option>Snowing</option>
        </select>
      </div>
    </div>
    <button class="btn-gold" style="width:100%; margin-top:30px; height:50px;" onclick="toggleModal('world-modal', false)">Apply Environment</button>
  </div>
</div>

<!-- BESTIARY POPUP -->
<div id="bestiary-modal" class="modal">
  <div class="modal-content">
    <h2 style="color:var(--gold); margin-bottom:15px; border-bottom:2px solid var(--gold); padding-bottom:10px;">🐉 SUMMON PORTAL</h2>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;" id="bestiary-inject"></div>
    <button class="btn-gold" style="width:100%; margin-top:20px; height:50px;" onclick="toggleModal('bestiary-modal', false)">Close</button>
  </div>
</div>

<!-- LOOT OVERLAY -->
<div id="chest-overlay">
  <div id="big-chest" onclick="openChest()">🎁</div>
  <div id="loot-results" style="text-align:center; margin-top:20px;"></div>
  <button id="close-loot" class="btn-gold" style="display:none; margin-top:20px; width:200px;" onclick="toggleModal('chest-overlay', false)">Collect Items</button>
</div>
<div id="floating-chest" onclick="triggerLoot()">🎁</div>

<!-- MAIN UI -->
<div id="header">
  <div style="display:flex; align-items:center; gap:15px;">
    <h1 style="color:var(--gold); font-size:22px;">⚔️ COMMAND</h1>
    <button onclick="toggleModal('world-modal', true)" style="background:rgba(0,0,0,0.3); padding:8px 15px; border-radius:10px; border:1px solid var(--gold); color:var(--gold); font-size:14px; cursor:pointer; font-weight:bold;">
      📍 <span id="loc-display">Forest</span> | ☁️ <span id="weath-display">Sunny</span>
    </button>
  </div>
  <button class="btn-gold" style="background:var(--red); color:#fff;" onclick="newSession()">Reset Session</button>
</div>

<div id="main">
  <div id="left-col">
    <div class="panel">
      <div class="panel-header"><h2>👥 The Party</h2><button class="btn-gold" style="font-size:11px;" onclick="addPlayer()">+ Player</button></div>
      <div id="players-grid"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><h2>🎒 Team Bag</h2></div>
      <div id="bag-list" style="padding:10px; max-height:180px; overflow-y:auto;"></div>
    </div>
    <div class="panel">
      <div id="chronicle-list" style="height:150px; background:#000; padding:12px; font-family:monospace; font-size:12px; overflow-y:auto;"></div>
    </div>
  </div>

  <div id="right-col">
    <div class="panel" style="padding:15px; text-align:center;">
      <div id="turn-name" style="font-size:26px; color:var(--gold); font-weight:900; margin-bottom:10px;">—</div>
      <button class="btn-gold" style="width:100%; height:70px; font-size:22px;" onclick="nextTurn()">NEXT TURN ⚔️</button>
    </div>

    <div class="panel">
      <div id="dice-res" style="font-size:60px; text-align:center; color:var(--gold); font-weight:900; padding:10px;">—</div>
      <div class="dice-grid">
        <button class="dice-btn" onclick="roll(4)">d4</button><button class="dice-btn" onclick="roll(6)">d6</button>
        <button class="dice-btn" onclick="roll(12)">d12</button><button class="dice-btn" onclick="roll(20)">d20</button>
        <button class="atk-btn" onclick="playerAtk()">⚔️ PLAYER ATTACK</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>🔥 Active Combatants</h2></div>
      <div id="monster-list"></div>
    </div>

    <button class="btn-gold" style="width:100%; height:60px; font-size:20px; background:#241508; color:var(--gold); border:2px solid var(--gold);" onclick="toggleModal('bestiary-modal', true)">🐉 OPEN BESTIARY</button>
  </div>
</div>

<div id="qr-modal" class="modal"><div style="background:#fff; padding:20px; border-radius:15px; margin-bottom:20px;"><div id="qr-code"></div></div><button class="btn-gold" onclick="toggleModal('qr-modal', false)">Done</button></div>

<script>
const PRESETS = [
  { n: "Goblin", hp: 12, atk: "Scimitar" }, { n: "Orc", hp: 15, atk: "Greataxe" },
  { n: "Zombie", hp: 22, atk: "Slam" }, { n: "Vampire", hp: 144, atk: "Bite" },
  { n: "Red Dragon", hp: 256, atk: "Fire Breath" }, { n: "Skeleton", hp: 13, atk: "Bow" },
  { n: "Lich", hp: 135, atk: "Disintegrate" }, { n: "Kraken", hp: 472, atk: "Tentacle" }
];
const P_CONDS = ["Regen", "Blessed", "Shield", "Hasted", "Poisoned", "Cursed"];
const M_CONDS = ["Blinded", "Poisoned", "Stunned", "Prone", "Burning"];

let S = JSON.parse(localStorage.getItem('dnd_dm_vLogic')) || { 
  players: [], monsters: [], logs: [], turn: -1, bag: [], loc: "Forest", weath: "Sunny" 
};

function save() { localStorage.setItem('dnd_dm_vLogic', JSON.stringify(S)); render(); }
function log(msg, type='norm') {
  const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  S.logs.unshift({ t, msg, type });
  save();
}

function toggleModal(id, open) { document.getElementById(id).classList.toggle('open', open); }

function nextTurn() {
  if (!S.players.length) return;
  
  // Monster DoT Logic (Damage over Time)
  S.monsters.forEach(m => {
    if (m.conds.includes("Poisoned")) {
      m.cur -= 2;
      log(`🤢 ${m.n} takes 2 Poison damage!`);
    }
    if (m.conds.includes("Burning")) {
      m.cur -= 3;
      log(`🔥 ${m.n} takes 3 Burning damage!`);
    }
  });

  S.turn = (S.turn + 1) % S.players.length;
  const p = S.players[S.turn];
  log(`>> Turn: ${p.name}`);
  
  if (p.conds.includes("Regen")) log(`✨ Regen: ${p.name} recovers health!`);
  if (Math.random() < 0.3) document.getElementById('floating-chest').style.display = 'block';
  save();
}

function playerAtk() {
  const p = S.players[S.turn] || { name: "Player", conds: [] };
  const r = Math.floor(Math.random()*20)+1;
  let mod = p.conds.includes("Blessed") ? " (+Blessed)" : p.conds.includes("Poisoned") ? " (-Poisoned)" : "";
  let res = r <= 7 ? "❌ FAIL" : r <= 15 ? "⚔️ HIT" : "💥 CRIT (1.4x)";
  log(`${p.name} Attack: [${r}]${mod} -> ${res}`, 'atk');
  document.getElementById('dice-res').textContent = r;
}

function monsterAtk(mIdx) {
  const m = S.monsters[mIdx];
  if (m.conds.includes("Stunned")) { log(`🚫 ${m.n} is STUNNED!`, 'atk'); return; }
  
  const dmg = Math.floor(Math.random() * 10) + 5;
  let blind = m.conds.includes("Blinded") ? " (Miss Chance!)" : "";
  log(`🐉 ${m.n} uses ${m.atk} for ${dmg} damage${blind}!`, 'atk');
}

function triggerLoot() {
  document.getElementById('floating-chest').style.display = 'none';
  document.getElementById('loot-results').innerHTML = '';
  document.getElementById('close-loot').style.display = 'none';
  toggleModal('chest-overlay', true);
}

function openChest() {
  document.getElementById('big-chest').style.display = 'none';
  const LOOT = ["Health Potion", "Iron Sword", "Phoenix Down", "Golden Coin", "Regen Herb"];
  LOOT.forEach((item, i) => {
    setTimeout(() => {
      const div = document.createElement('div'); div.className = 'loot-item reveal'; div.innerHTML = `✨ ${item}`;
      document.getElementById('loot-results').appendChild(div);
      S.bag.push(item); if(i === 4) document.getElementById('close-loot').style.display = 'block';
      save();
    }, i * 400);
  });
}

function addPlayer() {
  S.players.push({ id: Date.now(), name: 'Hero', conds: [] });
  save();
  toggleModal('qr-modal', true);
  document.getElementById('qr-code').innerHTML = '';
  new QRCode(document.getElementById('qr-code'), { text: "https://solormenezes.github.io/Rod-Space/DNDC", width: 200, height: 200 });
}

function summon(idx) {
  const p = PRESETS[idx];
  S.monsters.push({ id: Date.now(), ...p, cur: p.hp, conds: [] });
  log(`Summoned ${p.n}`);
  toggleModal('bestiary-modal', false);
  save();
}

function roll(s) {
  const r = Math.floor(Math.random()*s)+1;
  document.getElementById('dice-res').textContent = r;
  log(`Roll d${s}: [${r}]`);
}

function render() {
  document.getElementById('loc-display').textContent = S.loc;
  document.getElementById('weath-display').textContent = S.weath;
  document.getElementById('loc-select').value = S.loc;
  document.getElementById('weath-select').value = S.weath;

  // Players
  document.getElementById('players-grid').innerHTML = S.players.map((p, i) => `
    <div class="p-card ${S.turn === i ? 'active-turn' : ''}">
      <button style="position:absolute; right:10px; top:10px; background:none; border:none; color:var(--red); font-size:18px;" onclick="S.players.splice(${i},1);save()">✕</button>
      <input class="p-name-in" value="${p.name}" onchange="S.players[${i}].name=this.value;save()">
      <div class="p-cond-bar">
        ${P_CONDS.map(c => `<div class="p-tag ${p.conds.includes(c)?'active':''}" onclick="const idx=S.players[${i}].conds.indexOf('${c}'); if(idx>-1) S.players[${i}].conds.splice(idx,1); else S.players[${i}].conds.push('${c}'); save()">${c}</div>`).join('')}
      </div>
    </div>`).join('');

  // Monsters
  document.getElementById('monster-list').innerHTML = S.monsters.map((m, mIdx) => `
    <div class="m-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:22px; font-weight:900; color:var(--red);">🐉 ${m.n}</span>
        <button class="btn-gold" style="padding:5px 10px; font-size:11px;" onclick="monsterAtk(${mIdx})">ATTACK</button>
        <button style="background:none; border:none; color:#fff; opacity:0.3; font-size:20px;" onclick="S.monsters.splice(${mIdx},1);save()">✕</button>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <span style="font-size:12px; color:var(--muted)">Skill: ${m.atk}</span>
        <div><input type="number" style="width:70px; background:#000; color:#fff; border:1px solid var(--border); text-align:center; font-size:20px;" value="${m.cur}" onchange="S.monsters[${mIdx}].cur=this.value;save()"> / ${m.hp}</div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;">
        ${M_CONDS.map(c => `<div class="cond-tag ${m.conds.includes(c)?'active':''}" onclick="const idx=S.monsters[${mIdx}].conds.indexOf('${c}'); if(idx>-1) S.monsters[${mIdx}].conds.splice(idx,1); else S.monsters[${mIdx}].conds.push('${c}'); save()">${c}</div>`).join('')}
      </div>
    </div>`).join('');

  document.getElementById('bag-list').innerHTML = S.bag.map((item, i) => `
    <div style="background:#111; padding:8px; border-radius:6px; display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px;">
      <span>📦 ${item}</span><button style="background:none; border:none; color:var(--red);" onclick="S.bag.splice(${i},1);save()">✕</button>
    </div>`).join('');

  document.getElementById('bestiary-inject').innerHTML = PRESETS.map((p, i) => `
    <button style="background:#241508; border:2px solid var(--border); color:#fff; padding:15px; border-radius:10px; text-align:left; font-size:18px; font-weight:bold;" onclick="summon(${i})">${p.n} <span style="color:var(--red); float:right;">${p.hp}</span></button>`).join('');

  document.getElementById('chronicle-list').innerHTML = S.logs.map(l => `<div style="color:${l.type==='atk'?'#ff6b6b':'#ccc'}; margin-bottom:5px;">[${l.t}] ${l.msg}</div>`).join('');
  document.getElementById('turn-name').textContent = S.players[S.turn] ? S.players[S.turn].name : 'WAITING...';
}

function newSession() { if(confirm('Wipe everything?')) { S={players:[],monsters:[],logs:[],turn:-1,bag:[],loc:"Forest",weath:"Sunny"}; save(); } }
render();
</script>
  <script src="assets/language-toggle.js" defer></script>
</body>
</html>
