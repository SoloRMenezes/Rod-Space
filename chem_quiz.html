<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Chemistry SL Master Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .quiz-container { max-width: 800px; margin: 2rem auto; }
        .option-btn { transition: all 0.2s; border: 2px solid #e2e8f0; }
        .option-btn:hover { border-color: #3b82f6; background-color: #eff6ff; }
        .correct { background-color: #def7ec !important; border-color: #057a55 !important; }
        .incorrect { background-color: #fde8e8 !important; border-color: #9b1c1c !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans text-slate-900">

    <div id="app" class="quiz-container bg-white rounded-xl shadow-lg p-6 md:p-8">
        <!-- Header -->
        <div class="mb-8 border-b pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-blue-800">IB Chemistry SL Quiz</h1>
                <p id="topic-label" class="text-sm text-slate-500 mt-1 uppercase tracking-wider font-semibold"></p>
            </div>
            <div class="text-right">
                <span id="progress" class="text-sm font-medium text-slate-600">Question 1/68</span>
                <div class="w-32 h-2 bg-slate-200 rounded-full mt-1">
                    <div id="progress-bar" class="h-full bg-blue-600 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Question Section -->
        <div id="quiz-content">
            <h2 id="question-text" class="text-xl font-semibold mb-6">Loading question...</h2>
            
            <div id="options-grid" class="grid gap-3 mb-8">
                <!-- Options injected here -->
            </div>

            <div id="feedback" class="hidden p-4 rounded-lg mb-6 border">
                <p id="feedback-text" class="font-medium"></p>
            </div>

            <div class="flex justify-between items-center">
                <button id="hint-btn" class="text-blue-600 text-sm font-medium hover:underline">Need a hint?</button>
                <button id="next-btn" class="hidden bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700">Next Question</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-content" class="hidden text-center py-10">
            <h2 class="text-4xl font-bold text-slate-800 mb-4">Quiz Complete!</h2>
            <div class="text-6xl font-bold text-blue-600 mb-6" id="final-score">0/68</div>
            <p class="text-slate-600 mb-8" id="result-message"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition">Restart Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "Which of the following is a physical change?", t: "S1.1 Matter", o: ["Rusting iron", "Combusting methane", "Subliming iodine", "Neutralisation"], a: 2, h: "Look for a change in state, not bonds." },
            { q: "Which state has fixed volume but no fixed shape?", t: "S1.1 Matter", o: ["Solid", "Liquid", "Gas", "Plasma"], a: 1 },
            { q: "What defines a homogeneous mixture?", t: "S1.1 Matter", o: ["Visible boundaries", "Chemically bonded", "Uniform composition", "Chemical separation only"], a: 2 },
            { q: "Which process is endothermic?", t: "S1.1 Matter", o: ["Freezing", "Condensing", "Boiling", "Deposition"], a: 2 },
            { q: "An atom has 11 protons and 12 neutrons. Mass number?", t: "S1.2 Atom", o: ["11", "22", "23", "34"], a: 2 },
            { q: "Isotopes of the same element have the same:", t: "S1.2 Atom", o: ["Neutrons", "Mass number", "Electron configuration", "Physical properties"], a: 2 },
            { q: "Calculate Ar: 80% mass 10, 20% mass 11.", t: "S1.2 Atom", o: ["10.0", "10.2", "10.5", "10.8"], a: 1 },
            { q: "Particle with smallest mass?", t: "S1.2 Atom", o: ["Proton", "Neutron", "Electron", "Alpha"], a: 2 },
            { q: "Electron configuration of Na+ (Z=11)?", t: "S1.3 Configuration", o: ["1s2 2s2 2p6 3s1", "1s2 2s2 2p6", "1s2 2s2 2p5", "1s2 2s2 2p6 3s2"], a: 1 },
            { q: "Orbitals in n=2 level?", t: "S1.3 Configuration", o: ["2", "4", "8", "1"], a: 1 },
            { q: "Element with [Ar] 4s1 3d10?", t: "S1.3 Configuration", o: ["Zn", "Cu", "Cr", "K"], a: 1 },
            { q: "Max electrons in a 'p' subshell?", t: "S1.3 Configuration", o: ["2", "6", "10", "14"], a: 1 },
            { q: "Molecules in 18.02g of H2O?", t: "S1.4 Mole", o: ["1", "6.02x10^23", "1.20x10^24", "3.01x10^23"], a: 1 },
            { q: "Molar mass of Mg(OH)2?", t: "S1.4 Mole", o: ["41.3", "58.3", "42.3", "57.3"], a: 1 },
            { q: "Most moles of oxygen atoms in 1 mol of:", t: "S1.4 Mole", o: ["O2", "O3", "H2O", "CO"], a: 1 },
            { q: "Mass of 0.5 mol CO2?", t: "S1.4 Mole", o: ["22g", "44g", "11g", "88g"], a: 0 },
            { q: "Pressure if volume is halved at constant T?", t: "S1.5 Gases", o: ["Halved", "Doubles", "Stays same", "Quadruples"], a: 1 },
            { q: "Gas deviating most from ideal at low T?", t: "S1.5 Gases", o: ["He", "H2", "NH3", "CH4"], a: 2 },
            { q: "Volume of 1 mol gas at 273K, 100kPa?", t: "S1.5 Gases", o: ["22.4", "22.7", "24.0", "1.0"], a: 1 },
            { q: "Unit of R in PV=nRT (SI)?", t: "S1.5 Gases", o: ["J K-1 mol-1", "dm3 atm", "L bar", "None"], a: 0 },
            { q: "Pair forming ionic bond?", t: "S2.1 Ionic", o: ["C, O", "Na, Cl", "H, Cl", "N, O"], a: 1 },
            { q: "Formula of Magnesium Phosphide?", t: "S2.1 Ionic", o: ["MgP", "Mg2P3", "Mg3P2", "MgP2"], a: 2 },
            { q: "Highest lattice enthalpy?", t: "S2.1 Ionic", o: ["NaCl", "MgO", "KBr", "LiCl"], a: 1 },
            { q: "Why are ionic solids brittle?", t: "S2.1 Ionic", o: ["Fixed electrons", "Layer repulsion", "Weak forces", "Metallic bonds"], a: 1 },
            { q: "Contains a triple bond:", t: "S2.2 Covalent", o: ["O2", "N2", "F2", "CH4"], a: 1 },
            { q: "Bond angle in NH3?", t: "S2.2 Covalent", o: ["109.5", "107", "104.5", "120"], a: 1 },
            { q: "Polar molecule:", t: "S2.2 Covalent", o: ["CO2", "CCl4", "H2O", "BF3"], a: 2 },
            { q: "Allotrope that conducts electricity:", t: "S2.2 Covalent", o: ["Diamond", "Graphite", "C60", "Quartz"], a: 1 },
            { q: "Metallic bond attraction:", t: "S2.3 Metallic", o: ["Shared pairs", "Cations & delocalized e-", "Ion attraction", "Van der Waals"], a: 1 },
            { q: "Why are metals malleable?", t: "S2.3 Metallic", o: ["Fixed e-", "Layers slide", "Low MP", "Ionic bonds"], a: 1 },
            { q: "Highest melting point:", t: "S2.3 Metallic", o: ["Na", "Mg", "Al", "K"], a: 2 },
            { q: "Alloys are usually ____ than pure metals:", t: "S2.3 Metallic", o: ["Softer", "Harder", "More ductile", "Reactive"], a: 1 },
            { q: "Strongest IMF:", t: "S2.4 Materials", o: ["London", "Dipole", "H-bonding", "Gravity"], a: 2 },
            { q: "Forms hydrogen bonds:", t: "S2.4 Materials", o: ["CH4", "H2S", "NH3", "HCl"], a: 2 },
            { q: "Trend in Noble Gas BP down group:", t: "S2.4 Materials", o: ["Increases", "Decreases", "Stays same", "None"], a: 0 },
            { q: "SiO2 melting point:", t: "S2.4 Materials", o: ["Low", "High", "Moderate", "Variable"], a: 1 },
            { q: "Group of Alkali Metals:", t: "S3.1 Periodicity", o: ["1", "2", "17", "18"], a: 0 },
            { q: "Electronegativity trend (Across/Down):", t: "S3.1 Periodicity", o: ["Inc/Inc", "Inc/Dec", "Dec/Inc", "Dec/Dec"], a: 1 },
            { q: "Is a metalloid:", t: "S3.1 Periodicity", o: ["Al", "Si", "P", "C"], a: 1 },
            { q: "Halogen that is liquid at RT:", t: "S3.1 Periodicity", o: ["F", "Cl", "Br", "I"], a: 2 },
            { q: "Name of -COOH:", t: "S3.2 Organic", o: ["Hydroxyl", "Carbonyl", "Carboxyl", "Ester"], a: 2 },
            { q: "Which is an aldehyde?", t: "S3.2 Organic", o: ["Propanone", "Propanal", "Propanol", "Propanoic acid"], a: 1 },
            { q: "General formula for Alkanes:", t: "S3.2 Organic", o: ["CnH2n", "CnH2n+2", "CnH2n-2", "CnH2n+1OH"], a: 1 },
            { q: "Alkene feature:", t: "S3.2 Organic", o: ["Single bond", "Double bond", "OH group", "Benzene"], a: 1 },
            { q: "Temp rise in water means reaction is:", t: "R1.1 Enthalpy", o: ["Endo", "Exo", "Iso", "Adiabatic"], a: 1 },
            { q: "Q = mcDT (100g, 4.18, 10K):", t: "R1.1 Enthalpy", o: ["41.8", "418", "4180", "4.18"], a: 2 },
            { q: "Standard enthalpy of combustion burns ___ mol:", t: "R1.1 Enthalpy", o: ["1", "2", "10", "Any"], a: 0 },
            { q: "Sign of DH for endothermic:", t: "R1.1 Enthalpy", o: ["Positive", "Negative", "Zero", "N/A"], a: 0 },
            { q: "Hess's Law independence:", t: "R1.2 Cycles", o: ["Initial", "Final", "Route", "Temp"], a: 2 },
            { q: "DH (rxn) = Products - ?", t: "R1.2 Cycles", o: ["Reactants", "Combustions", "Bonds", "Ea"], a: 0 },
            { q: "DHf of O2(g):", t: "R1.2 Cycles", o: ["100", "0", "-286", "498"], a: 1 },
            { q: "Bond breaking is ____:", t: "R1.2 Cycles", o: ["Exo", "Endo", "Neutral", "Both"], a: 1 },
            { q: "Renewable source:", t: "R1.3 Fuels", o: ["Coal", "Gas", "Bioethanol", "Uranium"], a: 2 },
            { q: "Natural gas main component:", t: "R1.3 Fuels", o: ["Ethane", "Methane", "Propane", "Octane"], a: 1 },
            { q: "Specific energy is per unit ___:", t: "R1.3 Fuels", o: ["Vol", "Mass", "Mole", "Time"], a: 1 },
            { q: "Fossil fuel disadvantage:", t: "R1.3 Fuels", o: ["Low density", "CO2 release", "Transport", "Price"], a: 1 },
            { q: "A + 2B -> C. Moles of B for 1 mol A?", t: "R2.1 Stoich", o: ["1", "2", "0.5", "4"], a: 1 },
            { q: "1 mol N2 + 2 mol H2. Limiting?", t: "R2.1 Stoich", o: ["N2", "H2", "NH3", "None"], a: 1 },
            { q: "Theo: 10g, Actual: 8g. % Yield?", t: "R2.1 Stoich", o: ["125", "80", "20", "18"], a: 1 },
            { q: "Conc of 1 mol in 500cm3?", t: "R2.1 Stoich", o: ["0.5", "2.0", "1.0", "5.0"], a: 1 },
            { q: "Increases rate:", t: "R2.2 Rates", o: ["Dec T", "Inc particle size", "Catalyst", "Dec conc"], a: 2 },
            { q: "Ea is the ____ energy needed:", t: "R2.2 Rates", o: ["Max", "Min", "Avg", "Total"], a: 1 },
            { q: "Catalyst works by:", t: "R2.2 Rates", o: ["Inc H", "Lowering Ea", "Inc collisions", "Reacting"], a: 1 },
            { q: "Pressure affects rate of:", t: "R2.2 Rates", o: ["Solids", "Liquids", "Gases", "Aqueous"], a: 2 },
            { q: "At equilibrium, rates are:", t: "R2.3 Equilibrium", o: ["Zero", "Equal", "Unequal", "Inc"], a: 1 },
            { q: "Kc > 10^3 means reaction:", t: "R2.3 Equilibrium", o: ["Hardly proceeds", "Almost complete", "Equal", "Slow"], a: 1 },
            { q: "Change that shifts equilibrium but NOT Kc:", t: "R2.3 Equilibrium", o: ["Temp", "Conc", "Catalyst", "None"], a: 1 },
            { q: "Le Chatelier's system will:", t: "R2.3 Equilibrium", o: ["Stay same", "Oppose change", "Inc entropy", "Turn gas"], a: 1 }
        ];

        let currentIdx = 0;
        let score = 0;
        let canAnswer = true;

        const topicEl = document.getElementById('topic-label');
        const qTextEl = document.getElementById('question-text');
        const optionsEl = document.getElementById('options-grid');
        const progressEl = document.getElementById('progress');
        const progressBtn = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const hintBtn = document.getElementById('hint-btn');

        function loadQuestion() {
            const data = quizData[currentIdx];
            canAnswer = true;
            nextBtn.classList.add('hidden');
            feedbackEl.classList.add('hidden');
            
            topicEl.textContent = data.t;
            qTextEl.textContent = data.q;
            progressEl.textContent = `Question ${currentIdx + 1}/${quizData.length}`;
            progressBtn.style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;

            optionsEl.innerHTML = '';
            data.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn p-4 rounded-lg text-left font-medium';
                btn.textContent = opt;
                btn.onclick = () => selectOption(i);
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(index) {
            if (!canAnswer) return;
            canAnswer = false;
            
            const data = quizData[currentIdx];
            const buttons = optionsEl.querySelectorAll('button');
            
            if (index === data.a) {
                buttons[index].classList.add('correct');
                score++;
                showFeedback("Correct!", "green");
            } else {
                buttons[index].classList.add('incorrect');
                buttons[data.a].classList.add('correct');
                showFeedback("Incorrect. The correct answer is highlighted.", "red");
            }

            nextBtn.classList.remove('hidden');
        }

        function showFeedback(text, color) {
            feedbackEl.classList.remove('hidden');
            feedbackEl.className = `p-4 rounded-lg mb-6 border border-${color}-200 bg-${color}-50`;
            feedbackText.textContent = text;
            feedbackText.className = `font-medium text-${color}-800`;
        }

        nextBtn.onclick = () => {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        hintBtn.onclick = () => {
            const hint = quizData[currentIdx].h || "Think about the core concept of this sub-topic!";
            alert(hint);
        };

        function showResults() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('results-content').classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score}/${quizData.length}`;
            
            let msg = "Keep studying! Chemistry takes practice.";
            if (score > 60) msg = "Excellent! You're ready for the IB exam.";
            else if (score > 45) msg = "Great job! Just a few more topics to polish.";
            
            document.getElementById('result-message').textContent = msg;
        }

        loadQuestion();
    </script>
</body>
</html>
