    <script>
        // --- DOM references ---
        const canvas = document.getElementById('screen'); // Used as WebGLRenderer target
        const mCanvas = document.getElementById('minimap');
        const mCtx = mCanvas.getContext('2d');
        const settingsMenu = document.getElementById('settings-menu');
        const sensSlider = document.getElementById('sens-slider');
        const sensValDisplay = document.getElementById('sens-val');
        const closeSettings = document.getElementById('close-settings');

        // Cheats menu DOM
        const cheatsMenu = document.getElementById('cheats-menu');
        const phaseToggle = document.getElementById('phase-toggle');
        const closeCheats = document.getElementById('close-cheats');

        // --- MAP ---
        // 24x24 map: only outer walls (1s), all interior floor (0s).
        // Each map unit now corresponds to a 2x2 block in world coordinates.
        // Player (1.5,1.5) and bot (10.5,10.5) are valid open positions (multiplied by 2 for world coords).
const MAP = (() => {
            const width = 140, height = 96;
            const map = Array.from({length:height},(_,y)=>Array.from({length:width},(_,x)=>x===0||y===0||x===width-1||y===height-1?1:0));
            // A 4 x 4 room plan gives each floor sixteen distinct spaces. Every wall has
            // broad openings, so chases can flow between rooms instead of becoming corridors.
            for(const x of [35,70,105])for(let y=2;y<height-2;y++)if(![12,36,60,84].some(door=>Math.abs(y-door)<=5))map[y][x]=1;
            for(const y of [24,48,72])for(let x=2;x<width-2;x++)if(![18,52,88,122].some(door=>Math.abs(x-door)<=6))map[y][x]=1;
            // Support columns define parking bays inside the rooms.
            for(let y=10;y<height-8;y+=14)for(let x=10;x<width-8;x+=14){map[y][x]=1;map[y][x+1]=1;map[y+1][x]=1;map[y+1][x+1]=1;}
            // Parked cars are real obstacles, leaving the central drive lanes open.
            const cars=[];
            for(const cy of [18,78])for(let cx=16;cx<width-12;cx+=15)if(Math.abs(cx-70)>9)cars.push([cx,cy]);
            map.carSpots=cars;
            return map;
        })();
        const MAP_SIZE_Y = MAP.length;
        const MAP_SIZE_X = MAP[0].length;
        const FLOOR_HEIGHT=8;
        const RAMPS=[
            {x1:7,x2:27,y1:7,y2:14,reverse:false},{x1:113,x2:133,y1:7,y2:14,reverse:true},
            {x1:7,x2:27,y1:44,y2:51,reverse:false},{x1:113,x2:133,y1:44,y2:51,reverse:true},
            {x1:7,x2:27,y1:81,y2:88,reverse:false},{x1:113,x2:133,y1:81,y2:88,reverse:true}
        ];
        for(const ramp of RAMPS)for(let y=ramp.y1;y<=ramp.y2;y++)for(let x=ramp.x1;x<=ramp.x2;x++)MAP[y][x]=0;
        function rampAt(x,y){return RAMPS.find(r=>x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2)}
        function surfaceHeightAt(x,y,current=0){const ramp=rampAt(x,y);if(!ramp)return current>=FLOOR_HEIGHT/2?FLOOR_HEIGHT:0;let t=(x-ramp.x1)/(ramp.x2-ramp.x1);if(ramp.reverse)t=1-t;return t*FLOOR_HEIGHT}

        // --- Bot spawn point ---
        // We'll use a THREE.Vector3 for position
        const botSpawnY = 1; // fixed bot spawn y
const botSpawns = [
    new THREE.Vector3(137, botSpawnY, 93),
    new THREE.Vector3(145, botSpawnY, 93),
    new THREE.Vector3(137, botSpawnY, 101),
    new THREE.Vector3(145, botSpawnY, 101)
];

        // --- Player state ---
        // All positions are now in map units (will be multiplied by 2 for world coords)
        const player = {
            x: 1.5,
            y: 1.5,
            dir: 0.8, // yaw
            z: 0,     // vertical offset for jump
            floorY: 0,
            zVel: 0,
            isJumping: false,
            speed: 0.16, // deliberately quick arcade movement
            rotSpeed: 0.0025,
            sensitivity: 1.0,
            isSprinting: false,
            pitch: 0, // vertical look (up/down)
            roll: 0
        };

        const keys = {};
        let isLocked = false;
        let gameTimer = 0;
        let roundEndsAt=Infinity;
        const timerDisplay = document.getElementById('timer-display');
        function formatClock(ms){const total=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`}

        // --- Three.js Setup ---
        let renderer, scene, camera, controls;
        let wallGroup, floorMesh;
let bots = [];
let screenWidth, screenHeight;
let audioCtx, humNode, chaseNode, chaseGain;
let botReleaseAt=Infinity;
let netRole='solo',roomSession=null,lastNetSend=0,roomsWatching=false;
const remotePlayers=new Map();

function ensureRemotePlayer(id,name='Player'){
    let remote=remotePlayers.get(id);if(remote)return remote;
    const material=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.72,.55)});
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,1.8,10),material);mesh.position.y=1;scene.add(mesh);
    remote={id,name,x:0,y:0,floorY:0,dir:0,alive:true,mesh};remotePlayers.set(id,remote);return remote;
}
function applyPlayerPacket(id,data,name){
    const remote=ensureRemotePlayer(id,name);Object.assign(remote,{x:data.x,y:data.y,floorY:data.floorY||0,dir:data.dir||0,alive:data.alive!==false});
    remote.mesh.visible=remote.alive;remote.mesh.position.set(remote.x*2+1,1+remote.floorY,remote.y*2+1);remote.mesh.rotation.y=remote.dir;
}
function networkTick(now){
    if(netRole==='solo'||!roomSession||now-lastNetSend<80)return;lastNetSend=now;
    const state={x:player.x,y:player.y,floorY:player.floorY,dir:player.dir,alive:!isGameOver};
    if(netRole==='host'){
        roomSession.lan.broadcast('world',{players:[{id:'host',name:document.getElementById('player-name').value||'Host',...state},...Array.from(remotePlayers.values()).map(p=>({id:p.id,name:p.name,x:p.x,y:p.y,floorY:p.floorY,dir:p.dir,alive:p.alive}))],bots:bots.map(bot=>({x:bot.mesh.position.x,z:bot.mesh.position.z,vx:bot.vx,vz:bot.vz,targetId:bot.targetId,floorY:bot.floorY})),releaseIn:Math.max(0,botReleaseAt-now),roundIn:Math.max(0,roundEndsAt-now)});
    }else roomSession.client.send('player',state);
}
function wireHostRoom(session){
    session.lan.on('message',({peer,data})=>{if(data.type!=='player')return;applyPlayerPacket(peer.meta.id,data.payload,peer.meta.name);});
}
function wireGuestRoom(session){
    session.client.on('message',({data})=>{if(data.type!=='world')return;const world=data.payload;botReleaseAt=performance.now()+world.releaseIn;roundEndsAt=performance.now()+world.roundIn;
        world.players.filter(p=>p.id!=='host').forEach(p=>{if(p.id!==session.client.meta.peerId)applyPlayerPacket(p.id,p,p.name)});
        const host=world.players.find(p=>p.id==='host');if(host)applyPlayerPacket('host',host,host.name);
        world.bots.forEach((state,i)=>{const bot=bots[i];if(!bot)return;bot.mesh.position.x=state.x;bot.mesh.position.z=state.z;bot.backing.position.x=state.x;bot.backing.position.z=state.z;bot.vx=state.vx;bot.vz=state.vz;bot.targetId=state.targetId;bot.floorY=state.floorY||0;bot.mesh.position.y=3.15+bot.floorY;bot.backing.position.y=3.15+bot.floorY;if(bot.label)bot.label.position.y=.55+bot.floorY;});
    });
    session.client.on('message',({data})=>{if(data.type==='death'&&data.payload.id===session.client.meta.peerId)showGameOverOverlay();});
}

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Deep rumble base
    humNode = audioCtx.createOscillator();
    const humGain = audioCtx.createGain();
    humNode.type = 'sawtooth';
    humNode.frequency.value = 40;
    humGain.gain.value = 0.012;
    humNode.connect(humGain);
    humGain.connect(audioCtx.destination);
    humNode.start();

    // Heartbeat-style pulse oscillator
    chaseNode = audioCtx.createOscillator();
    chaseGain = audioCtx.createGain();
    chaseNode.type = 'triangle';
    chaseNode.frequency.value = 55;
    chaseGain.gain.value = 0;
    chaseNode.connect(chaseGain);
    chaseGain.connect(audioCtx.destination);
    chaseNode.start();
}

        // --- Lighting ---
        let ambientLight, dirLight;

        function initThree() {
            scene = new THREE.Scene();
            // Scene color: backrooms yellow
            scene.background = new THREE.Color(0x15171a);
            scene.fog = new THREE.Fog(0x15171a, 55, 205);

            // Camera
            camera = new THREE.PerspectiveCamera(95, window.innerWidth / window.innerHeight, 0.1, 280);
            camera.position.set(player.x, 1.6, player.y); // y=eye height
            camera.rotation.order = 'YXZ';

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference:'high-performance' });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setClearColor(0x15171a);
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Lighting
            ambientLight = new THREE.AmbientLight(0xd7deea, 0.62);
            scene.add(ambientLight);
            dirLight = new THREE.DirectionalLight(0xffffff, 0.18);
            dirLight.position.set(0, 10, 0);
            scene.add(dirLight);

            // Floor (scaled 2x: each map unit is 2x2 world units)
            const floorGeo = new THREE.PlaneGeometry(MAP_SIZE_X * 2, MAP_SIZE_Y * 2);
            const makeConcreteTexture=(base,lines=false)=>{
                const tile=document.createElement('canvas');tile.width=tile.height=256;const ctx=tile.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,256,256);
                const image=ctx.getImageData(0,0,256,256);for(let i=0;i<image.data.length;i+=4){const grain=(Math.random()-.5)*22;image.data[i]+=grain;image.data[i+1]+=grain;image.data[i+2]+=grain;}ctx.putImageData(image,0,0);
                if(lines){ctx.strokeStyle='rgba(10,12,15,.28)';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,253,253);ctx.beginPath();ctx.moveTo(0,128);ctx.lineTo(256,128);ctx.stroke()}
                const texture=new THREE.CanvasTexture(tile);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(MAP_SIZE_X/7,MAP_SIZE_Y/7);texture.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return texture;
            };
            const floorMat = new THREE.MeshPhongMaterial({map:makeConcreteTexture('#30343a',true),color:0xb8bcc1,shininess:7});
            floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.position.set(MAP_SIZE_X, 0, MAP_SIZE_Y);
            scene.add(floorMesh);

            // Keep perimeter walls darker while the structural garage pillars read as stained white concrete.
            wallGroup = new THREE.Group();
            const wallTexture = new THREE.TextureLoader().load('./assets/vendor/nextbot-brick.jpg');
            wallTexture.wrapS=wallTexture.wrapT=THREE.RepeatWrapping;wallTexture.repeat.set(1,1);
            const wallGeo = new THREE.BoxGeometry(2, 19, 2);
            const wallMat = new THREE.MeshPhongMaterial({map:wallTexture,color:0x8f949a,shininess:3});
            const pillarMat = new THREE.MeshPhongMaterial({map:makeConcreteTexture('#dedbd0'),color:0xf1eee3,shininess:1});
            const isEdge=(x,y)=>x===0||y===0||x===MAP_SIZE_X-1||y===MAP_SIZE_Y-1;
            let edgeCount=0,pillarCount=0;for(let y=0;y<MAP_SIZE_Y;y++)for(let x=0;x<MAP_SIZE_X;x++)if(MAP[y][x]===1)(isEdge(x,y)?edgeCount++:pillarCount++);
            const walls=new THREE.InstancedMesh(wallGeo,wallMat,edgeCount),pillars=new THREE.InstancedMesh(wallGeo,pillarMat,pillarCount);
            const transform=new THREE.Matrix4();let wallIndex=0,pillarIndex=0;
            for(let y=0;y<MAP_SIZE_Y;y++)for(let x=0;x<MAP_SIZE_X;x++)if(MAP[y][x]===1){transform.makeTranslation((x+.5)*2,9.5,(y+.5)*2);(isEdge(x,y)?walls:pillars).setMatrixAt(isEdge(x,y)?wallIndex++:pillarIndex++,transform)}
            walls.instanceMatrix.needsUpdate=true;pillars.instanceMatrix.needsUpdate=true;wallGroup.add(walls,pillars);scene.add(wallGroup);

            // The upper deck has real openings above every ramp instead of cutting
            // straight through the ramp entrance.
            const deckShape=new THREE.Shape();
            deckShape.moveTo(-MAP_SIZE_X,-MAP_SIZE_Y);deckShape.lineTo(MAP_SIZE_X,-MAP_SIZE_Y);deckShape.lineTo(MAP_SIZE_X,MAP_SIZE_Y);deckShape.lineTo(-MAP_SIZE_X,MAP_SIZE_Y);deckShape.closePath();
            for(const ramp of RAMPS){

                targetX=Math.max(1,Math.min(MAP_SIZE_X-2,targetX));targetY=Math.max(1,Math.min(MAP_SIZE_Y-2,targetY));
                if(MAP[targetY][targetX]!==0){targetX=botMapX;targetY=botMapY;}

                let needsPath = (!bot._path || !bot._path.length || bot._lastTargetX!==targetX || bot._lastTargetY!==targetY || bot._lastStartX!==botMapX || bot._lastStartY!==botMapY);
                if(needsPath){
                    const path=astar(botMapX,botMapY,targetX,targetY,MAP);
                    bot._path=path&&path.length>1?path:null;bot._lastTargetX=targetX;bot._lastTargetY=targetY;bot._lastStartX=botMapX;bot._lastStartY=botMapY;bot._pathStep=1;
                }
                if(netRole==='guest')continue;
                if(now<botReleaseAt){bot.vx=0;bot.vz=0;continue}

                let steerX=targetX*2+1,steerZ=targetY*2+1;
                if(bot._path&&bot._pathStep<bot._path.length){
                    const [cellX,cellY]=bot._path[bot._pathStep];steerX=cellX*2+1;steerZ=cellY*2+1;
                    if(Math.hypot(steerX-bot.mesh.position.x,steerZ-bot.mesh.position.z)<.45)bot._pathStep++;
                }
                const dx=steerX-bot.mesh.position.x,dz=steerZ-bot.mesh.position.z,distance=Math.hypot(dx,dz)||1;
                const maxSpeed=bot.baseSpeed*.01*bot.speedMult,accel=.018;
                bot.vx+=dx/distance*accel;bot.vz+=dz/distance*accel;
                const velocity=Math.hypot(bot.vx,bot.vz);if(velocity>maxSpeed){bot.vx=bot.vx/velocity*maxSpeed;bot.vz=bot.vz/velocity*maxSpeed}
                // Low friction gives the chasers weight: they skid wide, brake, then accelerate into a turn.
                bot.vx*=.992;bot.vz*=.992;
                const tryX=bot.mesh.position.x+bot.vx,mapX=Math.floor((tryX-1)/2),mapY=Math.floor((bot.mesh.position.z-1)/2);
                if(MAP[mapY]?.[mapX]===0)bot.mesh.position.x=tryX;else bot.vx*=-.28;
                const tryZ=bot.mesh.position.z+bot.vz,nextMapX=Math.floor((bot.mesh.position.x-1)/2),nextMapY=Math.floor((tryZ-1)/2);
                if(MAP[nextMapY]?.[nextMapX]===0)bot.mesh.position.z=tryZ;else bot.vz*=-.28;
                bot.floorY=surfaceHeightAt((bot.mesh.position.x-1)/2,(bot.mesh.position.z-1)/2,bot.floorY);bot.mesh.position.y=3.15+bot.floorY;bot.backing.position.set(bot.mesh.position.x,3.15+bot.floorY,bot.mesh.position.z);if(bot.label)bot.label.position.set(bot.mesh.position.x,.55+bot.floorY,bot.mesh.position.z);
            }
            // Gentle separation keeps overlapping chasers visually and tactically distinct.
            if(performance.now()>=botReleaseAt) for(let i=0;i<bots.length;i++)for(let j=i+1;j<bots.length;j++){
                const a=bots[i].mesh.position,b=bots[j].mesh.position,dx=a.x-b.x,dz=a.z-b.z,d=Math.hypot(dx,dz);
                if(d>0&&d<3){const push=(3-d)*.04;a.x+=dx/d*push;a.z+=dz/d*push;b.x-=dx/d*push;b.z-=dz/d*push;}
            }
            if(netRole==='host') for(const remote of remotePlayers.values()){
                if(!remote.alive)continue;
                const hit=bots.some(bot=>Math.abs(bot.floorY-remote.floorY)<2.5&&Math.hypot(bot.mesh.position.x-(remote.x*2+1),bot.mesh.position.z-(remote.y*2+1))<1);
                if(hit){remote.alive=false;remote.mesh.visible=false;roomSession.lan.broadcast('death',{id:remote.id});}
            }
        }

        // --- Minimap ---
        let minimapFrame=0;
        function drawMinimap() {
            if((minimapFrame++&3)!==0)return;
            mCtx.clearRect(0,0,150,150);
            const blockSize = 150 / Math.max(MAP_SIZE_X, MAP_SIZE_Y);
            for(let y=0; y<MAP_SIZE_Y; y++) {
                for(let x=0; x<MAP_SIZE_X; x++) {
                    if(MAP[y][x] === 1) {
                        mCtx.fillStyle = '#d1b45d';
                        mCtx.fillRect(x*blockSize, y*blockSize, blockSize-1, blockSize-1);
                    }
                }
            }
            // Player
            mCtx.fillStyle = '#fff';
            mCtx.beginPath();
            mCtx.arc(player.x * blockSize, player.y * blockSize, 3, 0, Math.PI*2);
            mCtx.fill();
            // View direction (corrected: x = sin(dir), y = cos(dir)), flipped to point forward
            mCtx.strokeStyle = 'rgba(255,255,255,0.3)';
            mCtx.beginPath();
            mCtx.moveTo(player.x * blockSize, player.y * blockSize);
            mCtx.lineTo(
                (player.x - Math.sin(player.dir) * 2) * blockSize,
                (player.y - Math.cos(player.dir) * 2) * blockSize
            );
            mCtx.stroke();
            // Bots
            if (bots && bots.length > 0) {
                mCtx.fillStyle = '#44f';
                for (let i = 0; i < bots.length; i++) {
                    if(Math.abs(bots[i].floorY-player.floorY)>=2.5)continue;
                    // Convert bot world position to map units for minimap
                    mCtx.beginPath();
                    mCtx.arc(
                        ((bots[i].mesh.position.x - 1) / 2) * blockSize,
                        ((bots[i].mesh.position.z - 1) / 2) * blockSize,
                        3, 0, Math.PI*2
                    );
                    mCtx.fill();
                }
            }
        }

        // --- Render Loop ---
        function render() {
            if (isGameOver) return;
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
            drawMinimap();
        }

        function gameLoop() {
            if (isGameOver) return;
            update();
            render();
            if (!isGameOver) requestAnimationFrame(gameLoop);
        }

        // --- Settings and UI ---
        function initUI() {
            // Load sensitivity from localStorage if present. Camera FOV is fixed at 95°.
            let storedSens = localStorage.getItem('sensitivity');
            if (storedSens !== null) {
                player.sensitivity = parseFloat(storedSens);
                sensSlider.value = player.sensitivity;
                sensValDisplay.innerText = player.sensitivity.toFixed(1);
            } else {
                sensSlider.value = player.sensitivity;
                sensValDisplay.innerText = player.sensitivity.toFixed(1);
            }
            // Close button for settings
            closeSettings.onclick = () => {
                settingsMenu.style.display = 'none';
            };
            sensSlider.oninput = (e) => {
                player.sensitivity = parseFloat(e.target.value);
                sensValDisplay.innerText = player.sensitivity.toFixed(1);
                localStorage.setItem('sensitivity', player.sensitivity);
            };
        }

        // --- INIT ---
        let gameStarted = false;
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            document.body.classList.remove('menu-active');
            botReleaseAt=performance.now()+30000;roundEndsAt=botReleaseAt+180000;
            // Hide start screen overlay
            const startScreen = document.getElementById('start-screen');
            if (startScreen) startScreen.style.display = 'none';
            // Hide game over overlay if present
            hideGameOverOverlay();
            // Show game container
            document.getElementById('game-container').style.display = '';
            // Start game loop
            requestAnimationFrame(gameLoop);
            initAudio();
            gameTimer=0;timerDisplay.innerText='GET READY · 30';document.getElementById('mobile-controls').classList.add('active');
        }

        function lobbyStatus(message){document.getElementById('lobby-status').textContent=message||'';}
        function playerName(){return document.getElementById('player-name').value.trim()||'Player';}
        function roomPin(){return document.getElementById('room-pin').value.replace(/\D/g,'').slice(0,4);}
        function setupRooms(){
            if(!globalThis.PartyRooms||roomsWatching)return;roomsWatching=true;
            PartyRooms.watch('nicos-nextbots',rooms=>{
                const list=document.getElementById('room-list');list.replaceChildren();
                if(!rooms.length){const empty=document.createElement('div');empty.className='lobby-note';empty.textContent='No open games yet.';list.append(empty);return;}
                rooms.forEach(room=>{const row=document.createElement('div');row.className='room-row';const label=document.createElement('span');label.textContent=`${room.name} · ${room.players||1} player${room.players===1?'':'s'}${room.locked?' · PIN':''}`;const join=document.createElement('button');join.textContent='JOIN';join.onclick=async()=>{try{join.disabled=true;lobbyStatus('Connecting…');roomSession=await PartyRooms.join(room,{name:playerName(),pin:roomPin(),onStatus:lobbyStatus});netRole='guest';wireGuestRoom(roomSession);startGame()}catch(error){lobbyStatus(error.message);join.disabled=false}};row.append(label,join);list.append(row);});
            },()=>lobbyStatus('Room list unavailable. Check your connection.'));
        }

        function init() {
            initThree();
            initUI();
            initTouchControls();
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            window.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('pointerlockchange', updateLockStatus);
            const savedName=localStorage.getItem('nicos-player-name');if(savedName)document.getElementById('player-name').value=savedName;
            document.getElementById('player-name').addEventListener('input',event=>localStorage.setItem('nicos-player-name',event.target.value));
            document.getElementById('room-pin').addEventListener('input',event=>event.target.value=event.target.value.replace(/\D/g,'').slice(0,4));
            document.getElementById('solo-start').onclick=()=>{netRole='solo';startGame()};
            document.getElementById('join-open').onclick=()=>{document.getElementById('room-panel').style.display='block';lobbyStatus('Choose a host below.');if(globalThis.PartyRooms)setupRooms()};
            document.getElementById('host-start').onclick=async event=>{try{event.currentTarget.disabled=true;lobbyStatus('Opening room…');roomSession=await PartyRooms.createHost({game:'nicos-nextbots',name:playerName(),pin:roomPin(),onStatus:lobbyStatus});netRole='host';wireHostRoom(roomSession);startGame()}catch(error){lobbyStatus(error.message);event.currentTarget.disabled=false}};
            if(globalThis.PartyRooms)setupRooms();else addEventListener('partyroomsready',setupRooms,{once:true});
        }
        init();
    </script>
