<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextbot Escape - High Speed Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }
        #stopwatch-container {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }
        #stopwatch {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
            color: #ffff00;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid #444;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #warning {
            color: #ff4444;
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #ff0000;
            color: white;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: white; margin-bottom: 20px;">NEXTBOT BROWSER: OVERDRIVE</h1>
        <button id="start-btn">ENTER THE MAZE</button>
        <p style="color: #888; margin-top: 15px;">Use WASD to Move | Mouse to Look</p>
    </div>

    <div id="stopwatch-container">
        <div id="stopwatch">TIME: 0.00s</div>
    </div>

    <div id="ui">
        <h2 id="status">STATUS: SURVIVING</h2>
        <p>BOT DISTANCE: <span id="dist">0</span>m</p>
        <p id="warning">LINE OF SIGHT DETECTED! TURN CORNERS!</p>
    </div>
    
    <div id="crosshair"></div>

    <div id="instructions">
        WASD/ARROWS to move | SPACE to jump | CLICK to lock mouse
    </div>

    <script>
        let scene, camera, renderer, clock;
        let startTime = 0;
        let gameActive = false;

        let player = {
            speed: 0.32, // Increased from 0.18
            velocity: new THREE.Vector3(),
            friction: 0.9, // Higher for better control at high speeds
            isLocked: false,
            sensitivity: 0.003,
            verticalVelocity: 0,
            isJumping: false,
            jumpStrength: 0.22, // Increased
            gravity: 0.012, // Increased for snappier jumping
            height: 1.7
        };

        let bot = {
            mesh: null,
            baseSpeed: 0.24, // Increased
            chaseSpeed: 0.38, // Increased (faster than player's base speed!)
            slowSpeed: 0.16, // Half of player's new speed
            currentSpeed: 0.24,
            active: false,
            losTimer: 0,
            isChasing: false,
            isSlowed: false,
            slowExpiration: 0
        };

        let walls = [];
        let keys = {};
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const crosshair = document.getElementById('crosshair');
        const warningUI = document.getElementById('warning');
        const stopwatchUI = document.getElementById('stopwatch');

        let audioCtx, oscillator, gainNode;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.08);

            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000); // Wider FOV for speed
            camera.position.set(0, player.height, 45); // Start at the edge
            camera.rotation.order = 'YXZ'; 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.05);
            scene.add(ambient);
            
            const flashlight = new THREE.SpotLight(0xffffff, 2.5, 60, Math.PI / 3, 0.5);
            camera.add(flashlight);
            flashlight.position.set(0, 0, 0);
            flashlight.target.position.set(0, 0, -1);
            camera.add(flashlight.target);
            scene.add(camera);

            createMaze();
            createNextbot();

            clock = new THREE.Clock();
            startTime = Date.now();
            gameActive = true;
            
            window.addEventListener('resize', onWindowResize, false);
            
            window.addEventListener('keydown', (e) => { keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', () => {
                if (!player.isLocked && overlay.style.display === 'none') {
                    document.body.requestPointerLock();
                }
            });
            
            animate();
        }

        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 512, 512);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#222';
            ctx.strokeRect(0, 0, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createMaze() {
            const size = 150;
            const h = 7;
            const wallTex = createWallTexture();
            const floorTex = createFloorTexture();
            
            floorTex.repeat.set(size/2, size/2);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshPhongMaterial({ map: floorTex }));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide }));
            ceil.rotation.x = Math.PI/2; ceil.position.y = h;
            scene.add(ceil);

            // Boundaries
            addWall(0, h/2, -size/2, size, h, 0, wallTex);
            addWall(0, h/2, size/2, size, h, Math.PI, wallTex);
            addWall(size/2, h/2, 0, size, h, -Math.PI/2, wallTex);
            addWall(-size/2, h/2, 0, size, h, Math.PI/2, wallTex);

            // Redesigned: Corridors leading to a central open space
            // Central open arena is roughly from -15 to 15 on X and Z
            const mazeBlocks = [
                // Inner perimeter walls (leaving 4 main openings)
                {x: -25, z: -25, w: 20, d: 2}, // Top left corridor wall
                {x: 25, z: -25, w: 20, d: 2},  // Top right corridor wall
                {x: -25, z: 25, w: 20, d: 2},  // Bottom left corridor wall
                {x: 25, z: 25, w: 20, d: 2},   // Bottom right corridor wall
                
                // Vertical corridors
                {x: -15, z: -40, w: 2, d: 30},
                {x: 15, z: -40, w: 2, d: 30},
                {x: -15, z: 40, w: 2, d: 30},
                {x: 15, z: 40, w: 2, d: 30},
                
                // Horizontal corridors
                {x: -40, z: -15, w: 30, d: 2},
                {x: 40, z: -15, w: 30, d: 2},
                {x: -40, z: 15, w: 30, d: 2},
                {x: 40, z: 15, w: 30, d: 2},

                // Outer zig-zags to force corridor movement
                {x: 0, z: -60, w: 40, d: 2},
                {x: 0, z: 60, w: 40, d: 2},
                {x: -60, z: 0, w: 2, d: 40},
                {x: 60, z: 0, w: 2, d: 40},
            ];

            mazeBlocks.forEach(b => {
                const geom = new THREE.BoxGeometry(b.w, h, b.d);
                const m = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ map: wallTex }));
                m.position.set(b.x, h/2, b.z);
                scene.add(m);
                walls.push(m);
            });
        }

        function addWall(x, y, z, w, h, ry, tex) {
            const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshPhongMaterial({ map: tex }));
            wall.position.set(x, y, z);
            wall.rotation.y = ry;
            scene.add(wall);
            walls.push(wall);
        }

        function createNextbot() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white'; ctx.fillRect(0,0,256,256);
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(80, 100, 30, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(176, 100, 30, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(128, 190, 60, 40, 0, 0, Math.PI*2); ctx.fill();
            const tex = new THREE.CanvasTexture(canvas);
            bot.mesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
            bot.mesh.position.set(0, 2, 0); // Start in the middle (open space)
            scene.add(bot.mesh);
            bot.active = true;
        }

        document.addEventListener('pointerlockchange', () => {
            player.isLocked = (document.pointerLockElement === document.body);
            crosshair.style.display = player.isLocked ? 'block' : 'none';
        });

        function onMouseMove(event) {
            if (player.isLocked) {
                camera.rotation.y -= event.movementX * player.sensitivity;
                let pitch = camera.rotation.x - event.movementY * player.sensitivity;
                camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updatePlayer() {
            let inputX = 0;
            let inputZ = 0;

            if (keys['KeyW'] || keys['ArrowUp']) inputZ -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) inputZ += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;

            const angle = camera.rotation.y;
            const sideAngle = angle + Math.PI / 2;

            const targetDir = new THREE.Vector3(0, 0, 0);
            if (inputX !== 0 || inputZ !== 0) {
                targetDir.x = (Math.sin(angle) * inputZ) + (Math.sin(sideAngle) * inputX);
                targetDir.z = (Math.cos(angle) * inputZ) + (Math.cos(sideAngle) * inputX);
                targetDir.normalize();
            }

            // Snappier acceleration for faster game
            player.velocity.x += targetDir.x * 0.05;
            player.velocity.z += targetDir.z * 0.05;
            player.velocity.multiplyScalar(player.friction);

            const currentHozSpeed = Math.sqrt(player.velocity.x**2 + player.velocity.z**2);
            if (currentHozSpeed > player.speed) {
                player.velocity.multiplyScalar(player.speed / currentHozSpeed);
            }

            const oldPos = camera.position.clone();
            
            camera.position.x += player.velocity.x;
            if (checkCollision()) { camera.position.x = oldPos.x; player.velocity.x = 0; }
            
            camera.position.z += player.velocity.z;
            if (checkCollision()) { camera.position.z = oldPos.z; player.velocity.z = 0; }

            if (keys['Space'] && !player.isJumping) {
                player.verticalVelocity = player.jumpStrength;
                player.isJumping = true;
            }

            if (player.isJumping || camera.position.y > player.height) {
                player.verticalVelocity -= player.gravity;
                camera.position.y += player.verticalVelocity;
                if (camera.position.y <= player.height) {
                    camera.position.y = player.height;
                    player.verticalVelocity = 0;
                    player.isJumping = false;
                }
            }
        }

        function checkCollision() {
            for (let w of walls) {
                const box = new THREE.Box3().setFromObject(w);
                box.expandByScalar(0.45); 
                if (box.containsPoint(camera.position)) return true;
            }
            return false;
        }

        function checkLOS() {
            const start = bot.mesh.position.clone();
            const end = camera.position.clone();
            const direction = new THREE.Vector3().subVectors(end, start).normalize();
            const raycaster = new THREE.Raycaster(start, direction, 0, start.distanceTo(end));
            const intersects = raycaster.intersectObjects(walls);
            return intersects.length === 0;
        }

        function updateBot() {
            if (!bot.active) return;
            const dist = camera.position.distanceTo(bot.mesh.position);
            document.getElementById('dist').innerText = Math.round(dist);

            if (dist < 1.8) {
                gameActive = false;
                document.getElementById('status').innerText = "STATUS: ELIMINATED";
                document.getElementById('status').style.color = "#ff0000";
                bot.active = false;
                const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                stopwatchUI.innerText = `FINAL SCORE: ${finalTime}s`;
                setTimeout(() => location.reload(), 3000);
            }

            const hasLOS = checkLOS();
            
            if (bot.isChasing && !hasLOS && !bot.isSlowed) {
                bot.isSlowed = true;
                bot.slowExpiration = Date.now() + 3000;
            }

            if (bot.isSlowed && Date.now() > bot.slowExpiration) {
                bot.isSlowed = false;
            }

            if (hasLOS) {
                bot.losTimer += 1/60;
                if (bot.losTimer > 1.0) { // Slightly faster reaction
                    bot.isChasing = true;
                    warningUI.style.display = 'block';
                }
            } else {
                bot.losTimer = 0;
                bot.isChasing = false;
                warningUI.style.display = 'none';
            }

            if (bot.isSlowed) {
                bot.currentSpeed = bot.slowSpeed;
            } else if (bot.isChasing) {
                bot.currentSpeed = bot.chaseSpeed;
            } else {
                bot.currentSpeed = bot.baseSpeed;
            }

            const dir = new THREE.Vector3().subVectors(camera.position, bot.mesh.position);
            dir.y = 0; dir.normalize();
            bot.mesh.position.addScaledVector(dir, bot.currentSpeed);
            bot.mesh.lookAt(camera.position.x, bot.mesh.position.y, camera.position.z);

            if (gainNode) {
                const vol = Math.max(0, 1 - (dist / 40));
                gainNode.gain.setTargetAtTime(vol * 0.4, audioCtx.currentTime, 0.1);
                const pitch = bot.isSlowed ? 40 : (bot.isChasing ? 140 : 70);
                oscillator.frequency.setTargetAtTime(pitch + (1000 / (dist + 1)), audioCtx.currentTime, 0.1);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameActive) {
                updatePlayer();
                updateBot();
                const currentTime = ((Date.now() - startTime) / 1000).toFixed(2);
                stopwatchUI.innerText = `TIME: ${currentTime}s`;
            }
            renderer.render(scene, camera);
        }

        startBtn.onclick = () => {
            overlay.style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth';
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            init();
        };
    </script>
</body>
</html>
