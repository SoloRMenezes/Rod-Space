<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Wants to Be a Millionaire?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');

        :root {
            --primary-blue: #020230;
            --accent-gold: #e5a024;
            --border-blue: #4a90e2;
            --success-green: #28a745;
            --error-red: #dc3545;
        }

        body {
            background: radial-gradient(circle at center, #0a0a4d 0%, #02021a 100%);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        /* The iconic Hexagon shape for buttons and question box */
        .hex-box {
            position: relative;
            background: linear-gradient(180deg, #101050 0%, #050520 100%);
            border: 2px solid var(--border-blue);
            clip-path: polygon(2% 0, 98% 0, 100% 50%, 98% 100%, 2% 100%, 0 50%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .answer-btn {
            cursor: pointer;
        }

        .answer-btn:hover:not(:disabled) {
            background: var(--accent-gold);
            color: black;
            border-color: white;
            transform: scale(1.02);
        }

        .answer-btn.correct {
            background: var(--success-green) !important;
            border-color: white;
            animation: pulse-green 0.5s infinite;
        }

        .answer-btn.wrong {
            background: var(--error-red) !important;
            border-color: white;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        /* Money Ladder Styles */
        .ladder-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 12px;
            border-radius: 4px;
            margin: 1px 0;
        }

        .ladder-item.active {
            background: var(--accent-gold);
            color: black;
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent-gold);
        }

        .ladder-item.safe {
            color: #fff;
            text-decoration: underline;
        }

        .ladder-item.milestone {
            color: var(--accent-gold);
        }

        /* Lifeline Styles */
        .lifeline {
            width: 60px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
            cursor: pointer;
        }

        .lifeline:hover:not(.used) {
            background: var(--accent-gold);
            color: black;
            transform: translateY(-2px);
        }

        .lifeline.used {
            opacity: 0.3;
            border-color: #666;
            cursor: not-allowed;
            position: relative;
        }

        .lifeline.used::after {
            content: "X";
            color: var(--error-red);
            font-size: 30px;
            position: absolute;
        }

        #start-screen {
            background: radial-gradient(circle, #1a1a7a 0%, #02021a 100%);
            z-index: 100;
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(74, 144, 226, 0.8);
        }

        #timer-bar {
            transition: width 1s linear;
        }
    </style>
</head>

    <!-- Starting Screen -->

            </svg>
        </div>
        <h1 class="text-6xl font-bold mb-4 glow-text uppercase tracking-widest">Who Wants To Be A<br><span class="text-yellow-500">Millionaire</span></h1>
        <p class="text-blue-300 text-xl mb-10 max-w-md">Harder mix. Faster clock. 15 questions between you and the million.</p>
        <button onclick="initGame()" class="bg-yellow-500 text-black px-12 py-4 rounded-full font-bold text-2xl hover:bg-yellow-400 transition-all hover:scale-110 shadow-2xl">
            START THE QUIZ
        </button>
    </div>

    <!-- Game Over Screen -->

        <p id="end-message" class="text-2xl mb-10 text-center max-w-2xl"></p>
        <button onclick="resetToHome()" class="bg-blue-600 text-white px-10 py-3 rounded-full font-bold hover:bg-blue-500">PLAY AGAIN</button>
    </div>

    <!-- Main Game Interface -->
    <div id="game-ui" class="hidden h-screen flex flex-col">
        
        <!-- Header: Lifelines & Timer -->
        <div class="p-6 flex justify-between items-start">
            <div class="flex gap-4">

                <button id="ll-host" onclick="useHost()" class="lifeline">🎤</button>
            </div>

            </div>

            <div class="text-right">

            </div>
        </div>

                <div class="hex-box w-full p-8 md:p-12 text-center text-xl md:text-2xl font-bold">
                    <span id="question-text">Loading question...</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-6">
                    <button id="btn-0" onclick="handleAnswer(0)" class="hex-box answer-btn p-5 text-left flex items-center">
                        <span class="text-yellow-500 font-bold mr-4">A:</span> <span class="answer-label">...</span>
                    </button>
                    <button id="btn-1" onclick="handleAnswer(1)" class="hex-box answer-btn p-5 text-left flex items-center">
                        <span class="text-yellow-500 font-bold mr-4">B:</span> <span class="answer-label">...</span>
                    </button>
                    <button id="btn-2" onclick="handleAnswer(2)" class="hex-box answer-btn p-5 text-left flex items-center">
                        <span class="text-yellow-500 font-bold mr-4">C:</span> <span class="answer-label">...</span>
                    </button>

                        <span class="text-yellow-500 font-bold mr-4">D:</span> <span class="answer-label">...</span>
                    </button>
                </div>
            </div>

                <div id="ladder-container" class="flex flex-col-reverse gap-1"></div>
            </div>
        </div>
    </div>

                { q: "Which lens creates 'Bokeh' effect?", a: ["Telephoto", "Wide-angle", "Fisheye", "Macro"], c: 0 },

                { q: "Which film popularized 'Steadicam'?", a: ["Rocky", "Star Wars", "Jaws", "Goodfellas"], c: 0 },
                { q: "Which director is known for long tracking shots?", a: ["Alfonso Cuarón", "Christopher Nolan", "Tarantino", "Spielberg"], c: 0 },
                { q: "Cinematographer of Gravity?", a: ["Emmanuel Lubezki", "Roger Deakins", "Janusz Kamiński", "Wally Pfister"], c: 0 },
                { q: "Which movie is considered the first blockbuster?", a: ["Jaws", "Star Wars", "Gone with the Wind", "E.T."], c: 0 },
                { q: "Director of Parasite?", a: ["Bong Joon-ho", "Park Chan-wook", "Kim Ki-duk", "Lee Chang-dong"], c: 0 }

        };

        let currentQuestions = [];
        let currentIndex = 0;
        let currentShuffledAnswers = [];
        let currentCorrectIdx = -1;
        let isActive = false;
        let lifelines = { fifty: true, phone: true, host: true };
        let timerSeconds = QUESTION_TIME_LIMIT;
        let timerInterval = null;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            
            // Slightly tougher curve: fewer warmups, more high-tier questions.
            const t1 = shuffle([...QUESTION_BANK.tier1]).slice(0, 2);
            const t2 = shuffle([...QUESTION_BANK.tier2]).slice(0, 4);
            const t3 = shuffle([...QUESTION_BANK.tier3]).slice(0, 5);
            const t4 = shuffle([...QUESTION_BANK.tier4]).slice(0, 4);
            
            currentQuestions = [...t1, ...t2, ...t3, ...t4];
            currentIndex = 0;
            isActive = true;
            lifelines = { fifty: true, phone: true, host: true };
            
            document.querySelectorAll('.lifeline').forEach(el => el.classList.remove('used'));
            
            buildLadder();
            loadQuestion();
        }

        function buildLadder() {
            const container = document.getElementById('ladder-container');
            container.innerHTML = '';
            PRIZES.forEach((amount, i) => {
                const div = document.createElement('div');
                div.id = `ladder-${i}`;
                div.className = 'ladder-item';
                if (i === 4 || i === 9 || i === 14) div.classList.add('safe');
                div.innerHTML = `<span>${i + 1}</span> <span>$${amount}</span>`;
                container.appendChild(div);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = QUESTION_TIME_LIMIT;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const bar = document.getElementById('timer-bar');
            const text = document.getElementById('timer-text');
            const percentage = (timerSeconds / QUESTION_TIME_LIMIT) * 100;
            
            bar.style.width = `${percentage}%`;
            text.innerText = `${timerSeconds}s`;

            if (timerSeconds <= 10) {
                bar.classList.remove('bg-yellow-500');
                bar.classList.add('bg-red-500');
            } else {
                bar.classList.add('bg-yellow-500');
                bar.classList.remove('bg-red-500');
            }
        }

        function handleTimeOut() {
            if (!isActive) return;
            isActive = false;
            document.getElementById(`btn-${currentCorrectIdx}`).classList.add('correct');
            setTimeout(() => finishGame(false, true), 1500);
        }

        function loadQuestion() {
            const rawQuestion = currentQuestions[currentIndex];
            const originalAnswers = rawQuestion.a;

            let answerPool = originalAnswers.map((text, i) => ({ text, isCorrect: i === rawQuestion.c }));
            currentShuffledAnswers = shuffle(answerPool);
            currentCorrectIdx = currentShuffledAnswers.findIndex(a => a.isCorrect);

            document.getElementById('question-text').innerText = rawQuestion.q;
            document.getElementById('host-bubble').innerText = "";
            document.getElementById('current-prize-display').innerText = currentIndex > 0 ? `$${PRIZES[currentIndex-1]}` : "$0";

            document.querySelectorAll('.ladder-item').forEach(el => el.classList.remove('active'));
            const activeLadder = document.getElementById(`ladder-${currentIndex}`);
            if (activeLadder) activeLadder.classList.add('active');

            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.classList.remove('correct', 'wrong');
                btn.style.visibility = 'visible';
                btn.disabled = false;
                btn.querySelector('.answer-label').innerText = currentShuffledAnswers[i].text;
            }

            startTimer();
        }

        function handleAnswer(idx) {
            if (!isActive) return;
            isActive = false;
            clearInterval(timerInterval);

            const btn = document.getElementById(`btn-${idx}`);

            if (idx === currentCorrectIdx) {
                btn.classList.add('correct');
                setTimeout(() => {
                    if (currentIndex === 14) {
                        finishGame(true);
                    } else {
                        currentIndex++;
                        isActive = true;
                        loadQuestion();
                    }
                }, 1500);
            } else {
                btn.classList.add('wrong');
                document.getElementById(`btn-${currentCorrectIdx}`).classList.add('correct');
                setTimeout(() => finishGame(false), 2000);
            }
        }

        function use5050() {
            if (!lifelines.fifty || !isActive) return;
            lifelines.fifty = false;
            document.getElementById('ll-50').classList.add('used');

            let pool = [0,1,2,3].filter(i => i !== currentCorrectIdx).sort(() => Math.random() - 0.5);
            document.getElementById(`btn-${pool[0]}`).style.visibility = 'hidden';
            document.getElementById(`btn-${pool[1]}`).style.visibility = 'hidden';
        }

        function usePhone() {
            if (!lifelines.phone || !isActive) return;
            lifelines.phone = false;
            document.getElementById('ll-phone').classList.add('used');

            const labels = ["A", "B", "C", "D"];
            const chance = Math.max(0.35, 0.76 - (currentIndex * 0.045));
            const pick = Math.random() < chance ? currentCorrectIdx : Math.floor(Math.random() * 4);
            setHostMsg(`Friend: "I'm about ${(chance*100).toFixed(0)}% sure the answer is ${labels[pick]}!"`);
        }

        function useHost() {
            if (!lifelines.host || !isActive) return;
            lifelines.host = false;
            document.getElementById('ll-host').classList.add('used');

            const labels = ["A", "B", "C", "D"];
            const chance = Math.max(0.45, 0.82 - (currentIndex * 0.035));
            const wrongOptions = [0,1,2,3].filter(i => i !== currentCorrectIdx);
            const pick = Math.random() < chance ? currentCorrectIdx : wrongOptions[Math.floor(Math.random() * wrongOptions.length)];
            setHostMsg(`Host: "I would lean toward ${labels[pick]}, but this one is not free."`);
        }

        function setHostMsg(msg) {
            const el = document.getElementById('host-bubble');
            el.innerText = msg;
            el.style.opacity = 1;
        }

        function finishGame(win, isTimeout = false) {
            clearInterval(timerInterval);
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-message');

            if (win) {
                title.innerText = "MILLIONAIRE!";
                msg.innerText = "ASTOUNDING! You've navigated through advanced science, history, and cinematography to claim the $1,000,000!";
            } else {
                title.innerText = isTimeout ? "TIME EXPIRED" : "GAME OVER";
                let safetyPrize = "$0";
                if (currentIndex >= 10) safetyPrize = "$32,000";
                else if (currentIndex >= 5) safetyPrize = "$1,000";
                msg.innerText = `${isTimeout ? 'The clock hit zero. ' : 'Incorrect answer! '} You leave the show with a total of ${safetyPrize}.`;
            }
        }

        function resetToHome() {
            clearInterval(timerInterval);
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
