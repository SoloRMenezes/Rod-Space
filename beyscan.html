<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEY-SCANNER | Beyblade Collection Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .animate-flash {
            animation: flash 300ms ease-out forwards;
        }
        
        .scan-top { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(249, 115, 22, 0.2)); border-color: rgba(239, 68, 68, 0.3); }
        .scan-middle { background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(16, 185, 129, 0.2)); border-color: rgba(34, 197, 94, 0.3); }
        .scan-tip { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2)); border-color: rgba(59, 130, 246, 0.3); }
        .scan-build { background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2)); border-color: rgba(168, 85, 247, 0.3); }
        
        .category-attack { background: linear-gradient(135deg, #ef4444, #f97316); color: white; }
        .category-stamina { background: linear-gradient(135deg, #22c55e, #10b981); color: white; }
        .category-defense { background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white; }
        .category-balance { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-950 text-white font-sans">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-lg border-b border-white/10 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="m3.3 7 8.7 5 8.7-5"></path>
                        <path d="M12 22V12"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">
                        BEY-SCANNER
                    </h1>
                    <p class="text-xs text-slate-400">Beyblade Collection Tracker</p>
                </div>
            </div>
            
            <button id="viewGalleryBtn" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors" title="View Collection">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent" class="pt-20 pb-6 px-4 max-w-md mx-auto">
        <!-- Camera View (Default) -->
        <div id="cameraView" class="space-y-6 fade-in">
            <!-- Camera Preview -->
            <div class="relative rounded-2xl overflow-hidden bg-slate-800 shadow-2xl shadow-black/50">
                <video id="cameraVideo" autoplay playsinline muted class="w-full h-[60vh] object-cover"></video>
                
                <!-- Flash effect -->
                <div id="flashEffect" class="absolute inset-0 bg-white animate-flash hidden"></div>
                
                <!-- Overlay -->
                <div class="absolute inset-0 pointer-events-none">
                    <!-- Center guide -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                        <div class="w-24 h-24 border-2 border-white/30 rounded-lg">
                            <div class="absolute top-1/2 left-0 right-0 h-px bg-white/20"></div>
                            <div class="absolute left-1/2 top-0 bottom-0 w-px bg-white/20"></div>
                        </div>
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white/70 rounded-full"></div>
                    </div>
                    
                    <!-- Corner markers -->
                    <div class="absolute top-4 left-4 w-6 h-6 border-l-2 border-t-2 border-white/40 rounded-tl-lg"></div>
                    <div class="absolute top-4 right-4 w-6 h-6 border-r-2 border-t-2 border-white/40 rounded-tr-lg"></div>
                    <div class="absolute bottom-4 left-4 w-6 h-6 border-l-2 border-b-2 border-white/40 rounded-bl-lg"></div>
                    <div class="absolute bottom-4 right-4 w-6 h-6 border-r-2 border-b-2 border-white/40 rounded-br-lg"></div>
                    
                    <!-- Type indicator -->
                    <div class="absolute top-4 left-1/2 -translate-x-1/2">
                        <div id="scanTypeIndicator" class="px-4 py-1.5 rounded-full scan-top border border-white/30">
                            <span class="text-xs font-bold text-white tracking-wider">TOP</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Type Selection -->
            <div class="grid grid-cols-4 gap-2">
                <button data-type="Top" class="scan-type-btn flex flex-col items-center justify-center p-3 rounded-xl transition-all scan-top border border-white/30 scale-105">
                    <span class="text-lg mb-1">◆</span>
                    <span class="text-xs font-medium">Top</span>
                    <span class="text-[10px] text-slate-400 mt-1">Energy Ring</span>
                </button>
                <button data-type="Middle" class="scan-type-btn flex flex-col items-center justify-center p-3 rounded-xl transition-all bg-white/5 hover:bg-white/10">
                    <span class="text-lg mb-1">◎</span>
                    <span class="text-xs font-medium">Middle</span>
                    <span class="text-[10px] text-slate-400 mt-1">Fusion Wheel</span>
                </button>
                <button data-type="Tip" class="scan-type-btn flex flex-col items-center justify-center p-3 rounded-xl transition-all bg-white/5 hover:bg-white/10">
                    <span class="text-lg mb-1">▼</span>
                    <span class="text-xs font-medium">Tip</span>
                    <span class="text-[10px] text-slate-400 mt-1">Performance Tip</span>
                </button>
                <button data-type="Build" class="scan-type-btn flex flex-col items-center justify-center p-3 rounded-xl transition-all bg-white/5 hover:bg-white/10">
                    <span class="text-lg mb-1">⚡</span>
                    <span class="text-xs font-medium">Build</span>
                    <span class="text-[10px] text-slate-400 mt-1">Complete Bey</span>
                </button>
            </div>
            
            <!-- Capture Button -->
            <div class="flex justify-center pt-4">
                <button id="captureBtn" class="relative group">
                    <div class="absolute inset-0 rounded-full bg-gradient-to-r from-blue-500 to-cyan-500 blur-xl opacity-60 group-hover:opacity-80 transition-opacity"></div>
                    <div class="relative w-20 h-20 rounded-full bg-slate-900 border-4 border-white/10 flex items-center justify-center transition-transform group-active:scale-95">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center shadow-inner">
                            <div class="w-14 h-14 rounded-full bg-white/20 backdrop-blur-sm"></div>
                        </div>
                    </div>
                </button>
            </div>
            
            <p class="text-center text-sm text-slate-400">
                Tap button or press SPACE to capture
            </p>
        </div>

        <!-- Review View (Hidden by default) -->
        <div id="reviewView" class="space-y-6 hidden">
            <div class="flex items-center gap-3">
                <button id="backToCameraBtn" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h2 class="text-xl font-bold">Review Photo</h2>
            </div>
            
            <div class="rounded-2xl overflow-hidden bg-slate-800 shadow-xl">
                <img id="capturedImage" alt="Captured" class="w-full h-[60vh] object-cover">
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button id="retakeBtn" class="py-4 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center gap-2 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    <span class="font-medium text-slate-300">Retake</span>
                </button>
                <button id="continueBtn" class="py-4 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 flex items-center justify-center gap-2 shadow-lg transition-transform active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span class="font-bold text-white">Continue</span>
                </button>
            </div>
        </div>

        <!-- Form View (Hidden by default) -->
        <div id="formView" class="space-y-6 hidden">
            <div class="flex items-center gap-3">
                <button id="backToReviewBtn" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h2 class="text-xl font-bold">Add Details</h2>
            </div>
            
            <!-- Image Preview -->
            <div class="relative rounded-2xl overflow-hidden bg-slate-800">
                <img id="formImage" alt="Preview" class="w-full h-40 object-cover">
                <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-900 to-transparent">
                    <div id="formTypeBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full scan-top border border-white/30">
                        <span class="text-xs font-bold text-white">Top</span>
                    </div>
                </div>
            </div>
            
            <!-- Name Input -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">
                    Part Name
                </label>
                <input type="text" id="partName" placeholder="e.g. Storm Pegasus, Diablo Nemesis..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-blue-500/50 focus:outline-none transition-colors text-white placeholder:text-slate-500">
            </div>
            
            <!-- Stats -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-3">
                    Stats (1-5)
                </label>
                
                <div class="space-y-4">
                    <!-- Attack -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-red-500/20 flex items-center justify-center text-red-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                            </svg>
                        </div>
                        <span class="text-sm font-medium w-20">Attack</span>
                        <div class="flex-1 flex gap-1">
                            <button data-stat="attack" data-value="1" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="attack" data-value="2" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="attack" data-value="3" class="stat-btn flex-1 h-10 rounded-lg bg-red-500"></button>
                            <button data-stat="attack" data-value="4" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="attack" data-value="5" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                        </div>
                        <span class="w-6 text-center font-bold text-red-400" id="attackValue">3</span>
                    </div>
                    
                    <!-- Stamina -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-green-500/20 flex items-center justify-center text-green-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path>
                                <path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path>
                                <path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path>
                            </svg>
                        </div>
                        <span class="text-sm font-medium w-20">Stamina</span>
                        <div class="flex-1 flex gap-1">
                            <button data-stat="stamina" data-value="1" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="stamina" data-value="2" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="stamina" data-value="3" class="stat-btn flex-1 h-10 rounded-lg bg-green-500"></button>
                            <button data-stat="stamina" data-value="4" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="stamina" data-value="5" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                        </div>
                        <span class="w-6 text-center font-bold text-green-400" id="staminaValue">3</span>
                    </div>
                    
                    <!-- Defense -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                        </div>
                        <span class="text-sm font-medium w-20">Defense</span>
                        <div class="flex-1 flex gap-1">
                            <button data-stat="defense" data-value="1" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="defense" data-value="2" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="defense" data-value="3" class="stat-btn flex-1 h-10 rounded-lg bg-blue-500"></button>
                            <button data-stat="defense" data-value="4" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                            <button data-stat="defense" data-value="5" class="stat-btn flex-1 h-10 rounded-lg bg-white/5 hover:bg-white/10"></button>
                        </div>
                        <span class="w-6 text-center font-bold text-blue-400" id="defenseValue">3</span>
                    </div>
                </div>
            </div>
            
            <!-- Category Preview -->
            <div class="p-4 rounded-xl bg-white/5 border border-white/10">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-300">Detected Category</p>
                        <p class="text-xs text-slate-500">Based on your stats</p>
                    </div>
                    <div id="categoryBadge" class="flex items-center gap-2 px-4 py-2 rounded-full category-attack">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                        <span class="text-sm font-bold text-white" id="categoryText">Attack</span>
                    </div>
                </div>
            </div>
            
            <!-- Save Button -->
            <button id="saveBtn" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-lg hover:opacity-90 transition-opacity active:scale-95">
                Save to Collection
            </button>
        </div>

        <!-- Gallery View (Hidden by default) -->
        <div id="galleryView" class="space-y-6 hidden">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button id="backFromGalleryBtn" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div>
                        <h2 class="text-xl font-bold">My Collection</h2>
                        <p id="collectionCount" class="text-sm text-slate-400">0 items</p>
                    </div>
                </div>
                <button id="newScanBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white text-sm font-medium hover:opacity-90 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline mr-2">
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                        <circle cx="12" cy="13" r="3"></circle>
                    </svg>
                    New Scan
                </button>
            </div>
            
            <!-- Stats -->
            <div class="grid grid-cols-4 gap-2">
                <div class="p-3 rounded-xl bg-white/5 text-center">
                    <div class="text-2xl font-bold text-slate-400" id="totalCount">0</div>
                    <div class="text-xs text-slate-400 uppercase mt-1">Total</div>
                </div>
                <div class="p-3 rounded-xl bg-white/5 text-center">
                    <div class="text-2xl font-bold text-red-400" id="topCount">0</div>
                    <div class="text-xs text-slate-400 uppercase mt-1">Top</div>
                </div>
                <div class="p-3 rounded-xl bg-white/5 text-center">
                    <div class="text-2xl font-bold text-green-400" id="middleCount">0</div>
                    <div class="text-xs text-slate-400 uppercase mt-1">Mid</div>
                </div>
                <div class="p-3 rounded-xl bg-white/5 text-center">
                    <div class="text-2xl font-bold text-blue-400" id="tipCount">0</div>
                    <div class="text-xs text-slate-400 uppercase mt-1">Tip</div>
                </div>
            </div>
            
            <!-- Collection Items -->
            <div id="collectionContainer" class="grid grid-cols-2 gap-3">
                <!-- Items will be added here dynamically -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12">
                <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-white/5 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="m3.3 7 8.7 5 8.7-5"></path>
                        <path d="M12 22V12"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-medium text-slate-300 mb-2">No Beyblades Yet</h3>
                <p class="text-slate-500 mb-6">Start scanning your collection!</p>
                <button id="startScanBtn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-medium hover:opacity-90 transition-opacity">
                    Scan Your First Bey
                </button>
            </div>
        </div>
        
        <!-- Hidden canvas for capture -->
        <canvas id="captureCanvas" class="hidden"></canvas>
    </main>

    <!-- Bottom Navigation -->
    <div id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-white/10 px-4 py-3 hidden">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1">
            <button data-view="camera" class="nav-btn flex flex-col items-center justify-center p-2 rounded-lg transition-colors bg-blue-500/20 text-blue-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                    <circle cx="12" cy="13" r="3"></circle>
                </svg>
                <span class="text-xs mt-1">Camera</span>
            </button>
            <button data-view="review" class="nav-btn flex flex-col items-center justify-center p-2 rounded-lg transition-colors text-slate-400 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                    <path d="m3.3 7 8.7 5 8.7-5"></path>
                    <path d="M12 22V12"></path>
                </svg>
                <span class="text-xs mt-1">Review</span>
            </button>
            <button data-view="form" class="nav-btn flex flex-col items-center justify-center p-2 rounded-lg transition-colors text-slate-400 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                <span class="text-xs mt-1">Details</span>
            </button>
            <button data-view="gallery" class="nav-btn flex flex-col items-center justify-center p-2 rounded-lg transition-colors text-slate-400 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span class="text-xs mt-1">Gallery</span>
            </button>
        </div>
    </div>

    <script>
        // App State
        let currentView = 'camera';
        let selectedType = 'Top';
        let capturedImage = '';
        let isCapturing = false;
        let collection = [];
        let stats = { attack: 3, stamina: 3, defense: 3 };
        let cameraStream = null;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // DOM Elements
        const elements = {
            cameraVideo: document.getElementById('cameraVideo'),
            flashEffect: document.getElementById('flashEffect'),
            scanTypeIndicator: document.getElementById('scanTypeIndicator'),
            capturedImage: document.getElementById('capturedImage'),
            formImage: document.getElementById('formImage'),
            formTypeBadge: document.getElementById('formTypeBadge'),
            categoryBadge: document.getElementById('categoryBadge'),
            categoryText: document.getElementById('categoryText'),
            partName: document.getElementById('partName'),
            captureCanvas: document.getElementById('captureCanvas'),
            
            // Views
            cameraView: document.getElementById('cameraView'),
            reviewView: document.getElementById('reviewView'),
            formView: document.getElementById('formView'),
            galleryView: document.getElementById('galleryView'),
            bottomNav: document.getElementById('bottomNav'),
            
            // Collection elements
            collectionCount: document.getElementById('collectionCount'),
            totalCount: document.getElementById('totalCount'),
            topCount: document.getElementById('topCount'),
            middleCount: document.getElementById('middleCount'),
            tipCount: document.getElementById('tipCount'),
            collectionContainer: document.getElementById('collectionContainer'),
            emptyState: document.getElementById('emptyState')
        };

        // View switching
        function switchView(view) {
            currentView = view;
            
            // Hide all views
            elements.cameraView.classList.add('hidden');
            elements.reviewView.classList.add('hidden');
            elements.formView.classList.add('hidden');
            elements.galleryView.classList.add('hidden');
            elements.bottomNav.classList.add('hidden');
            
            // Show selected view
            switch(view) {
                case 'camera':
                    elements.cameraView.classList.remove('hidden');
                    elements.bottomNav.classList.remove('hidden');
                    break;
                case 'review':
                    elements.reviewView.classList.remove('hidden');
                    elements.bottomNav.classList.remove('hidden');
                    break;
                case 'form':
                    elements.formView.classList.remove('hidden');
                    elements.bottomNav.classList.remove('hidden');
                    updateCategoryPreview();
                    break;
                case 'gallery':
                    elements.galleryView.classList.remove('hidden');
                    elements.bottomNav.classList.remove('hidden');
                    loadCollection();
                    break;
            }
            
            // Update navigation buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.view === view) {
                    btn.classList.add('bg-blue-500/20', 'text-blue-400');
                    btn.classList.remove('text-slate-400', 'hover:text-white');
                } else {
                    btn.classList.remove('bg-blue-500/20', 'text-blue-400');
                    btn.classList.add('text-slate-400', 'hover:text-white');
                }
            });
        }

        // Initialize camera
        async function initCamera() {
            try {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: isMobile ? 'environment' : 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                cameraStream = stream;
                elements.cameraVideo.srcObject = stream;
                
                if (!isMobile) {
                    elements.cameraVideo.style.transform = 'scaleX(-1)';
                }
            } catch (err) {
                console.error('Camera error:', err);
                alert('Failed to access camera. Please check permissions.');
            }
        }

        // Capture photo
        function capturePhoto() {
            if (!elements.cameraVideo.srcObject || isCapturing) return;
            
            isCapturing = true;
            elements.flashEffect.classList.remove('hidden');
            
            setTimeout(() => {
                const video = elements.cameraVideo;
                const canvas = elements.captureCanvas;
                const ctx = canvas.getContext('2d');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Flip back if mirrored
                if (!isMobile) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                
                ctx.drawImage(video, 0, 0);
                
                capturedImage = canvas.toDataURL('image/jpeg', 0.85);
                elements.capturedImage.src = capturedImage;
                elements.formImage.src = capturedImage;
                
                elements.flashEffect.classList.add('hidden');
                isCapturing = false;
                switchView('review');
            }, 300);
        }

        // Update scan type
        function updateScanType(type) {
            selectedType = type;
            
            // Update indicator
            elements.scanTypeIndicator.className = `px-4 py-1.5 rounded-full scan-${type.toLowerCase()} border border-white/30`;
            elements.scanTypeIndicator.innerHTML = `<span class="text-xs font-bold text-white tracking-wider">${type.toUpperCase()}</span>`;
            
            // Update form badge
            elements.formTypeBadge.className = `inline-flex items-center gap-2 px-3 py-1.5 rounded-full scan-${type.toLowerCase()} border border-white/30`;
            elements.formTypeBadge.innerHTML = `<span class="text-xs font-bold text-white">${type}</span>`;
            
            // Update buttons
            document.querySelectorAll('.scan-type-btn').forEach(btn => {
                if (btn.dataset.type === type) {
                    btn.classList.add('scale-105');
                    btn.classList.remove('bg-white/5', 'hover:bg-white/10');
                    btn.className = btn.className.replace(/scan-\w+/g, '');
                    btn.classList.add(`scan-${type.toLowerCase()}`, 'border', 'border-white/30');
                } else {
                    btn.classList.remove('scale-105');
                    btn.classList.remove(/scan-\w+/g, 'border', 'border-white/30');
                    btn.classList.add('bg-white/5', 'hover:bg-white/10');
                }
            });
        }

        // Update stats
        function updateStat(stat, value) {
            stats[stat] = value;
            
            // Update display
            document.getElementById(`${stat}Value`).textContent = value;
            
            // Update buttons
            document.querySelectorAll(`[data-stat="${stat}"]`).forEach(btn => {
                const btnValue = parseInt(btn.dataset.value);
                if (btnValue <= value) {
                    const colors = {
                        attack: 'bg-red-500',
                        stamina: 'bg-green-500',
                        defense: 'bg-blue-500'
                    };
                    btn.className = btn.className.replace(/bg-\w+-\d+|bg-white\/\d+|hover:bg-white\/\d+/g, '');
                    btn.classList.add(colors[stat]);
                } else {
                    btn.className = btn.className.replace(/bg-\w+-\d+/g, '');
                    btn.classList.add('bg-white/5', 'hover:bg-white/10');
                }
            });
            
            // Update category if in form view
            if (currentView === 'form') {
                updateCategoryPreview();
            }
        }

        // Update category preview
        function updateCategoryPreview() {
            const max = Math.max(stats.attack, stats.stamina, stats.defense);
            let category = 'Balance';
            if (stats.attack === max) category = 'Attack';
            else if (stats.stamina === max) category = 'Stamina';
            else if (stats.defense === max) category = 'Defense';
            
            // Update badge
            elements.categoryBadge.className = `flex items-center gap-2 px-4 py-2 rounded-full category-${category.toLowerCase()}`;
            elements.categoryText.textContent = category;
            
            // Update icon
            const icons = {
                Attack: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
                Stamina: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg>',
                Defense: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
                Balance: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>'
            };
            
            elements.categoryBadge.innerHTML = icons[category] + `<span class="text-sm font-bold text-white">${category}</span>`;
        }

        // Save to collection
        function saveToCollection() {
            const name = elements.partName.value || `Unnamed ${selectedType}`;
            const max = Math.max(stats.attack, stats.stamina, stats.defense);
            let category = 'Balance';
            if (stats.attack === max) category = 'Attack';
            else if (stats.stamina === max) category = 'Stamina';
            else if (stats.defense === max) category = 'Defense';
            
            const newItem = {
                id: Date.now().toString(),
                name: name,
                type: selectedType,
                category: category,
                stats: { ...stats },
                image: capturedImage,
                createdAt: Date.now()
            };
            
            collection.unshift(newItem);
            saveCollection();
            
            // Reset form
            elements.partName.value = '';
            stats = { attack: 3, stamina: 3, defense: 3 };
            updateStat('attack', 3);
            updateStat('stamina', 3);
            updateStat('defense', 3);
            
            switchView('gallery');
        }

        // Delete item
        function deleteItem(id) {
            collection = collection.filter(item => item.id !== id);
            saveCollection();
            loadCollection();
        }

        // Save collection to localStorage
        function saveCollection() {
            localStorage.setItem('bey-collection', JSON.stringify(collection));
        }

        // Load collection from localStorage
        function loadCollection() {
            const saved = localStorage.getItem('bey-collection');
            collection = saved ? JSON.parse(saved) : [];
            
            // Update counts
            elements.collectionCount.textContent = `${collection.length} items`;
            elements.totalCount.textContent = collection.length;
            elements.topCount.textContent = collection.filter(item => item.type === 'Top').length;
            elements.middleCount.textContent = collection.filter(item => item.type === 'Middle').length;
            elements.tipCount.textContent = collection.filter(item => item.type === 'Tip').length;
            
            // Show/hide empty state
            if (collection.length === 0) {
                elements.emptyState.classList.remove('hidden');
                elements.collectionContainer.innerHTML = '';
            } else {
                elements.emptyState.classList.add('hidden');
                renderCollection();
            }
        }

        // Render collection items
        function renderCollection() {
            elements.collectionContainer.innerHTML = '';
            
            collection.forEach((item, index) => {
                const colors = {
                    Attack: 'category-attack',
                    Stamina: 'category-stamina',
                    Defense: 'category-defense',
                    Balance: 'category-balance'
                };
                
                const scanColors = {
                    Top: 'scan-top',
                    Middle: 'scan-middle',
                    Tip: 'scan-tip',
                    Build: 'scan-build'
                };
                
                const itemElement = document.createElement('div');
                itemElement.className = `group relative rounded-xl overflow-hidden bg-slate-800 fade-in`;
                itemElement.style.animationDelay = `${index * 50}ms`;
                
                itemElement.innerHTML = `
                    <div class="aspect-square">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-70"></div>
                    <button class="delete-btn absolute top-2 right-2 w-8 h-8 rounded-full bg-black/60 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" data-id="${item.id}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    <div class="absolute bottom-0 left-0 right-0 p-3">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-2 h-2 rounded-full ${colors[item.category]}"></div>
                            <span class="text-xs font-medium text-slate-300">${item.type}</span>
                        </div>
                        <h3 class="font-semibold text-sm truncate">${item.name}</h3>
                        <div class="flex gap-3 mt-2 text-xs text-slate-400">
                            <span class="text-red-400">A:${item.stats.attack}</span>
                            <span class="text-green-400">S:${item.stats.stamina}</span>
                            <span class="text-blue-400">D:${item.stats.defense}</span>
                        </div>
                    </div>
                    <div class="absolute top-2 left-2 px-2 py-1 rounded-full ${colors[item.category]}">
                        <span class="text-xs font-bold text-white">${item.category[0]}</span>
                    </div>
                `;
                
                elements.collectionContainer.appendChild(itemElement);
            });
            
            // Add event listeners to delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteItem(btn.dataset.id);
                });
            });
        }

        // Event Listeners
        function initEventListeners() {
            // Scan type buttons
            document.querySelectorAll('.scan-type-btn').forEach(btn => {
                btn.addEventListener('click', () => updateScanType(btn.dataset.type));
            });
            
            // Stat buttons
            document.querySelectorAll('.stat-btn').forEach(btn => {
                btn.addEventListener('click', () => updateStat(btn.dataset.stat, parseInt(btn.dataset.value)));
            });
            
            // Capture button
            document.getElementById('captureBtn').addEventListener('click', capturePhoto);
            
            // Navigation buttons
            document.getElementById('backToCameraBtn').addEventListener('click', () => switchView('camera'));
            document.getElementById('retakeBtn').addEventListener('click', () => switchView('camera'));
            document.getElementById('continueBtn').addEventListener('click', () => switchView('form'));
            document.getElementById('backToReviewBtn').addEventListener('click', () => switchView('review'));
            document.getElementById('saveBtn').addEventListener('click', saveToCollection);
            document.getElementById('backFromGalleryBtn').addEventListener('click', () => switchView('camera'));
            document.getElementById('newScanBtn').addEventListener('click', () => switchView('camera'));
            document.getElementById('startScanBtn').addEventListener('click', () => switchView('camera'));
            document.getElementById('viewGalleryBtn').addEventListener('click', () => switchView('gallery'));
            
            // Bottom navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });
            
            // Keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && currentView === 'camera') {
                    e.preventDefault();
                    capturePhoto();
                }
            });
            
            // Part name input - auto focus
            elements.partName.addEventListener('focus', () => {
                setTimeout(() => {
                    window.scrollTo(0, elements.partName.offsetTop - 100);
                }, 100);
            });
        }

        // Initialize app
        async function initApp() {
            await initCamera();
            loadCollection();
            initEventListeners();
            updateScanType('Top');
            updateCategoryPreview();
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
