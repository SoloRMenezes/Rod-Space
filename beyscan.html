<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeyScan - Pro Blader Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --primary: #3b82f6;
            --secondary: #0ea5e9;
            --accent: #22d3ee;
            --bg-dark: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1), transparent),
                radial-gradient(circle at 0% 100%, rgba(14, 165, 233, 0.05), transparent);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .font-header { font-family: 'Orbitron', sans-serif; }

        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-main-scan {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-main-scan:active { transform: scale(0.95); }

        .nav-pill {
            transition: all 0.3s ease;
        }
        .nav-pill.active {
            background: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            color: white !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .part-slot {
            transition: all 0.2s ease;
            border: 2px dashed rgba(255,255,255,0.1);
        }
        .part-slot.selected {
            border: 2px solid var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .stat-block {
            width: 40px;
            height: 24px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .stat-block.active-attack { background: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .stat-block.active-stamina { background: #22d3ee; box-shadow: 0 0 10px rgba(34, 211, 238, 0.3); }
        .stat-block.active-defense { background: #6366f1; box-shadow: 0 0 10px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body class="flex justify-center p-0 select-none">

    <div class="w-full max-w-md min-h-screen flex flex-col">
        
        <!-- 1. HOME VIEW -->
        <section id="home-view" class="view flex flex-col p-6 animate-in fade-in duration-500">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="font-header text-2xl font-black tracking-tighter text-white">BEY<span class="text-blue-500">SCAN</span></h1>
                </div>
                <div class="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center bg-slate-900 overflow-hidden">
                    <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                </div>
            </div>

            <!-- Hangar Inventory Dashboard -->
            <div class="glass-card rounded-[2rem] p-6 mb-8 border-blue-500/10">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Hangar Inventory</p>
                
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-blue-400 uppercase mb-2">Tops</div>
                        <div class="text-3xl font-header font-black" id="count-top">0</div>
                    </div>
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-cyan-400 uppercase mb-2">Mids</div>
                        <div class="text-3xl font-header font-black" id="count-middle">0</div>
                    </div>
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-indigo-400 uppercase mb-2">Tips</div>
                        <div class="text-3xl font-header font-black" id="count-tip">0</div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showView('scanner-view'); startCamera();" class="btn-main-scan col-span-2 py-8 rounded-[2.5rem] flex flex-col items-center justify-center gap-3 group">
                    <div class="w-14 h-14 bg-white/10 rounded-full flex items-center justify-center border border-white/20">
                        <i data-lucide="scan" class="w-7 h-7 text-white"></i>
                    </div>
                    <span class="font-header font-bold text-sm tracking-widest">INITIATE SCAN</span>
                </button>
                
                <button onclick="showView('builder-view')" class="glass-card py-6 rounded-3xl flex flex-col items-center gap-2 border-blue-500/10 hover:bg-white/5 transition-colors">
                    <i data-lucide="wrench" class="w-6 h-6 text-blue-400"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Lab</span>
                </button>

                <button onclick="showView('collection-view')" class="glass-card py-6 rounded-3xl flex flex-col items-center gap-2 border-cyan-500/10 hover:bg-white/5 transition-colors">
                    <i data-lucide="database" class="w-6 h-6 text-cyan-400"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Vault</span>
                </button>
            </div>
        </section>

        <!-- 2. SCANNER VIEW -->
        <section id="scanner-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Optical Capture</h3>
            </div>
            
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="setScanPart('Top')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1 border-blue-500" id="btn-top">
                    <i data-lucide="circle-dot" class="w-5 h-5 text-blue-400"></i>
                    <span class="text-[9px] font-bold uppercase">Top</span>
                </button>
                <button onclick="setScanPart('Middle')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1" id="btn-middle">
                    <i data-lucide="aperture" class="w-5 h-5 text-slate-500"></i>
                    <span class="text-[9px] font-bold uppercase text-slate-500">Mid</span>
                </button>
                <button onclick="setScanPart('Tip')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1" id="btn-tip">
                    <i data-lucide="triangle" class="w-5 h-5 rotate-180 text-slate-500"></i>
                    <span class="text-[9px] font-bold uppercase text-slate-500">Tip</span>
                </button>
            </div>

            <div class="relative aspect-square bg-black rounded-[2rem] overflow-hidden mb-8 border border-white/5">
                <video id="video-preview" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                <canvas id="capture-canvas" class="hidden"></canvas>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="camera-guide" class="border-2 border-dashed border-white/40 shadow-[0_0_0_999px_rgba(0,0,0,0.7)]"></div>
                </div>
            </div>

            <div class="flex justify-center">
                <button onclick="takePhoto()" class="w-20 h-20 rounded-full border-4 border-white/10 p-1 bg-blue-600">
                    <div class="w-full h-full rounded-full border-2 border-white/20 flex items-center justify-center">
                        <i data-lucide="camera" class="w-8 h-8 text-white"></i>
                    </div>
                </button>
            </div>
        </section>

        <!-- 3. REVIEW VIEW -->
        <section id="review-view" class="view hidden flex-col items-center p-6">
            <h3 class="font-header text-sm font-bold mb-6 tracking-widest">CAPTURE CONFIRMED</h3>
            <div class="w-full aspect-square bg-slate-900 rounded-[2rem] overflow-hidden mb-8 border border-white/10 shadow-2xl">
                <img id="capture-review" src="" alt="Capture" class="w-full h-full object-cover scale-x-[-1]">
            </div>
            <div class="w-full grid grid-cols-2 gap-4">
                <button onclick="showView('scanner-view')" class="bg-slate-800 py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest">Discard</button>
                <button onclick="showView('details-view')" class="btn-main-scan py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest text-white">Analyze</button>
            </div>
        </section>

        <!-- 4. DETAILS VIEW -->
        <section id="details-view" class="view hidden flex-col p-6">
            <h3 class="font-header text-xs font-bold uppercase tracking-widest mb-6 text-blue-400">Analysis Results</h3>
            <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden mb-6 border border-white/10">
                <img id="details-preview-img" src="" class="w-full h-full object-cover opacity-50">
                <div class="absolute bottom-4 left-4">
                    <span id="details-part-tag" class="bg-blue-600 text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-wider">Top</span>
                </div>
            </div>
            <div class="space-y-6 mb-10">
                <div class="space-y-2">
                    <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Designation</p>
                    <input id="part-name-input" type="text" placeholder="Enter part name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:border-blue-500 outline-none">
                </div>
                <div class="space-y-5" id="stat-controls"></div>
            </div>
            <button onclick="savePart()" class="btn-main-scan w-full py-5 rounded-2xl font-bold uppercase tracking-[0.2em] text-sm">Save to Vault</button>
        </section>

        <!-- 5. BUILDER VIEW -->
        <section id="builder-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Lab Assembly</h3>
            </div>

            <div class="glass-card rounded-[2rem] p-8 mb-6 flex flex-col items-center">
                <div class="flex items-center justify-center gap-2 mb-10 w-full">
                    <div id="slot-Top" onclick="openPartPicker('Top')" class="part-slot w-24 h-24 rounded-full flex items-center justify-center cursor-pointer overflow-hidden bg-slate-950/50">
                        <i data-lucide="circle-dot" class="w-10 h-10 text-slate-700"></i>
                    </div>
                    <div class="w-4 h-[1px] bg-slate-800"></div>
                    <div id="slot-Middle" onclick="openPartPicker('Middle')" class="part-slot w-16 h-16 rounded-full flex items-center justify-center cursor-pointer overflow-hidden bg-slate-950/50">
                        <i data-lucide="aperture" class="w-6 h-6 text-slate-700"></i>
                    </div>
                    <div class="w-4 h-[1px] bg-slate-800"></div>
                    <div id="slot-Tip" onclick="openPartPicker('Tip')" class="part-slot w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer overflow-hidden bg-slate-950/50">
                        <i data-lucide="triangle" class="w-4 h-4 text-slate-700 rotate-180"></i>
                    </div>
                </div>

                <div class="w-full grid grid-cols-3 gap-6 text-center border-t border-white/5 pt-8">
                    <div>
                        <div id="combo-attack" class="text-xl font-header font-black text-blue-400">0.0</div>
                        <div class="text-[8px] uppercase text-slate-500 font-bold tracking-widest mt-1">ATK</div>
                    </div>
                    <div>
                        <div id="combo-stamina" class="text-xl font-header font-black text-cyan-400">0.0</div>
                        <div class="text-[8px] uppercase text-slate-500 font-bold tracking-widest mt-1">STA</div>
                    </div>
                    <div>
                        <div id="combo-defense" class="text-xl font-header font-black text-indigo-400">0.0</div>
                        <div class="text-[8px] uppercase text-slate-500 font-bold tracking-widest mt-1">DEF</div>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <input id="combo-name-input" type="text" placeholder="Combo designation..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-xs outline-none focus:border-blue-500">
                <button onclick="saveCombo()" class="btn-main-scan w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-sm">Save Combo</button>
            </div>
        </section>

        <!-- 6. COLLECTION VIEW -->
        <section id="collection-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Vault</h3>
            </div>
            
            <div class="flex bg-slate-950/80 p-1 rounded-2xl mb-6 border border-white/5">
                <button onclick="setCollectionTab('Parts')" id="tab-parts" class="nav-pill active flex-1 py-2 text-[9px] font-black uppercase tracking-wider rounded-xl">Parts</button>
                <button onclick="setCollectionTab('Combos')" id="tab-combos" class="nav-pill flex-1 py-2 text-[9px] font-black uppercase tracking-wider rounded-xl text-slate-500">Combos</button>
            </div>

            <div id="parts-filter-controls" class="space-y-4 mb-6">
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="setPartSubFilter('All')" class="sub-filter-btn px-4 py-2 rounded-full text-[8px] font-black uppercase tracking-wider bg-blue-600" data-filter="All">All</button>
                    <button onclick="setPartSubFilter('Top')" class="sub-filter-btn px-4 py-2 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-800 text-slate-400" data-filter="Top">Tops</button>
                    <button onclick="setPartSubFilter('Middle')" class="sub-filter-btn px-4 py-2 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-800 text-slate-400" data-filter="Middle">Mids</button>
                    <button onclick="setPartSubFilter('Tip')" class="sub-filter-btn px-4 py-2 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-800 text-slate-400" data-filter="Tip">Tips</button>
                </div>
            </div>

            <div id="collection-grid" class="grid grid-cols-2 gap-4 pb-20"></div>
        </section>

        <!-- Part Picker Modal -->
        <div id="part-picker-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center px-4">
            <div class="w-full max-w-sm glass-card rounded-[2.5rem] border border-white/10 p-6 max-h-[70vh] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-header text-xs font-bold uppercase tracking-widest" id="picker-title">Database</h3>
                    <button onclick="closePartPicker()" class="p-2 bg-slate-800 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div id="picker-list" class="space-y-4 overflow-y-auto no-scrollbar"></div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        let stream = null;
        let capturedImage = null;
        let selectedPartType = 'Top';
        let collection = []; 
        let combos = [];     
        let stats = { attack: 0, stamina: 0, defense: 0 };
        const MAX_TOTAL = 13;

        let currentTab = 'Parts'; 
        let currentSubFilter = 'All'; 
        let currentBuild = { Top: null, Middle: null, Tip: null };

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(viewId);
            target.classList.remove('hidden');
            target.classList.add('flex');
            
            if (viewId !== 'scanner-view' && stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            if (viewId === 'home-view') updateHomeUI();
            if (viewId === 'details-view') renderDetailsView();
            if (viewId === 'collection-view') renderCollection();
            if (viewId === 'builder-view') updateComboPreview();
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('video-preview').srcObject = stream;
                setScanPart(selectedPartType);
            } catch (err) { console.error(err); }
        }

        function takePhoto() {
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('capture-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            capturedImage = canvas.toDataURL('image/png');
            document.getElementById('capture-review').src = capturedImage;
            showView('review-view');
        }

        function setScanPart(type) {
            selectedPartType = type;
            document.querySelectorAll('.scan-part-btn').forEach(b => {
                b.classList.remove('border-blue-500');
                b.querySelector('i').classList.replace('text-blue-400', 'text-slate-500');
                b.querySelector('span').classList.replace('text-white', 'text-slate-500');
            });
            const btn = document.getElementById(`btn-${type.toLowerCase()}`);
            btn.classList.add('border-blue-500');
            btn.querySelector('i').classList.replace('text-slate-500', 'text-blue-400');
            btn.querySelector('span').classList.replace('text-slate-500', 'text-white');
            
            const guide = document.getElementById('camera-guide');
            guide.className = 'absolute border-2 border-dashed border-blue-400/40 shadow-[0_0_0_999px_rgba(2,6,23,0.7)] transition-all duration-300';
            if (type === 'Top') guide.classList.add('w-[75%]', 'h-[75%]', 'rounded-full');
            else if (type === 'Middle') guide.classList.add('w-[50%]', 'h-[50%]', 'rounded-full');
            else if (type === 'Tip') guide.classList.add('w-[45%]', 'h-[45%]', 'rounded-2xl');
        }

        function renderDetailsView() {
            document.getElementById('details-preview-img').src = capturedImage;
            document.getElementById('details-part-tag').textContent = selectedPartType;
            renderDetailsStats();
        }

        function renderDetailsStats() {
            const container = document.getElementById('stat-controls');
            container.innerHTML = '';
            ['attack', 'stamina', 'defense'].forEach(type => {
                const row = document.createElement('div');
                row.className = 'space-y-2';
                let blocks = '';
                for(let i=1; i<=5; i++) {
                    const active = stats[type] >= i ? 'active-'+type : '';
                    blocks += `<div class="stat-block flex-1 h-1.5 rounded-sm ${active}" onclick="setStatVal('${type}', ${i})"></div>`;
                }
                row.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[8px] font-black uppercase text-slate-500 tracking-widest">${type}</span>
                        <span class="text-[10px] font-bold text-slate-400">${stats[type]}/5</span>
                    </div>
                    <div class="flex gap-1.5 w-full">${blocks}</div>
                `;
                container.appendChild(row);
            });
        }

        function setStatVal(type, val) {
            const total = Object.entries(stats).reduce((a, [k, v]) => a + (k === type ? val : v), 0);
            if (total <= MAX_TOTAL) {
                stats[type] = val;
                renderDetailsStats();
            }
        }

        function savePart() {
            const name = document.getElementById('part-name-input').value || `${selectedPartType}-${Math.floor(Math.random()*999)}`;
            collection.push({ id: Date.now(), name, type: selectedPartType, image: capturedImage, stats: {...stats} });
            stats = { attack: 0, stamina: 0, defense: 0 };
            document.getElementById('part-name-input').value = '';
            showView('home-view');
        }

        function updateHomeUI() {
            const counts = { Top: 0, Middle: 0, Tip: 0 };
            collection.forEach(p => counts[p.type]++);
            
            document.getElementById('count-top').textContent = counts.Top;
            document.getElementById('count-middle').textContent = counts.Middle;
            document.getElementById('count-tip').textContent = counts.Tip;
            lucide.createIcons();
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            if (currentTab === 'Parts') {
                document.getElementById('parts-filter-controls').classList.remove('hidden');
                let filtered = currentSubFilter === 'All' ? collection : collection.filter(p => p.type === currentSubFilter);
                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'glass-card rounded-3xl overflow-hidden border border-white/5';
                    card.innerHTML = `
                        <div class="h-24 w-full bg-slate-800 relative"><img src="${item.image}" class="w-full h-full object-cover grayscale"></div>
                        <div class="p-3">
                            <div class="text-[10px] font-bold truncate mb-2">${item.name}</div>
                            <div class="flex justify-between">
                                <span class="text-[7px] font-black text-blue-400">A:${item.stats.attack}</span>
                                <span class="text-[7px] font-black text-cyan-400">S:${item.stats.stamina}</span>
                                <span class="text-[7px] font-black text-indigo-400">D:${item.stats.defense}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                document.getElementById('parts-filter-controls').classList.add('hidden');
                combos.forEach(combo => {
                    const card = document.createElement('div');
                    card.className = 'glass-card rounded-3xl overflow-hidden border border-blue-500/20';
                    card.innerHTML = `
                        <div class="h-24 w-full bg-slate-800"><img src="${combo.parts.Top.image}" class="w-full h-full object-cover"></div>
                        <div class="p-3">
                            <div class="text-[10px] font-bold truncate mb-1">${combo.name}</div>
                            <div class="flex justify-between pt-2 border-t border-white/5">
                                <span class="text-[8px] font-bold text-blue-400">${combo.stats.attack}</span>
                                <span class="text-[8px] font-bold text-cyan-400">${combo.stats.stamina}</span>
                                <span class="text-[8px] font-bold text-indigo-400">${combo.stats.defense}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        function setCollectionTab(mode) {
            currentTab = mode;
            document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${mode.toLowerCase()}`).classList.add('active');
            renderCollection();
        }

        function setPartSubFilter(type) {
            currentSubFilter = type;
            document.querySelectorAll('.sub-filter-btn').forEach(btn => {
                const active = btn.getAttribute('data-filter') === type;
                btn.className = `sub-filter-btn px-4 py-2 rounded-full text-[8px] font-black uppercase tracking-wider ${active ? 'bg-blue-600' : 'bg-slate-800 text-slate-400'}`;
            });
            renderCollection();
        }

        function openPartPicker(type) {
            const modal = document.getElementById('part-picker-modal');
            const list = document.getElementById('picker-list');
            document.getElementById('picker-title').textContent = `${type} REGISTRY`;
            list.innerHTML = '';
            modal.classList.remove('hidden');
            collection.filter(p => p.type === type).forEach(part => {
                const div = document.createElement('div');
                div.className = `glass-card p-3 rounded-2xl border flex items-center gap-4 cursor-pointer border-white/5`;
                div.innerHTML = `
                    <img src="${part.image}" class="w-10 h-10 rounded-lg object-cover">
                    <div class="flex-1 text-[10px] font-bold uppercase">${part.name}</div>
                `;
                div.onclick = () => { currentBuild[type] = part; closePartPicker(); updateComboPreview(); };
                list.appendChild(div);
            });
            lucide.createIcons();
        }

        function closePartPicker() { document.getElementById('part-picker-modal').classList.add('hidden'); }

        function updateComboPreview() {
            ['Top', 'Middle', 'Tip'].forEach(type => {
                const slot = document.getElementById(`slot-${type}`);
                if (currentBuild[type]) {
                    slot.innerHTML = `<img src="${currentBuild[type].image}" class="w-full h-full object-cover">`;
                    slot.classList.add('selected');
                }
            });
            let active = Object.values(currentBuild).filter(p => p).length;
            const t = Object.values(currentBuild).reduce((acc, p) => { if(p){acc.a+=p.stats.attack; acc.s+=p.stats.stamina; acc.d+=p.stats.defense;} return acc;}, {a:0,s:0,d:0});
            document.getElementById('combo-attack').textContent = active ? (t.a/active).toFixed(1) : "0.0";
            document.getElementById('combo-stamina').textContent = active ? (t.s/active).toFixed(1) : "0.0";
            document.getElementById('combo-defense').textContent = active ? (t.d/active).toFixed(1) : "0.0";
        }

        function saveCombo() {
            const name = document.getElementById('combo-name-input').value;
            if (!name || !currentBuild.Top || !currentBuild.Middle || !currentBuild.Tip) return;
            const t = Object.values(currentBuild).reduce((acc, p) => { acc.a+=p.stats.attack; acc.s+=p.stats.stamina; acc.d+=p.stats.defense; return acc;}, {a:0,s:0,d:0});
            combos.push({ id: Date.now(), name, parts: {...currentBuild}, stats: { attack: (t.a/3).toFixed(1), stamina: (t.s/3).toFixed(1), defense: (t.d/3).toFixed(1) } });
            currentBuild = { Top: null, Middle: null, Tip: null };
            document.getElementById('combo-name-input').value = '';
            showView('collection-view');
            setCollectionTab('Combos');
        }
    </script>
</body>
</html>
