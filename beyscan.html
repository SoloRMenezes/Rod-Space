<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeyScan - Pro Blader Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&family=Exo+2:ital,wght@1,900&display=swap');
        
        :root {
            --primary: #3b82f6;
            --secondary: #eab308;
            --accent: #22c55e;
            --bg-dark: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1), transparent),
                radial-gradient(circle at 0% 100%, rgba(234, 179, 8, 0.05), transparent);
            min-height: 100vh;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN STYLES --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1), opacity 0.5s ease;
        }

        #splash-screen.hidden-splash {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .beyblade-container {
            position: relative;
            text-align: center;
            perspective: 1000px;
        }

        .beyblade-title {
            font-family: 'Exo 2', sans-serif;
            font-size: clamp(4rem, 15vw, 8rem);
            text-transform: uppercase;
            font-weight: 900;
            font-style: italic;
            position: relative;
            display: inline-block;
            letter-spacing: -4px;
            line-height: 1;
            background: linear-gradient(to bottom, #fff 0%, #a0a0a0 45%, #404040 50%, #808080 55%, #fff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            -webkit-text-stroke: 2px #000;
        }

        .beyblade-title::before {
            content: 'BEYSCAN';
            position: absolute; left: 0; top: 0; z-index: -1;
            -webkit-text-stroke: 12px #0033aa; color: #0033aa;
        }

        .beyblade-title::after {
            content: 'BEYSCAN';
            position: absolute; left: 0; top: 0; z-index: -2;
            -webkit-text-stroke: 22px #ffcc00; color: #ffcc00;
            clip-path: polygon(0% 0%, 100% 0%, 95% 50%, 100% 100%, 0% 100%, 5% 50%);
        }

        .btn-start {
            margin-top: 4rem;
            padding: 1.25rem 4rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(59, 130, 246, 0.6); background: #3b82f6; }

        /* --- APP STYLES --- */
        .font-header { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); position: relative; }
        .btn-main-scan { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        .nav-pill.active { background: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); color: white !important; }
        
        .filter-pill { 
            padding: 0.25rem 0.75rem; 
            border-radius: 9999px; 
            font-size: 9px; 
            font-weight: 800; 
            text-transform: uppercase; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            transition: all 0.2s ease;
        }
        .filter-pill.active { background: var(--primary); color: white; border-color: var(--primary); }

        .stat-block { width: 40px; height: 6px; border-radius: 2px; background: rgba(255,255,255,0.05); cursor: pointer; transition: all 0.2s; }
        .stat-block.active-attack { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .stat-block.active-stamina { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .stat-block.active-defense { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .stat-block.inactive { opacity: 0.2; cursor: not-allowed; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .edit-btn {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            padding: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            transition: transform 0.2s;
        }

        .delete-btn {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10;
            background: rgba(220, 38, 38, 0.6);
            border-radius: 50%;
            padding: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            transition: transform 0.2s;
        }
        
        .edit-btn:active, .delete-btn:active { transform: scale(0.9); }

        /* Combo Triangle Layout */
        .combo-triangle {
            display: grid;
            grid-template-areas: 
                "top top"
                "mid tip";
            gap: 4px;
            height: 96px;
        }
    </style>
</head>
<body class="flex justify-center p-0 select-none">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="beyblade-container">
            <h1 class="beyblade-title">BEYSCAN</h1>
            <div class="text-[#ffcc00] font-header tracking-[0.5em] text-[10px] mt-4 italic opacity-80">OPTICAL ANALYSIS SYSTEM</div>
        </div>
        <button class="btn-start text-white" onclick="dismissSplash()">Initialize</button>
    </div>

    <!-- Main App Content -->
    <div class="w-full max-w-md min-h-screen flex flex-col">
        
        <!-- HOME VIEW -->
        <section id="home-view" class="view flex flex-col p-6 animate-in fade-in duration-500">
            <div class="flex justify-between items-center mb-8">
                <h1 class="font-header text-2xl font-black tracking-tighter text-white">BEY<span class="text-blue-500">SCAN</span></h1>
                <div class="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center bg-slate-900"><i data-lucide="user" class="w-5 h-5 text-slate-400"></i></div>
            </div>

            <div class="glass-card rounded-[2rem] p-6 mb-8 border-blue-500/10">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Hangar Inventory</p>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-blue-500 uppercase mb-1">Tops</div>
                        <div class="text-3xl font-header font-black" id="count-top">0</div>
                    </div>
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-yellow-500 uppercase mb-1">Mids</div>
                        <div class="text-3xl font-header font-black" id="count-middle">0</div>
                    </div>
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-green-500 uppercase mb-1">Tips</div>
                        <div class="text-3xl font-header font-black" id="count-tip">0</div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="showView('scanner-view'); startCamera();" class="btn-main-scan col-span-2 py-8 rounded-[2.5rem] flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20"><i data-lucide="scan" class="w-6 h-6 text-white"></i></div>
                    <span class="font-header font-bold text-xs tracking-widest text-white">INITIATE SCAN</span>
                </button>
                <button onclick="showView('builder-view')" class="glass-card py-6 rounded-3xl flex flex-col items-center gap-2">
                    <i data-lucide="wrench" class="w-6 h-6 text-blue-400"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Lab</span>
                </button>
                <button onclick="showView('collection-view')" class="glass-card py-6 rounded-3xl flex flex-col items-center gap-2">
                    <i data-lucide="database" class="w-6 h-6 text-yellow-400"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Vault</span>
                </button>
            </div>
        </section>

        <!-- SCANNER VIEW -->
        <section id="scanner-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Optical Capture</h3>
            </div>
            
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="setScanPart('Top')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1 border-blue-500" id="btn-top">
                    <i data-lucide="circle-dot" class="w-5 h-5 text-blue-400"></i>
                    <span class="text-[9px] font-bold uppercase">Top</span>
                </button>
                <button onclick="setScanPart('Middle')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1" id="btn-middle">
                    <i data-lucide="aperture" class="w-5 h-5 text-slate-500"></i>
                    <span class="text-[9px] font-bold uppercase">Mid</span>
                </button>
                <button onclick="setScanPart('Tip')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1" id="btn-tip">
                    <i data-lucide="triangle" class="w-5 h-5 rotate-180 text-slate-500"></i>
                    <span class="text-[9px] font-bold uppercase">Tip</span>
                </button>
            </div>

            <div class="relative aspect-square bg-black rounded-[2rem] overflow-hidden mb-8 border border-white/5">
                <video id="video-preview" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                <canvas id="capture-canvas" class="hidden"></canvas>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="camera-guide" class="w-64 h-64 border-2 border-dashed border-white/40 shadow-[0_0_0_999px_rgba(0,0,0,0.7)] rounded-full"></div>
                </div>
            </div>

            <div class="flex justify-center">
                <button onclick="takePhoto()" class="w-20 h-20 rounded-full border-4 border-white/10 p-1 bg-blue-600">
                    <div class="w-full h-full rounded-full border-2 border-white/20 flex items-center justify-center">
                        <i data-lucide="camera" class="w-8 h-8 text-white"></i>
                    </div>
                </button>
            </div>
        </section>

        <!-- DETAILS VIEW (ANALYSIS) -->
        <section id="details-view" class="view hidden flex-col p-6">
            <h3 class="font-header text-xs font-bold uppercase tracking-widest mb-6 text-blue-400">Analysis Results</h3>
            <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden mb-6 border border-white/10">
                <img id="details-preview-img" src="" class="w-full h-full object-cover opacity-50">
                <div class="absolute bottom-4 left-4">
                    <span id="details-part-tag" class="bg-blue-600 text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-wider">Top</span>
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-[10px] font-black uppercase tracking-tighter text-slate-400">Tuning Budget (Min 1 per stat)</span>
                <span id="points-remaining" class="font-header text-lg text-white">0 / 11</span>
            </div>

            <div class="space-y-6 mb-10" id="stat-controls"></div>
            
            <div class="mt-auto">
                <input id="part-name-input" type="text" placeholder="Enter part name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-sm mb-4 outline-none text-white focus:border-blue-500">
                <button id="save-part-btn" onclick="savePart()" class="btn-main-scan w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-sm text-white transition-opacity">Save to Vault</button>
            </div>
        </section>

        <!-- BUILDER VIEW (LAB) -->
        <section id="builder-view" class="view hidden flex-col p-6">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                    <h3 class="font-header text-xs font-bold uppercase tracking-widest">Lab Assembly</h3>
                </div>
                <button onclick="resetBuild()" class="text-[8px] font-bold text-slate-500 uppercase tracking-widest border border-slate-800 px-3 py-1 rounded-full">Reset</button>
            </div>

            <div class="glass-card rounded-[2rem] p-8 mb-6 flex flex-col items-center">
                <div class="flex items-center justify-center gap-2 mb-10 w-full">
                    <div id="slot-Top" onclick="openPartPicker('Top')" class="relative w-24 h-24 rounded-full border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer bg-slate-950/50 overflow-hidden">
                        <i data-lucide="circle-dot" class="w-8 h-8 text-slate-700"></i>
                    </div>
                    <div class="w-4 h-[1px] bg-slate-800"></div>
                    <div id="slot-Middle" onclick="openPartPicker('Middle')" class="relative w-16 h-16 rounded-full border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer bg-slate-950/50 overflow-hidden">
                        <i data-lucide="aperture" class="w-6 h-6 text-slate-700"></i>
                    </div>
                    <div class="w-4 h-[1px] bg-slate-800"></div>
                    <div id="slot-Tip" onclick="openPartPicker('Tip')" class="relative w-14 h-14 rounded-xl border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer bg-slate-950/50 overflow-hidden">
                        <i data-lucide="triangle" class="w-4 h-4 text-slate-700 rotate-180"></i>
                    </div>
                </div>
                <div class="w-full grid grid-cols-3 gap-4 text-center">
                    <div><div id="combo-attack" class="text-xl font-header font-black text-blue-500">1.0</div><div class="text-[7px] text-slate-500 font-bold uppercase tracking-widest">Avg Attack</div></div>
                    <div><div id="combo-stamina" class="text-xl font-header font-black text-yellow-500">1.0</div><div class="text-[7px] text-slate-500 font-bold uppercase tracking-widest">Avg Stamina</div></div>
                    <div><div id="combo-defense" class="text-xl font-header font-black text-green-500">1.0</div><div class="text-[7px] text-slate-500 font-bold uppercase tracking-widest">Avg Defense</div></div>
                </div>
            </div>

            <div class="mt-auto">
                <input id="combo-name-input" type="text" placeholder="Enter build name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-sm mb-4 outline-none text-white focus:border-blue-500">
                <button onclick="saveCombo()" class="btn-main-scan w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-sm text-white">
                    <span id="save-combo-label">Save Build</span>
                </button>
            </div>
        </section>

        <!-- COLLECTION VIEW (VAULT) -->
        <section id="collection-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-4">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Vault</h3>
            </div>

            <div class="space-y-4 mb-6">
                <div class="flex bg-slate-950/80 p-1 rounded-2xl border border-white/5">
                    <button onclick="setCollectionTab('Parts')" id="tab-parts" class="nav-pill active flex-1 py-2 text-[9px] font-black uppercase rounded-xl">Parts</button>
                    <button onclick="setCollectionTab('Combos')" id="tab-combos" class="nav-pill flex-1 py-2 text-[9px] font-black uppercase rounded-xl text-slate-500">Builds</button>
                </div>

                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input id="vault-search" type="text" placeholder="Search by name..." oninput="handleFilterChange()" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-white focus:border-blue-500 outline-none transition-all">
                </div>

                <div id="part-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="setTypeFilter('all')" class="type-filter-btn filter-pill active" id="filter-all">All</button>
                    <button onclick="setTypeFilter('Top')" class="type-filter-btn filter-pill" id="filter-top">Tops</button>
                    <button onclick="setTypeFilter('Middle')" class="type-filter-btn filter-pill" id="filter-middle">Mids</button>
                    <button onclick="setTypeFilter('Tip')" class="type-filter-btn filter-pill" id="filter-tip">Tips</button>
                </div>
            </div>

            <div id="collection-grid" class="grid grid-cols-2 gap-4 pb-20 overflow-y-auto no-scrollbar"></div>
        </section>

    </div>

    <!-- Part Picker Modal -->
    <div id="part-picker-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-6">
        <div class="w-full glass-card rounded-[2.5rem] p-6 max-h-[70vh] flex flex-col">
            <div class="flex justify-between mb-6">
                <h3 class="font-header text-xs font-bold uppercase">Select Part</h3>
                <button onclick="closePartPicker()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="picker-list" class="space-y-3 overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <script>
        // --- STORAGE LOGIC ---
        const DB_KEY_PARTS = 'beyscan_collection';
        const DB_KEY_COMBOS = 'beyscan_builds';
        const DB_KEY_COUNTER = 'beyscan_build_counter';

        function loadFromStorage() {
            const savedParts = localStorage.getItem(DB_KEY_PARTS);
            const savedCombos = localStorage.getItem(DB_KEY_COMBOS);
            const savedCounter = localStorage.getItem(DB_KEY_COUNTER);
            
            if (savedParts) collection = JSON.parse(savedParts);
            if (savedCombos) combos = JSON.parse(savedCombos);
            if (savedCounter) buildCounter = parseInt(savedCounter);
        }

        function saveToStorage() {
            localStorage.setItem(DB_KEY_PARTS, JSON.stringify(collection));
            localStorage.setItem(DB_KEY_COMBOS, JSON.stringify(combos));
            localStorage.setItem(DB_KEY_COUNTER, buildCounter.toString());
        }

        // --- GLOBAL STATE ---
        let stream = null;
        let capturedImage = null;
        let selectedPartType = 'Top';
        let collection = []; 
        let combos = [];     
        let buildCounter = 1;
        let stats = { attack: 1, stamina: 1, defense: 1 };
        const MAX_POINTS = 11;
        
        let currentBuild = { Top: null, Middle: null, Tip: null };
        let currentCollectionTab = 'Parts';
        let currentTypeFilter = 'all';
        let editingPartIndex = null;
        let editingComboIndex = null;

        // --- APP LOGIC ---
        function dismissSplash() {
            document.getElementById('splash-screen').classList.add('hidden-splash');
            lucide.createIcons();
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(viewId);
            target.classList.remove('hidden');
            target.classList.add('flex');
            
            if (viewId !== 'scanner-view' && stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            if (viewId === 'home-view') updateHomeUI();
            if (viewId === 'details-view') renderDetailsStats();
            if (viewId === 'collection-view') {
                resetFilters();
                renderCollection();
            }
            if (viewId === 'builder-view') updateBuildUI();
            
            lucide.createIcons();
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('video-preview').srcObject = stream;
            } catch (err) { console.error("Camera error:", err); }
        }

        function takePhoto() {
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('capture-canvas');
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImage = canvas.toDataURL('image/png');
            document.getElementById('details-preview-img').src = capturedImage;
            
            stats = { attack: 1, stamina: 1, defense: 1 };
            editingPartIndex = null;
            document.getElementById('part-name-input').value = '';
            
            showView('details-view');
        }

        function editPart(index) {
            const part = collection[index];
            editingPartIndex = index;
            selectedPartType = part.type;
            stats = { ...part.stats };
            capturedImage = part.image;
            document.getElementById('details-preview-img').src = capturedImage;
            document.getElementById('details-part-tag').textContent = part.type;
            document.getElementById('part-name-input').value = part.name;
            showView('details-view');
        }

        function deletePart(index) {
            if (confirm("Permanently delete this part from the vault?")) {
                collection.splice(index, 1);
                saveToStorage();
                renderCollection();
                updateHomeUI();
            }
        }

        function editCombo(index) {
            const combo = combos[index];
            editingComboIndex = index;
            currentBuild = { ...combo.parts };
            document.getElementById('combo-name-input').value = combo.name;
            document.getElementById('save-combo-label').textContent = "Update Build";
            showView('builder-view');
        }

        function resetBuild() {
            currentBuild = { Top: null, Middle: null, Tip: null };
            editingComboIndex = null;
            document.getElementById('combo-name-input').value = '';
            document.getElementById('save-combo-label').textContent = "Save Build";
            updateBuildUI();
        }

        function deleteCombo(index) {
            if (confirm("Delete this build?")) {
                combos.splice(index, 1);
                saveToStorage();
                renderCollection();
            }
        }

        function getPointsSpent() {
            return stats.attack + stats.stamina + stats.defense;
        }

        function handleStatClick(type, value) {
            const currentTotal = getPointsSpent();
            const newValue = Math.max(1, value);
            const difference = newValue - stats[type];
            
            if (currentTotal + difference <= MAX_POINTS) {
                stats[type] = newValue;
                renderDetailsStats();
            }
        }

        function renderDetailsStats() {
            const container = document.getElementById('stat-controls');
            const spent = getPointsSpent();
            document.getElementById('points-remaining').textContent = `${spent} / ${MAX_POINTS}`;
            
            container.innerHTML = '';
            ['attack', 'stamina', 'defense'].forEach(type => {
                let blocks = '';
                for(let i=1; i<=5; i++) {
                    const isActive = stats[type] >= i;
                    const activeClass = isActive ? 'active-'+type : '';
                    const canIncrease = (spent + 1 <= MAX_POINTS);
                    const isInactive = !isActive && !canIncrease;
                    
                    blocks += `<div class="stat-block flex-1 ${activeClass} ${isInactive ? 'inactive' : ''}" 
                                    onclick="handleStatClick('${type}', ${i})"></div>`;
                }
                container.innerHTML += `
                    <div class="space-y-2">
                        <div class="flex justify-between uppercase text-[8px] font-black text-slate-500"><span>${type}</span><span>${stats[type]}/5</span></div>
                        <div class="flex gap-2">${blocks}</div>
                    </div>`;
            });
        }

        function savePart() {
            const inputVal = document.getElementById('part-name-input').value.trim();
            let name = inputVal;
            
            if (!name) {
                const count = collection.filter(p => p.type === selectedPartType).length + 1;
                name = `${selectedPartType} — ${count}`;
            }

            const partData = { 
                name, 
                type: selectedPartType, 
                image: capturedImage, 
                stats: {...stats} 
            };

            if (editingPartIndex !== null) {
                collection[editingPartIndex] = partData;
            } else {
                collection.push(partData);
            }
            
            saveToStorage();
            showView('home-view');
        }

        function updateBuildUI() {
            ['Top', 'Middle', 'Tip'].forEach(type => {
                const slot = document.getElementById(`slot-${type}`);
                if (currentBuild[type]) {
                    slot.innerHTML = `<img src="${currentBuild[type].image}" class="w-full h-full object-cover">`;
                    slot.classList.remove('border-dashed');
                } else {
                    const icons = { 'Top': 'circle-dot', 'Middle': 'aperture', 'Tip': 'triangle' };
                    slot.innerHTML = `<i data-lucide="${icons[type]}" class="w-8 h-8 text-slate-700 ${type === 'Tip' ? 'rotate-180' : ''}"></i>`;
                    slot.classList.add('border-dashed');
                }
            });

            const keys = ['attack', 'stamina', 'defense'];
            keys.forEach(key => {
                const partsInBuild = Object.values(currentBuild).filter(p => p !== null);
                let avg = 1.0;
                if (partsInBuild.length > 0) {
                    const sum = partsInBuild.reduce((acc, p) => acc + p.stats[key], 0);
                    avg = Math.max(1, sum / partsInBuild.length).toFixed(1);
                }
                document.getElementById(`combo-${key}`).textContent = avg;
            });
            lucide.createIcons();
        }

        function openPartPicker(type) {
            const modal = document.getElementById('part-picker-modal');
            const list = document.getElementById('picker-list');
            list.innerHTML = '';
            
            const parts = collection.filter(p => p.type === type);
            if (parts.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs font-bold uppercase">No ${type} parts in Vault</div>`;
            }

            parts.forEach((p) => {
                const item = document.createElement('div');
                item.className = 'glass-card p-3 rounded-xl flex items-center justify-between cursor-pointer hover:bg-white/5';
                item.innerHTML = `
                    <div class="flex items-center gap-3 flex-1" onclick="selectPartForBuild('${type}', '${p.name}')">
                        <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover">
                        <div>
                            <div class="text-[10px] font-bold text-white">${p.name}</div>
                            <div class="flex gap-2 text-[7px] text-slate-400 mt-1 uppercase">
                                <span>A: ${p.stats.attack}</span>
                                <span>S: ${p.stats.stamina}</span>
                                <span>D: ${p.stats.defense}</span>
                            </div>
                        </div>
                    </div>`;
                list.appendChild(item);
            });
            
            modal.classList.remove('hidden');
        }

        function selectPartForBuild(type, name) {
            const part = collection.find(p => p.name === name);
            currentBuild[type] = part;
            closePartPicker();
            updateBuildUI();
        }

        function closePartPicker() {
            document.getElementById('part-picker-modal').classList.add('hidden');
        }

        function saveCombo() {
            if (!currentBuild.Top || !currentBuild.Middle || !currentBuild.Tip) {
                return;
            }
            
            const nameInput = document.getElementById('combo-name-input').value.trim();
            let name = nameInput;
            
            if (!name) {
                // Formatting build counter to 0001 format
                const paddedCount = buildCounter.toString().padStart(4, '0');
                name = `BUILD-${paddedCount}`;
                
                // Only increment the counter if we used it for a new build
                if (editingComboIndex === null) {
                    buildCounter++;
                }
            }
            
            const sumAttack = currentBuild.Top.stats.attack + currentBuild.Middle.stats.attack + currentBuild.Tip.stats.attack;
            const sumStamina = currentBuild.Top.stats.stamina + currentBuild.Middle.stats.stamina + currentBuild.Tip.stats.stamina;
            const sumDefense = currentBuild.Top.stats.defense + currentBuild.Middle.stats.defense + currentBuild.Tip.stats.defense;

            const comboStats = {
                attack: (sumAttack / 3).toFixed(1),
                stamina: (sumStamina / 3).toFixed(1),
                defense: (sumDefense / 3).toFixed(1)
            };

            const comboData = { name, parts: {...currentBuild}, stats: comboStats };

            if (editingComboIndex !== null) {
                combos[editingComboIndex] = comboData;
            } else {
                combos.push(comboData);
            }
            
            saveToStorage();
            resetBuild();
            showView('home-view');
        }

        function updateHomeUI() {
            document.getElementById('count-top').textContent = collection.filter(p => p.type === 'Top').length;
            document.getElementById('count-middle').textContent = collection.filter(p => p.type === 'Middle').length;
            document.getElementById('count-tip').textContent = collection.filter(p => p.type === 'Tip').length;
        }

        function setCollectionTab(tab) {
            currentCollectionTab = tab;
            document.getElementById('tab-parts').classList.toggle('active', tab === 'Parts');
            document.getElementById('tab-parts').classList.toggle('text-slate-500', tab !== 'Parts');
            document.getElementById('tab-combos').classList.toggle('active', tab === 'Combos');
            document.getElementById('tab-combos').classList.toggle('text-slate-500', tab !== 'Combos');
            document.getElementById('part-filters').style.display = tab === 'Parts' ? 'flex' : 'none';
            renderCollection();
        }

        function setTypeFilter(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${type.toLowerCase()}`).classList.add('active');
            renderCollection();
        }

        function handleFilterChange() { renderCollection(); }

        function resetFilters() {
            document.getElementById('vault-search').value = '';
            currentTypeFilter = 'all';
            document.querySelectorAll('.type-filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('filter-all').classList.add('active');
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            const searchTerm = document.getElementById('vault-search').value.toLowerCase();
            grid.innerHTML = '';
            
            if (currentCollectionTab === 'Parts') {
                collection.forEach((p, index) => {
                    const matchesSearch = p.name.toLowerCase().includes(searchTerm);
                    const matchesType = currentTypeFilter === 'all' || p.type === currentTypeFilter;
                    
                    if (matchesSearch && matchesType) {
                        grid.innerHTML += `
                            <div class="glass-card rounded-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
                                <button onclick="event.stopPropagation(); deletePart(${index})" class="delete-btn">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                                <button onclick="event.stopPropagation(); editPart(${index})" class="edit-btn">
                                    <i data-lucide="edit-3" class="w-3 h-3"></i>
                                </button>
                                <img src="${p.image}" class="h-24 w-full object-cover">
                                <div class="p-3">
                                    <div class="text-[10px] font-bold truncate text-white mb-1">${p.name}</div>
                                    <div class="text-[8px] font-bold text-blue-500 uppercase">${p.type}</div>
                                </div>
                            </div>`;
                    }
                });
            } else {
                combos.forEach((c, index) => {
                    if (c.name.toLowerCase().includes(searchTerm)) {
                        grid.innerHTML += `
                            <div class="glass-card rounded-2xl p-2 flex flex-col gap-2 animate-in fade-in zoom-in duration-300">
                                <button onclick="event.stopPropagation(); deleteCombo(${index})" class="delete-btn">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                                <button onclick="event.stopPropagation(); editCombo(${index})" class="edit-btn">
                                    <i data-lucide="edit-3" class="w-3 h-3"></i>
                                </button>
                                
                                <div class="combo-triangle">
                                    <div style="grid-area: top" class="rounded-lg overflow-hidden border border-white/10 bg-slate-900">
                                        <img src="${c.parts.Top.image}" class="w-full h-full object-cover">
                                    </div>
                                    <div style="grid-area: mid" class="rounded-lg overflow-hidden border border-white/10 bg-slate-900">
                                        <img src="${c.parts.Middle.image}" class="w-full h-full object-cover">
                                    </div>
                                    <div style="grid-area: tip" class="rounded-lg overflow-hidden border border-white/10 bg-slate-900">
                                        <img src="${c.parts.Tip.image}" class="w-full h-full object-cover">
                                    </div>
                                </div>
                                
                                <div class="px-1">
                                    <div class="text-[10px] font-bold text-white truncate mb-2">${c.name}</div>
                                    <div class="grid grid-cols-3 gap-1">
                                        <div class="text-center"><div class="text-[9px] font-header text-blue-500">${c.stats.attack}</div><div class="text-[6px] uppercase text-slate-500">ATK</div></div>
                                        <div class="text-center"><div class="text-[9px] font-header text-yellow-500">${c.stats.stamina}</div><div class="text-[6px] uppercase text-slate-500">STA</div></div>
                                        <div class="text-center"><div class="text-[9px] font-header text-green-500">${c.stats.defense}</div><div class="text-[6px] uppercase text-slate-500">DEF</div></div>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
            }

            if (grid.innerHTML === '') {
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 text-[10px] font-bold uppercase tracking-widest">Vault is Empty</div>`;
            }

            lucide.createIcons();
        }

        function setScanPart(type) {
            selectedPartType = type;
            document.getElementById('details-part-tag').textContent = type;
            document.querySelectorAll('.scan-part-btn').forEach(b => b.classList.remove('border-blue-500'));
            document.getElementById(`btn-${type.toLowerCase()}`).classList.add('border-blue-500');
        }

        window.onload = () => {
            loadFromStorage();
            updateHomeUI();
            lucide.createIcons();
        };
    </script>
</body>
</html>
