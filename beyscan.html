<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeyScan - Pro Blader Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&family=Exo+2:ital,wght@1,900&display=swap');
        
        :root {
            --primary: #3b82f6;
            --secondary: #eab308;
            --accent: #22c55e;
            --bg-dark: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1), transparent),
                radial-gradient(circle at 0% 100%, rgba(234, 179, 8, 0.05), transparent);
            min-height: 100vh;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN STYLES --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1), opacity 0.5s ease;
        }

        #splash-screen.hidden-splash {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .beyblade-container {
            position: relative;
            text-align: center;
            perspective: 1000px;
        }

        .beyblade-title {
            font-family: 'Exo 2', sans-serif;
            font-size: clamp(4rem, 15vw, 8rem);
            text-transform: uppercase;
            font-weight: 900;
            font-style: italic;
            position: relative;
            display: inline-block;
            letter-spacing: -4px;
            line-height: 1;
            background: linear-gradient(to bottom, #fff 0%, #a0a0a0 45%, #404040 50%, #808080 55%, #fff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            -webkit-text-stroke: 2px #000;
        }

        .beyblade-title::before {
            content: 'BEYSCAN';
            position: absolute; left: 0; top: 0; z-index: -1;
            -webkit-text-stroke: 12px #0033aa; color: #0033aa;
        }

        .beyblade-title::after {
            content: 'BEYSCAN';
            position: absolute; left: 0; top: 0; z-index: -2;
            -webkit-text-stroke: 22px #ffcc00; color: #ffcc00;
            clip-path: polygon(0% 0%, 100% 0%, 95% 50%, 100% 100%, 0% 100%, 5% 50%);
        }

        .btn-start {
            margin-top: 4rem;
            padding: 1.25rem 4rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(59, 130, 246, 0.6); background: #3b82f6; }

        /* --- APP STYLES --- */
        .font-header { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-main-scan { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        .nav-pill.active { background: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); color: white !important; }
        
        /* Filter Pill Styles */
        .filter-pill { 
            padding: 0.25rem 0.75rem; 
            border-radius: 9999px; 
            font-size: 9px; 
            font-weight: 800; 
            text-transform: uppercase; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            transition: all 0.2s ease;
        }
        .filter-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .stat-block { width: 40px; height: 6px; border-radius: 2px; background: rgba(255,255,255,0.05); cursor: pointer; }
        .stat-block.active-attack { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .stat-block.active-stamina { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .stat-block.active-defense { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center p-0 select-none">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="beyblade-container">
            <h1 class="beyblade-title">BEYSCAN</h1>
            <div class="text-[#ffcc00] font-header tracking-[0.5em] text-[10px] mt-4 italic opacity-80">OPTICAL ANALYSIS SYSTEM</div>
        </div>
        <button class="btn-start text-white" onclick="dismissSplash()">Initialize</button>
    </div>

    <!-- Main App Content -->
    <div class="w-full max-w-md min-h-screen flex flex-col">
        
        <!-- HOME VIEW -->
        <section id="home-view" class="view flex flex-col p-6 animate-in fade-in duration-500">
            <div class="flex justify-between items-center mb-8">
                <h1 class="font-header text-2xl font-black tracking-tighter text-white">BEY<span class="text-blue-500">SCAN</span></h1>
                <div class="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center bg-slate-900"><i data-lucide="user" class="w-5 h-5 text-slate-400"></i></div>
            </div>

            <div class="glass-card rounded-[2rem] p-6 mb-8 border-blue-500/10">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Hangar Inventory</p>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-blue-500 uppercase mb-1">Tops</div>
                        <div class="text-3xl font-header font-black" id="count-top">0</div>
                    </div>
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-yellow-500 uppercase mb-1">Mids</div>
                        <div class="text-3xl font-header font-black" id="count-middle">0</div>
                    </div>
                    <div class="bg-slate-950/50 p-4 rounded-2xl border border-white/5 flex flex-col items-center">
                        <div class="text-[8px] font-black text-green-500 uppercase mb-1">Tips</div>
                        <div class="text-3xl font-header font-black" id="count-tip">0</div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="showView('scanner-view'); startCamera();" class="btn-main-scan col-span-2 py-8 rounded-[2.5rem] flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20"><i data-lucide="scan" class="w-6 h-6 text-white"></i></div>
                    <span class="font-header font-bold text-xs tracking-widest text-white">INITIATE SCAN</span>
                </button>
                <button onclick="showView('builder-view')" class="glass-card py-6 rounded-3xl flex flex-col items-center gap-2">
                    <i data-lucide="wrench" class="w-6 h-6 text-blue-400"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Lab</span>
                </button>
                <button onclick="showView('collection-view')" class="glass-card py-6 rounded-3xl flex flex-col items-center gap-2">
                    <i data-lucide="database" class="w-6 h-6 text-yellow-400"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-300">Vault</span>
                </button>
            </div>
        </section>

        <!-- SCANNER VIEW -->
        <section id="scanner-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Optical Capture</h3>
            </div>
            
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="setScanPart('Top')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1 border-blue-500" id="btn-top">
                    <i data-lucide="circle-dot" class="w-5 h-5 text-blue-400"></i>
                    <span class="text-[9px] font-bold uppercase">Top</span>
                </button>
                <button onclick="setScanPart('Middle')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1" id="btn-middle">
                    <i data-lucide="aperture" class="w-5 h-5 text-slate-500"></i>
                    <span class="text-[9px] font-bold uppercase">Mid</span>
                </button>
                <button onclick="setScanPart('Tip')" class="scan-part-btn glass-card rounded-2xl p-3 flex flex-col items-center gap-1" id="btn-tip">
                    <i data-lucide="triangle" class="w-5 h-5 rotate-180 text-slate-500"></i>
                    <span class="text-[9px] font-bold uppercase">Tip</span>
                </button>
            </div>

            <div class="relative aspect-square bg-black rounded-[2rem] overflow-hidden mb-8 border border-white/5">
                <video id="video-preview" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                <canvas id="capture-canvas" class="hidden"></canvas>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div id="camera-guide" class="border-2 border-dashed border-white/40 shadow-[0_0_0_999px_rgba(0,0,0,0.7)]"></div>
                </div>
            </div>

            <div class="flex justify-center">
                <button onclick="takePhoto()" class="w-20 h-20 rounded-full border-4 border-white/10 p-1 bg-blue-600">
                    <div class="w-full h-full rounded-full border-2 border-white/20 flex items-center justify-center">
                        <i data-lucide="camera" class="w-8 h-8 text-white"></i>
                    </div>
                </button>
            </div>
        </section>

        <!-- DETAILS VIEW -->
        <section id="details-view" class="view hidden flex-col p-6">
            <h3 class="font-header text-xs font-bold uppercase tracking-widest mb-6 text-blue-400">Analysis Results</h3>
            <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden mb-6 border border-white/10">
                <img id="details-preview-img" src="" class="w-full h-full object-cover opacity-50">
                <div class="absolute bottom-4 left-4">
                    <span id="details-part-tag" class="bg-blue-600 text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-wider">Top</span>
                </div>
            </div>
            <div class="space-y-6 mb-10" id="stat-controls"></div>
            <div class="mt-auto">
                <input id="part-name-input" type="text" placeholder="Enter part name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-sm mb-4 outline-none text-white">
                <button onclick="savePart()" class="btn-main-scan w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-sm text-white">Save to Vault</button>
            </div>
        </section>

        <!-- BUILDER VIEW -->
        <section id="builder-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-6">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Lab Assembly</h3>
            </div>
            <div class="glass-card rounded-[2rem] p-8 mb-6 flex flex-col items-center">
                <div class="flex items-center justify-center gap-2 mb-10 w-full">
                    <div id="slot-Top" onclick="openPartPicker('Top')" class="w-20 h-20 rounded-full border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer bg-slate-950/50 overflow-hidden"><i data-lucide="circle-dot" class="w-8 h-8 text-slate-700"></i></div>
                    <div class="w-4 h-[1px] bg-slate-800"></div>
                    <div id="slot-Middle" onclick="openPartPicker('Middle')" class="w-14 h-14 rounded-full border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer bg-slate-950/50 overflow-hidden"><i data-lucide="aperture" class="w-6 h-6 text-slate-700"></i></div>
                    <div class="w-4 h-[1px] bg-slate-800"></div>
                    <div id="slot-Tip" onclick="openPartPicker('Tip')" class="w-12 h-12 rounded-xl border-2 border-dashed border-white/10 flex items-center justify-center cursor-pointer bg-slate-950/50 overflow-hidden"><i data-lucide="triangle" class="w-4 h-4 text-slate-700 rotate-180"></i></div>
                </div>
                <div class="w-full grid grid-cols-3 gap-4 text-center">
                    <div><div id="combo-attack" class="text-xl font-header font-black text-blue-500">0.0</div><div class="text-[7px] text-slate-500 font-bold uppercase tracking-widest">Attack</div></div>
                    <div><div id="combo-stamina" class="text-xl font-header font-black text-yellow-500">0.0</div><div class="text-[7px] text-slate-500 font-bold uppercase tracking-widest">Stamina</div></div>
                    <div><div id="combo-defense" class="text-xl font-header font-black text-green-500">0.0</div><div class="text-[7px] text-slate-500 font-bold uppercase tracking-widest">Defense</div></div>
                </div>
            </div>
            <button onclick="saveCombo()" class="btn-main-scan w-full py-5 rounded-2xl font-bold uppercase tracking-widest text-sm text-white">Save Combo</button>
        </section>

        <!-- COLLECTION VIEW -->
        <section id="collection-view" class="view hidden flex-col p-6">
            <div class="flex items-center gap-4 mb-4">
                <button onclick="showView('home-view')" class="p-2 bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                <h3 class="font-header text-xs font-bold uppercase tracking-widest">Vault</h3>
            </div>

            <!-- Search & Filters -->
            <div class="space-y-4 mb-6">
                <!-- Tabs -->
                <div class="flex bg-slate-950/80 p-1 rounded-2xl border border-white/5">
                    <button onclick="setCollectionTab('Parts')" id="tab-parts" class="nav-pill active flex-1 py-2 text-[9px] font-black uppercase rounded-xl">Parts</button>
                    <button onclick="setCollectionTab('Combos')" id="tab-combos" class="nav-pill flex-1 py-2 text-[9px] font-black uppercase rounded-xl text-slate-500">Combos</button>
                </div>

                <!-- Search Input -->
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                    <input id="vault-search" type="text" placeholder="Search by name..." oninput="handleFilterChange()" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-white focus:border-blue-500 outline-none transition-all">
                </div>

                <!-- Type Filters (Only for Parts) -->
                <div id="part-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="setTypeFilter('all')" class="type-filter-btn filter-pill active" id="filter-all">All</button>
                    <button onclick="setTypeFilter('Top')" class="type-filter-btn filter-pill" id="filter-top">Tops</button>
                    <button onclick="setTypeFilter('Middle')" class="type-filter-btn filter-pill" id="filter-middle">Mids</button>
                    <button onclick="setTypeFilter('Tip')" class="type-filter-btn filter-pill" id="filter-tip">Tips</button>
                </div>
            </div>

            <div id="collection-grid" class="grid grid-cols-2 gap-4 pb-20 overflow-y-auto no-scrollbar"></div>
        </section>

    </div>

    <!-- Part Picker Modal -->
    <div id="part-picker-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-6">
        <div class="w-full glass-card rounded-[2.5rem] p-6 max-h-[70vh] flex flex-col">
            <div class="flex justify-between mb-6"><h3 class="font-header text-xs font-bold uppercase">Select Part</h3><button onclick="closePartPicker()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div id="picker-list" class="space-y-3 overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let stream = null;
        let capturedImage = null;
        let selectedPartType = 'Top';
        let collection = []; 
        let combos = [];     
        let stats = { attack: 1, stamina: 1, defense: 1 };
        let currentBuild = { Top: null, Middle: null, Tip: null };
        let currentCollectionTab = 'Parts';
        let currentTypeFilter = 'all';

        function dismissSplash() {
            document.getElementById('splash-screen').classList.add('hidden-splash');
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(viewId);
            target.classList.remove('hidden');
            target.classList.add('flex');
            
            if (viewId !== 'scanner-view' && stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            if (viewId === 'home-view') updateHomeUI();
            if (viewId === 'details-view') renderDetailsStats();
            if (viewId === 'collection-view') {
                resetFilters();
                renderCollection();
            }
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('video-preview').srcObject = stream;
            } catch (err) { console.error(err); }
        }

        function takePhoto() {
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('capture-canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImage = canvas.toDataURL('image/png');
            document.getElementById('details-preview-img').src = capturedImage;
            showView('details-view');
        }

        function renderDetailsStats() {
            const container = document.getElementById('stat-controls');
            container.innerHTML = '';
            ['attack', 'stamina', 'defense'].forEach(type => {
                let blocks = '';
                for(let i=1; i<=5; i++) {
                    const active = stats[type] >= i ? 'active-'+type : '';
                    blocks += `<div class="stat-block flex-1 ${active}" onclick="stats['${type}']=${i}; renderDetailsStats()"></div>`;
                }
                container.innerHTML += `
                    <div class="space-y-2">
                        <div class="flex justify-between uppercase text-[8px] font-black text-slate-500"><span>${type}</span><span>${stats[type]}/5</span></div>
                        <div class="flex gap-2">${blocks}</div>
                    </div>`;
            });
        }

        function savePart() {
            const name = document.getElementById('part-name-input').value || `PART-${Date.now()}`;
            collection.push({ name, type: selectedPartType, image: capturedImage, stats: {...stats} });
            stats = { attack: 1, stamina: 1, defense: 1 };
            document.getElementById('part-name-input').value = '';
            showView('home-view');
        }

        function saveCombo() {
            if (!currentBuild.Top || !currentBuild.Middle || !currentBuild.Tip) return;
            const name = `COMBO-${Date.now()}`;
            const totalStats = {
                attack: ((currentBuild.Top.stats.attack + currentBuild.Middle.stats.attack + currentBuild.Tip.stats.attack)/3).toFixed(1),
                stamina: ((currentBuild.Top.stats.stamina + currentBuild.Middle.stats.stamina + currentBuild.Tip.stats.stamina)/3).toFixed(1),
                defense: ((currentBuild.Top.stats.defense + currentBuild.Middle.stats.defense + currentBuild.Tip.stats.defense)/3).toFixed(1)
            };
            combos.push({ name, parts: {...currentBuild}, stats: totalStats });
            currentBuild = { Top: null, Middle: null, Tip: null };
            updateBuildUI();
            showView('home-view');
        }

        function updateHomeUI() {
            document.getElementById('count-top').textContent = collection.filter(p => p.type === 'Top').length;
            document.getElementById('count-middle').textContent = collection.filter(p => p.type === 'Middle').length;
            document.getElementById('count-tip').textContent = collection.filter(p => p.type === 'Tip').length;
        }

        function setCollectionTab(tab) {
            currentCollectionTab = tab;
            document.getElementById('tab-parts').classList.toggle('active', tab === 'Parts');
            document.getElementById('tab-parts').classList.toggle('text-slate-500', tab !== 'Parts');
            document.getElementById('tab-combos').classList.toggle('active', tab === 'Combos');
            document.getElementById('tab-combos').classList.toggle('text-slate-500', tab !== 'Combos');
            
            // Toggle visibility of part-specific filters
            document.getElementById('part-filters').style.display = tab === 'Parts' ? 'flex' : 'none';
            
            renderCollection();
        }

        function setTypeFilter(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${type.toLowerCase()}`).classList.add('active');
            renderCollection();
        }

        function handleFilterChange() {
            renderCollection();
        }

        function resetFilters() {
            document.getElementById('vault-search').value = '';
            currentTypeFilter = 'all';
            document.querySelectorAll('.type-filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('filter-all').classList.add('active');
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            const searchTerm = document.getElementById('vault-search').value.toLowerCase();
            grid.innerHTML = '';
            
            if (currentCollectionTab === 'Parts') {
                const filteredParts = collection.filter(p => {
                    const matchesSearch = p.name.toLowerCase().includes(searchTerm);
                    const matchesType = currentTypeFilter === 'all' || p.type === currentTypeFilter;
                    return matchesSearch && matchesType;
                });

                if (filteredParts.length === 0) {
                    grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 text-[10px] font-bold uppercase tracking-widest">No matching parts found</div>`;
                }

                filteredParts.forEach(p => {
                    grid.innerHTML += `
                        <div class="glass-card rounded-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
                            <img src="${p.image}" class="h-24 w-full object-cover">
                            <div class="p-3">
                                <div class="text-[10px] font-bold truncate text-white mb-1">${p.name}</div>
                                <div class="text-[8px] font-bold text-blue-500 uppercase">${p.type}</div>
                            </div>
                        </div>`;
                });
            } else {
                const filteredCombos = combos.filter(c => c.name.toLowerCase().includes(searchTerm));

                if (filteredCombos.length === 0) {
                    grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 text-[10px] font-bold uppercase tracking-widest">No matching combos found</div>`;
                }

                filteredCombos.forEach(c => {
                    grid.innerHTML += `
                        <div class="glass-card rounded-2xl p-3 flex flex-col gap-2 animate-in fade-in zoom-in duration-300">
                            <div class="text-[10px] font-bold text-white truncate">${c.name}</div>
                            <div class="grid grid-cols-3 gap-1">
                                <div class="text-center"><div class="text-[10px] font-header text-blue-500">${c.stats.attack}</div><div class="text-[6px] uppercase text-slate-500">ATK</div></div>
                                <div class="text-center"><div class="text-[10px] font-header text-yellow-500">${c.stats.stamina}</div><div class="text-[6px] uppercase text-slate-500">STA</div></div>
                                <div class="text-center"><div class="text-[10px] font-header text-green-500">${c.stats.defense}</div><div class="text-[6px] uppercase text-slate-500">DEF</div></div>
                            </div>
                        </div>`;
                });
            }
        }

        function setScanPart(type) {
            selectedPartType = type;
            document.getElementById('details-part-tag').textContent = type;
            document.querySelectorAll('.scan-part-btn').forEach(b => b.classList.remove('border-blue-500'));
            document.getElementById(`btn-${type.toLowerCase()}`).classList.add('border-blue-500');
        }

        function openPartPicker(type) {
            const modal = document.getElementById('part-picker-modal');
            const list = document.getElementById('picker-list');
            list.innerHTML = '';
            const filtered = collection.filter(p => p.type === type);
            
            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs font-bold uppercase tracking-widest">No ${type} Parts Scanned</div>`;
            } else {
                filtered.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'glass-card p-3 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-white/5';
                    item.innerHTML = `<img src="${p.image}" class="w-10 h-10 rounded-full object-cover"> <div class="text-[10px] font-bold text-white">${p.name}</div>`;
                    item.onclick = () => { currentBuild[type] = p; updateBuildUI(); modal.classList.add('hidden'); };
                    list.appendChild(item);
                });
            }
            modal.classList.remove('hidden');
        }

        function updateBuildUI() {
            Object.entries(currentBuild).forEach(([type, p]) => {
                const slot = document.getElementById(`slot-${type}`);
                if(p) {
                    slot.innerHTML = `<img src="${p.image}" class="w-full h-full object-cover">`;
                    slot.classList.remove('border-dashed');
                } else {
                    const icon = type === 'Top' ? 'circle-dot' : type === 'Middle' ? 'aperture' : 'triangle';
                    const rot = type === 'Tip' ? 'rotate-180' : '';
                    slot.innerHTML = `<i data-lucide="${icon}" class="w-8 h-8 text-slate-700 ${rot}"></i>`;
                    slot.classList.add('border-dashed');
                }
            });
            
            let active = Object.values(currentBuild).filter(v => v);
            if(active.length === 3) {
                document.getElementById('combo-attack').textContent = ((parseFloat(currentBuild.Top.stats.attack) + parseFloat(currentBuild.Middle.stats.attack) + parseFloat(currentBuild.Tip.stats.attack))/3).toFixed(1);
                document.getElementById('combo-stamina').textContent = ((parseFloat(currentBuild.Top.stats.stamina) + parseFloat(currentBuild.Middle.stats.stamina) + parseFloat(currentBuild.Tip.stats.stamina))/3).toFixed(1);
                document.getElementById('combo-defense').textContent = ((parseFloat(currentBuild.Top.stats.defense) + parseFloat(currentBuild.Middle.stats.defense) + parseFloat(currentBuild.Tip.stats.defense)/3)).toFixed(1);
            } else {
                document.getElementById('combo-attack').textContent = '0.0';
                document.getElementById('combo-stamina').textContent = '0.0';
                document.getElementById('combo-defense').textContent = '0.0';
            }
            lucide.createIcons();
        }

        function closePartPicker() { document.getElementById('part-picker-modal').classList.add('hidden'); }
    </script>
</body>
</html>
