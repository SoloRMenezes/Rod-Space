<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPOSTOR | CLASSIFIED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        :root {
            --danger: #ef4444;
            --surface: #0a0a0c;
            --border: #1f1f23;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--surface); 
            color: #d1d5db;
            touch-action: manipulation;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 100%, 100% 2px, 3px 100%;
        }

        .terminal-box {
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .terminal-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--danger);
            opacity: 0.3;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        .btn-danger {
            background: #450a0a;
            border: 1px solid #991b1b;
            color: #fecaca;
            transition: all 0.2s;
        }

        .btn-danger:active {
            background: #991b1b;
            transform: scale(0.98);
        }

        .btn-primary {
            background: #111827;
            border: 1px solid #374151;
            color: #9ca3af;
        }

        .btn-primary:active {
            background: #1f2937;
        }

        .glitch-text {
            text-shadow: 2px 0 #ff0000, -2px 0 #00ff00;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 1px 0 #ff0000, -1px 0 #00ff00; }
            5% { text-shadow: 3px 0 #ff0000, -3px 0 #00ff00; }
            10% { text-shadow: 1px 0 #ff0000, -1px 0 #00ff00; }
            100% { text-shadow: 1px 0 #ff0000, -1px 0 #00ff00; }
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #374151;
        }

        .status-dot.active {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        select:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="scanline"></div>

    <div id="app" class="w-full max-w-md">
        <!-- Main Menu -->
        <div id="setup-screen" class="space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-5xl font-black tracking-tighter text-red-600 glitch-text uppercase">
                    Impostor
                </h1>
                <p class="text-[10px] text-red-900 font-bold tracking-[0.4em] uppercase">Unauthorized Access Detected</p>
            </div>

            <div class="terminal-box p-6 rounded-lg space-y-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-600">Personnel Roster</label>
                    <div class="flex gap-2">
                        <input type="text" id="name-input" placeholder="IDENTIFY..." class="flex-1 bg-black border border-zinc-800 rounded p-3 text-sm outline-none focus:border-red-900 transition-all placeholder:text-zinc-800">
                        <button onclick="addPlayer()" class="btn-danger px-6 rounded font-bold text-xs">ADD</button>
                    </div>
                    <div id="player-chips" class="flex flex-wrap gap-2 pt-2 min-h-[40px]">
                        <p id="no-players-msg" class="text-zinc-800 text-[10px] uppercase font-bold">Awaiting Input...</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-600">Threat Level</label>
                        <select id="impostor-count" class="w-full bg-black border border-zinc-800 rounded p-3 text-xs outline-none text-zinc-400">
                            <option value="1">1 IMPOSTOR</option>
                            <option value="2" id="opt-2-imp">2 IMPOSTORS</option>
                            <option value="3" id="opt-3-imp">3 IMPOSTORS</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-600">Data Set</label>
                        <select id="theme-select" class="w-full bg-black border border-zinc-800 rounded p-3 text-xs outline-none text-zinc-400">
                            <option value="food">FOOD & DRINK</option>
                            <option value="places">FAMOUS PLACES</option>
                            <option value="objects">EVERYDAY OBJECTS</option>
                            <option value="animals">ANIMALS</option>
                            <option value="professions">PROFESSIONS</option>
                            <option value="entertainment">ENTERTAINMENT</option>
                            <option value="transport">TRANSPORT</option>
                            <option value="clothing">CLOTHING</option>
                            <option value="tech">TECH & GADGETS</option>
                            <option value="sports">SPORTS</option>
                            <option value="tools">OBJECTS & TOOLS</option>
                            <option value="mythical">MYTHICAL</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center space-x-3 p-2 bg-red-950/10 border border-red-950/20 rounded">
                    <input type="checkbox" id="impostor-hint" class="w-4 h-4 accent-red-600 bg-black border-zinc-800 rounded">
                    <label for="impostor-hint" class="text-[10px] font-bold text-zinc-500 uppercase cursor-pointer">Leak category to impostor?</label>
                </div>

                <button onclick="startGame()" class="w-full btn-danger font-black py-4 rounded shadow-2xl tracking-[0.3em] text-xs uppercase">
                    Initialize Protocol
                </button>
            </div>
        </div>

        <!-- Role Select Menu -->
        <div id="role-select-screen" class="hidden space-y-6 text-center">
            <div class="terminal-box p-8 rounded-lg">
                <h2 class="text-xl font-bold mb-1 uppercase tracking-tighter text-red-600">Biometric Verification</h2>
                <p class="text-zinc-600 mb-8 text-[10px] font-bold uppercase tracking-widest">Verify identity privately</p>
                
                <div class="grid grid-cols-2 gap-3 mb-4" id="role-grid-display"></div>
            </div>

            <button id="begin-gameplay-btn" disabled onclick="showGameplayScreen()" class="w-full bg-zinc-200 text-black disabled:opacity-20 font-black py-4 rounded tracking-[0.3em] text-xs uppercase">
                Initiate Sequence
            </button>
        </div>

        <!-- Role Modal -->
        <div id="role-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 modal-overlay">
            <div id="confirm-view-content" class="terminal-box w-full max-w-xs rounded-lg p-10 text-center">
                <p class="text-zinc-400 font-bold mb-8 text-sm uppercase tracking-widest" id="confirm-text"></p>
                <div class="space-y-3">
                    <button onclick="revealRoleNow()" class="w-full py-4 btn-danger rounded font-black text-[10px] uppercase tracking-widest">Confirm Identity</button>
                    <button onclick="closeRoleOverlay()" class="w-full py-4 btn-primary rounded font-bold text-[10px] uppercase tracking-widest">Cancel</button>
                </div>
            </div>

            <div id="actual-role-content" class="hidden bg-zinc-900 border-2 border-red-600 w-full max-w-xs rounded-lg p-10 text-center shadow-[0_0_50px_rgba(239,68,68,0.2)]">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] text-red-500 mb-6">Classified Information</p>
                <div id="role-text-body"></div>
                <button onclick="closeRoleOverlay()" class="mt-10 w-full py-3 bg-red-600 text-white rounded font-bold text-[10px] uppercase tracking-widest">Clear Screen</button>
            </div>
        </div>

        <!-- Gameplay Screen -->
        <div id="gameplay-screen" class="hidden space-y-6 text-center">
            <div class="terminal-box p-8 rounded-lg">
                <h2 class="text-xl font-bold mb-2 uppercase tracking-tighter text-red-600">Active Investigation</h2>
                <div id="turn-order-banner" class="mb-6 p-4 bg-red-600/5 border border-red-600/20 text-red-500"></div>
                <div class="grid grid-cols-2 gap-2 text-[10px] font-bold" id="gameplay-player-list"></div>
            </div>
            <button onclick="triggerCountdown()" class="w-full btn-danger font-black py-4 rounded tracking-[0.3em] text-xs uppercase">Submit Findings</button>
        </div>

        <!-- Final Reveal Screen -->
        <div id="final-screen" class="hidden flex flex-col items-center justify-center space-y-8 py-10">
            <div id="countdown-display" class="text-9xl font-black text-red-600 glitch-text hidden">3</div>
            <div id="results-display" class="hidden space-y-6 w-full text-center">
                <h2 class="text-2xl font-bold text-zinc-500 uppercase tracking-widest">Compromised Asset:</h2>
                <div id="impostor-names" class="text-4xl font-black text-red-600 uppercase glitch-text"></div>
                <div id="chaos-tag" class="hidden text-red-500 font-bold text-xs uppercase animate-pulse">Critical Error: Systemwide Corruption</div>
                <div class="terminal-box p-6 rounded border-red-900/50">
                    <p class="text-zinc-600 text-[10px] font-bold uppercase tracking-widest mb-2">Subject Cipher</p>
                    <p id="final-word" class="text-3xl font-black text-white uppercase tracking-[0.2em]"></p>
                </div>
                <button onclick="resetGame()" class="w-full btn-primary font-bold py-4 rounded text-xs tracking-widest">REBOOT SYSTEM</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'impostor_game_players';
        const wordPools = {
            food: ["McDonald’s", "Starbucks", "Domino’s", "KFC", "Subway", "Häagen-Dazs", "Nestlé", "Coca-Cola", "Pepsi", "Lindt", "Pizza", "Sushi", "Burger", "Ice Cream", "Taco", "Pasta", "Croissant", "Chocolate", "Avocado", "Pancake", "Ramen", "Steak", "Salad", "Sandwich", "Fries", "Donut", "Bagel", "Curry", "Soup", "Waffles"],
            places: ["Disneyland", "Universal Studios", "National Geographic", "Lonely Planet", "NASA", "National Parks", "Lego Land", "Travel Channel", "Airbnb", "Paris", "Tokyo", "London", "New York", "Egypt", "Grand Canyon", "Great Wall", "Moon", "Amazon Rain Forest", "Hollywood", "Rome", "Sydney", "Beijing", "Rio de Janeiro", "Venice", "Machu Picchu", "Niagara Falls", "Dubai", "Santorini", "Bali"],
            objects: ["Apple", "Samsung", "Canon", "Nikon", "Logitech", "Bose", "Sony", "IKEA", "KitchenAid", "Leatherman", "Toaster", "Umbrella", "Bicycle", "Headphones", "Telescope", "Hammer", "Clock", "Camera", "Guitar", "Mirror", "Laptop", "Phone", "Wallet", "Keys", "Chair", "Table", "Pen", "Notebook", "Backpack", "Shoes"],
            animals: ["National Geographic", "Disney Animals", "WWF", "San Diego Zoo", "SeaWorld", "Animal Planet", "Discovery Channel", "BBC Earth", "LEGO Animals", "Pokémon", "Lion", "Penguin", "Giraffe", "Elephant", "Octopus", "Eagle", "Sloth", "Kangaroo", "Dolphin", "Cheetah", "Tiger", "Zebra", "Bear", "Wolf", "Fox", "Owl", "Parrot", "Snake", "Crocodile", "Whale"],
            professions: ["Marvel Heroes", "LEGO City", "Barbie Careers", "Disney Jobs", "Playmobil", "Sesame Street", "Doctor Who", "Fortnite Skins", "Roblox", "The Sims", "Doctor", "Astronaut", "Chef", "Firefighter", "Artist", "Detective", "Pilot", "Teacher", "Scientist", "Farmer", "Engineer", "Musician", "Lawyer", "Nurse", "Actor", "Writer", "Photographer", "Architect", "Police Officer", "Plumber"],
            entertainment: ["Disney", "Netflix", "Marvel", "Nintendo", "HBO", "Spotify", "Twitch", "Pixar", "Warner Bros", "EA Games", "Movies", "TV Shows", "Video Games", "Books", "Anime", "Music Genres", "Comics", "Podcasts", "Theatre", "YouTube Channels", "Cartoons", "Musicals", "Web Series", "Reality Shows", "Documentaries", "Graphic Novels", "Manga", "Film Festivals", "Concerts", "Awards Shows"],
            transport: ["Bugatti", "Mercedes-Benz", "Tesla", "Ferrari", "Lamborghini", "Porsche", "Rolls-Royce", "BMW", "Audi", "Ducati", "Car", "Train", "Airplane", "Bicycle", "Boat", "Subway", "Scooter", "Helicopter", "Spaceship", "Skateboard", "Motorcycle", "Bus", "Tram", "Yacht", "Jet", "Ferry", "Hot Air Balloon", "Snowmobile", "Segway", "Golf Cart"],
            clothing: ["Nike", "Adidas", "Timberland", "Gucci", "Prada", "Louis Vuitton", "Converse", "Puma", "Reebok", "The North Face", "Hat", "Shoes", "Dress", "Jacket", "Gloves", "Scarf", "Sunglasses", "Belt", "Watch", "Socks", "T-Shirt", "Pants", "Skirt", "Hoodie", "Boots", "Tie", "Earrings", "Necklace", "Bracelet", "Ring"],
            tech: ["Apple Inc", "Samsung", "Microsoft", "Sony", "DJI", "GoPro", "Fitbit", "Oculus", "Razer", "Kindle", "Smartphone", "Laptop", "Tablet", "Drone", "Smartwatch", "Printer", "VR Headset", "Router", "Microphone", "Camera", "Speaker", "Keyboard", "Mouse", "Projector", "Smart TV", "Earbuds", "Gaming Console", "Charger", "Hard Drive", "Monitor"],
            sports: ["Nike", "Adidas", "Wilson", "Puma", "Reebok", "Under Armour", "Decathlon", "GoPro (sports)", "Red Bull (extreme)", "Fitbit", "Football", "Basketball", "Tennis", "Swimming", "Gymnastics", "Skateboarding", "Yoga", "Surfing", "Running", "Cycling", "Volleyball", "Golf", "Cricket", "Hockey", "Boxing", "Martial Arts", "Skiing", "Snowboarding", "Table Tennis", "Archery"],
            tools: ["Leatherman", "Stanley", "KitchenAid", "Bosch", "DeWalt", "Makita", "IKEA", "Logitech", "Apple", "Canon", "Kitchenware", "Furniture", "Stationery", "Electronics", "Musical Instruments", "Toys", "Jewelry", "Vehicles", "Sports Gear", "Outdoor Gear", "Hammer", "Screwdriver", "Drill", "Wrench", "Saw", "Pliers", "Paintbrush", "Easel", "Ruler", "Compass"],
            mythical: ["Disney", "Marvel", "Pokémon", "Wizards of the Coast", "LEGO Fantasy", "Dungeons & Dragons", "Harry Potter", "DreamWorks", "Blizzard", "Nickelodeon Fantasy", "Dragon", "Unicorn", "Phoenix", "Elf", "Wizard", "Troll", "Mermaid", "Vampire", "Giant", "Fairy", "Werewolf", "Goblin", "Griffin", "Centaur", "Dwarf", "Ogre", "Sprite", "Kraken", "Chimera", "Pegasus"]
        };

        let currentPlayers = [];
        const savedPlayers = localStorage.getItem(STORAGE_KEY);
        if (savedPlayers) {
            try { currentPlayers = JSON.parse(savedPlayers); } catch (e) { currentPlayers = []; }
        }

        let gameState = {
            players: [],
            impostorIndices: [],
            secretWord: "",
            theme: "",
            viewedPlayers: new Set(),
            isChaosMode: false,
            lastClickedIndex: -1
        };

        window.onload = () => {
            renderPlayerChips();
            updateImpostorOptions();
        };

        function updateImpostorOptions() {
            const count = currentPlayers.length;
            const opt2 = document.getElementById('opt-2-imp');
            const opt3 = document.getElementById('opt-3-imp');
            const selector = document.getElementById('impostor-count');

            opt2.disabled = count < 5;
            opt3.disabled = count < 7;

            // Reset selection if current selection becomes invalid
            if (selector.value === "2" && count < 5) selector.value = "1";
            if (selector.value === "3" && count < 7) selector.value = "1";
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPlayers));
        }

        function addPlayer() {
            const input = document.getElementById('name-input');
            const name = input.value.trim();
            if (!name || currentPlayers.length >= 12) return;
            if (currentPlayers.includes(name)) return;
            currentPlayers.push(name);
            input.value = '';
            saveToStorage();
            renderPlayerChips();
            updateImpostorOptions();
        }

        function removePlayer(name) {
            currentPlayers = currentPlayers.filter(p => p !== name);
            saveToStorage();
            renderPlayerChips();
            updateImpostorOptions();
        }

        function renderPlayerChips() {
            const container = document.getElementById('player-chips');
            if (currentPlayers.length === 0) {
                container.innerHTML = '<p id="no-players-msg" class="text-zinc-800 text-[10px] uppercase font-bold">Awaiting Input...</p>';
                return;
            }
            container.innerHTML = currentPlayers.map(name => `
                <div class="bg-zinc-900 border border-zinc-800 text-zinc-400 px-3 py-1.5 rounded text-[10px] font-bold uppercase flex items-center gap-2">
                    ${name}
                    <button onclick="removePlayer('${name}')" class="text-red-900 hover:text-red-500">&times;</button>
                </div>
            `).join('');
        }

        function showScreen(screenId) {
            ['setup-screen', 'role-select-screen', 'gameplay-screen', 'final-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            if (currentPlayers.length < 3) {
                alert("MINIMUM 3 PERSONNEL REQUIRED");
                return;
            }
            const impCount = parseInt(document.getElementById('impostor-count').value);
            const themeKey = document.getElementById('theme-select').value;
            
            const pool = wordPools[themeKey];
            const secretWord = pool[Math.floor(Math.random() * pool.length)];
            const themeName = document.getElementById('theme-select').options[document.getElementById('theme-select').selectedIndex].text;

            const isChaosMode = Math.random() < 0.05; 
            let impIndices = [];

            if (isChaosMode) {
                impIndices = currentPlayers.map((_, i) => i);
            } else {
                let poolIndices = currentPlayers.map((_, i) => i);
                for(let i = 0; i < impCount; i++) {
                    const randIndex = Math.floor(Math.random() * poolIndices.length);
                    impIndices.push(poolIndices.splice(randIndex, 1)[0]);
                }
            }

            gameState = {
                players: [...currentPlayers],
                impostorIndices: impIndices,
                secretWord,
                theme: themeName,
                viewedPlayers: new Set(),
                isChaosMode,
                lastClickedIndex: -1
            };

            renderRoleSelect();
            showScreen('role-select-screen');
        }

        function renderRoleSelect() {
            const grid = document.getElementById('role-grid-display');
            grid.innerHTML = gameState.players.map((name, i) => `
                <button 
                    onclick="viewRolePrompt(${i})" 
                    class="bg-black border border-zinc-800 p-4 rounded text-zinc-500 font-bold text-[10px] tracking-widest uppercase transition-all flex items-center justify-between"
                >
                    <span class="truncate pr-2">${name}</span>
                    <div id="check-${i}" class="status-dot"></div>
                </button>
            `).join('');
            document.getElementById('begin-gameplay-btn').disabled = true;
        }

        function viewRolePrompt(index) {
            gameState.lastClickedIndex = index;
            document.getElementById('confirm-text').innerText = `IS THIS PLAYER ${gameState.players[index]}?`;
            document.getElementById('confirm-view-content').classList.remove('hidden');
            document.getElementById('actual-role-content').classList.add('hidden');
            document.getElementById('role-overlay').classList.remove('hidden');
        }

        function revealRoleNow() {
            const index = gameState.lastClickedIndex;
            const isImpostor = gameState.impostorIndices.includes(index);
            const giveHint = document.getElementById('impostor-hint').checked;
            const textBody = document.getElementById('role-text-body');
            
            if (isImpostor) {
                textBody.innerHTML = `
                    <h3 class="text-4xl font-black text-red-600 mb-2 tracking-tighter italic uppercase glitch-text">Impostor</h3>
                    ${giveHint ? `<p class="text-[10px] text-zinc-500 font-bold uppercase mt-4">Data Leak: ${gameState.theme}</p>` : `<p class="text-[10px] text-zinc-500 font-bold uppercase mt-4">Infiltrate the group.</p>`}
                `;
            } else {
                textBody.innerHTML = `
                    <h3 class="text-3xl font-black text-zinc-200 mb-1 tracking-widest uppercase">${gameState.secretWord}</h3>
                    <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-[0.3em]">Valid Personnel</p>
                `;
            }

            document.getElementById('confirm-view-content').classList.add('hidden');
            document.getElementById('actual-role-content').classList.remove('hidden');
            
            gameState.viewedPlayers.add(index);
            document.getElementById(`check-${index}`).classList.add('active');

            if (gameState.viewedPlayers.size === gameState.players.length) {
                document.getElementById('begin-gameplay-btn').disabled = false;
            }
        }

        function closeRoleOverlay() {
            document.getElementById('role-overlay').classList.add('hidden');
        }

        function showGameplayScreen() {
            showScreen('gameplay-screen');
            const starterIdx = Math.floor(Math.random() * gameState.players.length);
            const direction = Math.random() > 0.5 ? "CLOCKWISE" : "COUNTER-CLOCKWISE";
            
            document.getElementById('turn-order-banner').innerHTML = `
                <div class="text-[10px] font-black uppercase tracking-[0.3em] mb-1">Investigation Start</div>
                <div class="text-lg font-black text-white">${gameState.players[starterIdx]}</div>
                <div class="text-[10px] font-bold opacity-60 mt-1">${direction} RECURSION</div>
            `;

            document.getElementById('gameplay-player-list').innerHTML = gameState.players.map(p => `
                <div class="bg-black border border-zinc-900 p-4 rounded text-zinc-600 uppercase tracking-widest">${p}</div>
            `).join('');
        }

        function triggerCountdown() {
            showScreen('final-screen');
            const cd = document.getElementById('countdown-display');
            const res = document.getElementById('results-display');
            cd.classList.remove('hidden');
            res.classList.add('hidden');

            let count = 3;
            cd.innerText = count;
            const interval = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(interval);
                    showResults();
                } else {
                    cd.innerText = count;
                }
            }, 800);
        }

        function showResults() {
            document.getElementById('countdown-display').classList.add('hidden');
            const res = document.getElementById('results-display');
            res.classList.remove('hidden');

            if (gameState.isChaosMode) {
                document.getElementById('impostor-names').innerText = "SYSTEM CORRUPT";
                document.getElementById('chaos-tag').classList.remove('hidden');
            } else {
                const names = gameState.impostorIndices.map(i => gameState.players[i]).join(' & ');
                document.getElementById('impostor-names').innerText = names;
                document.getElementById('chaos-tag').classList.add('hidden');
            }
            document.getElementById('final-word').innerText = gameState.secretWord;
        }

        function resetGame() {
            showScreen('setup-screen');
            updateImpostorOptions();
        }
    </script>
  <script src="assets/language-toggle.js?v=page-dock-2" defer></script>
</body>
</html>
