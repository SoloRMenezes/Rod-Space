<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostor - Social Deduction Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; 
            color: #f8fafc;
            touch-action: manipulation;
        }

        .glass {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-overlay {
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(12px);
        }

        .animate-pulse-slow {
            animation: pulse 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.5)); }
            50% { opacity: .4; filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.2)); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-md">
        <!-- Main Menu -->
        <div id="setup-screen" class="space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-6xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-cyan-400 via-indigo-400 to-purple-500">
                    IMPOSTOR
                </h1>
                <p class="text-slate-400 font-medium tracking-wide italic">"Trust no one."</p>
            </div>

            <div class="glass p-6 rounded-3xl space-y-5 shadow-2xl border border-white/5">
                <div class="space-y-2">
                    <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 ml-1">Crew Members</label>
                    <div class="flex gap-2">
                        <input type="text" id="name-input" placeholder="Player name..." class="flex-1 bg-slate-900 border border-slate-700/50 rounded-xl p-3 text-sm focus:ring-2 focus:ring-cyan-500 outline-none transition-all placeholder:text-slate-600">
                        <button onclick="addPlayer()" class="bg-indigo-600 hover:bg-indigo-500 px-5 rounded-xl font-bold text-sm transition-all active:scale-90 text-white">ADD</button>
                    </div>
                    <div id="player-chips" class="flex flex-wrap gap-2 pt-2 min-h-[40px]">
                        <p id="no-players-msg" class="text-slate-600 text-xs italic">No players added yet.</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 mb-2 ml-1">Impostors</label>
                        <select id="impostor-count" class="w-full bg-slate-900 border border-slate-700/50 rounded-xl p-3 text-sm outline-none focus:border-indigo-500 text-slate-200">
                            <option value="1">1 Impostor</option>
                            <option value="2">2 Impostors</option>
                            <option value="3">3 Impostors</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 mb-2 ml-1">Theme</label>
                        <select id="theme-select" class="w-full bg-slate-900 border border-slate-700/50 rounded-xl p-3 text-sm outline-none focus:border-indigo-500 text-slate-200">
                            <option value="food">Food & Drinks</option>
                            <option value="places">Famous Places</option>
                            <option value="objects">Everyday Objects</option>
                            <option value="animals">Animals</option>
                            <option value="jobs">Professions</option>
                            <option value="tech">Tech & Gadgets</option>
                            <option value="media">Movies/Games</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center space-x-3 p-2 group">
                    <input type="checkbox" id="impostor-hint" class="w-5 h-5 accent-cyan-400 rounded cursor-pointer">
                    <label for="impostor-hint" class="text-sm text-slate-400 cursor-pointer group-hover:text-slate-200 transition-colors">Give Impostor a category hint?</label>
                </div>

                <button onclick="startGame()" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-cyan-900/20 transform active:scale-[0.98] transition-all tracking-widest text-sm">
                    START SESSION
                </button>
            </div>
        </div>

        <!-- Role Select Menu -->
        <div id="role-select-screen" class="hidden space-y-6 text-center">
            <div class="glass p-8 rounded-3xl border-2 border-cyan-500/10 shadow-2xl relative">
                <h2 class="text-3xl font-black mb-2 uppercase tracking-tight text-cyan-400">ASSIGNMENTS</h2>
                <p class="text-slate-400 mb-8 text-xs leading-relaxed uppercase tracking-wider">Tap your name to reveal role</p>
                
                <div class="grid grid-cols-2 gap-3 mb-4" id="role-grid-display">
                    <!-- Player Role Buttons -->
                </div>
            </div>

            <button id="begin-gameplay-btn" disabled onclick="showGameplayScreen()" class="w-full bg-white text-slate-900 disabled:opacity-30 disabled:cursor-not-allowed font-black py-4 rounded-2xl shadow-xl transform active:scale-[0.98] transition-all tracking-widest text-sm">
                START GAME
            </button>
        </div>

        <!-- Role Modal (Confirm -> View) -->
        <div id="role-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 modal-overlay">
            <div id="confirm-view-content" class="bg-slate-900 border border-slate-700 w-full max-w-xs rounded-[2.5rem] p-10 text-center shadow-2xl">
                <p class="text-slate-300 font-bold mb-6 text-lg" id="confirm-text">Are you [Name]?</p>
                <div class="flex flex-col gap-3">
                    <button onclick="revealRoleNow()" class="w-full py-4 bg-cyan-500 text-slate-900 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-cyan-900/20">CONFIRM</button>
                    <button onclick="closeRoleOverlay()" class="w-full py-4 bg-slate-800 text-slate-400 rounded-2xl font-bold text-xs uppercase tracking-widest">CANCEL</button>
                </div>
            </div>

            <div id="actual-role-content" class="hidden bg-slate-100 w-full max-w-xs rounded-[2.5rem] p-10 text-center shadow-2xl">
                <p class="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-400 mb-6">Secret File</p>
                <div id="role-text-body">
                    <!-- Injected Role Content -->
                </div>
                <button onclick="closeRoleOverlay()" class="mt-10 w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-xs uppercase tracking-widest">DONE</button>
            </div>
        </div>

        <!-- Gameplay Screen -->
        <div id="gameplay-screen" class="hidden space-y-6 text-center">
            <div class="glass p-8 rounded-3xl border-2 border-cyan-500/10 shadow-2xl">
                <h2 class="text-2xl font-black mb-1 uppercase tracking-tight text-cyan-400">INVESTIGATIONS</h2>
                <div id="turn-order-banner" class="mb-6 p-4 bg-indigo-500/10 rounded-2xl border border-indigo-500/20 text-indigo-300 font-bold text-sm">
                    <!-- Turn order injected here -->
                </div>
                
                <div class="grid grid-cols-2 gap-2 text-sm" id="gameplay-player-list">
                    <!-- Players list -->
                </div>
            </div>

            <button onclick="triggerCountdown()" class="w-full bg-white text-slate-900 font-black py-4 rounded-2xl shadow-xl transform active:scale-[0.98] transition-all tracking-widest text-sm">
                VOTE / REVEAL
            </button>
        </div>

        <!-- Final Reveal Screen -->
        <div id="final-screen" class="hidden flex flex-col items-center justify-center space-y-8 py-10">
            <div id="countdown-display" class="text-9xl font-black text-cyan-400 hidden">3</div>
            
            <div id="results-display" class="hidden space-y-6 w-full text-center">
                <h2 class="text-4xl font-extrabold text-white">THE IMPOSTOR WAS...</h2>
                <div id="impostor-names" class="text-5xl font-black text-cyan-400 drop-shadow-[0_0_20px_rgba(34,211,238,0.4)]"></div>
                <div id="chaos-tag" class="hidden text-fuchsia-400 font-bold text-xl uppercase animate-bounce">Chaos Mode! Everyone was an impostor!</div>
                <div class="glass p-5 rounded-2xl border border-white/5">
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">Secret Word</p>
                    <p id="final-word" class="text-3xl font-black text-white uppercase tracking-widest"></p>
                </div>
                <button onclick="resetGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95">
                    REPLAY
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'impostor_game_players';

        const wordPools = {
            food: ["Pizza", "Sushi", "Burger", "Ice Cream", "Taco", "Pasta", "Croissant", "Chocolate", "Avocado", "Ramen", "Steak", "Burrito", "Waffles", "Donut", "Curry"],
            places: ["Paris", "Tokyo", "London", "New York", "Egypt", "Grand Canyon", "Great Wall", "Moon", "Hollywood", "Rome", "Venice", "Dubai", "Bali", "Kyoto"],
            objects: ["Toaster", "Umbrella", "Bicycle", "Headphones", "Telescope", "Hammer", "Clock", "Camera", "Guitar", "Mirror", "Laptop", "Phone", "Backpack", "Watch"],
            animals: ["Lion", "Penguin", "Giraffe", "Elephant", "Octopus", "Eagle", "Sloth", "Kangaroo", "Dolphin", "Cheetah", "Tiger", "Fox", "Panda", "Koala"],
            jobs: ["Doctor", "Astronaut", "Chef", "Firefighter", "Artist", "Detective", "Pilot", "Teacher", "Scientist", "Farmer", "Musician", "Lawyer", "Nurse", "Athlete"],
            tech: ["Apple", "Samsung", "Microsoft", "Smartphone", "Laptop", "Drone", "VR Headset", "AI", "Robot", "Bitcoin", "Internet"],
            media: ["Disney", "Netflix", "Marvel", "Nintendo", "Anime", "Movies", "Video Games", "Comics", "Star Wars", "Harry Potter", "Minecraft", "Fortnite"]
        };

        let currentPlayers = [];
        const savedPlayers = localStorage.getItem(STORAGE_KEY);
        if (savedPlayers) {
            try { currentPlayers = JSON.parse(savedPlayers); } catch (e) { currentPlayers = []; }
        }

        let gameState = {
            players: [],
            impostorIndices: [],
            secretWord: "",
            theme: "",
            viewedPlayers: new Set(),
            isChaosMode: false,
            lastClickedIndex: -1
        };

        window.onload = () => renderPlayerChips();

        document.getElementById('name-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addPlayer();
        });

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPlayers));
        }

        function addPlayer() {
            const input = document.getElementById('name-input');
            const name = input.value.trim();
            if (!name) return;
            if (currentPlayers.some(p => p.toLowerCase() === name.toLowerCase())) {
                input.classList.add('border-fuchsia-500');
                setTimeout(() => input.classList.remove('border-fuchsia-500'), 1000);
                return;
            }
            currentPlayers.push(name);
            input.value = '';
            saveToStorage();
            renderPlayerChips();
        }

        function removePlayer(name) {
            currentPlayers = currentPlayers.filter(p => p !== name);
            saveToStorage();
            renderPlayerChips();
        }

        function renderPlayerChips() {
            const container = document.getElementById('player-chips');
            if (currentPlayers.length === 0) {
                container.innerHTML = '<p id="no-players-msg" class="text-slate-600 text-xs italic">No players added yet.</p>';
                return;
            }
            container.innerHTML = currentPlayers.map(name => `
                <div class="bg-indigo-500/10 text-indigo-300 px-3 py-1.5 rounded-xl text-xs flex items-center gap-2 border border-indigo-500/20 animate-in fade-in zoom-in duration-200">
                    ${name}
                    <button onclick="removePlayer('${name}')" class="hover:text-white transition-colors p-1">&times;</button>
                </div>
            `).join('');
        }

        function showScreen(screenId) {
            ['setup-screen', 'role-select-screen', 'gameplay-screen', 'final-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            const impCountSetting = parseInt(document.getElementById('impostor-count').value);
            const themeKey = document.getElementById('theme-select').value;
            
            if (currentPlayers.length < 3) {
                alert("At least 3 players required!");
                return;
            }
            if (impCountSetting >= currentPlayers.length - 1) {
                alert("Too many impostors for this player count.");
                return;
            }

            const pool = wordPools[themeKey];
            const secretWord = pool[Math.floor(Math.random() * pool.length)];
            const themeName = document.getElementById('theme-select').options[document.getElementById('theme-select').selectedIndex].text;

            const isChaosMode = Math.random() < 0.10; 
            let impIndices = [];

            if (isChaosMode) {
                impIndices = currentPlayers.map((_, i) => i);
            } else {
                let poolIndices = currentPlayers.map((_, i) => i);
                for(let i = 0; i < impCountSetting; i++) {
                    const randIndex = Math.floor(Math.random() * poolIndices.length);
                    impIndices.push(poolIndices.splice(randIndex, 1)[0]);
                }
            }

            gameState = {
                players: [...currentPlayers],
                impostorIndices: impIndices,
                secretWord,
                theme: themeName,
                viewedPlayers: new Set(),
                isChaosMode,
                lastClickedIndex: -1
            };

            renderRoleSelect();
            showScreen('role-select-screen');
        }

        function renderRoleSelect() {
            const grid = document.getElementById('role-grid-display');
            grid.innerHTML = gameState.players.map((name, i) => `
                <button 
                    id="player-btn-${i}"
                    onclick="viewRolePrompt(${i})" 
                    class="bg-slate-900/80 hover:bg-slate-800 border-2 border-slate-700/50 p-4 rounded-2xl text-slate-300 font-bold transition-all transform active:scale-95 flex items-center justify-between"
                >
                    <span class="truncate pr-2">${name}</span>
                    <div id="check-${i}" class="w-2 h-2 rounded-full bg-slate-700"></div>
                </button>
            `).join('');
            document.getElementById('begin-gameplay-btn').disabled = true;
        }

        function viewRolePrompt(index) {
            gameState.lastClickedIndex = index;
            document.getElementById('confirm-text').innerText = `Are you ${gameState.players[index]}?`;
            
            document.getElementById('confirm-view-content').classList.remove('hidden');
            document.getElementById('actual-role-content').classList.add('hidden');
            document.getElementById('role-overlay').classList.remove('hidden');
        }

        function revealRoleRole() {} // placeholder

        function revealRoleNow() {
            const index = gameState.lastClickedIndex;
            const isImpostor = gameState.impostorIndices.includes(index);
            const giveHint = document.getElementById('impostor-hint').checked;
            const textBody = document.getElementById('role-text-body');
            
            if (isImpostor) {
                textBody.innerHTML = `
                    <h3 class="text-4xl font-black text-indigo-600 mb-2 tracking-tight italic">IMPOSTOR</h3>
                    ${giveHint ? `<p class="text-xs text-slate-500 font-medium">Topic: <span class="text-indigo-500 font-bold">${gameState.theme}</span></p>` : `<p class="text-xs text-slate-400">Try to figure out the word!</p>`}
                `;
            } else {
                textBody.innerHTML = `
                    <h3 class="text-3xl font-black text-slate-900 mb-1 leading-tight tracking-tight">${gameState.secretWord.toUpperCase()}</h3>
                    <p class="text-xs font-bold text-cyan-600 uppercase tracking-widest">Innocent</p>
                `;
            }

            document.getElementById('confirm-view-content').classList.add('hidden');
            document.getElementById('actual-role-content').classList.remove('hidden');
            
            // Mark as viewed
            gameState.viewedPlayers.add(index);
            const check = document.getElementById(`check-${index}`);
            check.classList.remove('bg-slate-700');
            check.classList.add('bg-cyan-400', 'shadow-[0_0_8px_rgba(34,211,238,0.8)]');

            if (gameState.viewedPlayers.size === gameState.players.length) {
                document.getElementById('begin-gameplay-btn').disabled = false;
            }
        }

        function closeRoleOverlay() {
            document.getElementById('role-overlay').classList.add('hidden');
        }

        function showGameplayScreen() {
            showScreen('gameplay-screen');
            
            // Determine turn order
            const starterIdx = Math.floor(Math.random() * gameState.players.length);
            const direction = Math.random() > 0.5 ? "Clockwise ↻" : "Counter-Clockwise ↺";
            const starterName = gameState.players[starterIdx];

            document.getElementById('turn-order-banner').innerHTML = `
                <div class="text-[10px] uppercase tracking-widest text-indigo-400 mb-1">Turn Sequence</div>
                <div class="text-xl font-black text-white">${starterName} Starts</div>
                <div class="text-xs text-cyan-400 mt-1">${direction}</div>
            `;

            const display = document.getElementById('gameplay-player-list');
            display.innerHTML = gameState.players.map(p => `
                <div class="bg-indigo-500/5 p-4 rounded-2xl border border-indigo-500/10 font-bold text-slate-300">${p}</div>
            `).join('');
        }

        function triggerCountdown() {
            showScreen('final-screen');
            const cd = document.getElementById('countdown-display');
            const res = document.getElementById('results-display');
            cd.classList.remove('hidden');
            res.classList.add('hidden');

            let count = 3;
            cd.innerText = count;
            const interval = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(interval);
                    showResults();
                } else {
                    cd.innerText = count;
                }
            }, 800);
        }

        function showResults() {
            document.getElementById('countdown-display').classList.add('hidden');
            const res = document.getElementById('results-display');
            const chaosTag = document.getElementById('chaos-tag');
            res.classList.remove('hidden');

            if (gameState.isChaosMode) {
                document.getElementById('impostor-names').innerText = "EVERYONE";
                chaosTag.classList.remove('hidden');
            } else {
                const names = gameState.impostorIndices.map(i => gameState.players[i]).join(' & ');
                document.getElementById('impostor-names').innerText = names;
                chaosTag.classList.add('hidden');
            }
            document.getElementById('final-word').innerText = gameState.secretWord;
        }

        function resetGame() {
            showScreen('setup-screen');
        }
    </script>
</body>
</html>
