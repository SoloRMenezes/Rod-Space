<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Canvas Drift Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* Overlay Systems */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        h1 { color: white; font-size: 48px; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #ff4444; font-size: 36px; margin-bottom: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        .btn {
            background: white; color: black; border: none;
            padding: 15px 40px; margin: 10px; font-size: 20px; font-weight: bold;
            border-radius: 50px; cursor: pointer; width: 250px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #eee; }

        /* Game UI */
        #game-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none;
        }

        #top-left-ui {
            position: absolute;
            top: 20px; left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #turbo-container { width: 200px; }
        .ui-label { color: white; font-size: 12px; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px 2px black; }
        #turbo-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        #turbo-bar { width: 100%; height: 100%; background: #00f2ff; transition: width 0.1s; }

        #health-container { display: flex; gap: 5px; }
        .heart { width: 20px; height: 20px; fill: #ff4444; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .heart.lost { fill: #333; opacity: 0.5; }

        #speed-container {
            position: absolute;
            bottom: 30px; left: 30px;
            color: white; text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
        #speed-val { font-size: 64px; font-weight: 900; }
        #speed-unit { font-size: 24px; margin-left: 5px; opacity: 0.8; }

        #home-btn {
            position: absolute;
            top: 20px; right: 20px;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #home-btn:hover { transform: scale(1.1); background: white; }
        #home-btn svg { width: 28px; height: 28px; fill: #333; }

        /* Screens */
        .hidden { display: none !important; }
        
        #skin-picker { background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; }
        .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .color-btn { width: 50px; height: 50px; border-radius: 10px; border: 3px solid transparent; cursor: pointer; }
        .color-btn:hover { border-color: white; }

        #keybinds-screen { color: white; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; text-align: left; line-height: 2; }
        
        #damage-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div id="damage-flash"></div>

    <!-- Main Menu -->
    <div id="main-menu" class="overlay">
        <h1>DRIFT PRO</h1>
        <button class="btn" onclick="startGame()">START</button>
        <button class="btn" onclick="showScreen('skin-picker')">CUSTOMIZE</button>
        <button class="btn" onclick="showScreen('keybinds-screen')">KEYBINDS</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="overlay hidden">
        <h2>CRASHED!</h2>
        <div style="color: white; font-size: 20px; margin-bottom: 20px;">Car integrity compromised.</div>
        <button class="btn" onclick="startGame()">RETRY</button>
        <button class="btn" style="background: #444; color: white;" onclick="backToMenu()">MAIN MENU</button>
    </div>

    <!-- Customize Screen -->
    <div id="skin-picker" class="overlay hidden">
        <h2 style="color: white">CHOOSE COLOR</h2>
        <div class="colors">
            <div class="color-btn" style="background: #ff0000;" onclick="setCarColor(0xff0000)"></div>
            <div class="color-btn" style="background: #ff8800;" onclick="setCarColor(0xff8800)"></div>
            <div class="color-btn" style="background: #00ff00;" onclick="setCarColor(0x00ff00)"></div>
            <div class="color-btn" style="background: #00ccff;" onclick="setCarColor(0x00ccff)"></div>
            <div class="color-btn" style="background: #ffff00;" onclick="setCarColor(0xffff00)"></div>
            <div class="color-btn" style="background: #ffffff;" onclick="setCarColor(0xffffff)"></div>
            <div class="color-btn" style="background: #888888;" onclick="setCarColor(0x888888)"></div>
            <div class="color-btn" style="background: #ff00ff;" onclick="setCarColor(0xff00ff)"></div>
            <div class="color-btn" style="background: #8800ff;" onclick="setCarColor(0x8800ff)"></div>
        </div>
        <button class="btn" style="margin-top: 20px" onclick="showScreen('main-menu')">BACK</button>
    </div>

    <!-- Keybinds Screen -->
    <div id="keybinds-screen" class="overlay hidden">
        <h2>CONTROLS</h2>
        <div><b>WASD / ARROWS:</b> DRIVE & STEER</div>
        <div><b>SPACE:</b> TURBO BOOST</div>
        <div><b>SHIFT:</b> FREELOOK (SHIFT LOCK)</div>
        <button class="btn" style="margin-top: 20px" onclick="showScreen('main-menu')">BACK</button>
    </div>

    <!-- In-Game UI -->
    <div id="game-ui">
        <div id="top-left-ui">
            <div id="turbo-container">
                <div class="ui-label">TURBO</div>
                <div id="turbo-bar-bg">
                    <div id="turbo-bar"></div>
                </div>
            </div>
            <div id="health-container">
                <!-- Hearts generated by JS -->
            </div>
        </div>

        <div id="speed-container">
            <span id="speed-val">0</span><span id="speed-unit">KM/H</span>
        </div>

        <button id="home-btn" onclick="backToMenu()" title="Back to Menu">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Texture Generators ---
        function createAsphaltTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 4000; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.04})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#ffd700';
            for(let y = 10; y < 120; y += 15) {
                for(let x = 10; x < 120; x += 20) {
                    if(Math.random() > 0.4) ctx.fillRect(x, y, 12, 8);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 350);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(100, 200, 100);
        scene.add(sun);

        const WORLD_SIZE = 1000;

        // Ground (Open World Grass/Dirt)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(WORLD_SIZE * 2.5, WORLD_SIZE * 2.5),
            new THREE.MeshLambertMaterial({ color: 0x3d4d3d })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- Track / Looping Road ---
        // Create a custom path for the track
        const trackWidth = 24;
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.05, 0),
            new THREE.Vector3(200, 0.05, 50),
            new THREE.Vector3(400, 0.05, -150),
            new THREE.Vector3(500, 0.05, 200),
            new THREE.Vector3(250, 0.05, 450),
            new THREE.Vector3(-150, 0.05, 400),
            new THREE.Vector3(-450, 0.05, 250),
            new THREE.Vector3(-300, 0.05, -100),
            new THREE.Vector3(-100, 0.05, -350),
            new THREE.Vector3(300, 0.05, -500),
            new THREE.Vector3(600, 0.05, -400),
            new THREE.Vector3(450, 0.05, 100),
            new THREE.Vector3(0, 0.05, 0) // Loop back to start
        ]);

        const points = curve.getPoints(200);
        const roadShape = new THREE.Shape();
        roadShape.moveTo(0, -trackWidth/2);
        roadShape.lineTo(0, trackWidth/2);

        const extrudeSettings = {
            steps: 200,
            extrudePath: curve,
            bevelEnabled: false
        };

        const roadGeo = new THREE.ExtrudeGeometry(roadShape, extrudeSettings);
        // Correcting road geometry orientation (flattening it)
        const v = roadGeo.attributes.position.array;
        for(let i = 1; i < v.length; i+=3) { v[i] = 0.06; } // Keep it flat on ground
        
        const roadTex = createAsphaltTexture();
        roadTex.repeat.set(1, 1);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
        const roadMesh = new THREE.Mesh(roadGeo, roadMat);
        scene.add(roadMesh);

        // Road Lines (Yellow center)
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const lineGeo = new THREE.TubeGeometry(curve, 200, 0.4, 4, false);
        const lineMesh = new THREE.Mesh(lineGeo, lineMat);
        lineMesh.position.y = 0.1;
        scene.add(lineMesh);

        // --- Buildings ---
        const buildings = [];
        const bTex = createBuildingTexture();
        function createCity() {
            for(let i = 0; i < 350; i++) {
                const w = 10 + Math.random() * 20;
                const d = 10 + Math.random() * 20;
                const h = 20 + Math.random() * 100;
                
                let x = (Math.random() - 0.5) * 1800;
                let z = (Math.random() - 0.5) * 1800;
                
                // Avoid the track
                const testPos = new THREE.Vector3(x, 0.05, z);
                let minDistToTrack = 10000;
                for(let t=0; t<=1; t+=0.01) {
                    const p = curve.getPoint(t);
                    const dist = testPos.distanceTo(p);
                    if(dist < minDistToTrack) minDistToTrack = dist;
                }
                if(minDistToTrack < 35) continue;

                const mat = new THREE.MeshLambertMaterial({ map: bTex.clone() });
                mat.map.repeat.set(1, h/10);
                const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                box.position.set(x, h/2, z);
                scene.add(box);
                buildings.push({ 
                    minX: x - w/2, maxX: x + w/2, 
                    minZ: z - d/2, maxZ: z + d/2 
                });
            }
        }
        createCity();

        // --- Advanced Car Model ---
        function createCar() {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00ccff, shininess: 100 });
            const blackMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const chromeMat = new THREE.MeshPhongMaterial({ color: 0x888888 });

            // Main Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 3.4), bodyMat);
            body.position.y = 0.5;
            group.add(body);

            // Hood Slope
            const hood = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 1.2), bodyMat);
            hood.position.set(0, 0.7, 1.1);
            hood.rotation.x = 0.1;
            group.add(hood);

            // Cabin
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.6, 1.6), blackMat);
            cabin.position.set(0, 1.0, -0.2);
            group.add(cabin);

            // Spoiler
            const sPostL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), bodyMat);
            sPostL.position.set(0.6, 0.8, -1.5);
            group.add(sPostL);
            const sPostR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), bodyMat);
            sPostR.position.set(-0.6, 0.8, -1.5);
            group.add(sPostR);
            const sWing = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.1, 0.6), bodyMat);
            sWing.position.set(0, 1.0, -1.5);
            sWing.rotation.x = -0.1;
            group.add(sWing);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 20);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelsArr = [];
            const wheelPos = [{x:0.9,z:1.1}, {x:-0.9,z:1.1}, {x:0.9,z:-1.1}, {x:-0.9,z:-1.1}];
            wheelPos.forEach(p => {
                const w = new THREE.Mesh(wheelGeo, blackMat);
                w.position.set(p.x, 0.4, p.z);
                group.add(w);
                wheelsArr.push(w);
                // Rim
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.42, 10), chromeMat);
                rim.rotateZ(Math.PI / 2);
                w.add(rim);
            });

            return { group, bodyMat, wheelsArr };
        }

        const { group: carGroup, bodyMat: carBodyMat, wheelsArr: carWheels } = createCar();
        scene.add(carGroup);

        // --- Game State ---
        let isGameRunning = false;
        let velocity = new THREE.Vector3();
        let currentSpeed = 0;
        let turboAmount = 100;
        let carHealth = 5;
        let freelookRotation = 0;
        let lastCollisionTime = 0;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const speedVal = document.getElementById('speed-val');
        const turboBar = document.getElementById('turbo-bar');
        const healthContainer = document.getElementById('health-container');
        const damageFlash = document.getElementById('damage-flash');

        function updateHealthUI() {
            healthContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                heart.setAttribute("viewBox", "0 0 24 24");
                heart.classList.add("heart");
                if (i >= carHealth) heart.classList.add("lost");
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z");
                heart.appendChild(path);
                healthContainer.appendChild(heart);
            }
        }

        function triggerDamage() {
            const now = Date.now();
            if (now - lastCollisionTime < 500) return; 
            carHealth--;
            lastCollisionTime = now;
            updateHealthUI();
            damageFlash.style.opacity = '1';
            setTimeout(() => damageFlash.style.opacity = '0', 100);
            if (carHealth <= 0) gameOver();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.overlay').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            document.querySelectorAll('.overlay').forEach(s => s.classList.add('hidden'));
            document.getElementById('game-ui').style.display = 'block';
            carHealth = 5;
            currentSpeed = 0;
            velocity.set(0,0,0);
            carGroup.position.set(0, 0, 15);
            carGroup.rotation.y = Math.PI; // Point down the track
            turboAmount = 100;
            updateHealthUI();
            isGameRunning = true;
        }

        function gameOver() {
            isGameRunning = false;
            showScreen('game-over');
        }

        function backToMenu() {
            isGameRunning = false;
            document.getElementById('game-ui').style.display = 'none';
            showScreen('main-menu');
            carGroup.position.set(0,0,0);
        }

        function setCarColor(color) {
            carBodyMat.color.setHex(color);
            showScreen('main-menu');
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameRunning) {
                carGroup.rotation.y += 0.005;
                camera.position.set(8, 4, 8);
                camera.lookAt(carGroup.position);
                carWheels.forEach(w => w.rotation.x += 0.02);
            } else {
                const isFwd = keys['KeyW'] || keys['ArrowUp'];
                const isBwd = keys['KeyS'] || keys['ArrowDown'];
                const isL = keys['KeyA'] || keys['ArrowLeft'];
                const isR = keys['KeyD'] || keys['ArrowRight'];
                const isTurbo = keys['Space'] && turboAmount > 0;
                const isShiftLock = keys['ShiftLeft'] || keys['ShiftRight'];

                if (isFwd) currentSpeed += (isTurbo ? 0.024 : 0.014);
                if (isBwd) currentSpeed -= 0.01;
                currentSpeed *= 0.985;

                if (isTurbo) turboAmount -= 1.3;
                else if (turboAmount < 100) turboAmount += 0.2;

                const turnFactor = 0.045 * Math.min(Math.abs(currentSpeed) * 6, 1);
                if (isL) carGroup.rotation.y += turnFactor;
                if (isR) carGroup.rotation.y -= turnFactor;

                // Visual Steering
                carWheels[0].rotation.y = isL ? 0.4 : (isR ? -0.4 : 0);
                carWheels[1].rotation.y = isL ? 0.4 : (isR ? -0.4 : 0);
                carWheels.forEach(w => w.rotation.x += currentSpeed * 2);

                const heading = new THREE.Vector3(0, 0, 1).applyQuaternion(carGroup.quaternion);
                const targetVel = heading.clone().multiplyScalar(currentSpeed);
                
                // Drift logic - find if on track
                let minDistToTrack = 1000;
                for(let t=0; t<=1; t+=0.02) {
                    const p = curve.getPoint(t);
                    const d = carGroup.position.distanceTo(p);
                    if(d < minDistToTrack) minDistToTrack = d;
                }
                const onRoad = minDistToTrack < trackWidth / 2;
                const lerpFactor = onRoad ? 0.08 : 0.04; 
                velocity.lerp(targetVel, lerpFactor);

                let nextPos = carGroup.position.clone().add(velocity);
                const carRadius = 1.2;

                // Collision with buildings
                for(let b of buildings) {
                    if(nextPos.x + carRadius > b.minX && nextPos.x - carRadius < b.maxX &&
                       nextPos.z + carRadius > b.minZ && nextPos.z - carRadius < b.maxZ) {
                        if (Math.abs(currentSpeed) > 0.1) triggerDamage();
                        velocity.multiplyScalar(-0.4);
                        currentSpeed *= -0.5;
                        nextPos.copy(carGroup.position);
                    }
                }
                carGroup.position.copy(nextPos);

                // Camera follow
                if (!isShiftLock) freelookRotation = carGroup.rotation.y;
                const camOffset = new THREE.Vector3(0, 4, -9).applyQuaternion(
                    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), freelookRotation)
                );
                camera.position.lerp(carGroup.position.clone().add(camOffset), 0.1);
                camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1, 0)));

                speedVal.innerText = Math.floor(Math.abs(currentSpeed) * 500);
                turboBar.style.width = turboAmount + '%';
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.setCarColor = setCarColor;
        updateHealthUI();
        animate();
    </script>
</body>
</html>
