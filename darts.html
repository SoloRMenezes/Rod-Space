<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Darts</title>
  <style>
    :root {
      --felt: #221309;
      --felt-light: #3a2112;
      --wood: #3a2112;
      --brass: #c58b2c;
      --ink: #f6f1e8;
      --muted: #b9aea3;
      --panel: rgba(18, 10, 6, 0.56);
      --panel-strong: rgba(18, 10, 6, 0.7);
      --line: rgba(255, 255, 255, 0.1);
      --gold: #f5c542;
      --red: #ef4444;
      --green: #21b57a;
      --blue: #4aa3ff;
      --yellow: #ffd84d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 3px, transparent 3px 78px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.16) 0 2px, transparent 2px 156px),
        linear-gradient(180deg, #4a2a17 0%, #241209 100%);
      touch-action: manipulation;
      user-select: none;
    }

    body::before {
      content: none;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      z-index: 20;
      background: rgba(18, 10, 6, 0.78);
      backdrop-filter: blur(18px);
    }

    .menu {
      width: min(760px, 100%);
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: none;
    }

    .eyebrow,
    .label,
    .micro {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 12px;
      font-size: clamp(3.2rem, 12vw, 7.4rem);
      line-height: 0.82;
      letter-spacing: 0;
      text-transform: uppercase;
      font-style: italic;
    }

    .menu p {
      margin: 0;
      max-width: 48rem;
      color: #c8d3cb;
      font-size: 1rem;
      line-height: 1.55;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    .player-btn {
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .player-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 197, 66, 0.8);
      background: rgba(245, 197, 66, 0.12);
    }

    .game {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, 1.5vw, 18px);
      align-items: center;
      width: min(1240px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: none;
      backdrop-filter: none;
    }

    .scoreboard {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .player-card {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 50px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
    }

    .player-card.active {
      border-color: rgba(245, 197, 66, 0.68);
      background: rgba(245, 197, 66, 0.07);
    }

    .swatch {
      width: 10px;
      height: 36px;
      border-radius: 999px;
    }

    .player-name {
      font-weight: 900;
      text-transform: uppercase;
    }

    .player-score {
      font-size: 1.55rem;
      font-weight: 1000;
      font-style: italic;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 4px;
      justify-items: center;
      min-width: 0;
      min-height: 0;
      height: 100%;
      align-self: center;
      overflow: hidden;
    }

    .scoreboard {
      width: min(900px, 100%);
    }

    .board-wrap {
      position: relative;
      width: min(56vh, 560px, 82vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .angle-wrap {
      position: absolute;
      top: -38px;
      left: 50%;
      width: 78%;
      height: 86px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 8px;
      background: transparent;
      overflow: hidden;
      box-shadow: none;
      z-index: 2;
    }

    .board-wrap::before {
      content: none;
    }

    .board-wrap::after {
      content: none;
    }

    #gameCanvas {
      width: 88%;
      height: 88%;
      border-radius: 50%;
      background: radial-gradient(circle, #222, #050505);
      border: clamp(8px, 1.5vw, 14px) solid #2d1b11;
      box-shadow: none;
      touch-action: none;
    }

    #angleCanvas {
      width: 100%;
      height: 86px;
      pointer-events: none;
    }

    .sound-toggle {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 12;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(7, 14, 12, 0.58);
      box-shadow: none;
      backdrop-filter: none;
      font-size: 1.24rem;
      line-height: 1;
    }

    .sound-toggle svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: #f6f1e8;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sound-toggle .speaker {
      fill: rgba(246, 241, 232, 0.16);
    }

    .sound-toggle .sound-wave {
      display: none;
    }

    .sound-toggle.is-on {
      border-color: rgba(33, 181, 122, 0.55);
      background: rgba(10, 35, 25, 0.66);
    }

    .sound-toggle.is-on .sound-wave {
      display: block;
    }

    .sound-toggle.is-on .mute-slash {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .game {
        align-content: center;
        gap: 8px;
      }

      .scoreboard {
        grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
        gap: 8px;
        padding: 8px;
      }

      .player-card {
        min-height: 44px;
        padding: 7px 8px;
      }

      .player-score {
        font-size: 1.25rem;
      }

      .board-wrap {
        width: min(78vw, 43vh);
      }

      .board-wrap::before {
        inset: -3% -5%;
      }

      .player-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .game {
        padding-top: max(8px, env(safe-area-inset-top));
      }

      .scoreboard {
        grid-template-columns: 1fr;
      }

      .board-wrap {
        width: min(84vw, 35vh);
      }

      .angle-wrap {
        top: -30px;
        width: 80%;
        height: 70px;
      }

      #angleCanvas {
        height: 70px;
      }

      .menu {
        padding: 22px;
      }
    }

    @media (max-width: 1100px), (max-height: 820px) {
      .game {
        gap: 6px;
        align-items: stretch;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      }

      .scoreboard {
        justify-self: start;
        width: calc(100% - 58px);
        min-height: 58px;
        padding: 5px;
      }

      .player-card {
        display: none;
      }

      .player-card.active {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        min-height: 48px;
        padding: 7px 9px;
        gap: 9px;
      }

      .swatch {
        width: 8px;
        height: 34px;
      }

      .player-name {
        font-size: 0.92rem;
        line-height: 1;
      }

      .micro {
        display: none;
      }

      .player-score {
        font-size: clamp(1.2rem, 7vw, 1.8rem);
      }

      .stage {
        gap: 3px;
        grid-template-rows: minmax(0, 1fr);
      }

      .angle-wrap {
        top: -30px;
        width: 80%;
        height: 70px;
      }

      #angleCanvas {
        height: 70px;
      }

      .board-wrap {
        width: min(82vw, 46dvh, 520px);
        align-self: center;
      }

      .board-wrap::before {
        inset: -2% -4%;
      }

      .board-wrap::after {
        font-size: clamp(1.9rem, 9vw, 3.8rem);
      }

      .sound-toggle {
        width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 1100px) and (orientation: landscape) {
      .board-wrap {
        width: min(52vw, 72dvh, 520px);
      }
    }

    @media (max-width: 760px) and (orientation: portrait) {
      .board-wrap {
        width: min(88vw, 42dvh, 520px);
      }

    }
  </style>
</head>
<body>
  <button id="soundBtn" class="sound-toggle" aria-label="Sound off" title="Sound off">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="speaker" d="M4 9v6h4l5 4V5L8 9H4Z"></path>
      <path class="sound-wave" d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"></path>
      <path class="mute-slash" d="M18 8 21 16"></path>
    </svg>
  </button>

  <div id="startScreen" class="screen">
    <section class="menu">
      <div class="eyebrow">Rod Space Party Game</div>
      <h1>Darts</h1>
      <p>Pick players, then throw with the classic three-tap rhythm: lock the angle, lock horizontal aim, lock vertical depth. First player to land exactly on zero wins.</p>
      <div class="player-grid" aria-label="Select player count">
        <button class="player-btn" data-players="1">1 Player</button>
        <button class="player-btn" data-players="2">2 Players</button>
        <button class="player-btn" data-players="3">3 Players</button>
        <button class="player-btn" data-players="4">4 Players</button>
      </div>
    </section>
  </div>

  <main class="game">
    <aside id="scoreboard" class="scoreboard panel" aria-label="Player scores"></aside>

    <section class="stage">
      <div class="board-wrap">
        <div class="angle-wrap">
          <canvas id="angleCanvas"></canvas>
        </div>
        <canvas id="gameCanvas" width="720" height="720" aria-label="Dart board"></canvas>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const angleCanvas = document.getElementById("angleCanvas");
    const actx = angleCanvas.getContext("2d");
    const scoreboard = document.getElementById("scoreboard");
    const silentStatus = { textContent: "", style: {} };
    const lastHitLabel = silentStatus;
    const instructionBox = silentStatus;
    const turnMeta = silentStatus;
    const soundBtn = document.getElementById("soundBtn");

    const SIZE = 720;
    const CENTER = SIZE / 2;
    const RADIUS = 326;
    const NUMBERS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const PLAYER_COLORS = ["#ef4444", "#4aa3ff", "#21b57a", "#ffd84d"];
    const PLAYER_NAMES = ["Player 1", "Player 2", "Player 3", "Player 4"];
    const START_SCORE = 300;
    const BASE_SPEED = 7.6;
    const MAX_SPEED = 13;
    const RINGS = {
      doubleOuter: 284,
      doubleInner: 266,
      tripleOuter: 177,
      tripleInner: 158,
      bullOuter: 28,
      bullInner: 12
    };

    let players = [];
    let currentPlayerIndex = 0;
    let state = "WAITING";
    let angleProgress = 0.5;
    let angleDirection = 1;
    let scanAngle = 0;
    let scanOffsetX = 0;
    let scanOffsetY = 0;
    let scanDirX = 1;
    let scanDirY = -1;
    let speed = BASE_SPEED;
    let darts = [];
    let throwCount = 1;
    let audioContext = null;
    let soundEnabled = false;
    let animationStarted = false;

    function resizeAngleCanvas() {
      const rect = angleCanvas.getBoundingClientRect();
      angleCanvas.width = Math.max(1, rect.width * window.devicePixelRatio);
      angleCanvas.height = Math.max(1, rect.height * window.devicePixelRatio);
      actx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    function makePlayer(index) {
      return {
        index,
        name: PLAYER_NAMES[index],
        score: START_SCORE,
        color: PLAYER_COLORS[index],
        history: []
      };
    }

    function startGame(count) {
      players = Array.from({ length: count }, (_, index) => makePlayer(index));
      currentPlayerIndex = 0;
      state = "CHOOSE_ANGLE";
      speed = BASE_SPEED;
      darts = [];
      throwCount = 1;
      document.getElementById("startScreen").classList.add("hidden");
      renderScoreboard();
      prepareThrow();
      if (!animationStarted) {
        animationStarted = true;
        requestAnimationFrame(update);
      }
    }

    function currentPlayer() {
      return players[currentPlayerIndex];
    }

    function prepareThrow() {
      state = "CHOOSE_ANGLE";
      angleProgress = Math.random();
      angleDirection = Math.random() > 0.5 ? 1 : -1;
      scanOffsetX = 0;
      scanOffsetY = 0;
      scanDirX = Math.random() > 0.5 ? 1 : -1;
      scanDirY = Math.random() > 0.5 ? 1 : -1;
      setInstruction("Set Angle");
      updateHud();
    }

    function setInstruction(text) {
      instructionBox.textContent = text;
    }

    function renderScoreboard() {
      scoreboard.innerHTML = "";
      players.forEach((player, index) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.id = `player-${index}`;
        card.innerHTML = `
          <div class="swatch" style="background:${player.color}"></div>
          <div>
            <div class="player-name">${player.name}</div>
            <div class="micro">Need exact zero</div>
          </div>
          <div class="player-score" id="score-${index}">${player.score}</div>
        `;
        scoreboard.appendChild(card);
      });
    }

    function updateHud() {
      players.forEach((player, index) => {
        document.getElementById(`player-${index}`)?.classList.toggle("active", index === currentPlayerIndex);
        const scoreEl = document.getElementById(`score-${index}`);
        if (scoreEl) scoreEl.textContent = player.score;
      });
      const player = currentPlayer();
      turnMeta.textContent = player ? `${player.name} - Throw ${throwCount}` : "Throw 1";
    }

    // The board is drawn in canvas so the file stays portable and fast as a single static game.
    function drawBoard() {
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.save();
      ctx.translate(CENTER, CENTER);

      const slice = Math.PI * 2 / 20;
      const start = -Math.PI / 2 - slice / 2;
      const cork = ctx.createRadialGradient(-80, -110, 40, 0, 0, RADIUS);
      cork.addColorStop(0, "#2b2b26");
      cork.addColorStop(0.52, "#151615");
      cork.addColorStop(1, "#070808");

      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 18;
      drawCircle(RADIUS + 18, "#120d09", "#4b3420", 12);
      ctx.restore();

      drawCircle(RADIUS + 3, "#25170f", "#89683e", 4);
      drawCircle(RADIUS - 18, cork, "#0d0d0c", 2);

      for (let i = 0; i < 20; i++) {
        const a0 = start + i * slice;
        const a1 = a0 + slice;
        const light = i % 2 === 0;
        drawWedge(0, RINGS.doubleOuter, a0, a1, light ? "#eee5d3" : "#151817", "rgba(0,0,0,0.46)", 1);
        drawWedge(RINGS.tripleInner, RINGS.tripleOuter, a0, a1, light ? "#c92c33" : "#18a16e", "#17100d", 1.5);
        drawWedge(RINGS.doubleInner, RINGS.doubleOuter, a0, a1, light ? "#c92c33" : "#18a16e", "#17100d", 1.5);
        drawWedge(RINGS.doubleOuter, RADIUS - 20, a0, a1, "#19120e", "rgba(255,255,255,0.035)", 0.8);

        const labelAngle = a0 + slice / 2;
        const labelRadius = 306;
        const labelX = Math.cos(labelAngle) * labelRadius;
        const labelY = Math.sin(labelAngle) * labelRadius;
        ctx.font = "1000 28px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(0, 0, 0, 0.62)";
        ctx.strokeText(NUMBERS[i], labelX, labelY + 2);
        ctx.fillStyle = "#fff3dd";
        ctx.fillText(NUMBERS[i], labelX, labelY + 2);
      }

      drawCircle(RINGS.bullOuter, "#18a16e", "#120f0d", 2);
      drawCircle(RINGS.bullInner, "#c92c33", "#120f0d", 2);
      drawWire();
      drawBoardShine();
      ctx.restore();
    }

    function drawCircle(radius, fill, stroke, width) {
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawWedge(inner, outer, start, end, fill, stroke, width) {
      ctx.beginPath();
      ctx.arc(0, 0, outer, start, end);
      ctx.arc(0, 0, inner, end, start, true);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawWire() {
      ctx.strokeStyle = "rgba(255,255,255,0.34)";
      ctx.lineWidth = 1.45;
      for (const radius of [RINGS.bullInner, RINGS.bullOuter, RINGS.tripleInner, RINGS.tripleOuter, RINGS.doubleInner, RINGS.doubleOuter]) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let i = 0; i < 20; i++) {
        const angle = -Math.PI / 2 - Math.PI / 20 + i * Math.PI * 2 / 20;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * RINGS.bullOuter, Math.sin(angle) * RINGS.bullOuter);
        ctx.lineTo(Math.cos(angle) * RINGS.doubleOuter, Math.sin(angle) * RINGS.doubleOuter);
        ctx.stroke();
      }
    }

    function drawBoardShine() {
      const shine = ctx.createLinearGradient(-RADIUS, -RADIUS, RADIUS, RADIUS);
      shine.addColorStop(0, "rgba(255,255,255,0.10)");
      shine.addColorStop(0.24, "rgba(255,255,255,0.02)");
      shine.addColorStop(0.62, "rgba(0,0,0,0)");
      shine.addColorStop(1, "rgba(0,0,0,0.28)");
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.arc(0, 0, RADIUS + 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawDarts() {
      for (const dart of darts) {
        ctx.save();
        ctx.translate(dart.x, dart.y);
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(8, 0);
        ctx.moveTo(0, -8);
        ctx.lineTo(0, 8);
        ctx.stroke();

        ctx.strokeStyle = dart.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-7, 0);
        ctx.lineTo(7, 0);
        ctx.moveTo(0, -7);
        ctx.lineTo(0, 7);
        ctx.stroke();

        ctx.fillStyle = "#f6f1e8";
        ctx.strokeStyle = "rgba(0,0,0,0.65)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawAnglePicker(color) {
      actx.clearRect(0, 0, angleCanvas.width, angleCanvas.height);
      const width = angleCanvas.width / window.devicePixelRatio;
      const height = angleCanvas.height / window.devicePixelRatio;
      const pad = Math.max(18, width * 0.08);
      const start = { x: pad, y: height * 0.9 };
      const control = { x: width / 2, y: height * 0.04 };
      const end = { x: width - pad, y: height * 0.9 };
      const pointAt = (t) => {
        const inv = 1 - t;
        return {
          x: inv * inv * start.x + 2 * inv * t * control.x + t * t * end.x,
          y: inv * inv * start.y + 2 * inv * t * control.y + t * t * end.y
        };
      };
      const marker = pointAt(angleProgress);

      actx.save();
      actx.lineCap = "round";
      actx.strokeStyle = "rgba(255,255,255,0.24)";
      actx.lineWidth = 8;
      actx.beginPath();
      actx.moveTo(start.x, start.y);
      actx.quadraticCurveTo(control.x, control.y, end.x, end.y);
      actx.stroke();

      actx.strokeStyle = color;
      actx.lineWidth = 3;
      actx.beginPath();
      actx.moveTo(start.x, start.y);
      for (let i = 1; i <= 28; i++) {
        const p = pointAt(angleProgress * i / 28);
        actx.lineTo(p.x, p.y);
      }
      actx.stroke();

      actx.shadowColor = color;
      actx.shadowBlur = 10;
      actx.fillStyle = color;
      actx.beginPath();
      actx.arc(marker.x, marker.y, 8, 0, Math.PI * 2);
      actx.fill();
      actx.shadowBlur = 0;
      actx.fillStyle = "rgba(255,255,255,0.82)";
      actx.font = "900 10px Arial";
      actx.textAlign = "center";
      actx.textBaseline = "middle";
      actx.fillText("ANGLE", width / 2, height * 0.38);
      actx.restore();
    }

    // The two axis scanners preserve the original gameplay: first horizontal, then vertical/depth.
    function drawScanners(color) {
      ctx.save();
      ctx.translate(CENTER, CENTER);
      ctx.rotate(scanAngle);
      ctx.lineWidth = 4;

      if (state === "AXIS_X") {
        ctx.setLineDash([12, 12]);
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(scanOffsetX, -RADIUS);
        ctx.lineTo(scanOffsetX, RADIUS);
        ctx.stroke();
      }

      if (state === "AXIS_Y") {
        ctx.setLineDash([]);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(scanOffsetX, -RADIUS);
        ctx.lineTo(scanOffsetX, RADIUS);
        ctx.stroke();

        ctx.setLineDash([12, 12]);
        ctx.lineWidth = 4;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(-RADIUS, scanOffsetY);
        ctx.lineTo(RADIUS, scanOffsetY);
        ctx.stroke();
      }

      ctx.restore();
    }

    function update() {
      drawBoard();
      drawDarts();

      const player = currentPlayer();
      const color = player?.color || "#ffffff";

      if (state === "CHOOSE_ANGLE") {
        angleProgress += angleDirection * 0.011;
        if (angleProgress >= 1 || angleProgress <= 0) {
          angleProgress = Math.max(0, Math.min(1, angleProgress));
          angleDirection *= -1;
        }
        drawAnglePicker(color);
      } else {
        actx.clearRect(0, 0, angleCanvas.width, angleCanvas.height);
      }

      if (state === "AXIS_X") {
        scanOffsetX += scanDirX * speed;
        if (scanOffsetX > RINGS.doubleOuter || scanOffsetX < -RINGS.doubleOuter) scanDirX *= -1;
      }

      if (state === "AXIS_Y") {
        scanOffsetY += scanDirY * speed;
        if (scanOffsetY > RINGS.doubleOuter || scanOffsetY < -RINGS.doubleOuter) scanDirY *= -1;
      }

      if (state === "AXIS_X" || state === "AXIS_Y") drawScanners(color);
      requestAnimationFrame(update);
    }

    function handleAction() {
      if (state === "WAITING" || state === "COOLDOWN") return;
      unlockAudio();
      const player = currentPlayer();

      if (state === "CHOOSE_ANGLE") {
        const start = Math.PI * 1.16;
        const end = Math.PI * 1.84;
        scanAngle = start + angleProgress * (end - start) - Math.PI / 2;
        state = "AXIS_X";
        setInstruction("Set Horizontal");
        playTone(440, 0.04, "triangle", 0.05);
        return;
      }

      if (state === "AXIS_X") {
        state = "AXIS_Y";
        setInstruction("Set Vertical");
        playTone(560, 0.04, "triangle", 0.05);
        return;
      }

      if (state === "AXIS_Y") {
        state = "COOLDOWN";
        setInstruction("Throwing");
        const cos = Math.cos(scanAngle);
        const sin = Math.sin(scanAngle);
        const x = CENTER + scanOffsetX * cos - scanOffsetY * sin;
        const y = CENTER + scanOffsetX * sin + scanOffsetY * cos;
        const hit = scoreDart(x, y);
        commitThrow(player, hit, x, y);
      }
    }

    function commitThrow(player, hit, x, y) {
      const wouldScore = hit.points <= player.score;
      const entry = {
        points: wouldScore ? hit.points : 0,
        label: wouldScore ? hit.label : `Bust (${hit.label})`
      };

      darts = [{ x, y, color: player.color, angle: scanAngle }];
      player.history.push(entry);

      if (wouldScore) player.score -= hit.points;
      lastHitLabel.textContent = entry.label;
      lastHitLabel.style.color = wouldScore ? "#f6f1e8" : "#ef4444";
      playThrowSound(hit.points, wouldScore);
      updateHud();

      if (player.score === 0) {
        setInstruction(`${player.name} Wins`);
        lastHitLabel.textContent = `${player.name} wins`;
        playWinSound();
        return;
      }

      window.setTimeout(() => {
        nextTurn();
      }, 620);
    }

    function nextTurn() {
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      if (currentPlayerIndex === 0) {
        throwCount += 1;
        speed = Math.min(MAX_SPEED, speed + 0.28);
      }
      prepareThrow();
      updateHud();
    }

    function scoreDart(x, y) {
      const dx = x - CENTER;
      const dy = y - CENTER;
      const distance = Math.hypot(dx, dy);
      if (distance <= RINGS.bullInner) return { points: 50, label: "Bullseye 50" };
      if (distance <= RINGS.bullOuter) return { points: 25, label: "Outer Bull 25" };
      if (distance > RINGS.doubleOuter) return { points: 0, label: "Miss" };

      const sectorAngle = (Math.atan2(dy, dx) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
      const sector = Math.floor((sectorAngle + Math.PI / 20) / (Math.PI * 2 / 20)) % 20;
      const value = NUMBERS[sector];
      if (distance >= RINGS.doubleInner) return { points: value * 2, label: `Double ${value}` };
      if (distance >= RINGS.tripleInner && distance <= RINGS.tripleOuter) return { points: value * 3, label: `Triple ${value}` };
      return { points: value, label: `Single ${value}` };
    }

    function unlockAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
    }

    function playTone(frequency, duration, type = "sine", volume = 0.06) {
      if (!soundEnabled || !audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = type;
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(volume, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      osc.connect(gain).connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    function playThrowSound(points, counted) {
      if (!counted) {
        playTone(130, 0.12, "sawtooth", 0.08);
        return;
      }
      playTone(points >= 50 ? 820 : 520, 0.08, "triangle", 0.07);
      window.setTimeout(() => playTone(points >= 50 ? 1030 : 680, 0.05, "sine", 0.04), 70);
    }

    function playWinSound() {
      [440, 660, 880, 1320].forEach((note, index) => {
        window.setTimeout(() => playTone(note, 0.12, "triangle", 0.08), index * 90);
      });
    }

    document.querySelectorAll("[data-players]").forEach(button => {
      button.addEventListener("click", () => startGame(Number(button.dataset.players)));
    });

    document.querySelector(".game").addEventListener("pointerdown", event => {
      if (event.target.closest("button") || !document.getElementById("startScreen").classList.contains("hidden")) return;
      handleAction();
    });

    canvas.addEventListener("pointerdown", event => {
      event.stopPropagation();
      handleAction();
    });
    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      unlockAudio();
      soundBtn.classList.toggle("is-on", soundEnabled);
      soundBtn.setAttribute("aria-label", soundEnabled ? "Sound on" : "Sound off");
      soundBtn.title = soundEnabled ? "Sound on" : "Sound off";
      playTone(640, 0.06, "sine", 0.05);
    });

    window.addEventListener("keydown", event => {
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        handleAction();
      }
    });

    window.addEventListener("resize", resizeAngleCanvas);
    resizeAngleCanvas();
  </script>
</body>
</html>
