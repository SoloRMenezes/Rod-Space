<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cards Against Boredom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@400;700&display=swap');

        body {
            background-color: #111827;
            background-image: 
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%),
                radial-gradient(circle at center, #1f2937 0%, #111827 100%);
            font-family: 'Open Sans', sans-serif;
            color: #f3f4f6;
            overflow-x: hidden;
            min-height: 100vh;
            touch-action: manipulation;
        }

        h1, h2, h3, .logo-font {
            font-family: 'Fredoka One', cursive;
            letter-spacing: -0.02em;
        }

        .card {
            width: 100px;
            height: 140px;
            border-radius: 12px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .card { width: 140px; height: 190px; padding: 14px; }
        }

        .card:hover {
            transform: translateY(-5px);
            z-index: 20;
        }

        .card-black {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #374151;
            transition: opacity 0.5s ease;
        }

        .card-white {
            background-color: #ffffff;
            color: #111827;
            border: 1px solid #e5e7eb;
        }

        .card-judging {
            transform: scale(1.03);
        }

        .card-winner {
            border: 3px solid #eab308 !important;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3), 0 10px 15px -3px rgba(0, 0, 0, 0.4) !important;
            z-index: 40;
        }

        .card-selected {
            transform: translateY(-15px) !important;
            box-shadow: 0 0 0 4px #3b82f6, 0 15px 20px -5px rgba(0, 0, 0, 0.6) !important;
            z-index: 30;
        }

        .card-text {
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1.2;
            max-height: 100px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        
        @media (min-width: 768px) {
            .card-text { font-size: 0.85rem; }
        }

        .card-brand {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 800;
            opacity: 0.4;
        }

        #game-table {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }

        #prompt-container {
            background: rgba(0,0,0,0.25);
            padding: 10px 20px;
            border-radius: 100px;
            margin-bottom: 10px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        #play-area {
            display: flex;
            gap: 8px;
            min-height: 150px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 5px;
            width: 100%;
        }

        #player-hand {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 5px;
            padding: 10px;
            width: 100%;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        #start-menu {
            position: fixed;
            inset: 0;
            background: #111827;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
        }

        .menu-card {
            background: #1f2937;
            padding: 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #374151;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .input-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .number-input {
                width: 100% !important;
                text-align: left !important;
            }
        }

        .number-input {
            background: #374151;
            border: 2px solid #4b5563;
            border-radius: 12px;
            padding: 10px 15px;
            color: white;
            font-weight: bold;
            width: 90px;
            font-size: 1.25rem;
            text-align: center;
        }

        .input-label {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #9ca3af;
        }

        .btn-toggle {
            background: #374151;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            flex: 1;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-toggle.active {
            background: #3b82f6;
            color: white;
        }

        .hidden { display: none !important; }

        #scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.9);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 1px solid #374151;
        }

        #scores-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1 class="text-3xl md:text-4xl text-yellow-500 mb-8 logo-font text-center leading-tight">Cards Against Boredom</h1>
        
        <div class="mb-6">
            <label class="input-label mb-2 block">Game Mode</label>
            <div class="flex gap-2">
                <div id="mode-single" class="btn-toggle active" onclick="setMode('single')">Single Player</div>
                <div id="mode-multi" class="btn-toggle" onclick="setMode('multi')">Multiplayer</div>
            </div>
        </div>

        <div class="input-row">
            <label class="input-label">Player Count (3-12)</label>
            <input type="number" id="player-input" min="3" max="12" value="3" class="number-input">
        </div>

        <div class="input-row">
            <label class="input-label">Total Rounds (1-10)</label>
            <input type="number" id="rounds-input" min="1" max="10" value="5" class="number-input">
        </div>

        <div class="mb-8">
            <label class="input-label mb-2 block">Card Packs</label>
            <div class="flex items-center gap-3 bg-gray-800 p-3 rounded-xl border border-gray-700">
                <input type="checkbox" checked disabled class="w-5 h-5 accent-blue-500">
                <span class="text-sm font-bold">Main Pack (PG-13)</span>
            </div>
        </div>

        <div id="menu-error" class="text-red-400 text-xs font-bold uppercase mb-4 text-center hidden"></div>

        <button onclick="validateAndStart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 text-lg rounded-xl shadow-lg transition-all uppercase">Start Game</button>
    </div>
</div>

<div id="pass-screen" class="fixed inset-0 bg-gray-900 z-[1500] flex flex-col items-center justify-center text-center hidden">
    <h2 id="pass-to-name" class="text-3xl logo-font text-white mb-8">Ready?</h2>
    <button onclick="showPlayerHand()" class="bg-blue-600 text-white font-bold py-4 px-10 rounded-full uppercase">Show My Cards</button>
</div>

<div id="game-table">
    <div id="scoreboard">
        <div id="scores-container"></div>
        <div id="round-indicator" class="text-[10px] font-black uppercase self-center bg-gray-800 px-2 py-1 rounded">R1/5</div>
    </div>

    <div id="prompt-container">
        <div id="active-prompt" class="card card-black">
            <div class="card-text">Loading...</div>
            <div class="card-brand">Against Boredom</div>
        </div>
    </div>

    <div id="status-msg" class="text-[10px] text-gray-400 font-bold mb-2 uppercase h-4 text-center"></div>

    <div id="play-area"></div>

    <div class="flex gap-2 mb-2">
        <button id="confirm-btn" onclick="confirmSelection()" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-full hidden uppercase text-xs">Play</button>
        <button id="next-round-btn" onclick="nextRound()" class="bg-yellow-500 text-black font-bold py-2 px-6 rounded-full hidden uppercase text-xs">Continue</button>
    </div>

    <div id="player-hand"></div>
</div>

<div id="sound-toggle" onclick="toggleSound()" class="fixed bottom-4 right-4 bg-gray-800/80 p-2 rounded-full text-[10px] font-bold cursor-pointer">
    <span id="sound-icon">🔈</span> <span id="sound-text">OFF</span>
</div>

<div id="overlay" class="fixed inset-0 bg-black/90 z-[2000] flex flex-col items-center justify-center hidden">
    <h1 class="text-4xl text-yellow-500 mb-2 logo-font">GAME OVER</h1>
    <p id="overlay-msg" class="text-white mb-8 uppercase text-sm"></p>
    <button onclick="location.reload()" class="bg-white text-black font-bold py-3 px-8 rounded-full">MAIN MENU</button>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = false;

    function playSound(type) {
        if (!soundEnabled) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'slap') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        if (soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('sound-text').innerText = soundEnabled ? 'ON' : 'OFF';
        document.getElementById('sound-icon').innerText = soundEnabled ? '🔊' : '🔈';
    }

    const prompts = [
        "The principal banned ____.", "What's that smell?", "I got detention for ____.", "My superpower is ____.", "The new TikTok trend is ____.", "Mom! It's just ____.", "Goku fights ____.", "I fear ____.", "____ for dinner.", "Step 1: ____. Step 2: Profit.", "Doctors recommend ____.", "The Mc____.", "Worst ice cream: ____.", "Slow Wi-Fi is caused by ____.", "Anime betrayal: ____."
    ];

    const answers = [
        "A wet sock.", "Three hamsters.", "A screaming goat.", "Kanye West.", "Nicolas Cage.", "Magic beans.", "Shrek.", "A used diaper.", "Eating glue.", "Socks with sandals.", "A potato.", "My search history.", "Darth Vader.", "The mitochondria.", "Stepping on a Lego.", "Glitter.", "A clown.", "Farting.", "Tax evasion.", "A weird rash.", "Just a salad.", "Bees?", "Dad jokes.", "Social anxiety.", "Eating a spider.", "Licking a doorknob.", "The Illuminati.", "Being awkward.", "Using comic sans.", "Rick Astley.", "A dumpster fire.", "TikTok.", "Existential dread.", "A cardboard box.", "Homework.", "Cold pizza."
    ];

    let gameMode = "single", players = [], activePlayerIndex = 0, currentJudgeIndex = 0;
    let currentRound = 1, deckPrompts = [], deckAnswers = [], playedCards = [], selectedIndices = [];
    let blanksRequired = 1, maxRoundsLimit = 5;
    const HAND_SIZE = 7;

    // Fisher-Yates Shuffle for better randomness
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function setMode(mode) {
        gameMode = mode;
        document.getElementById('mode-single').classList.toggle('active', mode === 'single');
        document.getElementById('mode-multi').classList.toggle('active', mode === 'multi');
    }

    function validateAndStart() {
        const pCount = parseInt(document.getElementById('player-input').value);
        const rCount = parseInt(document.getElementById('rounds-input').value);
        if (pCount < 3 || pCount > 12 || rCount < 1 || rCount > 10) {
            document.getElementById('menu-error').innerText = "Invalid Input";
            document.getElementById('menu-error').classList.remove('hidden');
            return;
        }
        maxRoundsLimit = rCount;
        players = Array.from({ length: pCount }, (_, i) => ({
            name: gameMode === 'single' ? (i === 0 ? "You" : `Bot ${i}`) : `P${i + 1}`,
            hand: [], score: 0, isBot: gameMode === 'single' && i !== 0
        }));
        deckPrompts = shuffle([...prompts]);
        deckAnswers = shuffle([...answers]);
        players.forEach(p => { for (let i = 0; i < HAND_SIZE; i++) p.hand.push(drawAnswer()); });
        document.getElementById('start-menu').classList.add('hidden');
        startRound();
    }

    function drawAnswer() { return (deckAnswers.length ? deckAnswers : deckAnswers = shuffle([...answers])).pop(); }

    function startRound() {
        playedCards = []; activePlayerIndex = 0; selectedIndices = [];
        document.getElementById('prompt-container').style.opacity = "1";
        const prompt = (deckPrompts.length ? deckPrompts : deckPrompts = shuffle([...prompts])).pop();
        document.querySelector('#active-prompt .card-text').innerText = prompt;
        blanksRequired = (prompt.match(/____/g) || [1]).length;
        document.getElementById('round-indicator').innerText = `R${currentRound}/${maxRoundsLimit}`;
        document.getElementById('play-area').innerHTML = '';
        document.getElementById('confirm-btn').classList.add('hidden');
        document.getElementById('next-round-btn').classList.add('hidden');
        updateScoreboard();
        setupPlayerTurn();
    }

    function setupPlayerTurn() {
        if (activePlayerIndex >= players.length) { startJudging(); return; }
        const p = players[activePlayerIndex];
        if (p.isBot) {
            const chosen = [];
            for(let i=0; i<blanksRequired; i++) chosen.push(p.hand.splice(Math.floor(Math.random()*p.hand.length), 1)[0]);
            playedCards.push({ owner: p.name, text: chosen.join(" / ") });
            activePlayerIndex++; setupPlayerTurn();
        } else if (activePlayerIndex === currentJudgeIndex) {
            activePlayerIndex++; setupPlayerTurn();
        } else {
            document.getElementById('pass-screen').classList.remove('hidden');
            document.getElementById('pass-to-name').innerText = `${p.name}'s Turn`;
        }
    }

    function showPlayerHand() {
        document.getElementById('pass-screen').classList.add('hidden');
        document.getElementById('status-msg').innerText = `Pick ${blanksRequired}`;
        renderHand();
    }

    function renderHand() {
        const handEl = document.getElementById('player-hand');
        handEl.innerHTML = '';
        players[activePlayerIndex].hand.forEach((text, i) => {
            const card = document.createElement('div');
            card.className = `card card-white ${selectedIndices.includes(i) ? 'card-selected' : ''}`;
            card.innerHTML = `<div class="card-text">${text}</div><div class="card-brand">Against Boredom</div>`;
            card.onclick = () => {
                if(selectedIndices.includes(i)) selectedIndices = selectedIndices.filter(x => x !== i);
                else if(selectedIndices.length < blanksRequired) { selectedIndices.push(i); playSound('slap'); }
                renderHand();
                document.getElementById('confirm-btn').classList.toggle('hidden', selectedIndices.length < blanksRequired);
            };
            handEl.appendChild(card);
        });
    }

    function confirmSelection() {
        const p = players[activePlayerIndex];
        const chosen = selectedIndices.sort((a,b)=>b-a).map(i => p.hand.splice(i, 1)[0]);
        playedCards.push({ owner: p.name, text: chosen.reverse().join(" / ") });
        selectedIndices = [];
        document.getElementById('confirm-btn').classList.add('hidden');
        document.getElementById('player-hand').innerHTML = '';
        activePlayerIndex++; setupPlayerTurn();
    }

    function startJudging() {
        document.getElementById('player-hand').innerHTML = '';
        document.getElementById('prompt-container').style.opacity = "0.5";
        const judge = players[currentJudgeIndex];
        document.getElementById('status-msg').innerText = `Judge: ${judge.name}`;
        if (judge.isBot) revealCards(true);
        else {
            document.getElementById('pass-screen').classList.remove('hidden');
            document.getElementById('pass-to-name').innerText = `Judge: ${judge.name}`;
            document.querySelector('#pass-screen button').onclick = () => {
                document.getElementById('pass-screen').classList.add('hidden');
                revealCards(false);
            };
        }
    }

    function revealCards(isBotJudge) {
        const area = document.getElementById('play-area'); area.innerHTML = '';
        shuffle([...playedCards]).forEach((c, i) => {
            const card = document.createElement('div');
            card.className = `card card-white card-judging`;
            card.innerHTML = `<div class="card-text">${c.text}</div><div class="card-brand">???</div>`;
            card.onclick = () => { if (!players[currentJudgeIndex].isBot) selectWinner(c); };
            area.appendChild(card);
        });
        if (isBotJudge) setTimeout(() => selectWinner(playedCards[Math.floor(Math.random()*playedCards.length)]), 1500);
    }

    function selectWinner(winnerData) {
        players.find(p => p.name === winnerData.owner).score++;
        document.getElementById('status-msg').innerText = `${winnerData.owner} wins!`;
        document.querySelectorAll('#play-area .card').forEach(el => {
            const text = el.querySelector('.card-text').innerText;
            const cardData = playedCards.find(pc => pc.text === text);
            el.querySelector('.card-brand').innerText = cardData.owner;
            el.classList.remove('card-judging');
            if (cardData.owner === winnerData.owner) el.classList.add('card-winner');
        });
        updateScoreboard();
        document.getElementById('next-round-btn').classList.remove('hidden');
    }

    function nextRound() {
        if (currentRound >= maxRoundsLimit) { endGame(); return; }
        currentRound++; currentJudgeIndex = (currentJudgeIndex + 1) % players.length;
        players.forEach(p => { while(p.hand.length < HAND_SIZE) p.hand.push(drawAnswer()); });
        startRound();
    }

    function updateScoreboard() {
        const container = document.getElementById('scores-container');
        container.innerHTML = players.map((p, i) => `
            <div class="flex flex-col items-center min-w-[40px] ${i === currentJudgeIndex ? 'text-yellow-500' : 'text-gray-400'}">
                <span class="text-[8px] font-black">${p.name}</span>
                <span class="text-xs font-bold">${p.score}</span>
            </div>
        `).join('');
    }

    function endGame() {
        const winner = [...players].sort((a,b) => b.score - a.score)[0];
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('overlay-msg').innerText = `${winner.name} wins with ${winner.score} points!`;
    }
</script>
</body>
</html>
