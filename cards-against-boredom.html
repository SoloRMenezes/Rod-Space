            --table: #111927;
            --panel: rgba(16, 24, 39, 0.84);

            --blue: #5aa9ff;

        body {

                radial-gradient(circle at 75% 15%, rgba(255,209,102,0.13), transparent 28%),

            overflow-x: hidden;
            min-height: 100vh;
            touch-action: manipulation;

        h1, h2, h3, .logo-font {

            letter-spacing: 0;
        }

        button, .btn-toggle, label {

        }

        .card {
            width: 108px;
            height: 152px;
            border-radius: 8px;
            padding: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.36);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .card { width: 144px; height: 196px; padding: 16px; }
        }

        .card:hover {
            transform: translateY(-6px);
            z-index: 20;
        }

        .card-black {
            background:

                #050505;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.16);
            transition: opacity 0.5s ease;
        }

        .card-white {
            background:

                #f8fafc;
            color: #111827;
            border: 1px solid rgba(255,255,255,0.82);
        }

        .card-judging {
            animation: dealIn 0.28s ease both;
        }

        .card-winner {
            border: 3px solid var(--amber) !important;
            box-shadow: 0 0 0 5px rgba(255, 209, 102, 0.14), 0 24px 44px rgba(0, 0, 0, 0.46) !important;
            z-index: 40;
        }

        .card-selected {
            transform: translateY(-16px) rotate(-1deg) !important;
            box-shadow: 0 0 0 4px var(--blue), 0 20px 36px rgba(0, 0, 0, 0.48) !important;
            z-index: 30;
        }

        .card-text {
            font-size: 0.76rem;
            font-weight: 700;
            line-height: 1.25;
            max-height: 112px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        
        @media (min-width: 768px) {
            .card-text { font-size: 0.85rem; }
        }

        .card-brand {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 800;
            opacity: 0.5;
        }

            align-items: center;

            font-size: 1.25rem;
            text-align: center;

        .input-label {

            font-weight: 800;

<script>
  function clampInput(el) {
    const min = parseInt(el.min);
    const max = parseInt(el.max);
    let val = parseInt(el.value);
    if (isNaN(val)) val = min;
    if (val < min) val = min;
    if (val > max) val = max;
    el.value = val;
  }
</script>

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;

    function selectWinner(winnerData) {
        document.getElementById('confirm-winner-btn').classList.add('hidden');

            if (cardData.owner === winnerData.owner) el.classList.add('card-winner');

    function nextRound() {

        if (gameMode === 'multi') currentJudgeIndex = (currentJudgeIndex + 1) % players.length;
        players.forEach(p => { while(p.hand.length < HAND_SIZE) p.hand.push(drawAnswer(p.hand)); });

    function updateScoreboard() {
        const container = document.getElementById('scores-container');

    function endGame() {
        const winner = [...players].sort((a,b) => b.score - a.score)[0];
