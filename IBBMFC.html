<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Business HL - Flashcard SRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .flashcard {
            perspective: 1000px;
            height: 300px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
            border-radius: 1.25rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .flashcard-front {
            background-color: #1e293b;
        }

        .flashcard-back {
            background-color: #334155;
            transform: rotateY(180deg);
        }

        .progress-bar {
            height: 6px;
            background-color: #1e293b;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            transition: width 0.4s ease;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md space-y-6">
        <!-- Header -->
        <div class="text-center relative">
            <h1 class="text-3xl font-bold text-indigo-400">IB Business HL</h1>
            <p class="text-slate-400 text-sm mt-2">Personal Study Assistant</p>
            
            <!-- Undo Button -->
            <button id="undo-btn" onclick="undoLastAction()" class="absolute right-0 top-0 text-slate-500 hover:text-indigo-400 transition hidden flex items-center gap-1 text-xs font-semibold uppercase tracking-wider">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                Undo
            </button>
        </div>

        <!-- Stats -->
        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 backdrop-blur-sm">
            <div class="flex justify-between text-xs font-semibold mb-3 tracking-wide uppercase">
                <span class="text-emerald-400">Mastered: <span id="mastered-count">0</span></span>
                <span class="text-indigo-300">Remaining: <span id="learning-count">0</span></span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Flashcard -->
        <div id="card-container" class="flashcard">
            <div class="flashcard-inner" onclick="flipCard()">
                <div class="flashcard-front">
                    <h2 id="term" class="text-2xl font-bold tracking-tight">Loading...</h2>
                </div>
                <div class="flashcard-back overflow-y-auto">
                    <p id="definition" class="text-lg leading-relaxed font-medium text-slate-100"></p>
                </div>
            </div>
        </div>

        <!-- Hint Text -->
        <p id="hint" class="text-center text-slate-500 text-xs animate-pulse">Tap card to see definition</p>

        <!-- Controls -->
        <div id="controls" class="grid grid-cols-3 gap-3 hidden">
            <button onclick="handleResponse('hard')" class="bg-rose-500/20 hover:bg-rose-500 border border-rose-500/50 text-rose-200 hover:text-white font-bold py-4 rounded-xl transition-all duration-200 shadow-lg">
                Hard
            </button>
            <button onclick="handleResponse('good')" class="bg-amber-500/20 hover:bg-amber-500 border border-amber-500/50 text-amber-200 hover:text-white font-bold py-4 rounded-xl transition-all duration-200 shadow-lg">
                Good
            </button>
            <button onclick="handleResponse('easy')" class="bg-emerald-500/20 hover:bg-emerald-500 border border-emerald-500/50 text-emerald-200 hover:text-white font-bold py-4 rounded-xl transition-all duration-200 shadow-lg">
                Easy
            </button>
        </div>

        <!-- Session Finished -->
        <div id="done-message" class="hidden text-center py-12 bg-slate-800/30 rounded-2xl border border-dashed border-slate-600">
            <div class="text-5xl mb-4">🏆</div>
            <p class="text-2xl font-bold text-emerald-400">Great Progress!</p>
            <p class="text-slate-400 mt-2">You've cleared the current deck.</p>
            <button onclick="resetSession()" class="mt-8 px-6 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-full text-sm font-bold transition">Review Again</button>
        </div>

        <!-- Footer / Utility -->
        <div class="pt-6 flex justify-center">
            <button onclick="clearLocalStorage()" class="text-slate-600 text-[10px] hover:text-rose-400 transition tracking-widest uppercase">
                Reset All Data
            </button>
        </div>
    </div>

    <script>
        const cardData = [
            { t: "Ansoff Matrix", d: "Market Penetration, Market Development, Product Development, Product Diversification" },
            { t: "Business Plan", d: "A written statement of the business's goals and objectives, and the steps to be taken to achieve them." },
            { t: "Company/Corporation", d: "Legal entity separate from its owners" },
            { t: "Cooperative", d: "A business that is owned by the members it serves and is managed in their interest." },
            { t: "Corporate Social Responsibility", d: "Business's concern for society's welfare" },
            { t: "Decision Tree", d: "Shows conditions and actions graphically" },
            { t: "Diversification", d: "A strategy of increasing sales by introducing new products into new markets" },
            { t: "Dividends", d: "Earnings distributed to stockholders" },
            { t: "Economic Influences", d: "Food choices based on supply and demand, price and availability" },
            { t: "Economies of Scale", d: "Cost advantages associated with large-scale production" },
            { t: "Ethical Objectives", d: "Pressure on business to have ethical manners, expected from the general public" },
            { t: "External Growth", d: "Business takes over or merges with another." },
            { t: "Fiscal Policy", d: "Government policy that attempts to manage the economy by controlling taxing and spending." },
            { t: "Fishbone Diagram", d: "Visual model to clarify cause and effect relationships" },
            { t: "Fixed Costs", d: "Costs that are the same no matter how many units of a good are produced" },
            { t: "Force Field Analysis", d: "Analyzing the reasons for a problem as well as what is preventing the problem from being eliminated" },
            { t: "Franchise", d: "A legal agreement that gives an individual the right to market a company's products or services in a particular area." },
            { t: "Globalization", d: "Process of interaction and integration among people, companies, and governments worldwide." },
            { t: "Gross Domestic Product", d: "The sum total of the value of all the goods and services produced in a nation" },
            { t: "Horizontal Integration", d: "A company buys out all of its competition." },
            { t: "Inorganic Growth", d: "Expansion by merging with or taking over another business." },
            { t: "Internal Stakeholder", d: "Stakeholders that work within the business." },
            { t: "Joint Venture", d: "A partnership created by two or more companies for a specific purpose over a set period of time." },
            { t: "Merger", d: "Combination of two or more companies into a single firm" },
            { t: "Monetary Policy", d: "Changes in the money supply to fight recessions or inflations" },
            { t: "Multinational Corporation", d: "A large company that has operations in more than one country" },
            { t: "Non-profit Organization", d: "A business whose goal is to provide a service rather than to make a profit." },
            { t: "Operational Objectives", d: "Deals with the day-to-day or short-term planning for delivery of a business process" },
            { t: "Organic Growth", d: "Where a business grows naturally without merging or taking over other businesses" },
            { t: "PEST Analysis", d: "Political, Economic, Social and Technological factors assessment." },
            { t: "Primary Sector", d: "Part of an economy dominated by agriculture, including fishing and forestry." },
            { t: "Secondary Sector", d: "Transforms raw materials into manufactured goods" },
            { t: "Social Influences", d: "The forces other people exert on one's buying behavior" },
            { t: "Stakeholder", d: "The people whose interests are affected by an organization's activities" },
            { t: "SWOT Analysis", d: "Strengths, Weaknesses, Opportunities, Threats" },
            { t: "Vertical Integration", d: "Single entity controls the entire process of a product, from raw materials to distribution" },
            { t: "Vision", d: "A long-term strategy for attaining a goal" },
            { t: "Unique Selling Point (USP)", d: "A feature or function of a product that makes it different from any other on the market." },
            { t: "Appraisal", d: "Evaluation or estimation of worth" },
            { t: "Arbitration", d: "Neutral person or panel listens to both sides of a dispute and reaches a decision" },
            { t: "Autocratic", d: "Absolute in power or authority" },
            { t: "Centralization", d: "Degree to which decision making is concentrated at a single point in an organization." },
            { t: "Chain of Command", d: "The order of hierarchy" },
            { t: "Collective Bargaining", d: "Union representing workers negotiates with management for a contract" },
            { t: "Conciliation", d: "Appeasement/Mediation" },
            { t: "De-layering", d: "The removal of one or more layers from the organisational structure" },
            { t: "Decentralization", d: "Decision-making authority is given to lower levels in hierarchy." },
            { t: "Democratic", d: "Decision making where power is shared among people" },
            { t: "Dismissal", d: "Termination of contract due to incompetence or indiscipline" },
            { t: "Empowerment", d: "The delegation of power and authority to subordinates" },
            { t: "Financial Rewards", d: "Cash and non-cash rewards paid to workers to motivate effort" },
            { t: "Human Resource Management", d: "Management of formal relationship between employer and employees" },
            { t: "Labor Productivity", d: "Quantity of goods and services produced by one worker or one hour of work" },
            { t: "Labor Turnover", d: "The number of workers who leave a firm each year" },
            { t: "Laissez-faire", d: "Hands off approach. No government intervention." },
            { t: "Levels of Hierarchy", d: "Number of layers of management existing in an organisation" },
            { t: "Maslow's Motivational Theory", d: "Hierarchy of needs (Physiological to Self-actualization)" },
            { t: "Offshoring", d: "Relocation of business processes to a lower-cost foreign location" },
            { t: "Organization Chart Types", d: "Hierarchy and Matrix models" },
            { t: "Outsourcing", d: "Turning over responsibility for production to independent suppliers." },
            { t: "Paternalistic", d: "Work-center behavior coupled with protective employee concern" },
            { t: "Pink's Motivational Theory", d: "Self-direction (Autonomy), mastering skills (Mastery), finding Purpose" },
            { t: "Redundancy", d: "Unnecessary repetition or removal of roles no longer required" },
            { t: "Remuneration", d: "Payment for work done" },
            { t: "Situational Leadership", d: "Adjustment of style to specific situations and employee needs." },
            { t: "Slow Downs", d: "Decreased sales during offseason" },
            { t: "Span of Control", d: "Number of individuals who report to a supervisor." },
            { t: "Strike Action", d: "Refusal to work resulting from industrial unrest" },
            { t: "Taylor's Motivational Theory", d: "Workers are paid based on the amount they produce" },
            { t: "Termination", d: "The end of an employment contract" },
            { t: "Above-the-line Promotion", d: "Promotion through advertising: TV, radio, internet, press, etc." },
            { t: "Advertising", d: "Media message designed to interest consumers in purchasing" },
            { t: "Asset-led Marketing", d: "Bases strategy on firm's existing strengths instead of just customer wants." },
            { t: "Below-the-line Promotion", d: "Non-media short-term incentives to purchase" },
            { t: "Boston Matrix", d: "Analyses product portfolio: Stars, Cash Cows, Problem Children, Dogs" },
            { t: "Branding", d: "Use of name/symbol/logo to differentiate a product" },
            { t: "Differentiation", d: "Making a product different from other similar products" },
            { t: "Distribution Channels", d: "The path through which products or services get to customers" },
            { t: "Extension Strategy", d: "Extending product life cycle when it reaches maturity or saturation." },
            { t: "Guerilla Marketing", d: "Low cost, creative strategies to reach niche markets" },
            { t: "Market Orientation", d: "Locating economic activity close to its market" },
            { t: "Market Research", d: "Effort to gather and interpret information about a market" },
            { t: "Market Share", d: "Organization's portion of total industry sales" },
            { t: "Marketing Mix", d: "Product, Price, Place, Promotion" },
            { t: "Marketing Myopia", d: "Defining business by goods rather than customer benefits" },
            { t: "Mass Market", d: "Products and promotions to please large groups of people" },
            { t: "Niche Market", d: "A small market for specialized products" },
            { t: "Position Map", d: "Diagram illustrating product position relative to price and quality" },
            { t: "Price Elasticity", d: "Measure of sensitivity of demand to changes in price" },
            { t: "Product Life Cycle", d: "Introduction, Growth, Maturity, Decline" },
            { t: "Qualitative Research", d: "Research relying on field settings rather than statistical data" },
            { t: "Quantitative Research", d: "Research providing numerical data" },
            { t: "Segmentation", d: "Dividing a broad market into subsets of consumers with common needs" },
            { t: "Penetration Pricing", d: "Charging a low price initially to reach mass market" },
            { t: "Psychological Pricing", d: "Pricing at points that make products seem less expensive ($0.99)" }
        ];

        let state = {
            mastered: [],
            queue: [],
            currentCard: null,
            isFlipped: false,
            history: [] // Tracks previous states for undo
        };

        const storageKey = 'ib_biz_srs_state';

        function init() {
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                const parsed = JSON.parse(saved);
                state.mastered = parsed.mastered || [];
            }
            resetSession();
        }

        function resetSession() {
            state.queue = cardData
                .filter(c => !state.mastered.includes(c.t))
                .sort(() => Math.random() - 0.5);
            
            state.isFlipped = false;
            state.history = [];
            updateUndoButton();
            document.getElementById('card-container').classList.remove('flipped');
            document.getElementById('done-message').classList.add('hidden');
            document.getElementById('card-container').classList.remove('hidden');
            document.getElementById('hint').classList.remove('hidden');
            
            updateStats();
            nextCard();
        }

        function updateStats() {
            const masteredCount = state.mastered.length;
            const total = cardData.length;
            const percentage = (masteredCount / total) * 100;
            
            document.getElementById('mastered-count').innerText = masteredCount;
            document.getElementById('learning-count').innerText = state.queue.length;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        function updateUndoButton() {
            const undoBtn = document.getElementById('undo-btn');
            if (state.history.length > 0) {
                undoBtn.classList.remove('hidden');
            } else {
                undoBtn.classList.add('hidden');
            }
        }

        function nextCard() {
            if (state.queue.length === 0) {
                showDone();
                return;
            }
            state.currentCard = state.queue[0];
            state.isFlipped = false;
            
            document.getElementById('term').innerText = state.currentCard.t;
            document.getElementById('definition').innerText = state.currentCard.d;
            document.getElementById('card-container').classList.remove('flipped');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('hint').innerText = "Tap card to see definition";
        }

        function flipCard() {
            if (!state.currentCard) return;
            state.isFlipped = !state.isFlipped;
            const container = document.getElementById('card-container');
            const hint = document.getElementById('hint');
            
            if (state.isFlipped) {
                container.classList.add('flipped');
                document.getElementById('controls').classList.remove('hidden');
                hint.innerText = " ";
            } else {
                container.classList.remove('flipped');
                document.getElementById('controls').classList.add('hidden');
                hint.innerText = "Tap card to see definition";
            }
        }

        function handleResponse(difficulty) {
            // Save current state to history before modifying
            state.history.push({
                queue: [...state.queue.map(c => ({...c}))],
                mastered: [...state.mastered]
            });
            updateUndoButton();

            const card = state.queue.shift();
            
            if (difficulty === 'easy') {
                state.mastered.push(card.t);
                save();
            } else if (difficulty === 'good') {
                const middle = Math.floor(state.queue.length / 2);
                state.queue.splice(middle, 0, card);
            } else if (difficulty === 'hard') {
                const nearFront = Math.min(2, state.queue.length);
                state.queue.splice(nearFront, 0, card);
            }
            
            updateStats();
            nextCard();
        }

        function undoLastAction() {
            if (state.history.length === 0) return;
            
            const prevState = state.history.pop();
            state.queue = prevState.queue;
            state.mastered = prevState.mastered;
            
            save(); // Sync to localStorage in case a mastered card was undone
            updateUndoButton();
            updateStats();
            
            // UI Reset to current card in front
            document.getElementById('card-container').classList.remove('hidden');
            document.getElementById('done-message').classList.add('hidden');
            document.getElementById('hint').classList.remove('hidden');
            
            nextCard();
        }

        function showDone() {
            document.getElementById('card-container').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('hint').classList.add('hidden');
            document.getElementById('done-message').classList.remove('hidden');
        }

        function save() {
            localStorage.setItem(storageKey, JSON.stringify({ mastered: state.mastered }));
        }

        function clearLocalStorage() {
            if (confirm("Reset all your mastered progress?")) {
                localStorage.removeItem(storageKey);
                state.mastered = [];
                resetSession();
            }
        }

        init();
    </script>
</body>
</html>
