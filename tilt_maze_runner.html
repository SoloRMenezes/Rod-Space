<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Steel Ball Tilt</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #111; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { background: #000; display: block; border: 1px solid #333; }
        #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1a1a; color: #eee; z-index: 20; text-align: center; }
        #stats { position: fixed; top: 10px; width: 100%; text-align: center; color: #444; font-size: 12px; font-family: monospace; z-index: 5; }
        button { background: #eee; border: none; color: #111; padding: 20px 50px; font-size: 1.2rem; cursor: pointer; font-weight: bold; border-radius: 8px; }
        .hidden { display: none !important; }
        #debug { font-size: 10px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="stats">LVL: <span id="lvlDisplay">1</span> | <span id="sizeDisplay">11x15</span></div>
    
    <div id="ui">
        <h2>STEEL BALL</h2>
        <p>Tilt phone to roll into the hole.</p>
        <button id="startBtn">START GAME</button>
        <div id="debug">Waiting for interaction...</div>
    </div>

    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const ui = document.getElementById('ui'), lvlDisplay = document.getElementById('lvlDisplay'), sizeDisplay = document.getElementById('sizeDisplay'), debug = document.getElementById('debug');

let state = { running: false, level: 1, gridW: 11, gridH: 15, falling: false };
let gravity = { x: 0, y: 0 }, maze = [], cellSize = 0;
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 0, scale: 1 };

// Maze algorithm
function generateMaze(w, h) {
    let m = Array(h).fill().map(() => Array(w).fill(1));
    let stack = [{x: 1, y: 1}];
    m[1][1] = 0;
    while (stack.length > 0) {
        let curr = stack[stack.length - 1];
        let dirs = [{x:0,y:-2},{x:0,y:2},{x:-2,y:0},{x:2,y:0}].filter(d => {
            let nx = curr.x + d.x, ny = curr.y + d.y;
            return nx > 0 && nx < w-1 && ny > 0 && ny < h-1 && m[ny][nx] === 1;
        });
        if (dirs.length > 0) {
            let d = dirs[Math.floor(Math.random() * dirs.length)];
            m[curr.y + d.y/2][curr.x + d.x/2] = 0;
            m[curr.y + d.y][curr.x + d.x] = 0;
            stack.push({x: curr.x + d.x, y: curr.y + d.y});
        } else stack.pop();
    }
    m[h-2][w-2] = 2;
    return m;
}

function initLevel() {
    let growth = Math.floor((state.level - 1) / 5) * 4;
    state.gridW = 11 + growth;
    state.gridH = 15 + growth; 
    maze = generateMaze(state.gridW, state.gridH);
    
    const maxW = window.innerWidth - 20;
    const maxH = window.innerHeight - 60;
    cellSize = Math.min(maxW / state.gridW, maxH / state.gridH);
    
    canvas.width = state.gridW * cellSize;
    canvas.height = state.gridH * cellSize;
    
    ball.r = cellSize * 0.35;
    ball.vx = 0; ball.vy = 0; ball.scale = 1; state.falling = false;
    ball.x = cellSize * 1.5; ball.y = cellSize * 1.5;
    
    lvlDisplay.innerText = state.level;
    sizeDisplay.innerText = `${state.gridW}x${state.gridH}`;
}

function handleOrientation(e) {
    // Basic motion data mapping
    gravity.x = e.gamma * 0.15; 
    gravity.y = e.beta * 0.15;
    if(state.running) debug.innerText = `Sensors: Active (${Math.round(e.beta)})`;
}

function update() {
    if (!state.running || state.falling) return;
    ball.vx = (ball.vx + gravity.x * 0.1) * 0.94;
    ball.vy = (ball.vy + gravity.y * 0.1) * 0.94;

    const b = ball.r * 0.8;
    const check = (nx, ny) => {
        const pts = [{x:nx-b, y:ny-b},{x:nx+b, y:ny-b},{x:nx-b, y:ny+b},{x:nx+b, y:ny+b}];
        for (let p of pts) {
            let gx = Math.floor(p.x/cellSize), gy = Math.floor(p.y/cellSize);
            if (maze[gy] && maze[gy][gx] === 1) return true;
        }
        return false;
    };

    if (!check(ball.x + ball.vx, ball.y)) ball.x += ball.vx; else ball.vx *= -0.3;
    if (!check(ball.x, ball.y + ball.vy)) ball.y += ball.vy; else ball.vy *= -0.3;

    let gx = Math.floor(ball.x / cellSize), gy = Math.floor(ball.y / cellSize);
    if (maze[gy] && maze[gy][gx] === 2) {
        state.falling = true;
        setTimeout(() => { state.level++; initLevel(); }, 800);
    }
}

function draw() {
    if (!state.running) return;
    update(); // Force update inside draw loop
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let r=0; r<state.gridH; r++) {
        for (let c=0; c<state.gridW; c++) {
            let x = c*cellSize, y = r*cellSize;
            if (maze[r][c] === 1) {
                ctx.fillStyle = '#222'; ctx.fillRect(x, y, cellSize, cellSize);
                ctx.strokeStyle = '#111'; ctx.strokeRect(x, y, cellSize, cellSize);
            } else if (maze[r][c] === 2) {
                ctx.fillStyle = '#000'; ctx.beginPath();
                ctx.arc(x+cellSize/2, y+cellSize/2, cellSize*0.4, 0, 7); ctx.fill();
            }
        }
    }
    
    ctx.save();
    ctx.translate(ball.x, ball.y);
    if (state.falling) ball.scale *= 0.9;
    ctx.scale(ball.scale, ball.scale);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(2, 2, ball.r, 0, 7); ctx.fill();
    let g = ctx.createRadialGradient(-ball.r/3, -ball.r/3, 1, 0, 0, ball.r);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#888'); g.addColorStop(1, '#333');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, 7); ctx.fill();
    ctx.restore();
    
    requestAnimationFrame(draw);
}

// Fixed Start Sequence
function startApp() {
    debug.innerText = "Requesting permission...";
    
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    setupAndStart();
                } else {
                    debug.innerText = "Permission Denied.";
                }
            })
            .catch(err => {
                debug.innerText = "Error: Use HTTPS.";
                console.error(err);
            });
    } else {
        // Android or older iOS usually don't need explicit permission
        setupAndStart();
    }
}

function setupAndStart() {
    window.addEventListener('deviceorientation', handleOrientation);
    ui.classList.add('hidden');
    state.running = true;
    initLevel();
    requestAnimationFrame(draw);
}

document.getElementById('startBtn').addEventListener('click', startApp);
</script>
</body>
</html>
