<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Tilt Maze Runner</title>
<style>
    :root {
        --bg: #030405;
        --text: #f8fbff;
        --muted: #858b94;
        --danger: #ff2d55;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: #030405;
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
    }

    body.shake {
        animation: hardShake 0.38s steps(2, end);
    }

    canvas {
        display: block;
        background: #030405;
        border: 0;
        box-shadow: none;
    }

    #ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        text-align: center;
        background: #030405;
    }

    #ui h1 {
        margin: 0;
        font-size: clamp(42px, 11vw, 86px);
        line-height: 0.9;
        letter-spacing: 0;
        text-transform: uppercase;
    }

    #ui p {
        max-width: 560px;
        margin: 16px 0 28px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    #startStatus {
        min-height: 1.4em;
        margin: 14px 0 0;
        color: #b5bbc5;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    button {
        min-width: 190px;
        padding: 16px 28px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 8px;
        background: #e6e6e6;
        color: #090909;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 900;
        text-transform: uppercase;
        box-shadow: none;
    }

    button:active {
        transform: translateY(1px);
    }

    .hidden { display: none !important; }

    #scare {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
    }

    #scare::before {
        content: "";
        position: absolute;
        inset: -20%;
        background:
            repeating-linear-gradient(0deg, rgba(255,255,255,0.12) 0 2px, transparent 2px 7px),
            radial-gradient(circle at center, rgba(255,45,85,0.45), transparent 44%);
        animation: scareFlash 0.62s steps(2, end) infinite;
    }

    #scare::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.24);
        animation: scareFlash 0.12s steps(2, end) infinite;
    }

    .scare-face {
        position: relative;
        z-index: 1;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: contrast(1.2) brightness(1.08) saturate(0.86);
        transform: scale(1);
        animation: faceRush 0.62s cubic-bezier(.11,.86,.19,1) both;
    }

    @keyframes hardShake {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-16px, 12px); }
        40% { transform: translate(18px, -10px); }
        60% { transform: translate(-10px, -16px); }
        80% { transform: translate(14px, 8px); }
        100% { transform: translate(0, 0); }
    }

    @keyframes scareFlash {
        0%, 100% { opacity: 0.52; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(18px); }
    }

    @keyframes faceRush {
        0% { opacity: 0; transform: scale(0.45) rotate(-3deg); }
        36% { opacity: 1; transform: scale(1.08) rotate(1deg); }
        100% { opacity: 1; transform: scale(1.02) rotate(0); }
    }
</style>
</head>
<body>

<div id="ui">
    <h1>Tilt Maze<br>Runner</h1>
    <p>Guide the steel marble through the maze. Find the hole and keep moving.</p>
    <button id="startBtn">Start Run</button>
    <div id="startStatus"></div>
</div>

<div id="scare" class="hidden">
    <img class="scare-face" src="assets/tilt-maze/jumpscare-face.png" alt="">
</div>

<audio id="scareSound" src="assets/tilt-maze/jumpscare-scream.mp3" preload="auto"></audio>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");
const scare = document.getElementById("scare");
const scareSound = document.getElementById("scareSound");
const startBtn = document.getElementById("startBtn");
const startStatus = document.getElementById("startStatus");

const CAMERA_ZOOM = 2.45;
const FRICTION = 0.945;
const ACCEL = 0.11;
const SPAWN_HOLE_CLEARANCE = 5;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

let state = { running: false, level: 1, falling: false, scareCooldown: false };
let maze = [], cellSize = 0, worldWidth = 0, worldHeight = 0, startCell = null, exitCell = null;
let gravity = { x: 0, y: 0 }, keyGravity = { x: 0, y: 0 };
let audioCtx = null;
let noiseBuffer = null;
let fakeHoleCooldowns = new Map();
let hasStarted = false;

const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 0, trail: [] };

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);

function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

async function unlockAudio() {
    const ac = getAudioCtx();
    if (ac.state === "suspended") await ac.resume();
    const silent = ac.createBufferSource();
    const gain = ac.createGain();
    gain.gain.value = 0.001;
    silent.buffer = ac.createBuffer(1, 1, ac.sampleRate);
    silent.connect(gain);
    gain.connect(ac.destination);
    silent.start();
    scareSound.muted = true;
    scareSound.volume = 0.9;
    await scareSound.play().catch(() => {});
    scareSound.pause();
    scareSound.currentTime = 0;
    scareSound.muted = false;
}

async function requestTiltPermission() {
    if (!isMobile || typeof DeviceOrientationEvent === "undefined") return "not-needed";
    if (typeof DeviceOrientationEvent.requestPermission !== "function") {
        return "granted";
    }

    try {
        return await DeviceOrientationEvent.requestPermission();
    } catch (error) {
        console.warn("Device orientation permission failed:", error);
        return "error";
    }
}

function getNoiseBuffer() {
    const ac = getAudioCtx();
    if (noiseBuffer) return noiseBuffer;
    const length = Math.floor(ac.sampleRate * 0.75);
    noiseBuffer = ac.createBuffer(1, length, ac.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
        const fade = 1 - i / length;
        data[i] = (Math.random() * 2 - 1) * fade;
    }
    return noiseBuffer;
}

function playTone(freq, start, duration, gainValue, type = "sine") {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime + start);
    gain.gain.setValueAtTime(gainValue, ac.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + duration);
}

function playNoise(start, duration, gainValue) {
    const ac = getAudioCtx();
    const source = ac.createBufferSource();
    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();
    source.buffer = getNoiseBuffer();
    filter.type = "highpass";
    filter.frequency.setValueAtTime(900, ac.currentTime + start);
    gain.gain.setValueAtTime(gainValue, ac.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    source.start(ac.currentTime + start);
    source.stop(ac.currentTime + start + duration);
}

function playScream(start, duration, gainValue) {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();
    osc.type = "sawtooth";
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(1800, ac.currentTime + start);
    filter.Q.setValueAtTime(7, ac.currentTime + start);
    osc.frequency.setValueAtTime(520, ac.currentTime + start);
    osc.frequency.exponentialRampToValueAtTime(1760, ac.currentTime + start + duration * 0.34);
    osc.frequency.exponentialRampToValueAtTime(920, ac.currentTime + start + duration);
    gain.gain.setValueAtTime(0.001, ac.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(gainValue, ac.currentTime + start + 0.035);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + duration);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + duration);
}

function playScareSound() {
    scareSound.currentTime = 0;
    scareSound.volume = 1;
    if (audioCtx && audioCtx.state === "running") {
        playNoise(0, 0.88, 0.2);
        playScream(0.02, 0.84, 0.42);
        playTone(62, 0, 0.58, 0.34, "triangle");
    }
    scareSound.play().catch(() => {
        if (!audioCtx || audioCtx.state !== "running") return;
        playNoise(0, 0.88, 0.28);
        playScream(0.02, 0.84, 0.58);
        playScream(0.08, 0.62, 0.32);
        playTone(62, 0, 0.58, 0.44, "triangle");
    });
}

function playWinSound() {
    if (!audioCtx || audioCtx.state !== "running") return;
    playTone(320, 0, 0.14, 0.16, "triangle");
    playTone(540, 0.12, 0.16, 0.16, "triangle");
    playTone(820, 0.24, 0.2, 0.16, "triangle");
}

function isDeadEnd(m, x, y) {
    if (m[y][x] !== 0) return false;
    let open = 0;
    for (const d of [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}]) {
        if (m[y + d.y] && m[y + d.y][x + d.x] !== 1) open++;
    }
    return open === 1;
}

function getDeadEndCells(m, start) {
    const cells = [];
    for (let y = 1; y < m.length - 1; y++) {
        for (let x = 1; x < m[0].length - 1; x++) {
            if (x === start.x && y === start.y) continue;
            if (isDeadEnd(m, x, y)) cells.push({x, y});
        }
    }
    return cells;
}

function getSafeStartCell(m) {
    const center = {x: Math.floor(m[0].length / 2), y: Math.floor(m.length / 2)};
    const deadEnds = getDeadEndCells(m, {x: -1, y: -1});
    const openCells = [];
    for (let y = 1; y < m.length - 1; y++) {
        for (let x = 1; x < m[0].length - 1; x++) {
            if (m[y][x] === 0 && !isDeadEnd(m, x, y)) openCells.push({x, y});
        }
    }
    if (!openCells.length) return center;
    return openCells.sort((a, b) => {
        const nearestA = deadEnds.length ? Math.min(...deadEnds.map(deadEnd => manhattan(a, deadEnd))) : 999;
        const nearestB = deadEnds.length ? Math.min(...deadEnds.map(deadEnd => manhattan(b, deadEnd))) : 999;
        return nearestB - nearestA || manhattan(a, center) - manhattan(b, center);
    })[0];
}

function getSolutionPath(m, start, end) {
    const h = m.length, w = m[0].length;
    const q = [start];
    const prev = Array(h).fill().map(() => Array(w).fill(null));
    prev[start.y][start.x] = start;

    while (q.length) {
        const {x, y} = q.shift();
        if (x === end.x && y === end.y) break;
        for (const d of [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}]) {
            const nx = x + d.x, ny = y + d.y;
            if (nx >= 0 && ny >= 0 && nx < w && ny < h && m[ny][nx] === 0 && !prev[ny][nx]) {
                prev[ny][nx] = {x, y};
                q.push({x: nx, y: ny});
            }
        }
    }

    const path = new Set();
    let cur = end;
    while (cur && !(cur.x === start.x && cur.y === start.y)) {
        path.add(`${cur.x},${cur.y}`);
        cur = prev[cur.y][cur.x];
    }
    path.add(`${start.x},${start.y}`);
    return path;
}

function generateMaze(w, h) {
    const m = Array(h).fill().map(() => Array(w).fill(1));
    const centeredOdd = (size) => {
        let value = Math.floor(size / 2);
        if (value % 2 === 0) value--;
        return clamp(value, 1, size - 2);
    };
    const carveStart = {x: centeredOdd(w), y: centeredOdd(h)};
    const stack = [carveStart];
    m[carveStart.y][carveStart.x] = 0;

    while (stack.length) {
        const c = stack[stack.length - 1];
        const dirs = [{x:0,y:-2},{x:0,y:2},{x:-2,y:0},{x:2,y:0}].filter(d => {
            const nx = c.x + d.x, ny = c.y + d.y;
            return nx > 0 && ny > 0 && nx < w - 1 && ny < h - 1 && m[ny][nx] === 1;
        });

        if (dirs.length) {
            const d = dirs[Math.floor(Math.random() * dirs.length)];
            m[c.y + d.y / 2][c.x + d.x / 2] = 0;
            m[c.y + d.y][c.x + d.x] = 0;
            stack.push({x: c.x + d.x, y: c.y + d.y});
        } else {
            stack.pop();
        }
    }

    startCell = getSafeStartCell(m);
    const deadEnds = getDeadEndCells(m, startCell);
    exitCell = deadEnds.length
        ? deadEnds.sort((a, b) => manhattan(b, startCell) - manhattan(a, startCell))[0]
        : {x: w - 2, y: h - 2};
    deadEnds.forEach(({x, y}) => {
        if (!(x === exitCell.x && y === exitCell.y) && manhattan({x, y}, startCell) <= SPAWN_HOLE_CLEARANCE) return;
        m[y][x] = x === exitCell.x && y === exitCell.y ? 2 : 3;
    });
    return m;
}

function isHoleTile(tile) {
    return tile === 2 || tile === 3;
}

function initLevel() {
    const grow = Math.floor((state.level - 1) / 3) * 4;
    const w = 19 + grow;
    const h = 27 + grow;
    maze = generateMaze(w, h);
    cellSize = clamp(Math.floor(Math.min(innerWidth, innerHeight) / 15), 26, 48);
    worldWidth = w * cellSize;
    worldHeight = h * cellSize;
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    ball.x = cellSize * (startCell.x + 0.5);
    ball.y = cellSize * (startCell.y + 0.5);
    ball.vx = 0;
    ball.vy = 0;
    ball.r = cellSize * 0.34;
    ball.trail = [];
    state.falling = false;
    fakeHoleCooldowns = new Map();
}

function triggerScare(cx, cy) {
    if (state.falling || state.scareCooldown) return;
    if (Number.isFinite(cx) && Number.isFinite(cy)) {
        fakeHoleCooldowns.set(`${cx},${cy}`, Date.now() + 30000);
    }
    state.falling = true;
    state.scareCooldown = true;
    if (isMobile && navigator.vibrate) navigator.vibrate([90, 35, 160, 35, 240]);
    playScareSound();
    document.body.classList.add("shake");
    scare.classList.remove("hidden");

    setTimeout(() => {
        scare.classList.add("hidden");
        document.body.classList.remove("shake");
        ball.vx = 0;
        ball.vy = 0;
        ball.trail = [];
        state.falling = false;
    }, 930);

    setTimeout(() => {
        state.scareCooldown = false;
    }, 1500);
}

function update() {
    if (!state.running || state.falling) return;

    const gx = gravity.x + keyGravity.x;
    const gy = gravity.y + keyGravity.y;
    ball.vx = (ball.vx + gx * ACCEL) * FRICTION;
    ball.vy = (ball.vy + gy * ACCEL) * FRICTION;

    const b = ball.r * 0.82;
    const hitsWall = (nx, ny) => {
        for (const dx of [-b, b]) {
            for (const dy of [-b, b]) {
                const gxIdx = Math.floor((nx + dx) / cellSize);
                const gyIdx = Math.floor((ny + dy) / cellSize);
                if (maze[gyIdx] && maze[gyIdx][gxIdx] === 1) return true;
            }
        }
        return false;
    };

    if (!hitsWall(ball.x + ball.vx, ball.y)) ball.x += ball.vx;
    else ball.vx *= -0.34;

    if (!hitsWall(ball.x, ball.y + ball.vy)) ball.y += ball.vy;
    else ball.vy *= -0.34;

    const cx = Math.floor(ball.x / cellSize);
    const cy = Math.floor(ball.y / cellSize);
    const tile = maze[cy] && maze[cy][cx];
    const now = Date.now();

    fakeHoleCooldowns.forEach((expiresAt, key) => {
        if (expiresAt <= now) fakeHoleCooldowns.delete(key);
    });

    if (tile === 2) {
        state.falling = true;
        playWinSound();
        setTimeout(() => {
            state.level++;
            initLevel();
        }, 650);
    }

    if (tile === 3) {
        const key = `${cx},${cy}`;
        if ((fakeHoleCooldowns.get(key) || 0) <= now) triggerScare(cx, cy);
    }
}

function drawWalls() {
    for (let y = 0; y < maze.length; y++) {
        for (let x = 0; x < maze[0].length; x++) {
            const px = x * cellSize;
            const py = y * cellSize;
            const tile = maze[y][x];
            const isOuterWall = x === 0 || y === 0 || x === maze[0].length - 1 || y === maze.length - 1;

            if (tile === 1) {
                if (isOuterWall) {
                    ctx.fillStyle = "#030405";
                    ctx.fillRect(px, py, cellSize, cellSize);
                    continue;
                }
                const shade = 12 + ((x + y) % 3) * 5;
                ctx.fillStyle = `rgb(${shade}, ${shade + 1}, ${shade + 3})`;
                ctx.fillRect(px, py, cellSize, cellSize);
                ctx.strokeStyle = "rgba(255,255,255,0.018)";
                ctx.strokeRect(px + 0.5, py + 0.5, cellSize - 1, cellSize - 1);
            } else {
                ctx.fillStyle = "#070707";
                ctx.fillRect(px, py, cellSize, cellSize);

                if (isHoleTile(tile)) {
                    ctx.fillStyle = "#000";
                    ctx.beginPath();
                    ctx.arc(px + cellSize / 2, py + cellSize / 2, cellSize * 0.34, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    }
}

function drawHoleVignette() {
    for (let y = 1; y < maze.length - 1; y++) {
        for (let x = 1; x < maze[0].length - 1; x++) {
            if (!isHoleTile(maze[y][x])) continue;
            const hx = x * cellSize + cellSize / 2;
            const hy = y * cellSize + cellSize / 2;
            const d = Math.hypot(ball.x - hx, ball.y - hy);
            if (d > cellSize * 4.6) continue;
            const alpha = clamp(1 - d / (cellSize * 4.6), 0, 1);
            ctx.fillStyle = `rgba(0,0,0,${0.16 + alpha * 0.36})`;
            ctx.beginPath();
            ctx.arc(hx, hy, cellSize * (0.36 + alpha * 0.08), 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawBall() {
    const gradient = ctx.createRadialGradient(ball.x - ball.r * 0.35, ball.y - ball.r * 0.42, ball.r * 0.08, ball.x, ball.y, ball.r);
    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.36, "#d8e4f2");
    gradient.addColorStop(1, "#657083");
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = Math.max(1, ball.r * 0.08);
    ctx.stroke();
}

function drawDarkness() {
    const radius = Math.max(cellSize * 3.1, 92);
    const fade = Math.max(cellSize * 2.2, 78);
    const shadow = ctx.createRadialGradient(ball.x, ball.y, radius * 0.28, ball.x, ball.y, radius + fade);
    shadow.addColorStop(0, "rgba(0,0,0,0)");
    shadow.addColorStop(0.46, "rgba(0,0,0,0.18)");
    shadow.addColorStop(0.75, "rgba(0,0,0,0.72)");
    shadow.addColorStop(1, "rgba(0,0,0,0.97)");
    ctx.fillStyle = shadow;
    ctx.fillRect(-cellSize, -cellSize, worldWidth + cellSize * 2, worldHeight + cellSize * 2);
}

function drawWorldEdgeFade() {
    const edge = cellSize * 1.7;
    const fills = [
        [0, 0, worldWidth, edge, ctx.createLinearGradient(0, 0, 0, edge)],
        [0, worldHeight - edge, worldWidth, edge, ctx.createLinearGradient(0, worldHeight, 0, worldHeight - edge)],
        [0, 0, edge, worldHeight, ctx.createLinearGradient(0, 0, edge, 0)],
        [worldWidth - edge, 0, edge, worldHeight, ctx.createLinearGradient(worldWidth, 0, worldWidth - edge, 0)]
    ];

    fills.forEach(([, , , , gradient]) => {
        gradient.addColorStop(0, "rgba(0,0,0,0.96)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
    });

    fills.forEach(([x, y, w, h, gradient]) => {
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y, w, h);
    });
}

function cameraCenter(pos, viewSize, worldSize) {
    if (worldSize <= viewSize) return worldSize / 2;
    return clamp(pos, viewSize / 2, worldSize - viewSize / 2);
}

function draw() {
    if (!state.running) return;
    update();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const viewW = canvas.width / CAMERA_ZOOM;
    const viewH = canvas.height / CAMERA_ZOOM;
    const camX = cameraCenter(ball.x, viewW, worldWidth);
    const camY = cameraCenter(ball.y, viewH, worldHeight);

    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
    ctx.translate(-camX, -camY);

    drawWalls();
    drawWorldEdgeFade();
    drawDarkness();
    drawHoleVignette();
    drawBall();

    requestAnimationFrame(draw);
}

addEventListener("deviceorientation", e => {
    gravity.x = clamp(e.gamma || 0, -35, 35) * 0.15;
    gravity.y = clamp(e.beta || 0, -35, 35) * 0.15;
});

addEventListener("keydown", e => {
    const key = e.key.toLowerCase();
    if (key === "a" || e.key === "ArrowLeft") keyGravity.x = -3.2;
    if (key === "d" || e.key === "ArrowRight") keyGravity.x = 3.2;
    if (key === "w" || e.key === "ArrowUp") keyGravity.y = -3.2;
    if (key === "s" || e.key === "ArrowDown") keyGravity.y = 3.2;
});

addEventListener("keyup", e => {
    const key = e.key.toLowerCase();
    if (["a", "d"].includes(key) || ["ArrowLeft", "ArrowRight"].includes(e.key)) keyGravity.x = 0;
    if (["w", "s"].includes(key) || ["ArrowUp", "ArrowDown"].includes(e.key)) keyGravity.y = 0;
});

addEventListener("resize", () => {
    if (state.running) initLevel();
});

startBtn.addEventListener("pointerdown", () => {
    unlockAudio().catch(error => console.warn("Audio prime failed:", error));
}, { passive: true });

startBtn.onclick = async () => {
    if (hasStarted) return;
    hasStarted = true;
    startBtn.disabled = true;
    startStatus.textContent = isMobile ? "Requesting tilt..." : "Starting...";

    const tiltPermission = await requestTiltPermission();
    if (isMobile && !["granted", "not-needed"].includes(tiltPermission)) {
        startStatus.textContent = "Tilt permission blocked. Allow Motion & Orientation, then try again.";
        startBtn.disabled = false;
        hasStarted = false;
        return;
    }

    try {
        await unlockAudio();
    } catch (error) {
        console.warn("Audio unlock failed:", error);
    }

    start();
};

function start() {
    ui.classList.add("hidden");
    state.running = true;
    initLevel();
    requestAnimationFrame(draw);
}
</script>
