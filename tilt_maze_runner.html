<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Steel Ball</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    overflow: hidden;
    touch-action: none;
}
canvas {
    background: #000;
    border: 1px solid #222;
}
#ui {
    position: fixed;
    inset: 0;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    text-align: center;
}
button {
    padding: 18px 50px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}
.hidden { display: none !important; }
#stats {
    position: fixed;
    top: 8px;
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 11px;
    font-family: monospace;
    z-index: 5;
}
#scare {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-size: 120px;
}
</style>
</head>

<body>

<div id="stats">
LVL <span id="lvl">1</span> |
<span id="size">11x15</span>
</div>

<div id="ui">
<h2>STEEL BALL</h2>
<p>Tilt phone or use WASD / arrows.</p>
<button id="startBtn">START</button>
</div>

<div id="scare" class="hidden">👻</div>

<canvas id="game"></canvas>

<script>
/* ========= SETUP ========= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");
const scare = document.getElementById("scare");
const lvlEl = document.getElementById("lvl");
const sizeEl = document.getElementById("size");

const CAMERA_ZOOM = 2.3;
const WALL_HIT_THRESHOLD = 2.8;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

let state = { running:false, level:1, falling:false };
let maze=[], cellSize=0;
let gravity={x:0,y:0}, keyGravity={x:0,y:0};
let shakeTime=0, shakeStrength=0;

const ball = { x:0, y:0, vx:0, vy:0, r:0 };

/* ========= HELPERS ========= */
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
const manhattan = (a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);

function isDeadEnd(m,x,y){
    if(m[y][x]!==0) return false;
    let open=0;
    for(const d of[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}])
        if(m[y+d.y] && m[y+d.y][x+d.x]===0) open++;
    return open===1;
}

function getSolutionPath(m,start,end){
    const h=m.length,w=m[0].length;
    const q=[start];
    const prev=Array(h).fill().map(()=>Array(w).fill(null));
    prev[start.y][start.x]=start;

    while(q.length){
        const {x,y}=q.shift();
        if(x===end.x&&y===end.y) break;
        for(const d of[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]){
            const nx=x+d.x, ny=y+d.y;
            if(nx>=0&&ny>=0&&nx<w&&ny<h&&m[ny][nx]===0&&!prev[ny][nx]){
                prev[ny][nx]={x,y};
                q.push({x:nx,y:ny});
            }
        }
    }

    const path=new Set();
    let cur=end;
    while(cur && !(cur.x===start.x&&cur.y===start.y)){
        path.add(`${cur.x},${cur.y}`);
        cur=prev[cur.y][cur.x];
    }
    path.add(`${start.x},${start.y}`);
    return path;
}

/* ========= MAZE ========= */
function generateMaze(w,h){
    let m=Array(h).fill().map(()=>Array(w).fill(1));
    let stack=[{x:1,y:1}];
    m[1][1]=0;

    while(stack.length){
        let c=stack[stack.length-1];
        let dirs=[
            {x:0,y:-2},{x:0,y:2},{x:-2,y:0},{x:2,y:0}
        ].filter(d=>{
            let nx=c.x+d.x, ny=c.y+d.y;
            return nx>0&&ny>0&&nx<w-1&&ny<h-1&&m[ny][nx]===1;
        });
        if(dirs.length){
            let d=dirs[Math.random()*dirs.length|0];
            m[c.y+d.y/2][c.x+d.x/2]=0;
            m[c.y+d.y][c.x+d.x]=0;
            stack.push({x:c.x+d.x,y:c.y+d.y});
        } else stack.pop();
    }

    const start={x:1,y:1};

    const deadEnds=[];
    for(let y=1;y<h-1;y++)
        for(let x=1;x<w-1;x++)
            if(isDeadEnd(m,x,y)&&manhattan({x,y},start)>2)
                deadEnds.push({x,y});

    const main = deadEnds.length
        ? deadEnds[Math.random()*deadEnds.length|0]
        : {x:w-2,y:h-2};

    m[main.y][main.x]=2;

    const solution=getSolutionPath(m,start,main);
    const candidates=[];

    for(let y=1;y<h-1;y++){
        for(let x=1;x<w-1;x++){
            if(!isDeadEnd(m,x,y)) continue;
            if(solution.has(`${x},${y}`)) continue;
            if(manhattan({x,y},start)<=1) continue;
            if(manhattan({x,y},main)<=1) continue;
            candidates.push({x,y});
        }
    }

    if(candidates.length){
        const d=candidates[Math.random()*candidates.length|0];
        m[d.y][d.x]=3;
    }

    return m;
}

/* ========= LEVEL ========= */
function initLevel(){
    let grow=Math.floor((state.level-1)/5)*4;
    let w=11+grow, h=15+grow;
    maze=generateMaze(w,h);

    cellSize=Math.min(
        (innerWidth-20)/w,
        (innerHeight-60)/h
    );

    canvas.width=w*cellSize;
    canvas.height=h*cellSize;

    ball.x=cellSize*1.5;
    ball.y=cellSize*1.5;
    ball.vx=ball.vy=0;
    ball.r=cellSize*0.35;
    state.falling=false;

    lvlEl.textContent=state.level;
    sizeEl.textContent=`${w}x${h}`;
}

/* ========= INPUT ========= */
addEventListener("deviceorientation",e=>{
    gravity.x=e.gamma*0.15;
    gravity.y=e.beta*0.15;
});
addEventListener("keydown",e=>{
    if(e.key==="a"||e.key==="ArrowLeft") keyGravity.x=-3;
    if(e.key==="d"||e.key==="ArrowRight") keyGravity.x=3;
    if(e.key==="w"||e.key==="ArrowUp") keyGravity.y=-3;
    if(e.key==="s"||e.key==="ArrowDown") keyGravity.y=3;
});
addEventListener("keyup",e=>{
    if(["a","d","ArrowLeft","ArrowRight"].includes(e.key)) keyGravity.x=0;
    if(["w","s","ArrowUp","ArrowDown"].includes(e.key)) keyGravity.y=0;
});

/* ========= EFFECTS ========= */
function hitWallHard(speed){
    if(speed<WALL_HIT_THRESHOLD) return;
    if(isMobile && navigator.vibrate) navigator.vibrate(40);
    shakeTime=10; shakeStrength=4;
}

function triggerScare(){
    if(state.falling) return;
    state.falling=true;
    if(isMobile && navigator.vibrate) navigator.vibrate([80,40,80]);
    shakeTime=20; shakeStrength=6;
    scare.classList.remove("hidden");

    setTimeout(()=>{
        scare.classList.add("hidden");
        state.falling=false;
        ball.x=cellSize*1.5;
        ball.y=cellSize*1.5;
        ball.vx=ball.vy=0;
    },700);
}

/* ========= UPDATE ========= */
function update(){
    if(!state.running||state.falling) return;

    let gx=gravity.x+keyGravity.x;
    let gy=gravity.y+keyGravity.y;

    ball.vx=(ball.vx+gx*0.1)*0.94;
    ball.vy=(ball.vy+gy*0.1)*0.94;

    let speed=Math.hypot(ball.vx,ball.vy);
    let b=ball.r*0.8;

    const hit=(nx,ny)=>{
        for(let dx of[-b,b])for(let dy of[-b,b]){
            let gx=Math.floor((nx+dx)/cellSize);
            let gy=Math.floor((ny+dy)/cellSize);
            if(maze[gy]&&maze[gy][gx]===1) return true;
        }
        return false;
    };

    if(!hit(ball.x+ball.vx,ball.y)) ball.x+=ball.vx;
    else{ hitWallHard(speed); ball.vx*=-0.3; }

    if(!hit(ball.x,ball.y+ball.vy)) ball.y+=ball.vy;
    else{ hitWallHard(speed); ball.vy*=-0.3; }

    let gx2=Math.floor(ball.x/cellSize);
    let gy2=Math.floor(ball.y/cellSize);

    if(maze[gy2]&&maze[gy2][gx2]===2){
        state.falling=true;
        setTimeout(()=>{state.level++;initLevel();},800);
    }
    if(maze[gy2]&&maze[gy2][gx2]===3){
        triggerScare();
    }
}

/* ========= DRAW ========= */
function draw(){
    if(!state.running) return;
    update();

    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const viewW=canvas.width/CAMERA_ZOOM;
    const viewH=canvas.height/CAMERA_ZOOM;
    const camX=clamp(ball.x,viewW/2,canvas.width-viewW/2);
    const camY=clamp(ball.y,viewH/2,canvas.height-viewH/2);

    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.scale(CAMERA_ZOOM,CAMERA_ZOOM);
    ctx.translate(-camX,-camY);

    if(shakeTime>0){
        ctx.translate(
            (Math.random()-0.5)*shakeStrength,
            (Math.random()-0.5)*shakeStrength
        );
        shakeTime--;
    }

    for(let y=0;y<maze.length;y++){
        for(let x=0;x<maze[0].length;x++){
            let px=x*cellSize, py=y*cellSize;
            if(maze[y][x]===1){
                ctx.fillStyle="#222";
                ctx.fillRect(px,py,cellSize,cellSize);
            }
            if(maze[y][x]>=2){
                ctx.fillStyle="#000";
                ctx.beginPath();
                ctx.arc(px+cellSize/2,py+cellSize/2,cellSize*0.4,0,Math.PI*2);
                ctx.fill();
            }
        }
    }

    ctx.save();
    ctx.translate(ball.x,ball.y);
    ctx.fillStyle="#ddd";
    ctx.beginPath();
    ctx.arc(0,0,ball.r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    requestAnimationFrame(draw);
}

/* ========= START ========= */
document.getElementById("startBtn").onclick=()=>{
    if(DeviceOrientationEvent?.requestPermission){
        DeviceOrientationEvent.requestPermission().then(p=>{
            if(p==="granted") start();
        });
    } else start();
};

function start(){
    ui.classList.add("hidden");
    state.running=true;
    initLevel();
    draw();
}
</script>
</body>
</html>
