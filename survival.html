<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Survivor</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #111;
            border: 2px solid #333;
            overflow: hidden;
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            text-align: center;
        }

        /* Top Bar HUD */
        #xp-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: #222;
        }
        #xp-bar-fill {
            width: 0%;
            height: 100%;
            background: #00f2ff;
            transition: width 0.2s;
        }

        #hp-bar-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 16px;
            background: #222;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
        }
        #hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff6666);
            transition: width 0.1s;
        }

        #stats {
            position: absolute;
            top: 12px;
            left: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #crystal-display {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fbff00;
            text-shadow: 0 0 5px rgba(251, 255, 0, 0.5);
        }

        /* Upgrade Cards Rarity Colors */
        .upgrade-card {
            background: #1a1a1a;
            margin: 10px;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            width: 220px;
            transition: all 0.2s;
            border: 2px solid #333;
        }
        .upgrade-card:hover { transform: translateY(-5px); filter: brightness(1.2); }
        
        .rarity-common { border-color: #00f2ff; box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        .rarity-rare { border-color: #a349eb; box-shadow: 0 0 15px rgba(163, 73, 235, 0.3); }
        .rarity-legendary { border-color: #fbff00; box-shadow: 0 0 20px rgba(251, 255, 0, 0.4); }

        .rarity-label { font-size: 10px; text-transform: uppercase; font-weight: 900; margin-bottom: 5px; }
        .rarity-common .rarity-label { color: #00f2ff; }
        .rarity-rare .rarity-label { color: #a349eb; }
        .rarity-legendary .rarity-label { color: #fbff00; }

        .upgrade-card h3 { margin: 5px 0; font-size: 18px; }
        .upgrade-card p { margin: 0; font-size: 13px; color: #aaa; line-height: 1.4; }

        #upgrade-options { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; }

        button {
            background: #00f2ff;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            color: #000;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        
        .title {
            font-size: 52px;
            color: #00f2ff;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="xp-bar-container"><div id="xp-bar-fill"></div></div>
        <div id="hp-bar-container"><div id="hp-bar-fill"></div></div>
        <div id="stats">LVL <span id="lvl-val">1</span> | KILLS <span id="kills-val">0</span></div>
        <div id="crystal-display">✨ <span id="crystal-val">0</span></div>
        
        <div id="start-screen" class="overlay">
            <h1 class="title">SHADOW SURVIVOR</h1>
            <button onclick="startGame()">ENTER THE SHADOWS</button>
        </div>

        <div id="upgrade-screen" class="overlay" style="display:none;">
            <h2 style="color:#fff; margin-bottom: 5px;">AUGMENTATION DETECTED</h2>
            <p style="color: #888; margin-bottom: 20px;">Choose a path to evolve</p>
            <div id="upgrade-options"></div>
        </div>

        <div id="game-over" class="overlay" style="display:none;">
            <h1 style="color: #ff4444; font-size: 48px;">OVERRUN</h1>
            <p id="final-stats" style="font-size: 20px;"></p>
            <button onclick="location.reload()">TRY AGAIN</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const xpFill = document.getElementById('xp-bar-fill');
const hpFill = document.getElementById('hp-bar-fill');
const lvlVal = document.getElementById('lvl-val');
const killsVal = document.getElementById('kills-val');
const crystalVal = document.getElementById('crystal-val');
const upgradeScreen = document.getElementById('upgrade-screen');
const upgradeOptions = document.getElementById('upgrade-options');
const startScreen = document.getElementById('start-screen');

canvas.width = 800;
canvas.height = 600;

let gameActive = false;
let frameCount = 0;
let kills = 0;
let level = 1;
let xp = 0;
let xpToNext = 100;
let crystals = 0;

const camera = { x: 0, y: 0 };
const player = {
    worldX: 0, worldY: 0, size: 15,
    speed: 3.5, hp: 100, maxHp: 100,
    fireRate: 30, fireTimer: 0, bulletSpeed: 8,
    bulletSize: 5, bulletDamage: 30, bulletCount: 1,
    pickupRange: 80, shield: 0, lifesteal: 0, critChance: 0,
    hasTimeWarp: false, novaBlast: false, shotCount: 0,
    orbitSaws: 0, orbitAngle: 0
};

const enemies = [];
const bullets = [];
const gems = [];
const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Skills with Balanced Rarity
const skills = [
    // COMMON (75% probability)
    { id: 'speed', rarity: 'common', title: 'Adrenaline', desc: '+15% Move Speed', effect: () => player.speed *= 1.15 },
    { id: 'fireRate', rarity: 'common', title: 'Rapid Fire', desc: '+20% Fire Rate', effect: () => player.fireRate *= 0.8 },
    { id: 'damage', rarity: 'common', title: 'Heavy Rounds', desc: '+25% Bullet Damage', effect: () => player.bulletDamage *= 1.25 },

    // RARE (20% probability)
    { id: 'pickup', rarity: 'rare', title: 'Magnet', desc: '+40% Pickup Range', effect: () => player.pickupRange *= 1.4 },
    { id: 'health', rarity: 'rare', title: 'Vitality', desc: '+25 Max HP & Full Heal', effect: () => { player.maxHp += 25; player.hp = player.maxHp; } },
    { id: 'multishot', rarity: 'rare', title: 'Split Shot', desc: '+1 Projectile per volley', effect: () => player.bulletCount += 1 },
    { id: 'crit', rarity: 'rare', title: 'Eagle Eye', desc: '15% Chance to Crit (2x Damage)', effect: () => player.critChance += 0.15 },
    { id: 'plating', rarity: 'rare', title: 'Carbon Plating', desc: '+15% Damage Resistance', effect: () => player.shield = Math.min(80, player.shield + 15) },

    // LEGENDARY (5% probability)
    { id: 'saw', rarity: 'legendary', title: 'Orbiting Saw', desc: 'Floating blade deals 25% bullet damage. Stacks add more blades.', effect: () => player.orbitSaws++ },
    { id: 'lifesteal', rarity: 'legendary', title: 'Vampirism', desc: 'Heal 1 HP on every 5 kills', effect: () => player.lifesteal += 0.2 },
    { id: 'nova', rarity: 'legendary', title: 'Nova Blast', desc: 'Every 10th shot releases an explosion', effect: () => { player.novaBlast = true; player.shotCount = 0; } },
    { id: 'timewarp', rarity: 'legendary', title: 'Time Warp', desc: 'Permanently slows all enemies by 25%', effect: () => { player.hasTimeWarp = true; enemies.forEach(e => e.speed *= 0.75); } },
    { id: 'godmode', rarity: 'legendary', title: 'Hyper Core', desc: '+40% Speed, Damage, and Max HP', effect: () => { player.bulletDamage *= 1.4; player.speed *= 1.4; player.maxHp += 50; player.hp = player.maxHp; } }
];

function startGame() {
    startScreen.style.display = 'none';
    gameActive = true;
    requestAnimationFrame(gameLoop);
}

function spawnEnemy() {
    if (!gameActive) return;
    const angle = Math.random() * Math.PI * 2;
    const dist = 500;
    const spawnX = player.worldX + Math.cos(angle) * dist;
    const spawnY = player.worldY + Math.sin(angle) * dist;
    const difficultyScale = 1 + (level * 0.12);
    
    let baseSpeed = 1.6 + (Math.random() * 0.4);
    if (player.hasTimeWarp) baseSpeed *= 0.75;

    enemies.push({
        worldX: spawnX, worldY: spawnY,
        hp: 40 * difficultyScale, speed: baseSpeed,
        size: 12, color: `hsl(${Math.random() * 30 + 10}, 70%, 50%)`,
        hitCooldown: 0
    });
}

function getRandomSkill() {
    const roll = Math.random() * 100;
    let targetRarity = 'common';
    
    if (roll < 5) targetRarity = 'legendary';
    else if (roll < 25) targetRarity = 'rare';
    else targetRarity = 'common';
    
    let pool = skills.filter(s => s.rarity === targetRarity);
    if (pool.length === 0) pool = skills.filter(s => s.rarity === 'common');
    
    return pool[Math.floor(Math.random() * pool.length)];
}

function handleLevelUp() {
    gameActive = false;
    upgradeScreen.style.display = 'flex';
    upgradeOptions.innerHTML = '';
    
    const selectedSkills = [];
    while (selectedSkills.length < 3) {
        const s = getRandomSkill();
        if (!selectedSkills.includes(s)) selectedSkills.push(s);
    }

    selectedSkills.forEach(up => {
        const card = document.createElement('div');
        card.className = `upgrade-card rarity-${up.rarity}`;
        card.innerHTML = `
            <div class="rarity-label">${up.rarity}</div>
            <h3>${up.title}</h3>
            <p>${up.desc}</p>
        `;
        card.onclick = () => { 
            up.effect(); 
            resumeGame(); 
        };
        upgradeOptions.appendChild(card);
    });
}

function resumeGame() {
    upgradeScreen.style.display = 'none';
    gameActive = true;
    requestAnimationFrame(gameLoop);
}

function update() {
    let dx = 0, dy = 0;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    
    if (dx !== 0 || dy !== 0) {
        const mag = Math.sqrt(dx*dx + dy*dy);
        player.worldX += (dx/mag) * player.speed;
        player.worldY += (dy/mag) * player.speed;
    }

    camera.x = player.worldX - canvas.width / 2;
    camera.y = player.worldY - canvas.height / 2;

    // Orbit Logic
    player.orbitAngle += 0.05;
    const sawDamage = player.bulletDamage * 0.25;

    player.fireTimer++;
    if (player.fireTimer >= player.fireRate) {
        let nearest = null; let minDist = 400;
        enemies.forEach(e => {
            const d = Math.hypot(e.worldX - player.worldX, e.worldY - player.worldY);
            if (d < minDist) { minDist = d; nearest = e; }
        });
        if (nearest) {
            player.fireTimer = 0;
            const angleBase = Math.atan2(nearest.worldY - player.worldY, nearest.worldX - player.worldX);
            
            let isNova = false;
            if (player.novaBlast) {
                player.shotCount++;
                if (player.shotCount >= 10) {
                    isNova = true;
                    player.shotCount = 0;
                }
            }

            const count = isNova ? 16 : player.bulletCount;
            for (let i = 0; i < count; i++) {
                const angle = isNova ? (Math.PI * 2 / 16) * i : angleBase + (i - (player.bulletCount-1)/2) * 0.2;
                bullets.push({
                    worldX: player.worldX, worldY: player.worldY,
                    vx: Math.cos(angle) * player.bulletSpeed, vy: Math.sin(angle) * player.bulletSpeed, 
                    life: 80, damage: player.bulletDamage * (Math.random() < player.critChance ? 2 : 1),
                    isNova: isNova
                });
            }
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; b.worldX += b.vx; b.worldY += b.vy; b.life--;
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(b.worldX - e.worldX, b.worldY - e.worldY) < e.size + player.bulletSize) {
                e.hp -= b.damage; hit = true;
                if (e.hp <= 0) {
                    onEnemyKill(e, j);
                }
                break;
            }
        }
        if (hit || b.life <= 0) bullets.splice(i, 1);
    }

    enemies.forEach((e, index) => {
        const angle = Math.atan2(player.worldY - e.worldY, player.worldX - e.worldX);
        e.worldX += Math.cos(angle) * e.speed; e.worldY += Math.sin(angle) * e.speed;

        // Orbit collision
        if (player.orbitSaws > 0) {
            for (let i = 0; i < player.orbitSaws; i++) {
                const sa = player.orbitAngle + (i * Math.PI * 2 / player.orbitSaws);
                const sx = player.worldX + Math.cos(sa) * 60;
                const sy = player.worldY + Math.sin(sa) * 60;
                if (Math.hypot(e.worldX - sx, e.worldY - sy) < e.size + 10) {
                    if (e.hitCooldown <= 0) {
                        e.hp -= sawDamage;
                        e.hitCooldown = 15;
                        if (e.hp <= 0) {
                            onEnemyKill(e, index);
                            return;
                        }
                    }
                }
            }
        }
        if (e.hitCooldown > 0) e.hitCooldown--;

        if (Math.hypot(e.worldX - player.worldX, e.worldY - player.worldY) < player.size + e.size) {
            player.hp -= 0.6 * (1 - player.shield / 100);
            if (player.hp <= 0) gameOver();
        }
    });

    for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i]; const dist = Math.hypot(g.worldX - player.worldX, g.worldY - player.worldY);
        if (dist < player.pickupRange) {
            const angle = Math.atan2(player.worldY - g.worldY, player.worldX - g.worldX);
            g.worldX += Math.cos(angle) * 10; g.worldY += Math.sin(angle) * 10;
            if (dist < 12) {
                xp += g.val; gems.splice(i, 1);
                if (xp >= xpToNext) {
                    xp -= xpToNext; level++; xpToNext *= 1.25;
                    lvlVal.innerText = level;
                    handleLevelUp();
                }
            }
        }
    }
    
    xpFill.style.width = (xp / xpToNext * 100) + '%';
    hpFill.style.width = (player.hp / player.maxHp * 100) + '%';
}

function onEnemyKill(e, index) {
    kills++; killsVal.innerText = kills;
    crystals += Math.floor(Math.random() * 3) + 1;
    crystalVal.innerText = crystals;
    if (player.lifesteal > 0 && kills % 5 === 0) player.hp = Math.min(player.maxHp, player.hp + 1);
    gems.push({ worldX: e.worldX, worldY: e.worldY, val: 25 });
    enemies.splice(index, 1);
}

function draw() {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#151515'; ctx.lineWidth = 1;
    const gridSize = 100;
    const startX = -camera.x % gridSize;
    const startY = -camera.y % gridSize;
    for (let x = startX; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = startY; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    ctx.fillStyle = '#00f2ff';
    gems.forEach(g => {
        ctx.beginPath(); ctx.arc(g.worldX - camera.x, g.worldY - camera.y, 4, 0, Math.PI*2); ctx.fill();
    });

    bullets.forEach(b => {
        ctx.fillStyle = b.isNova ? '#fbff00' : '#fff';
        ctx.beginPath(); ctx.arc(b.worldX - camera.x, b.worldY - camera.y, b.isNova ? player.bulletSize * 1.5 : player.bulletSize, 0, Math.PI*2); ctx.fill();
    });

    enemies.forEach(e => {
        const screenX = e.worldX - camera.x; const screenY = e.worldY - camera.y;
        if (screenX > -50 && screenX < canvas.width+50 && screenY > -50 && screenY < canvas.height+50) {
            ctx.fillStyle = e.color;
            ctx.beginPath(); ctx.arc(screenX, screenY, e.size, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(screenX - 4, screenY - 4, 2, 2); ctx.fillRect(screenX + 2, screenY - 4, 2, 2);
        }
    });

    const px = player.worldX - camera.x; const py = player.worldY - camera.y;
    
    // Draw Saws
    if (player.orbitSaws > 0) {
        for (let i = 0; i < player.orbitSaws; i++) {
            const sa = player.orbitAngle + (i * Math.PI * 2 / player.orbitSaws);
            const sx = px + Math.cos(sa) * 60;
            const sy = py + Math.sin(sa) * 60;
            ctx.fillStyle = '#fbff00';
            ctx.beginPath();
            for (let j = 0; j < 8; j++) {
                const ra = (j * Math.PI * 2 / 8) + (frameCount * 0.2);
                const r = j % 2 === 0 ? 10 : 6;
                ctx.lineTo(sx + Math.cos(ra) * r, sy + Math.sin(ra) * r);
            }
            ctx.closePath();
            ctx.fill();
        }
    }

    ctx.fillStyle = '#fbff00';
    ctx.beginPath(); ctx.arc(px, py, player.size, 0, Math.PI*2); ctx.fill();
    
    if (player.shield > 0) {
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, py, player.size + 10, frameCount * 0.05, frameCount * 0.05 + 1); ctx.stroke();
    }
}

function gameOver() {
    gameActive = false;
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('final-stats').innerText = `Level ${level} reached. Total Kills: ${kills}`;
}

function gameLoop() {
    if (!gameActive) return;
    update();
    draw();
    frameCount++;
    if (frameCount % Math.max(8, 50 - level * 2) === 0) spawnEnemy();
    requestAnimationFrame(gameLoop);
}

draw();
</script>
</body>
</html>
