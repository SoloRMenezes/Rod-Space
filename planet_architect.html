<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos: The Planet Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --parchment: #f4e4bc;
            --ink: #2c241a;
            --gold: #b8860b;
            --planet-base: #2c241a;
            --planet-glow: rgba(184, 134, 11, 0.4);
        }

        /* MOBILE OPTIMIZATION OVERRIDES */
        * {
            -webkit-tap-highlight-color: transparent; /* Remove blue flash on tap */
            -webkit-touch-callout: none;                /* Prevent long-press menu */
            user-select: none;                         /* Prevent text selection */
            -webkit-user-select: none;
            touch-action: manipulation;                /* Disable double-tap zoom */
        }

        body {
            background-color: var(--parchment);
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            color: var(--ink);
            font-family: 'Spectral', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed; /* Prevents "pull to refresh" on mobile */
        }

        h1, h2, h3, .font-mythic { font-family: 'Cinzel', serif; }

        .planet-container {
            perspective: 1000px;
            filter: drop-shadow(0 0 25px var(--planet-glow));
        }

        #planet-sphere {
            width: clamp(140px, 40vw, 200px);
            height: clamp(140px, 40vw, 200px);
            border-radius: 50%;
            background: var(--planet-base);
            position: relative;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 
                        inset 10px 10px 30px rgba(255,255,255,0.1);
        }

        .planet-atmosphere {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 1.5s;
            opacity: 0.5;
        }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); } 
            100% { transform: scale(1); } 
        }

        .clicking { animation: pulse 0.1s ease-out !important; }

        .scroll-panel {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid #8b7355;
            box-shadow: inset 0 0 20px rgba(139, 115, 85, 0.1);
            border-radius: 4px;
        }

        .btn-ancient {
            background: var(--ink);
            color: var(--parchment);
            transition: all 0.2s;
            border: 1px solid var(--gold);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .btn-ancient:active {
            transform: scale(0.95);
            background: var(--gold);
        }

        .nav-btn {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            padding: 4px 8px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .nav-btn.active { border-bottom-color: var(--gold); color: var(--gold); }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1.2); opacity: 1; }
            100% { transform: translateY(-120px) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col p-4">

    <div id="save-indicator" class="fixed top-2 right-4 bg-amber-900 text-amber-100 px-3 py-1 rounded-full text-[9px] font-mythic opacity-0 z-50 transition-opacity">
        RECORDED
    </div>

    <header class="flex justify-between items-center mb-4 border-b border-amber-900/30 pb-2">
        <div>
            <h1 class="text-xl font-bold tracking-widest text-amber-900 uppercase">Chronos</h1>
        </div>
        <nav class="flex gap-2">
            <button onclick="setView('home')" id="nav-home" class="nav-btn font-mythic active">GENESIS</button>
            <button onclick="setView('achievements')" id="nav-achievements" class="nav-btn font-mythic">LOGS</button>
            <button onclick="setView('rebirth')" id="nav-rebirth" class="nav-btn font-mythic">RISE</button>
        </nav>
    </header>

    <main class="flex-grow relative overflow-hidden flex flex-col">
        
        <!-- HOME VIEW -->
        <div id="view-home" class="h-full flex flex-col lg:flex-row gap-4 overflow-hidden">
            <!-- Planet Core -->
            <div class="flex-shrink-0 flex flex-col items-center justify-center relative p-4 scroll-panel min-h-[280px]">
                <div class="planet-container mb-6">
                    <div id="planet-atmosphere" class="planet-atmosphere"></div>
                    <div id="planet-sphere" onclick="handlePlanetClick(event)"></div>
                </div>
                
                <div class="text-center">
                    <h2 id="era-name" class="font-mythic text-lg text-amber-900">The Pre-Void</h2>
                    <p id="era-desc" class="text-[10px] italic opacity-60">Darkness moves upon the deep.</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-4 w-full">
                    <div class="text-center">
                        <span class="text-[9px] uppercase font-mythic opacity-50 block">Essence</span>
                        <div id="essence-display" class="text-xl font-bold text-amber-900">0</div>
                    </div>
                    <div class="text-center">
                        <span class="text-[9px] uppercase font-mythic opacity-50 block">Flow</span>
                        <div id="auto-rate" class="text-xl font-bold opacity-80">0/s</div>
                    </div>
                </div>
            </div>

            <!-- Shop -->
            <div class="flex-grow flex flex-col overflow-hidden">
                <div id="upgrade-container" class="space-y-1.5 overflow-y-auto pr-1 flex-grow">
                    <!-- Upgrades -->
                </div>

                <div id="log" class="mt-2 p-2 bg-amber-900/5 rounded text-[10px] italic text-amber-900/60 h-12 overflow-hidden border border-amber-900/10">
                    Architect the weave.
                </div>
            </div>
        </div>

        <!-- ACHIEVEMENTS VIEW -->
        <div id="view-achievements" class="h-full hidden overflow-y-auto">
            <div id="achievement-list" class="grid grid-cols-1 gap-2"></div>
        </div>

        <!-- REBIRTH VIEW -->
        <div id="view-rebirth" class="h-full hidden flex flex-col space-y-4">
             <div class="scroll-panel p-6 text-center">
                <h2 class="font-mythic text-xl text-amber-900 mb-2">Ascension</h2>
                <p class="text-[11px] italic opacity-70 mb-4">Shed this shell for Aether.</p>
                
                <div class="flex justify-around mb-6 border-y border-amber-900/10 py-4">
                    <div>
                        <span class="text-[9px] font-mythic opacity-50 block">Current</span>
                        <div id="aether-display" class="text-2xl font-bold text-indigo-900">0</div>
                    </div>
                    <div>
                        <span class="text-[9px] font-mythic opacity-50 block">Gained</span>
                        <div id="aether-reward-display" class="text-2xl font-bold text-amber-700">0</div>
                    </div>
                </div>

                <button id="rebirth-btn" onclick="performRebirth()" class="btn-ancient w-full py-3 font-mythic tracking-widest text-sm disabled:opacity-20">
                    ASCEND
                </button>
             </div>
        </div>
    </main>

    <script>
        let state = {
            essence: 0, totalEssence: 0, 
            autoRate: 0, clickPower: 1, critChance: 0,
            eraIndex: 0, upgradesOwned: {}, aether: 0,
            rebirthCount: 0, lastTick: Date.now()
        };

        const eras = [
            { name: "The Pre-Void", color: "#2c241a", glow: "rgba(184, 134, 11, 0.2)", atmo: "transparent", min: 0 },
            { name: "Hadean Inferno", color: "#5a1a1a", glow: "rgba(255, 69, 0, 0.4)", atmo: "rgba(255, 100, 0, 0.1)", min: 300 },
            { name: "Archean Waters", color: "#1a2b3c", glow: "rgba(0, 191, 255, 0.4)", atmo: "rgba(0, 255, 255, 0.05)", min: 5000 },
            { name: "Verdant Bloom", color: "#1a3c21", glow: "rgba(50, 205, 50, 0.4)", atmo: "rgba(144, 238, 144, 0.1)", min: 50000 },
            { name: "Techno-Organic", color: "#2d1a3c", glow: "rgba(147, 112, 219, 0.4)", atmo: "rgba(200, 100, 255, 0.1)", min: 1000000 }
        ];

        const upgrades = [
            { id: 'focus', name: "Divine Will", cost: 10, baseClick: 1.25, type: 'click' },
            { id: 'gravity', name: "Primal Mass", cost: 40, baseYield: 1.5, type: 'auto' },
            { id: 'flare', name: "Solar Flare", cost: 200, baseCrit: 1, type: 'crit' },
            { id: 'core', name: "Iron Heart", cost: 1000, baseYield: 12, type: 'auto' },
            { id: 'tectonics', name: "World Forge", cost: 7000, baseYield: 80, type: 'auto' }
        ];

        function format(num) {
            if (num >= 1e6) return (num / 1e6).toFixed(2) + "M";
            if (num >= 1e3) return (num / 1e3).toFixed(1) + "k";
            return Math.floor(num);
        }

        function calculateRates() {
            let rate = 0; let crit = 0; let clickMult = 1;
            upgrades.forEach(u => {
                const count = state.upgradesOwned[u.id] || 0;
                if (u.type === 'auto') rate += u.baseYield * count;
                if (u.type === 'crit') crit += u.baseCrit * count;
                if (u.type === 'click') clickMult *= Math.pow(u.baseClick, count);
            });
            state.autoRate = rate;
            state.critChance = crit;
            state.clickPower = Math.max(1, Math.round(clickMult * (1 + state.eraIndex)));
        }

        function updateUI() {
            document.getElementById('essence-display').innerText = format(state.essence);
            document.getElementById('auto-rate').innerText = format(state.autoRate) + "/s";

            let activeEra = 0;
            eras.forEach((era, i) => { if (state.totalEssence >= era.min) activeEra = i; });
            
            if (activeEra !== state.eraIndex) {
                state.eraIndex = activeEra;
                const era = eras[activeEra];
                const sphere = document.getElementById('planet-sphere');
                const atmo = document.getElementById('planet-atmosphere');
                sphere.style.background = era.color;
                document.documentElement.style.setProperty('--planet-glow', era.glow);
                atmo.style.background = era.atmo;
                document.getElementById('era-name').innerText = era.name;
                calculateRates();
            }

            upgrades.forEach(u => {
                const count = state.upgradesOwned[u.id] || 0;
                const cost = Math.floor(u.cost * Math.pow(1.18, count));
                const btn = document.getElementById(`btn-${u.id}`);
                if (btn) {
                    btn.disabled = state.essence < cost;
                    btn.querySelector('.cost').innerText = format(cost);
                    btn.querySelector('.count').innerText = `x${count}`;
                }
            });

            const reward = Math.floor(Math.sqrt(state.essence / 100000));
            document.getElementById('aether-reward-display').innerText = reward;
            document.getElementById('rebirth-btn').disabled = state.essence < 100000;
        }

        function handlePlanetClick(e) {
            const sphere = document.getElementById('planet-sphere');
            sphere.classList.remove('clicking');
            void sphere.offsetWidth;
            sphere.classList.add('clicking');

            let gain = state.clickPower;
            const isCrit = (Math.random() * 100) < state.critChance;
            if (isCrit) gain *= 5;

            state.essence += gain;
            state.totalEssence += gain;
            
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            spawnParticle(clientX, clientY, isCrit ? `!!` : `+${format(gain)}`);
            updateUI();
        }

        function spawnParticle(x, y, text) {
            const p = document.createElement('div');
            p.className = 'particle font-mythic text-amber-900 text-xs font-bold';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.innerText = text;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }

        function buyUpgrade(id) {
            const u = upgrades.find(up => up.id === id);
            const count = state.upgradesOwned[id] || 0;
            const cost = Math.floor(u.cost * Math.pow(1.18, count));
            if (state.essence >= cost) {
                state.essence -= cost;
                state.upgradesOwned[id] = count + 1;
                calculateRates();
                updateUI();
            }
        }

        function setView(v) {
            ['home', 'achievements', 'rebirth'].forEach(id => {
                document.getElementById(`view-${id}`).classList.toggle('hidden', id !== v);
                document.getElementById(`nav-${id}`).classList.toggle('active', id === v);
            });
        }

        function tick() {
            const now = Date.now();
            const delta = (now - state.lastTick) / 1000;
            state.lastTick = now;
            if (state.autoRate > 0) {
                const gain = state.autoRate * delta;
                state.essence += gain;
                state.totalEssence += gain;
                updateUI();
            }
            requestAnimationFrame(tick);
        }

        const container = document.getElementById('upgrade-container');
        upgrades.forEach(u => {
            const div = document.createElement('div');
            div.className = "scroll-panel p-2 flex justify-between items-center";
            div.innerHTML = `
                <div>
                    <h3 class="font-mythic text-[10px] font-bold">${u.name} <span class="count opacity-40">x0</span></h3>
                </div>
                <button id="btn-${u.id}" onclick="buyUpgrade('${u.id}')" class="btn-ancient px-3 py-1.5 rounded text-[10px] font-mythic">
                    <span class="cost">0</span>
                </button>
            `;
            container.appendChild(div);
        });

        requestAnimationFrame(tick);
        const saved = localStorage.getItem('chronos_save');
        if (saved) {
            state = {...state, ...JSON.parse(saved)};
            calculateRates();
        }
        setInterval(() => localStorage.setItem('chronos_save', JSON.stringify(state)), 10000);
    </script>
  <script src="assets/language-switcher.js" defer></script>
</body>
</html>
