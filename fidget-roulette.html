<style>
/* ... existing styles ... */

.needle {
    position: absolute;
    top: -20px; /* Adjusted to sit better on the rim */
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent; 
    border-right: 16px solid transparent;
    border-top: 35px solid var(--gold-bright);
    z-index: 200;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
}
</style>

<script>
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const grid = document.getElementById('tableGrid');

    const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const step = 360 / numbers.length;
    const redNums = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

    // Table Generation (unchanged)
    for (let c = 0; c < 12; c++) {
        const rowNums = [3*c+3, 3*c+2, 3*c+1]; 
        rowNums.forEach((n, rowIndex) => {
            const cell = document.createElement('div');
            cell.className = 'cell ' + (redNums.includes(n) ? 'red' : 'black');
            cell.textContent = n;
            cell.style.gridColumn = c + 2;
            cell.style.gridRow = rowIndex + 1;
            grid.appendChild(cell);
        });
    }

    // Wheel Visuals - Centering labels
    numbers.forEach((num, i) => {
        const label = document.createElement('div');
        label.className = 'slot-label';
        label.innerText = num;
        // Place label at the start of the segment
        label.style.transform = `translateX(-50%) rotate(${i * step}deg)`;
        wheel.appendChild(label);
    });
    
    // FIX: Shift the background segments by half a step 
    // so the labels (at 0, 9.7, etc) are centered in the color blocks
    const conicParts = numbers.map((num, i) => {
        const color = num === 0 ? '#1e7c46' : (redNums.includes(num) ? '#c0392b' : '#000');
        const start = (i * step) - (step / 2);
        const end = ((i + 1) * step) - (step / 2);
        return `${color} ${start}deg ${end}deg`;
    });
    wheel.style.background = `conic-gradient(${conicParts.join(',')})`;

    let currentRotation = 0;

    spinBtn.addEventListener('click', () => {
        if (spinBtn.disabled) return;
        spinBtn.disabled = true;

        const winIdx = Math.floor(Math.random() * numbers.length);
        const spins = 360 * 6; 
        
        // Target calculation: Since labels are at (i * step), 
        // we rotate the wheel by -(winIdx * step) to bring it to the top
        const targetDistance = 360 - (winIdx * step);

        const baseRotation = Math.ceil(currentRotation / 360) * 360;
        currentRotation = baseRotation + spins + targetDistance;

        wheel.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            spinBtn.disabled = false;
        }, 5000);
    });
</script>
