<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Fidget-Roulette: Pro Edition</title>
    <style>
        :root {
            --felt: #1a4d2e; --gold: #d4af37; --gold-bright: #f9e29c;
            --wood: #3d1f05; --rim: #2b1606;
        }

        body {
            margin: 0; background: radial-gradient(circle at 50% 50%, #1a4d2e, #071a0d);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .game-wrapper {
            display: flex; align-items: center; gap: 60px;
            transform: scale(0.9);
        }

        /* --- TABLE --- */
        .table-section { width: 550px; border: 3px solid var(--gold); border-radius: 12px; padding: 10px; background: rgba(0,0,0,0.3); }
        .table-grid { display: grid; grid-template-columns: 50px repeat(12, 1fr); grid-template-rows: repeat(3, 45px); gap: 2px; }
        .cell { display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 2px; border: 1px solid rgba(255,255,255,0.1); }
        .red { background: #b22222; }
        .black { background: #222; }
        .green { background: #1e7c46; }
        .zero { grid-row: 1 / span 3; }

        /* --- WHEEL --- */
        .roulette-container {
            position: relative; width: 500px; height: 500px;
            border-radius: 50%; background: var(--wood);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 8px var(--rim), 0 0 0 12px var(--gold);
            display: flex; justify-content: center; align-items: center;
        }

        .needle {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 18px solid transparent; 
            border-right: 18px solid transparent; border-top: 40px solid var(--gold-bright);
            z-index: 200; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
        }

        .wheel {
            position: relative; width: 440px; height: 440px; border-radius: 50%;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            border: 5px solid #111;
        }

        .slot-label {
            position: absolute; top: 15px; left: 50%;
            transform-origin: 50% 205px; 
            width: 38px; text-align: center;
            font-weight: 900; font-size: 1.1rem; color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        #spinBtn {
            position: absolute; width: 100px; height: 100px; z-index: 100;
            border-radius: 50%; border: 4px solid #443300; cursor: pointer;
            background: radial-gradient(circle at 30% 30%, var(--gold-bright), var(--gold));
            color: #2b1606; font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="table-section">
        <div class="table-grid" id="tableGrid">
            <div class="cell green zero">0</div>
        </div>
    </div>

    <div class="roulette-container">
        <div class="needle"></div>
        <button id="spinBtn">SPIN</button>
        <div class="wheel" id="wheel"></div>
    </div>
</div>

<script>
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const grid = document.getElementById('tableGrid');

    const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNums = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    const step = 360 / numbers.length;

    // 1. Generate Table
    for (let c = 0; c < 12; c++) {
        [3*c+3, 3*c+2, 3*c+1].forEach((n, i) => {
            const cell = document.createElement('div');
            cell.className = `cell ${redNums.includes(n) ? 'red' : 'black'}`;
            cell.textContent = n;
            cell.style.gridColumn = c + 2;
            cell.style.gridRow = i + 1;
            grid.appendChild(cell);
        });
    }

    // 2. Build Wheel Visuals
    let gradientStops = [];
    numbers.forEach((num, i) => {
        // Label logic
        const label = document.createElement('div');
        label.className = 'slot-label';
        label.innerText = num;
        label.style.transform = `translateX(-50%) rotate(${i * step}deg)`;
        wheel.appendChild(label);

        // Gradient logic - centered on the number
        const color = num === 0 ? '#1e7c46' : (redNums.includes(num) ? '#c0392b' : '#111');
        gradientStops.push(`${color} ${(i * step) - (step / 2)}deg ${((i + 1) * step) - (step / 2)}deg`);
    });
    
    wheel.style.background = `conic-gradient(${gradientStops.join(',')})`;

    // 3. Spin Logic
    let rotation = 0;
    spinBtn.addEventListener('click', () => {
        if (spinBtn.disabled) return;
        spinBtn.disabled = true;

        const winIdx = Math.floor(Math.random() * numbers.length);
        const targetRotation = 360 - (winIdx * step);
        
        rotation += (360 * 10) + targetRotation - (rotation % 360);
        wheel.style.transform = `rotate(${rotation}deg)`;

        setTimeout(() => {
            spinBtn.disabled = false;
        }, 5000);
    });
</script>
</body>
</html>
