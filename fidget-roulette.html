<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fidget-Roulette</title>
<style>
  :root {
    --felt1: #176a37; --felt2: #0c3d1d; --felt3: #0b2d16;
    --gold: #d4af37; --wood1: #5d3513; --wood2: #2b1606;
    --red1: #b22222; --red2: #7a1414;
  }

  html, body {
    height: 100%; margin: 0; color: #fff;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 50% 40%, var(--felt1) 0%, var(--felt2) 80%, #092a15 100%);
    overflow: hidden;
  }

  .layout {
    height: 100%; display: grid;
    grid-template-columns: auto 1fr; gap: 2rem;
    align-items: center; padding: 0 2rem;
  }

  /* ===== TABLE ===== */
  .table-wrap { display: flex; flex-direction: column; gap: 10px; }
  .table {
    background: #0e3a1a; padding: 10px; border-radius: 8px;
    border: 3px solid var(--gold); box-shadow: inset 0 0 18px rgba(0,0,0,.6);
    display: grid; grid-template-columns: 50px repeat(12, 55px);
    grid-template-rows: repeat(3, 50px);
  }
  .cell {
    border: 1px solid var(--gold); display: flex; align-items: center;
    justify-content: center; font-weight: 700; position: relative;
  }
  .red { background: linear-gradient(180deg, var(--red1), var(--red2)); }
  .black { background: linear-gradient(180deg, #222, #000); }
  .green { background: linear-gradient(180deg, #1e7c46, #134e2d); }
  .zero { grid-row: 1 / span 3; grid-column: 1; }

  .belt, .belt2 { display: grid; gap: 8px; width: 100%; }
  .belt { grid-template-columns: repeat(3, 1fr); }
  .belt2 { grid-template-columns: repeat(6, 1fr); }
  .belt div, .belt2 div {
    text-align: center; padding: 8px 0; border: 2px solid var(--gold);
    border-radius: 6px; background: #143b1e; font-weight: 700; font-size: 0.8rem;
  }

  .marker {
    position: absolute; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, #aaa);
    box-shadow: 0 0 10px #fff; z-index: 10;
  }

  /* ===== WHEEL ===== */
  .wheel-sec { display: flex; flex-direction: column; align-items: center; }
  .wheel-wrap {
    position: relative; width: 500px; height: 500px; border-radius: 50%;
    background: var(--wood2); padding: 20px; box-shadow: 0 0 50px #000;
  }
  .wheel {
    position: relative; width: 100%; height: 100%; border-radius: 50%;
    border: 10px solid var(--gold); overflow: hidden;
    transition: transform 6s cubic-bezier(0.1, 0, 0.2, 1);
  }
  .ball {
    position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
    border-radius: 50%; background: white;
    transform: translate(-50%, -210px); z-index: 20;
    transition: transform 6s cubic-bezier(0.1, 0, 0.2, 1);
  }
  .indicator {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 4px; height: 30px; background: white; z-index: 30;
  }

  button#spinBtn {
    margin-top: 30px; padding: 1rem 3rem; font-size: 1.2rem; font-weight: 700;
    background: var(--gold); border: none; border-radius: 50px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="table-wrap">
    <div class="table" id="tableGrid">
        <div class="cell green zero" data-num="0">0</div>
    </div>
    <div class="belt"><div>1st 12</div><div>2nd 12</div><div>3rd 12</div></div>
    <div class="belt2"><div>1-18</div><div>RED</div><div>BLACK</div><div>EVEN</div><div>ODD</div><div>19-36</div></div>
  </div>

  <div class="wheel-sec">
    <div class="wheel-wrap">
      <div class="indicator"></div>
      <div class="wheel" id="wheel"></div>
      <div class="ball" id="ball"></div>
    </div>
    <button id="spinBtn">SPIN</button>
  </div>
</div>

<script>
const wheel = document.getElementById('wheel');
const grid = document.getElementById('tableGrid');
const spinBtn = document.getElementById('spinBtn');
const ball = document.getElementById('ball');

// 1. Build Table
for (let i = 1; i <= 36; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell ' + (i % 2 === 0 ? 'black' : 'red');
    cell.textContent = i;
    cell.dataset.num = i;
    grid.appendChild(cell);
}

// 2. Setup Wheel Logic
const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const totalItems = numbers.length;
const angleStep = 360 / totalItems;

// Draw Conic Gradient on the wheel
let gradientString = 'conic-gradient(';
numbers.forEach((num, i) => {
    let color = num === 0 ? '#27ae60' : (i % 2 === 0 ? '#000' : '#c0392b');
    gradientString += `${color} ${i * angleStep}deg ${(i + 1) * angleStep}deg${i === totalItems - 1 ? '' : ','}`;
});
gradientString += ')';
wheel.style.background = gradientString;

// 3. Spinning Logic
let currentRotation = 0;
let lastMarker = null;

spinBtn.addEventListener('click', () => {
    const winningIndex = Math.floor(Math.random() * totalItems);
    const extraSpins = 360 * 5; // 5 full rotations
    const targetAngle = winningIndex * angleStep;
    
    currentRotation += extraSpins + (360 - (currentRotation % 360)) + targetAngle;
    
    wheel.style.transform = `rotate(-${currentRotation}deg)`;
    
    // Animate ball slightly opposite for "fidget" effect
    ball.style.transform = `translate(-50%, -210px) rotate(${currentRotation * 0.2}deg)`;

    setTimeout(() => {
        const result = numbers[winningIndex];
        highlightWinner(result);
    }, 6000);
});

function highlightWinner(num) {
    if (lastMarker) lastMarker.remove();
    const cell = grid.querySelector(`[data-num="${num}"]`);
    const marker = document.createElement('div');
    marker.className = 'marker';
    cell.appendChild(marker);
    lastMarker = marker;
}
</script>
</body>
</html>
