<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Fidget-Roulette</title>
    <style>
        :root {
            --felt: #1a4d2e; --gold: #d4af37; --gold-bright: #f9e29c;
            --wood: #3d1f05; --rim: #2b1606; --table-bg: #0e3a1a;
            --red: #b22222; --black: #111;
        }

        body {
            margin: 0; background-color: #05140a;
            background: radial-gradient(circle at 50% 50%, #1a4d2e, #050f08);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden; font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
        }

        .stats-bar {
            display: flex; gap: 20px; margin-bottom: 20px; background: rgba(0,0,0,0.6);
            padding: 10px 20px; border-radius: 50px; border: 2px solid var(--gold);
            z-index: 10; font-size: 0.8rem;
        }
        .stat-item span { color: var(--gold-bright); font-weight: 900; font-size: 1.1rem; display: block; }

        .game-wrapper {
            display: flex; flex-direction: row; align-items: center; gap: 40px;
            padding: 20px; z-index: 1; transition: transform 0.3s;
        }

        /* MOBILE OVERRIDE */
        @media (max-width: 1000px) {
            .game-wrapper { 
                flex-direction: column; 
                transform: scale(0.7); /* Shrinks the whole game to fit phone width */
                margin-top: -50px;
            }
        }
        @media (max-width: 500px) {
            .game-wrapper { transform: scale(0.55); } /* Extra shrink for small phones */
        }

        /* Table */
        .table-section { display: flex; flex-direction: column; width: 620px; }
        .table-grid {
            background: var(--table-bg); padding: 10px; border-radius: 12px 12px 0 0;
            border: 4px solid var(--gold); border-bottom: none;
            display: grid; grid-template-columns: 60px repeat(12, 1fr);
            grid-template-rows: repeat(3, 50px); gap: 3px;
        }

        .cell {
            border: 1px solid rgba(212, 175, 55, 0.3); display: flex; align-items: center;
            justify-content: center; font-weight: 700; cursor: pointer; position: relative;
            transition: 0.2s; border-radius: 4px; font-size: 1.1rem;
        }
        .cell.betting::after {
            content: "•"; position: absolute; font-size: 2.5rem; color: var(--gold-bright);
            text-shadow: 0 0 10px black; pointer-events: none;
        }
        .cell.win-glow { animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { opacity: 1; } to { opacity: 0.5; background: var(--gold); } }

        .red { background: linear-gradient(180deg, var(--red), #7a1414); }
        .black { background: linear-gradient(180deg, #333, #000); }
        .green { background: linear-gradient(180deg, #1e7c46, #134e2d); }
        .zero { grid-row: 1 / span 3; grid-column: 1; }

        .bet-belts { 
            display: grid; background: var(--table-bg); border: 4px solid var(--gold);
            border-radius: 0 0 12px 12px; padding: 12px; gap: 8px;
        }
        .belt-row { display: grid; grid-template-columns: 60px 1fr; gap: 8px; }
        .belt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .belt2 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        
        .btn {
            text-align: center; padding: 15px 0; border: 1px solid var(--gold);
            border-radius: 6px; background: rgba(0,0,0,0.3); cursor: pointer;
            font-size: 0.75rem; font-weight: bold; position: relative;
        }
        .btn.betting::after {
            content: "•"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2rem; color: var(--gold-bright);
        }

        /* Wheel */
        .roulette-container {
            position: relative; width: 500px; height: 500px;
            border-radius: 50%; background: var(--wood);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 12px var(--rim), 0 0 0 16px var(--gold);
            display: flex; justify-content: center; align-items: center;
        }

        .needle {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 18px solid transparent; 
            border-right: 18px solid transparent; border-top: 40px solid var(--gold-bright);
            z-index: 500;
        }

        .wheel {
            position: relative; width: 440px; height: 440px; border-radius: 50%;
            transition: transform 6s cubic-bezier(0.15, 0, 0.2, 1);
            border: 8px solid #111; box-sizing: border-box;
        }

        .ball-track {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; z-index: 400; pointer-events: none;
            transition: transform 6s cubic-bezier(0.1, 0, 0.25, 1);
        }

        .ball {
            position: absolute; width: 18px; height: 18px; 
            background: radial-gradient(circle at 30% 30%, #fff, #999);
            border-radius: 50%; top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateY(-220px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        /* EXACT LINE TO EDIT NUMBER POSITION */
        .slot-label {
            position: absolute; 
            top: 7px; 
            width: 100%; 
            text-align: center;
            left: 0; 
            transform-origin: 50% 205px; 
            font-weight: 900; 
            font-size: 1rem; 
            color: white;
            pointer-events: none;
        }

        .spindle-hub {
            position: absolute; width: 130px; height: 130px; z-index: 450;
            border-radius: 50%; border: 4px solid #443300;
            background: radial-gradient(circle at 30% 30%, var(--gold-bright) 0%, var(--gold) 40%, #886600 100%);
            display: flex; align-items: center; justify-content: center;
        }

        #spinBtn {
            width: 100%; height: 100%; border-radius: 50%; border: none;
            background: transparent; cursor: pointer;
            color: #2b1606; font-weight: 900; font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="stats-bar">
    <div class="stat-item">BALANCE: <span id="balance">1000</span></div>
    <div class="stat-item">LAST WIN: <span id="lastWin">--</span></div>
    <div class="stat-item">TOTAL BET: <span id="totalBet">0</span></div>
</div>

<div class="game-wrapper">
    <div class="table-section">
        <div class="table-grid" id="tableGrid">
            <div class="cell green zero" data-bet="0">0</div>
        </div>
        <div class="bet-belts">
            <div class="belt-row">
                <div></div>
                <div class="belt">
                    <div class="btn" data-bet="1st12">1st 12</div>
                    <div class="btn" data-bet="2nd12">2nd 12</div>
                    <div class="btn" data-bet="3rd12">3rd 12</div>
                </div>
            </div>
            <div class="belt-row">
                <div></div>
                <div class="belt2">
                    <div class="btn" data-bet="low">1-18</div>
                    <div class="btn" data-bet="even">EVEN</div>
                    <div class="btn" data-bet="red">RED</div>
                    <div class="btn" data-bet="black">BLACK</div>
                    <div class="btn" data-bet="odd">ODD</div>
                    <div class="btn" data-bet="high">19-36</div>
                </div>
            </div>
        </div>
    </div>

    <div class="roulette-container">
        <div class="needle"></div>
        <div class="ball-track" id="ballTrack">
            <div class="ball" id="ball"></div>
        </div>
        <div class="spindle-hub">
            <button id="spinBtn">SPIN</button>
        </div>
        <div class="wheel" id="wheel"></div>
    </div>
</div>

<script>
    const wheel = document.getElementById('wheel');
    const ballTrack = document.getElementById('ballTrack');
    const ball = document.getElementById('ball');
    const spinBtn = document.getElementById('spinBtn');
    const grid = document.getElementById('tableGrid');
    const balanceEl = document.getElementById('balance');
    const lastWinEl = document.getElementById('lastWin');
    const totalBetEl = document.getElementById('totalBet');

    let balance = 1000;
    let currentBets = new Map();
    let isSpinning = false;
    let wheelRotation = 0;
    let ballRotation = 0;

    const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNums = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    const step = 360 / numbers.length;

    for (let c = 0; c < 12; c++) {
        [3*c+3, 3*c+2, 3*c+1].forEach((n, rowIndex) => {
            const cell = document.createElement('div');
            cell.className = 'cell ' + (redNums.includes(n) ? 'red' : 'black');
            cell.textContent = n;
            cell.dataset.bet = n;
            cell.style.gridColumn = c + 2;
            cell.style.gridRow = rowIndex + 1;
            grid.appendChild(cell);
        });
    }

    numbers.forEach((num, i) => {
        const label = document.createElement('div');
        label.className = 'slot-label';
        label.innerText = num;
        // EXACT LINE TO EDIT NUMBER CENTERING
        const angle = (i * step) + (step / 2);
        label.style.transform = `rotate(${angle}deg)`;
        wheel.appendChild(label);
    });

    wheel.style.background = `conic-gradient(${numbers.map((num, i) => {
        const color = num === 0 ? '#1e7c46' : (redNums.includes(num) ? '#c0392b' : '#111');
        return `${color} ${i * step}deg ${(i + 1) * step}deg`;
    }).join(',')})`;

    document.querySelectorAll('.cell, .btn').forEach(el => {
        el.addEventListener('click', () => {
            if (isSpinning) return;
            const betKey = el.dataset.bet;
            if (balance < 10) return;
            balance -= 10;
            currentBets.set(betKey, (currentBets.get(betKey) || 0) + 10);
            el.classList.add('betting');
            updateUI();
        });
    });

    function updateUI() {
        balanceEl.innerText = balance;
        let total = 0; currentBets.forEach(v => total += v);
        totalBetEl.innerText = total;
    }

    spinBtn.addEventListener('click', () => {
        if (isSpinning || currentBets.size === 0) return;
        isSpinning = true;
        spinBtn.disabled = true;

        const winIdx = Math.floor(Math.random() * numbers.length);
        const winNum = numbers[winIdx];
        
        const wheelSpins = 360 * 5; 
        const targetWheelPos = 360 - (winIdx * step + step/2);
        wheelRotation += wheelSpins + targetWheelPos - (wheelRotation % 360);
        wheel.style.transform = `rotate(${wheelRotation}deg)`;

        const ballSpins = - (360 * 9); 
        ballRotation += ballSpins - (ballRotation % 360);
        ballTrack.style.transform = `rotate(${ballRotation}deg)`;

        ball.style.transform = `translate(-50%, -50%) translateY(-220px)`; 
        setTimeout(() => {
            ball.style.transform = `translate(-50%, -50%) translateY(-178px)`; 
        }, 1200);

        setTimeout(() => finalize(winNum), 6000);
    });

    function finalize(winNum) {
        lastWinEl.innerText = winNum;
        let won = 0;
        currentBets.forEach((amt, key) => {
            if (key == winNum) won += amt * 36;
            else if (key === 'red' && redNums.includes(winNum)) won += amt * 2;
            else if (key === 'black' && !redNums.includes(winNum) && winNum !== 0) won += amt * 2;
            else if (key === 'even' && winNum % 2 === 0 && winNum !== 0) won += amt * 2;
            else if (key === 'odd' && winNum % 2 !== 0) won += amt * 2;
            else if (key === 'low' && winNum >= 1 && winNum <= 18) won += amt * 2;
            else if (key === 'high' && winNum >= 19 && winNum <= 36) won += amt * 2;
            else if (key === '1st12' && winNum >= 1 && winNum <= 12) won += amt * 3;
            else if (key === '2nd12' && winNum >= 13 && winNum <= 24) won += amt * 3;
            else if (key === '3rd12' && winNum >= 25 && winNum <= 36) won += amt * 3;
        });
        balance += won;
        const winCell = document.querySelector(`.cell[data-bet="${winNum}"]`);
        winCell.classList.add('win-glow');
        setTimeout(() => {
            winCell.classList.remove('win-glow');
            document.querySelectorAll('.betting').forEach(el => el.classList.remove('betting'));
            currentBets.clear();
            isSpinning = false; spinBtn.disabled = false;
            updateUI();
        }, 2000);
    }
</script>
  <script src="assets/language-toggle.js?v=page-dock-2" defer></script>
</body>
</html>
