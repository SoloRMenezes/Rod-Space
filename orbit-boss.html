<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>Orbit Boss</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#02050a;
    overflow:hidden;
    color:#fff;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:25px;width:100%;text-align:center;pointer-events:none;z-index:5;text-shadow: 0 0 10px rgba(0,242,255,0.5)}
  #centerMsg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,2,5,0.9);transition:opacity .3s;z-index:10; text-align: center;}
  .hidden{opacity:0;pointer-events:none}
  .stat{color:#00f2ff; font-weight:bold; font-size: 1.2rem}
  #hp-container{width:min(280px,80vw);height:4px;background:rgba(255,255,255,0.05);margin:12px auto;border-radius:2px;overflow:hidden;border: 1px solid rgba(0,242,255,0.2)}
  #hp-bar{height:100%;background:#00f2ff;width:100%;transition: width 0.3s;box-shadow: 0 0 8px #00f2ff}
</style>
<link rel="stylesheet" href="assets/rod-space-home.css">
<script defer src="assets/rod-space-home.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div style="letter-spacing:4px">BOSS <span id="lvl" class="stat">1</span> · SHIELDS <span id="scr" class="stat">3</span></div>
  <div id="hp-container"><div id="hp-bar"></div></div>
</div>
<div id="centerMsg">
    <div id="msg">ORBIT BOSS<br><br>TAP OR PRESS SPACE TO PLAY<br><small style="opacity:0.6; font-size:0.8rem; letter-spacing:1px">Tap to reverse. Dodge red shots. You fire automatically.</small></div>
</div>

<script>
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const state={w:0,h:0,lvl:1,running:false,started:false,time:0,cx:0,cy:0};
const player={ang:0, r:200, maxRadius:200, currentSpeed:0.8, dir:1, lastShot:0};
const boss={hp:50, maxHp:50, r:50, fireT:0, hue:190};
const bullets=[], stars=[];
let keyLocked = false, shields=3, invincible=0;

const resize=()=>{
    canvas.width=state.w=innerWidth; canvas.height=state.h=innerHeight;
    state.cx=innerWidth/2; state.cy=innerHeight/2;
    const minDim = Math.min(state.w, state.h);
    player.maxRadius = (minDim / 2) - 40; 
    player.r=player.maxRadius*.85;
    generateStars();
};

function generateStars(){
    stars.length = 0;
    for(let i=0; i<150; i++){
        stars.push({x: Math.random()*state.w, y: Math.random()*state.h, s: Math.random()*2, o: Math.random(), v: Math.random() * 0.5 });
    }
}

addEventListener("resize",resize); resize();

function handleInteraction() {
    if(!state.started) { state.started = true; state.running = true; document.getElementById("centerMsg").classList.add("hidden"); return; }
    if(!state.running) { state.lvl=1;state.time=0;player.lastShot=0;player.ang=0;player.dir=1;shields=3;initLevel();state.running=true;document.getElementById("centerMsg").classList.add("hidden");return; }
    player.dir *= -1; 
}

addEventListener("keydown", (e) => { if((e.code==='Space' || e.code==='Enter') && !keyLocked) { e.preventDefault(); keyLocked = true; handleInteraction(); }});
addEventListener("keyup", (e) => { if(e.code==='Space' || e.code==='Enter') keyLocked = false; });
addEventListener("pointerdown", () => handleInteraction());

function initLevel(){
    boss.maxHp = 18 + Math.min(state.lvl*6,42); boss.hp = boss.maxHp;
    bullets.length = 0;
    boss.fireT=-1;
    invincible=1.5;

}

function update(dt){
    if(!state.running) return;
    state.time += dt; invincible=Math.max(0,invincible-dt);
    player.currentSpeed = 1.0 + Math.min(state.lvl-1,8)*0.06;
    player.ang += (player.currentSpeed * player.dir) * dt;
    player.r = player.maxRadius * 0.85;

    const px = state.cx + Math.cos(player.ang)*player.r;
    const py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy-py, state.cx-px);

    if(state.time - player.lastShot > 0.22){
        player.lastShot = state.time;
        bullets.push({x:px, y:py, vx:Math.cos(lookAngle)*1000, vy:Math.sin(lookAngle)*1000, p:true});
    }

    boss.fireT += dt;
    if(boss.fireT > Math.max(0.85, 2.0 - state.lvl*0.1)){
        boss.fireT = 0;
        for(let i=0; i<6; i++){
            const a = (i/6)*Math.PI*2 + state.time;
            bullets.push({x:state.cx, y:state.cy, vx:Math.cos(a)*(player.maxRadius * (0.65 + Math.min(state.lvl,8)*0.035)), vy:Math.sin(a)*(player.maxRadius * (0.65 + Math.min(state.lvl,8)*0.035)), p:false});
        }
    }

    for(let i=bullets.length-1;i>=0;i--) {
        const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(b.p && (b.x-state.cx)**2+(b.y-state.cy)**2 < boss.r**2) {
            bullets.splice(i,1);boss.hp--;
            if(boss.hp<=0){state.lvl++;initLevel();break;}
            continue;
        }
        if(!b.p && invincible===0 && (b.x-px)**2+(b.y-py)**2<14**2) {
            bullets.splice(i,1);shields--;invincible=1.5;
            if(shields===0){endGame();break;}
            continue;
        }
        if(b.x<0||b.x>state.w||b.y<0||b.y>state.h)bullets.splice(i,1);
    }

    boss.hue = 190 - (1 - boss.hp/boss.maxHp) * 190;
    document.getElementById("hp-bar").style.width = (boss.hp/boss.maxHp)*100 + "%";
    document.getElementById("lvl").innerText = state.lvl;
    document.getElementById("scr").innerText = shields;
}

function endGame(){
    state.running = false;
    document.getElementById("msg").innerHTML = `RUN OVER<br>Reached boss ${state.lvl}<br><small style="opacity:0.6">Tap or press Space to retry</small>`;
    document.getElementById("centerMsg").classList.remove("hidden");
}

function drawStars(){
    ctx.fillStyle = "#fff";
    stars.forEach(s => { ctx.globalAlpha = s.o * Math.abs(Math.sin(state.time + s.x)); ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1;
}

function drawBoss(){
    const t = state.time, h = boss.hue;
    ctx.save(); ctx.translate(state.cx, state.cy); ctx.strokeStyle = `hsla(${h}, 100%, 50%, 0.3)`; ctx.rotate(t * 0.3);
    for(let i=0; i<6; i++){ ctx.rotate(Math.PI/3); ctx.strokeRect(boss.r + 10, -15, 10, 30); }
    ctx.rotate(-t * 0.8); ctx.strokeStyle = `hsl(${h}, 100%, 50%)`; ctx.lineWidth = 3;
    ctx.beginPath(); for(let i=0; i<6; i++){ const a = (i/6)*Math.PI*2; ctx.lineTo(Math.cos(a)*boss.r, Math.sin(a)*boss.r); }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = `hsla(${h}, 100%, 70%, ${0.2 + Math.sin(t*10)*0.1})`; ctx.beginPath(); ctx.arc(0,0, 20 + Math.sin(t*5)*5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawPlayer(px, py, ang){
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-12, -10); ctx.lineTo(-8, 0); ctx.lineTo(-12, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#00f2ff"; ctx.beginPath(); ctx.arc(-10, 0, 4 + Math.sin(state.time*20)*2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function draw(){
    ctx.fillStyle="#02050a"; ctx.fillRect(0,0,state.w,state.h);
    drawStars();
    const px = state.cx + Math.cos(player.ang)*player.r, py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy-py, state.cx-px);
    ctx.strokeStyle="#ffffff18";ctx.beginPath();ctx.arc(state.cx,state.cy,player.r,0,Math.PI*2);ctx.stroke();
    drawBoss(); if(invincible===0 || Math.floor(state.time*10)%2===0)drawPlayer(px, py, lookAngle);
    ctx.beginPath(); bullets.forEach(b => { if(!b.p){ ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 4, 0, 7); }});
    ctx.fillStyle = "#ff3333"; ctx.fill();
    ctx.beginPath(); bullets.forEach(b => { if(b.p){ ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 3, 0, 7); }});
    ctx.fillStyle = "#00f2ff"; ctx.fill();

}

addEventListener("blur",()=>{keyLocked=false;});
document.addEventListener("visibilitychange",()=>{last=performance.now();keyLocked=false;});
let last = performance.now();
function loop(t){ update(document.hidden?0:Math.min(1/30, (t-last)/1000)); last=t; draw(); requestAnimationFrame(loop); }
initLevel(); requestAnimationFrame(loop);
</script>
</body>
</html>
