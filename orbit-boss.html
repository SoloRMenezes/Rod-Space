<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>Orbit Boss</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#02050a;
    overflow:hidden;
    color:#fff;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:25px;width:100%;text-align:center;pointer-events:none;z-index:5;text-shadow: 0 0 10px rgba(0,242,255,0.5)}
  #centerMsg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,2,5,0.9);transition:opacity .3s;z-index:10; text-align: center;}
  .hidden{opacity:0;pointer-events:none}
  .stat{color:#00f2ff; font-weight:bold; font-size: 1.2rem}
  #hp-container{width:min(280px,80vw);height:4px;background:rgba(255,255,255,0.05);margin:12px auto;border-radius:2px;overflow:hidden;border: 1px solid rgba(0,242,255,0.2)}
  #hp-bar{height:100%;background:#00f2ff;width:100%;transition: width 0.3s;box-shadow: 0 0 8px #00f2ff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div style="letter-spacing:4px">BOSS <span id="lvl" class="stat">1</span> · <span id="pattern">RADIAL</span> · SHIELDS <span id="scr" class="stat">3</span></div>
  <div id="hp-container"><div id="hp-bar"></div></div>
</div>
<div id="centerMsg">
    <div id="msg">ORBIT BOSS<br><br>TAP OR PRESS SPACE TO PLAY<br><small style="opacity:0.6; font-size:0.8rem; letter-spacing:1px">Tap to reverse. Dodge red shots. You fire automatically.</small></div>
</div>

<script src="./mobile-gesture-guard.js?v=1"></script>
<script>
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const state={w:0,h:0,lvl:1,running:false,started:false,time:0,cx:0,cy:0,mobile:false,scale:1};
const player={ang:0, r:200, maxRadius:200, currentSpeed:0.8, dir:1, lastShot:0};
const boss={hp:50, maxHp:50, r:50, fireT:0, hue:282};
const bullets=[], stars=[], lasers=[], hearts=[];
let keyLocked = false, shields=3, invincible=0;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const hud={hp:document.getElementById("hp-bar"),lvl:document.getElementById("lvl"),shields:document.getElementById("scr"),pattern:document.getElementById("pattern")};
const hudCache={hp:-1,lvl:-1,shields:-1,pattern:""};

const resize=()=>{
    canvas.width=state.w=innerWidth; canvas.height=state.h=innerHeight;
    state.cx=innerWidth/2; state.cy=innerHeight/2;
    const minDim = Math.min(state.w, state.h);
    state.mobile=!!globalThis.matchMedia?.('(pointer:coarse)').matches||minDim<600;
    state.scale=state.mobile?.72:1;
    player.maxRadius = (minDim / 2) - (state.mobile?14:40);
    player.r=player.maxRadius*(state.mobile?.93:.85);
    boss.r=state.mobile?34:50;
    generateStars();
};

function generateStars(){
    stars.length = 0;
    for(let i=0,n=state.mobile?65:150; i<n; i++){
        stars.push({x: Math.random()*state.w, y: Math.random()*state.h, s: Math.random()*2, o: Math.random(), v: Math.random() * 0.5 });
    }
}

addEventListener("resize",resize); resize();

function handleInteraction() {
    if(!state.started) { state.started = true; state.running = true; document.getElementById("centerMsg").classList.add("hidden"); return; }
    if(!state.running) { state.lvl=1;state.time=0;state.won=false;player.lastShot=0;player.ang=0;player.dir=1;shields=3;initLevel(false);state.running=true;document.getElementById("centerMsg").classList.add("hidden");return; }
    player.dir *= -1; 
}

addEventListener("keydown", (e) => { if((e.code==='Space' || e.code==='Enter') && !keyLocked) { e.preventDefault(); keyLocked = true; handleInteraction(); }});
addEventListener("keyup", (e) => { if(e.code==='Space' || e.code==='Enter') keyLocked = false; });
addEventListener("pointerdown", () => handleInteraction());

function initLevel(preserveEnemyShots=false){
    boss.maxHp = 18 + state.lvl*6; boss.hp = boss.maxHp;
    if(preserveEnemyShots){
        // Enemy hazards remain live between bosses; remove only player shots so
        // the next boss cannot take damage from bullets fired at the last one.
        for(let i=bullets.length-1;i>=0;i--)if(bullets[i].p)bullets.splice(i,1);
    }else bullets.length = 0;
    lasers.length = 0;
    hearts.length = 0;
    boss.attackDelay=1.5;
    boss.fireT=-1;
    boss.aimT=0;
    boss.laserT=state.lvl>=4?1.4:99;
    boss.specialT=2.2;
    boss.spiralShots=0;
    boss.spiralIndex=0;
    boss.spiralShotT=0;
    boss.heavyT=2.8;
    boss.heartT=state.lvl%3===0?1.5:-1;
    invincible=1.5;

}

function spawnAlienShot(angle,speed,kind="spore",extra={}){
    const reach=boss.r*(.45+Math.random()*.38);
    bullets.push({x:state.cx+Math.cos(angle)*reach,y:state.cy+Math.sin(angle)*reach,
        vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,p:false,kind,age:0,
        phase:Math.random()*Math.PI*2,curve:(Math.random()-.5)*.18,
        wobble:.12+Math.random()*.18,wobbleSpeed:3+Math.random()*3,...extra});
}

function update(dt){
    if(!state.running) return;
    state.time += dt; invincible=Math.max(0,invincible-dt);
    // Rotation begins deliberately slow and rises through all twenty bosses.
    // The player's automatic firing interval remains fixed at 0.22 seconds.
    player.currentSpeed = (.78 + (state.lvl-1)*.065) * (state.mobile?1.08:1);
    player.ang += (player.currentSpeed * player.dir) * dt;
    player.r = player.maxRadius * (state.mobile?.93:.85);

    const px = state.cx + Math.cos(player.ang)*player.r;
    const py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy-py, state.cx-px);

    if(state.time - player.lastShot > 0.22){
        player.lastShot = state.time;
        bullets.push({x:px, y:py, vx:Math.cos(lookAngle)*1000, vy:Math.sin(lookAngle)*1000, p:true});
    }

    boss.attackDelay=Math.max(0,boss.attackDelay-dt);
    const bossCanAttack=boss.attackDelay===0;

    boss.fireT += dt;
    if(bossCanAttack && boss.fireT > Math.max(0.58, 2.0 - state.lvl*0.1)){
        boss.fireT = 0;
        const count=Math.min(12,6+Math.floor((state.lvl-1)/2));
        for(let i=0; i<count; i++){
            const a = (i/count)*Math.PI*2 + state.time*(.55+state.lvl*.015) + (Math.random()-.5)*.12;
            const speed=player.maxRadius*(.65+state.lvl*.035);
            spawnAlienShot(a,speed*(.9+Math.random()*.2),"spore");
            // Boss 5 introduces an offset echo ring, creating moving lanes
            // instead of merely repeating the opening radial burst.
            if(state.lvl>=5 && i%2===0){
                const echo=a+Math.PI/count;
                spawnAlienShot(echo,speed*.62,"larva",{curve:(i%4?1:-1)*.28,wobble:.22});
            }
        }
    }

    // From boss 3 onward, aimed shots punish reversing at the same point every time.
    boss.aimT += dt;
    if(bossCanAttack && state.lvl>=3 && boss.aimT>Math.max(1.15,3-state.lvl*.12)){
        boss.aimT=0;
        const a=Math.atan2(py-state.cy,px-state.cx);
        const spread=Math.min(.34,(state.lvl-3)*.035);
        const offsets=state.lvl>=9?[-spread,0,spread]:state.lvl>=5?[-spread,spread]:[0];
        offsets.forEach(offset=>{
            const speed=player.maxRadius*(.95+state.lvl*.025);
            spawnAlienShot(a+offset,speed,"seeker",{homingFor:.72,curve:offset*.32,wobble:.08,r:state.mobile?4:6});
        });
    }

    // Boss 6 adds a sustained spiral barrage. It returns more often and lasts
    // longer on later bosses, so post-5 levels do not loop back to boss 1.
    if(state.lvl>=6){
        boss.specialT-=dt;
        if(bossCanAttack && boss.specialT<=0 && boss.spiralShots===0){
            boss.spiralShots=Math.min(34,12+state.lvl*2);
            boss.spiralIndex=0;
            boss.specialT=Math.max(3.8,7-state.lvl*.18);
        }
        if(bossCanAttack && boss.spiralShots>0){
            boss.spiralShotT-=dt;
            if(boss.spiralShotT<=0){
                boss.spiralShotT=.105;
                const a=state.time*1.6+boss.spiralIndex*.43;
                const speed=player.maxRadius*(.72+state.lvl*.025);
                spawnAlienShot(a,speed,"helix",{curve:.34*(boss.spiralIndex%2?1:-1),wobble:.2});
                boss.spiralIndex++;
                boss.spiralShots--;
            }
        }
    }

    // Boss 15+ launches heavy rounds that split halfway to the orbit.
    if(state.lvl>=15){
        boss.heavyT-=dt;
        if(bossCanAttack && boss.heavyT<=0){
            boss.heavyT=Math.max(2.1,4.3-(state.lvl-15)*.22);
            const a=Math.atan2(py-state.cy,px-state.cx);
            const speed=player.maxRadius*.48;
            spawnAlienShot(a,speed,"egg",{r:state.mobile?8.5:12,splitAt:player.r*.5,curve:.04,wobble:.04});
        }
    }

    // Every third boss shoots one recoverable heart onto the player's orbit.
    if(boss.heartT>0){
        boss.heartT-=dt;
        if(boss.heartT<=0){
            boss.heartT=-1;
            hearts.push({angle:player.ang+player.dir*player.currentSpeed*1.15,radius:0,phase:"travel",timer:.65,hold:2.1});
        }
    }
    for(let i=hearts.length-1;i>=0;i--){
        const h=hearts[i];
        if(h.phase==="travel"){
            h.timer-=dt;h.radius=player.r*(1-Math.max(0,h.timer)/.65);
            if(h.timer<=0){h.phase="hold";h.radius=player.r;h.timer=h.hold;}
        }else if(h.phase==="hold"){
            h.timer-=dt;
            if(h.timer<=0){h.phase="leave";h.timer=.8;}
        }else{
            h.timer-=dt;h.radius+=player.maxRadius*dt*1.2;
            if(h.timer<=0){hearts.splice(i,1);continue;}
        }
        const hx=state.cx+Math.cos(h.angle)*h.radius,hy=state.cy+Math.sin(h.angle)*h.radius;
        const heartReach=state.mobile?16:22;
        if((hx-px)**2+(hy-py)**2<heartReach**2){shields++;hearts.splice(i,1);}
    }

    // A single laser sits directly on the player, then locks briefly before firing.
    // Multi-laser attacks are stationary arena dividers: the warning lines never chase.
    boss.laserT -= dt;
    if(bossCanAttack && state.lvl>=4 && boss.laserT<=0 && lasers.length===0){
        const count=state.lvl>=10?3:state.lvl>=7?2:1;
        const tracking=count===1?3+Math.random()*2:1.45+Math.random()*.55;
        const lockTime=count===1?1:.42,fireTime=count===1?.42:.62;
        const baseAngle=count===1?player.ang:Math.random()*Math.PI*2;
        const offsets=count===3?[0,1.5+Math.random()*.5,3.65+Math.random()*.6]:count===2?[0,2.35+Math.random()*1.15]:[0];
        for(let i=0;i<count;i++) lasers.push({
            angle:baseAngle+offsets[i],
            phase:count===1?"track":"divide",
            timer:tracking,
            tracking,
            lockTime,
            fireTime
        });
        boss.laserT=Math.max(4.5,9-state.lvl*.22);
    }
    for(let i=lasers.length-1;i>=0;i--){
        const l=lasers[i];
        if(l.phase==="track"){
            // No trailing: the faint warning ray remains exactly over the ship.
            l.angle=player.ang;
            l.timer-=dt;
            if(l.timer<=0){l.phase="lock";l.timer=l.lockTime;}
        } else if(l.phase==="divide"){
            // Uneven dividers stay fixed from the first warning frame onward.
            l.timer-=dt;
            if(l.timer<=0){l.phase="lock";l.timer=l.lockTime;}
        } else if(l.phase==="lock"){
            l.timer-=dt;
            if(l.timer<=0){l.phase="fire";l.timer=l.fireTime;}
        } else {
            l.timer-=dt;
            const distance=Math.abs(Math.sin(player.ang-l.angle))*player.r;
            const facing=Math.cos(player.ang-l.angle)>0;
            if(facing && distance<13*state.scale && invincible===0){shields--;invincible=1.5;if(shields===0){endGame();break;}}
            if(l.timer<=0)lasers.splice(i,1);
        }
    }

    for(let i=bullets.length-1;i>=0;i--) {
        const b=bullets[i];
        if(!b.p){
            b.age=(b.age||0)+dt;
            let turn=(b.curve||0)+Math.sin((b.phase||0)+b.age*(b.wobbleSpeed||4))*(b.wobble||0);
            if(b.homingFor && b.age<b.homingFor){
                const current=Math.atan2(b.vy,b.vx),target=Math.atan2(py-b.y,px-b.x);
                const delta=Math.atan2(Math.sin(target-current),Math.cos(target-current));
                turn+=clamp(delta,-.75,.75)*1.4;
            }
            if(turn){const c=Math.cos(turn*dt),s=Math.sin(turn*dt),vx=b.vx;b.vx=vx*c-b.vy*s;b.vy=vx*s+b.vy*c;}
        }
        b.x+=b.vx*dt;b.y+=b.vy*dt;
        if(b.kind==="egg" && Math.hypot(b.x-state.cx,b.y-state.cy)>=b.splitAt){
            const base=Math.atan2(b.vy,b.vx),pieces=2+Math.floor(Math.random()*3);
            for(let piece=0;piece<pieces;piece++){
                const spread=(piece-(pieces-1)/2)*.22,speed=player.maxRadius*(.92+state.lvl*.018);
                bullets.push({x:b.x,y:b.y,vx:Math.cos(base+spread)*speed,vy:Math.sin(base+spread)*speed,p:false,kind:"shard",age:0,phase:piece*2.1,curve:spread*.55,wobble:.1,wobbleSpeed:6,r:state.mobile?3.5:5});
            }
            bullets.splice(i,1);continue;
        }
        if(b.p && (b.x-state.cx)**2+(b.y-state.cy)**2 < boss.r**2) {
            bullets.splice(i,1);boss.hp--;
            if(boss.hp<=0){
                if(state.lvl>=20)completeGame();
                else{state.lvl++;initLevel(true);}
                break;
            }
            continue;
        }
        if(!b.p && invincible===0 && (b.x-px)**2+(b.y-py)**2<((state.mobile?7:10)+(b.r||(state.mobile?3:4)))**2) {
            bullets.splice(i,1);shields--;invincible=1.5;
            if(shields===0){endGame();break;}
            continue;
        }
        if((!b.p&&Math.hypot(b.x-state.cx,b.y-state.cy)>player.r+55)||(b.x<0||b.x>state.w||b.y<0||b.y>state.h))bullets.splice(i,1);
    }

    boss.hue = 282 + (1 - boss.hp/boss.maxHp) * 48;
    const hp=Math.round((boss.hp/boss.maxHp)*1000)/10,pattern=state.lvl>=20?"RUPTURE":state.lvl>=15?"EGG BURST":state.lvl>=10?"FEEDING FRENZY":state.lvl>=7?"NERVE WEB":state.lvl>=6?"HELIX":state.lvl>=4?"BIOBEAM":state.lvl>=3?"STALKER":"SPORES";
    if(hudCache.hp!==hp){hudCache.hp=hp;hud.hp.style.width=hp+"%"}
    if(hudCache.lvl!==state.lvl){hudCache.lvl=state.lvl;hud.lvl.innerText=state.lvl}
    if(hudCache.shields!==shields){hudCache.shields=shields;hud.shields.innerText=shields}
    if(hudCache.pattern!==pattern){hudCache.pattern=pattern;hud.pattern.innerText=pattern}
}

function endGame(){
    state.running = false;
    document.getElementById("msg").innerHTML = `RUN OVER<br>Reached boss ${state.lvl}<br><small style="opacity:0.6">Tap or press Space to retry</small>`;
    document.getElementById("centerMsg").classList.remove("hidden");
}

function completeGame(){
    state.running=false;state.won=true;
    document.getElementById("msg").innerHTML=`ORBIT CLEARED<br>All 20 bosses defeated<br><small style="opacity:0.6">Tap or press Space to fly again</small>`;
    document.getElementById("centerMsg").classList.remove("hidden");
}

function drawStars(){
    ctx.fillStyle = "#fff";
    stars.forEach(s => { ctx.globalAlpha = state.mobile?s.o*.72:s.o*Math.abs(Math.sin(state.time+s.x)); ctx.fillRect(s.x,s.y,s.s,s.s); });
    ctx.globalAlpha = 1;
}

function drawBoss(){
    const t=state.time,h=boss.hue,pulse=1+Math.sin(t*3.2)*.045;
    ctx.save();ctx.translate(state.cx,state.cy);
    ctx.lineCap="round";
    for(let i=0;i<7;i++){
        const a=i*.91+.25*Math.sin(i*2.7),reach=boss.r*(1.28+(i%3)*.12);
        const sway=Math.sin(t*2.1+i*1.8)*boss.r*.25;
        ctx.strokeStyle=`hsla(${h+18},80%,55%,${.28+i*.025})`;ctx.lineWidth=(7-i*.35)*state.scale;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*boss.r*.55,Math.sin(a)*boss.r*.55);
        ctx.bezierCurveTo(Math.cos(a)*boss.r*.9-Math.sin(a)*sway,Math.sin(a)*boss.r*.9+Math.cos(a)*sway,
            Math.cos(a)*reach+Math.sin(a)*sway,Math.sin(a)*reach-Math.cos(a)*sway,
            Math.cos(a)*reach,Math.sin(a)*reach);ctx.stroke();
        ctx.fillStyle=`hsl(${h+35},85%,62%)`;ctx.beginPath();ctx.arc(Math.cos(a)*reach,Math.sin(a)*reach,2.4*state.scale,0,Math.PI*2);ctx.fill();
    }
    const blob=(radius,phase)=>{ctx.beginPath();for(let i=0;i<=32;i++){const a=i/32*Math.PI*2,r=radius*(1+.085*Math.sin(a*5+t*2.4+phase)+.045*Math.sin(a*3-t*1.7));const x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();};
    ctx.shadowColor=`hsl(${h},90%,55%)`;ctx.shadowBlur=state.mobile?6:22;
    blob(boss.r*pulse,0);ctx.fillStyle=`hsl(${h},46%,20%)`;ctx.fill();ctx.strokeStyle=`hsl(${h+28},92%,63%)`;ctx.lineWidth=2.5;ctx.stroke();
    blob(boss.r*.72,1.8);ctx.fillStyle=`hsla(${h+22},75%,38%,.5)`;ctx.fill();ctx.shadowBlur=0;
    for(let i=0;i<8;i++){const a=i*2.23+.3,r=boss.r*(.4+.25*Math.sin(i*4.1));ctx.fillStyle=`hsla(${h+55},90%,70%,${.18+(i%3)*.08})`;ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,(2+i%3)*state.scale,0,Math.PI*2);ctx.fill();}
    const target=Math.atan2(state.cy+Math.sin(player.ang)*player.r-state.cy,state.cx+Math.cos(player.ang)*player.r-state.cx);
    const blink=Math.max(.08,Math.min(1,(Math.sin(t*.78+1)*18+17)));
    ctx.save();ctx.rotate(target);ctx.scale(1,blink);ctx.fillStyle="#d7ffc4";ctx.beginPath();ctx.ellipse(boss.r*.18,0,boss.r*.34,boss.r*.21,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#20102e";ctx.beginPath();ctx.arc(boss.r*.27,0,boss.r*.13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(boss.r*.31,-boss.r*.05,boss.r*.035,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.restore();
}

function drawPlayer(px, py, ang){
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang);ctx.scale(state.scale,state.scale);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-12, -10); ctx.lineTo(-8, 0); ctx.lineTo(-12, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#00f2ff"; ctx.beginPath(); ctx.arc(-10, 0, 4 + Math.sin(state.time*20)*2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawLasers(){
    lasers.forEach(l=>{
        const length=Math.hypot(state.w,state.h), active=l.phase==="fire";
        ctx.save();ctx.translate(state.cx,state.cy);ctx.rotate(l.angle);
        ctx.strokeStyle=active?"#ff4bb7":l.phase==="lock"?"rgba(191,92,255,.62)":"rgba(142,255,176,.18)";
        ctx.lineWidth=(active?15:l.phase==="lock"?5:3)*state.scale;
        ctx.shadowColor="#ff4bb7";ctx.shadowBlur=active&&!state.mobile?24:0;
        ctx.beginPath();ctx.moveTo(0,0);for(let d=14;d<length;d+=14)ctx.lineTo(d,Math.sin(d*.035+state.time*9+l.angle*4)*(active?7:3));ctx.stroke();ctx.restore();
    });
}

function drawHeart(x,y,scale=1){
    ctx.save();ctx.translate(x,y);ctx.scale(scale*state.scale,scale*state.scale);ctx.fillStyle="#35bfff";ctx.shadowColor="#35bfff";ctx.shadowBlur=state.mobile?0:16;
    ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-18,-2,-12,-16,0,-8);ctx.bezierCurveTo(12,-16,18,-2,0,10);ctx.fill();ctx.restore();
}

function draw(){
    ctx.fillStyle="#02050a"; ctx.fillRect(0,0,state.w,state.h);
    drawStars();
    const px = state.cx + Math.cos(player.ang)*player.r, py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy-py, state.cx-px);
    ctx.strokeStyle="#ffffff18";ctx.beginPath();ctx.arc(state.cx,state.cy,player.r,0,Math.PI*2);ctx.stroke();
    drawBoss(); drawLasers(); if(invincible===0 || Math.floor(state.time*10)%2===0)drawPlayer(px, py, lookAngle);
    hearts.forEach(h=>drawHeart(state.cx+Math.cos(h.angle)*h.radius,state.cy+Math.sin(h.angle)*h.radius,h.phase==="hold"?1+.12*Math.sin(state.time*8):.85));
    bullets.forEach(b=>{if(b.p)return;const r=b.r||(state.mobile?4:6),a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.fillStyle=b.kind==="egg"?"#ff7ec8":b.kind==="seeker"?"#b8ff6a":b.kind==="shard"?"#ff3f8d":"#a86cff";ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=state.mobile?0:9;ctx.beginPath();if(b.kind==="shard"){ctx.moveTo(r*1.8,0);ctx.lineTo(-r,-r*.7);ctx.lineTo(-r*.45,r*.85);}else{for(let i=0;i<9;i++){const p=i/9*Math.PI*2,rr=r*(1+.16*Math.sin(p*3+(b.phase||0)));const x=Math.cos(p)*rr*(b.kind==="seeker"?1.45:1),y=Math.sin(p)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);} }ctx.closePath();ctx.fill();ctx.fillStyle="rgba(15,5,25,.55)";ctx.beginPath();ctx.arc(r*.18,0,r*.28,0,Math.PI*2);ctx.fill();ctx.restore();});
    ctx.beginPath(); bullets.forEach(b => { if(b.p){ const r=state.mobile?2:3;ctx.moveTo(b.x+r,b.y);ctx.arc(b.x,b.y,r,0,7); }});
    ctx.fillStyle = "#00f2ff"; ctx.fill();

}

addEventListener("blur",()=>{keyLocked=false;});
document.addEventListener("visibilitychange",()=>{last=performance.now();keyLocked=false;});
let last = performance.now();
function loop(t){ update(document.hidden?0:Math.min(1/30, (t-last)/1000)); last=t; draw(); requestAnimationFrame(loop); }
initLevel(); requestAnimationFrame(loop);
</script>
<script src="./mobile-landscape-resize.js"></script>
</body>
