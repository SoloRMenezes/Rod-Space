<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Orbit Boss — Laser Edition</title>
<style>
  html,body{margin:0;height:100%;background:#02040a;overflow:hidden;color:#fff;font-family: 'Courier New', monospace}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:20px;width:100%;text-align:center;pointer-events:none;font-size:1rem;letter-spacing:3px;font-weight:bold}
  #centerMsg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,0.8);transition:opacity .2s;z-index:10}
  .hidden{opacity:0;pointer-events:none}
  .stat{color:#00f2ff;text-shadow: 0 0 8px #00f2ff}
  #hp-container{width:200px;height:6px;background:rgba(255,255,255,0.1);margin:10px auto;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,0.2)}
  #hp-bar{height:100%;background:#00f2ff;width:100%;transition:width 0.1s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>LEVEL <span id="lvl" class="stat">1</span> | SCORE <span id="scr" class="stat">0</span></div>
  <div id="hp-container"><div id="hp-bar"></div></div>
</div>
<div id="centerMsg"><div id="msg">SPACE / ENTER TO FLIP DIRECTION<br><small style="opacity:0.6; font-size:0.8rem">WATCH FOR THE LASER WARNING</small></div></div>

<script>
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const state={w:0,h:0,lvl:1,score:0,running:true,time:0,cx:0,cy:0};
const player={ang:0, r:200, speed:3.8, dir:1, lastShot:0};
const boss={hp:30, maxHp:30, r:45, fireT:0, hue:190, laserAng:0, laserTimer:0};
const bullets=[], asteroids=[];

const resize=()=>{
    canvas.width=state.w=innerWidth;
    canvas.height=state.h=innerHeight;
    state.cx=innerWidth/2; state.cy=innerHeight/2;
};
addEventListener("resize",resize); resize();

// FIXED MOVEMENT: Single Keydown trigger
addEventListener("keydown", (e) => {
    if(e.code==='Space' || e.code==='Enter') {
        e.preventDefault();
        if(!state.running) { location.reload(); return; }
        player.dir *= -1; 
        document.getElementById("centerMsg").classList.add("hidden");
    }
});

function initLevel(){
    boss.maxHp = 25 + (state.lvl*10);
    boss.hp = boss.maxHp;
    boss.laserTimer = 0;
    asteroids.length = 0;
    for(let i=0; i<Math.min(state.lvl+5, 20); i++) {
        const a = Math.random()*Math.PI*2;
        const d = 450 + Math.random()*200;
        asteroids.push({x:state.cx+Math.cos(a)*d, y:state.cy+Math.sin(a)*d, vx:(Math.random()-0.5)*180, vy:(Math.random()-0.5)*180, s:14});
    }
}

function update(dt){
    if(!state.running) return;
    state.time += dt;

    // Movement Logic
    player.ang += (player.speed * player.dir) * dt;
    player.r = 210 + Math.sin(state.time * 0.9) * 70;

    const px = state.cx + Math.cos(player.ang)*player.r;
    const py = state.cy + Math.sin(player.ang)*player.r;

    // Auto-fire
    if(state.time - player.lastShot > 0.3){
        player.lastShot = state.time;
        const a = Math.atan2(state.cy-py, state.cx-px);
        bullets.push({x:px, y:py, vx:Math.cos(a)*750, vy:Math.sin(a)*750, p:true});
    }

    // Boss Patterns
    boss.fireT += dt;
    if(boss.fireT > Math.max(0.3, 1.4 - (state.lvl*0.1))){
        boss.fireT = 0;
        const count = 5 + Math.min(state.lvl, 5);
        for(let i=0; i<count; i++){
            const a = (i/count)*Math.PI*2 + (state.time);
            bullets.push({x:state.cx, y:state.cy, vx:Math.cos(a)*230, vy:Math.sin(a)*230, p:false});
        }
    }

    // Laser Logic
    boss.laserTimer += dt;
    if(boss.laserTimer > 4) { // Every 4 seconds
        if(boss.laserTimer < 5.5) { 
            boss.laserAng = Math.atan2(py-state.cy, px-state.cx); // Lock onto player during warning
        } else if(boss.laserTimer >= 5.5 && boss.laserTimer < 6.5) {
            // LASER IS FIRING
            const pAng = Math.atan2(py-state.cy, px-state.cx);
            const diff = Math.abs(pAng - boss.laserAng);
            if(diff < 0.12 || diff > Math.PI*2 - 0.12) {
                 state.running = false;
                 document.getElementById("centerMsg").innerHTML = "VAPORIZED BY LASER<br>PRESS SPACE";
                 document.getElementById("centerMsg").classList.remove("hidden");
            }
        } else { boss.laserTimer = 0; }
    }

    // Collision Logic (Optimized)
    const bossRSq = boss.r * boss.r;
    for(let i=bullets.length-1; i>=0; i--){
        const b = bullets[i];
        b.x += b.vx*dt; b.y += b.vy*dt;
        const distSqB = (b.x-state.cx)**2 + (b.y-state.cy)**2;

        if(b.p){ 
            if(distSqB < bossRSq){
                bullets.splice(i,1); boss.hp--; state.score+=20;
                if(boss.hp <= 0) { state.lvl++; initLevel(); }
            }
        } else {
            if((b.x-px)**2 + (b.y-py)**2 < 144){ 
                state.running = false;
                document.getElementById("centerMsg").innerHTML = "SYSTEM CRASH<br>SCORE: "+state.score+"<br>PRESS SPACE";
                document.getElementById("centerMsg").classList.remove("hidden");
            }
        }
        if(b.x<0||b.x>state.w||b.y<0||b.y>state.h) bullets.splice(i,1);
    }

    asteroids.forEach(a => {
        a.x += a.vx*dt; a.y += a.vy*dt;
        if(a.x<0||a.x>state.w) a.vx*=-1; if(a.y<0||a.y>state.h) a.vy*=-1;
        if((a.x-px)**2 + (a.y-py)**2 < 550) state.running = false;
    });

    boss.hue = 190 - (1 - boss.hp/boss.maxHp) * 190;
    document.getElementById("hp-bar").style.width = (boss.hp/boss.maxHp)*100 + "%";
    document.getElementById("hp-bar").style.background = `hsl(${boss.hue}, 100%, 50%)`;
    document.getElementById("lvl").innerText = state.lvl;
    document.getElementById("scr").innerText = state.score;
}

function draw(){
    ctx.fillStyle="#02040a"; ctx.fillRect(0,0,state.w,state.h);
    const color = `hsl(${boss.hue}, 100%, 50%)`;

    // Draw Laser Warning/Beam
    if(boss.laserTimer > 4 && boss.laserTimer < 5.5) {
        ctx.strokeStyle = "rgba(255,0,0,0.4)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(state.cx, state.cy);
        ctx.lineTo(state.cx + Math.cos(boss.laserAng)*2000, state.cy + Math.sin(boss.laserAng)*2000);
        ctx.stroke();
    } else if(boss.laserTimer >= 5.5 && boss.laserTimer < 6.5) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 15;
        ctx.shadowBlur = 20; ctx.shadowColor = "#ff0000";
        ctx.beginPath(); ctx.moveTo(state.cx, state.cy);
        ctx.lineTo(state.cx + Math.cos(boss.laserAng)*2000, state.cy + Math.sin(boss.laserAng)*2000);
        ctx.stroke();
        ctx.lineWidth = 5; ctx.strokeStyle = "#ff0000"; ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Draw Boss
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(state.cx, state.cy, boss.r + Math.sin(state.time*10)*3, 0, Math.PI*2); ctx.stroke();
    ctx.save(); ctx.translate(state.cx, state.cy); ctx.rotate(state.time);
    ctx.strokeRect(-20, -20, 40, 40); ctx.rotate(-state.time*2); ctx.strokeRect(-25, -25, 50, 50); ctx.restore();

    // Draw Player (Facing Center)
    const px = state.cx + Math.cos(player.ang)*player.r, py = state.cy + Math.sin(player.ang)*player.r;
    ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(state.cy-py, state.cx-px));
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,-8); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
    ctx.restore();

    // Batch Bullets
    ctx.beginPath(); bullets.forEach(b => { if(!b.p){ ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 4, 0, 7); }});
    ctx.fillStyle = "#ff4444"; ctx.fill();
    ctx.beginPath(); bullets.forEach(b => { if(b.p){ ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 2.5, 0, 7); }});
    ctx.fillStyle = "#00f2ff"; ctx.fill();

    // Asteroids
    ctx.strokeStyle="#333"; ctx.beginPath(); asteroids.forEach(a => { ctx.rect(a.x-7, a.y-7, 14, 14); }); ctx.stroke();

    requestAnimationFrame(draw);
}

let last = performance.now();
function loop(t){ update(Math.min(0.1, (t-last)/1000)); last=t; draw(); requestAnimationFrame(loop); }
initLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
