<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>Orbit Boss</title>
<style>
  html,body{ margin:0; height:100%; background:#02050a; overflow:hidden; color:#fff; font-family: 'Courier New', monospace; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:25px;width:100%;text-align:center;pointer-events:none;z-index:5;text-shadow: 0 0 10px rgba(0,242,255,0.5)}
  #centerMsg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,2,5,0.9);transition:opacity .3s;z-index:10; text-align: center;}
  .hidden{opacity:0;pointer-events:none}
  .stat{color:#00f2ff; font-weight:bold; font-size: 1.2rem}
  #hp-container{width:280px;height:4px;background:rgba(255,255,255,0.05);margin:12px auto;border-radius:2px;overflow:hidden;border: 1px solid rgba(0,242,255,0.2)}
  #hp-bar{height:100%;background:#00f2ff;width:100%;transition: width 0.3s;box-shadow: 0 0 8px #00f2ff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div style="letter-spacing:4px">SYSTEM: LVL <span id="lvl" class="stat">1</span> | DATA: <span id="scr" class="stat">0</span></div>
  <div id="hp-container"><div id="hp-bar"></div></div>
</div>
<div id="centerMsg">
    <div id="msg">
        PRESS [SPACE] OR TAP TO ENGAGE<br>
        <small style="opacity:0.6; font-size:0.8rem; letter-spacing:1px">CLICK/TAP TO FLIP DIRECTION</small>
    </div>
</div>

<script>
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const state={w:0,h:0,lvl:1,score:0,highScore:localStorage.getItem('orbit_hi')||0,running:false,started:false,time:0,cx:0,cy:0};
const player={ang:0, r:0, maxRadius:0, baseSpeed:0.8, currentSpeed:0.8, dir:1, lastShot:0};
const boss={hp:50, maxHp:50, r:50, fireT:0, hue:190};
const bullets=[], asteroids=[], stars=[];
let keyLocked = false, viewScale = 1;

const resize=()=>{
    canvas.width=state.w=innerWidth; canvas.height=state.h=innerHeight;
    state.cx=innerWidth/2; state.cy=innerHeight/2;
    const minDim = Math.min(state.w, state.h);
    player.maxRadius = (minDim / 2) - 40;
    viewScale = minDim < 500 ? 0.7 : 1;
    boss.r = 50 * viewScale;
    generateStars();
};

function generateStars(){
    stars.length = 0;
    for(let i=0; i<150; i++) stars.push({x: Math.random()*state.w, y: Math.random()*state.h, s: Math.random()*2, o: Math.random()});
}

addEventListener("resize",resize); resize();

function handleInteraction() {
    if(!state.started) { state.started = true; state.running = true; document.getElementById("centerMsg").classList.add("hidden"); return; }
    if(!state.running) { location.reload(); return; }
    player.dir *= -1; 
}

addEventListener("keydown", (e) => { if((e.code==='Space'||e.code==='Enter') && !keyLocked) { e.preventDefault(); keyLocked = true; handleInteraction(); }});
addEventListener("keyup", (e) => { if(e.code==='Space'||e.code==='Enter') keyLocked = false; });
addEventListener("pointerdown", (e) => { e.preventDefault(); handleInteraction(); });

function spawnAsteroid(x, y, vx, vy, s, isFragment = false) {
    asteroids.push({x, y, vx, vy, s, isFragment, rot: Math.random()*6});
}

function initLevel(){
    boss.maxHp = 40 + (state.lvl*20); boss.hp = boss.maxHp;
    asteroids.length = 0;
    const count = 20 + Math.min(state.lvl * 5, 40); 
    for(let i=0; i<count; i++) {
        const a = Math.random()*Math.PI*2, d = player.maxRadius * 2 + Math.random()*300;
        spawnAsteroid(state.cx+Math.cos(a)*d, state.cy+Math.sin(a)*d, (Math.random()-0.5)*150, (Math.random()-0.5)*150, (10+Math.random()*12)*viewScale);
    }
}

function update(dt){
    if(!state.running) return;
    state.time += dt;
    player.currentSpeed = player.baseSpeed + (state.lvl-1)*0.15 + (state.time * 0.02);
    player.ang += (player.currentSpeed * player.dir) * dt;
    player.r = (player.maxRadius * 0.85) + Math.sin(state.time * 0.6) * (player.maxRadius * 0.1);
    const px = state.cx + Math.cos(player.ang)*player.r, py = state.cy + Math.sin(player.ang)*player.r;

    if(state.time - player.lastShot > 0.22){
        player.lastShot = state.time;
        const la = Math.atan2(state.cy-py, state.cx-px);
        bullets.push({x:px, y:py, vx:Math.cos(la)*1000, vy:Math.sin(la)*1000, p:true});
    }

    boss.fireT += dt;
    if(boss.fireT > Math.max(0.5, 2.2 - (state.lvl*0.25))){
        boss.fireT = 0;
        for(let i=0; i<8; i++){
            const a = (i/8)*Math.PI*2 + state.time;
            bullets.push({x:state.cx, y:state.cy, vx:Math.cos(a)*200*viewScale, vy:Math.sin(a)*200*viewScale, p:false});
        }
    }

    bullets.forEach((b,i) => {
        b.x += b.vx*dt; b.y += b.vy*dt;
        if(b.p){
            if((b.x-state.cx)**2 + (b.y-state.cy)**2 < boss.r**2){
                bullets.splice(i,1); boss.hp--; state.score+=25;
                if(boss.hp <= 0) { state.lvl++; initLevel(); }
            }
        } else if((b.x-px)**2 + (b.y-py)**2 < (12*viewScale)**2) endGame();
        if(b.x<0||b.x>state.w||b.y<0||b.y>state.h) bullets.splice(i,1);
    });

    asteroids.forEach(a => {
        a.x += a.vx*dt; a.y += a.vy*dt;
        if(a.x<0||a.x>state.w) a.vx*=-1; if(a.y<0||a.y>state.h) a.vy*=-1;
        if((a.x-px)**2 + (a.y-py)**2 < (a.s+8)**2) endGame();
    });

    boss.hue = 190 - (1 - boss.hp/boss.maxHp) * 190;
    document.getElementById("hp-bar").style.width = (boss.hp/boss.maxHp)*100 + "%";
    document.getElementById("lvl").innerText = state.lvl;
    document.getElementById("scr").innerText = state.score;
}

function endGame(){
    state.running = false;
    if(state.score > state.highScore){
        state.highScore = state.score;
        localStorage.setItem('orbit_hi', state.score);
    }
    document.getElementById("msg").innerHTML = `CRITICAL FAILURE<br>SCORE: ${state.score} | BEST: ${state.highScore}<br><small>TAP TO REBOOT</small>`;
    document.getElementById("centerMsg").classList.remove("hidden");
}

function draw(){
    ctx.fillStyle="#02050a"; ctx.fillRect(0,0,state.w,state.h);
    ctx.fillStyle="#fff"; stars.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));
    const px = state.cx + Math.cos(player.ang)*player.r, py = state.cy + Math.sin(player.ang)*player.r;
    
    ctx.save(); ctx.translate(state.cx, state.cy); ctx.rotate(state.time*0.5);
    ctx.strokeStyle=`hsl(${boss.hue},100%,50%)`; ctx.lineWidth=3; ctx.strokeRect(-boss.r,-boss.r,boss.r*2,boss.r*2);
    ctx.restore();

    ctx.save(); ctx.translate(px,py); ctx.rotate(Math.atan2(state.cy-py, state.cx-px));
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(15*viewScale,0); ctx.lineTo(-10*viewScale,-8*viewScale); ctx.lineTo(-10*viewScale,8*viewScale); ctx.fill();
    ctx.restore();

    ctx.fillStyle="#ff3333"; bullets.forEach(b=>{ if(!b.p){ ctx.beginPath(); ctx.arc(b.x,b.y,4*viewScale,0,7); ctx.fill(); }});
    ctx.fillStyle="#00f2ff"; bullets.forEach(b=>{ if(b.p){ ctx.beginPath(); ctx.arc(b.x,b.y,3*viewScale,0,7); ctx.fill(); }});
    ctx.strokeStyle="#4b5563"; asteroids.forEach(a=>{ ctx.strokeRect(a.x-a.s,a.y-a.s,a.s*2,a.s*2); });
}

let last = performance.now();
function loop(t){ update(Math.min(0.1, (t-last)/1000)); last=t; draw(); requestAnimationFrame(loop); }
initLevel(); requestAnimationFrame(loop);
</script>
</body>
</html>
