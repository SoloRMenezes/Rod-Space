<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Orbit Boss — Elite Edition</title>
<style>
  html,body{margin:0;height:100%;background:#02040a;overflow:hidden;color:#fff;font-family: 'Courier New', Courier, monospace}
  canvas{display:block;width:100vw;height:100vh;image-rendering: auto}
  #hud{position:fixed;top:20px;width:100%;text-align:center;pointer-events:none;font-size:1rem;letter-spacing:3px;font-weight: bold}
  #centerMsg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,0.8);transition:opacity .2s}
  .hidden{opacity:0;pointer-events:none}
  .stat{color:#00f2ff;text-shadow: 0 0 8px rgba(0,242,255,0.6)}
  #hp-container{width:200px;height:4px;background:rgba(255,255,255,0.1);margin:10px auto;border-radius:2px}
  #hp-bar{height:100%;background:#00f2ff;width:100%;transition:width 0.2s, background 0.2s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>LEVEL <span id="lvl" class="stat">1</span> | SCORE <span id="scr" class="stat">0</span></div>
  <div id="hp-container"><div id="hp-bar"></div></div>
</div>
<div id="centerMsg"><div id="msg">SPACE / ENTER TO FLIP<br><small style="opacity:0.6">STAY ALIVE. DESTROY THE CORE.</small></div></div>

<script>
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const state={w:0,h:0,lvl:1,score:0,running:true,time:0,cx:0,cy:0};
const player={ang:0, r:200, speed:3.5, dir:1, lastShot:0};
const boss={hp:25, maxHp:25, r:45, fireT:0, hue:190};
const bullets=[], asteroids=[];

const resize=()=>{
    canvas.width=state.w=innerWidth;
    canvas.height=state.h=innerHeight;
    state.cx=innerWidth/2;
    state.cy=innerHeight/2;
};
addEventListener("resize",resize); resize();

const handleFlip = (e) => {
    if(e.code==='Space' || e.code==='Enter') {
        if(!state.running) { location.reload(); return; }
        player.dir *= -1; 
        document.getElementById("centerMsg").classList.add("hidden");
    }
};
addEventListener("keydown", handleFlip);

function initLevel(){
    boss.maxHp = 20 + (state.lvl*10);
    boss.hp = boss.maxHp;
    asteroids.length = 0;
    for(let i=0; i<Math.min(state.lvl+5, 18); i++) {
        const a = Math.random()*Math.PI*2;
        const d = 400 + Math.random()*300;
        asteroids.push({x:state.cx+Math.cos(a)*d, y:state.cy+Math.sin(a)*d, vx:(Math.random()-0.5)*150, vy:(Math.random()-0.5)*150, s:14});
    }
}

function update(dt){
    if(!state.running) return;
    state.time += dt;

    // Movement & Pulse logic
    player.ang += (player.speed * player.dir) * dt;
    player.r = 200 + Math.sin(state.time * 0.8) * 80;

    const px = state.cx + Math.cos(player.ang)*player.r;
    const py = state.cy + Math.sin(player.ang)*player.r;

    // Auto-fire
    if(state.time - player.lastShot > 0.3){
        player.lastShot = state.time;
        const a = Math.atan2(state.cy-py, state.cx-px);
        bullets.push({x:px, y:py, vx:Math.cos(a)*700, vy:Math.sin(a)*700, p:true});
    }

    // Boss Attack
    boss.fireT += dt;
    const rate = Math.max(0.25, 1.4 - (state.lvl*0.12));
    if(boss.fireT > rate){
        boss.fireT = 0;
        const count = 6 + Math.min(state.lvl, 4);
        for(let i=0; i<count; i++){
            const a = (i/count)*Math.PI*2 + (state.time * 1.2);
            bullets.push({x:state.cx, y:state.cy, vx:Math.cos(a)*250, vy:Math.sin(a)*250, p:false});
        }
    }

    // Boss Visuals
    boss.hue = 190 - (1 - boss.hp/boss.maxHp) * 190;

    // Collisions (Optimized)
    const bossRSq = boss.r * boss.r;
    for(let i=bullets.length-1; i>=0; i--){
        const b = bullets[i];
        b.x += b.vx*dt; b.y += b.vy*dt;
        
        const dxB = b.x - state.cx, dyB = b.y - state.cy;
        const distSqB = dxB*dxB + dyB*dyB;

        if(b.p){ 
            if(distSqB < bossRSq){
                bullets.splice(i,1); boss.hp--; state.score+=25;
                if(boss.hp <= 0) { state.lvl++; initLevel(); }
            }
        } else {
            const dxP = b.x - px, dyP = b.y - py;
            if(dxP*dxP + dyP*dyP < 144){ 
                state.running = false;
                document.getElementById("centerMsg").innerHTML = "CORE OVERLOAD<br>SCORE: "+state.score+"<br>PRESS SPACE";
                document.getElementById("centerMsg").classList.remove("hidden");
            }
        }
        if(b.x<0||b.x>state.w||b.y<0||b.y>state.h) bullets.splice(i,1);
    }

    for(let i=0; i<asteroids.length; i++){
        const a = asteroids[i];
        a.x += a.vx*dt; a.y += a.vy*dt;
        if(a.x<0||a.x>state.w) a.vx*=-1; if(a.y<0||a.y>state.h) a.vy*=-1;
        const dxA = a.x - px, dyA = a.y - py;
        if(dxA*dxA + dyA*dyA < 576){ // Collision
            state.running = false;
            document.getElementById("centerMsg").classList.remove("hidden");
        }
    }

    // HUD Update
    const hpPer = (boss.hp/boss.maxHp)*100;
    document.getElementById("lvl").innerText = state.lvl;
    document.getElementById("scr").innerText = state.score;
    document.getElementById("hp-bar").style.width = hpPer + "%";
    document.getElementById("hp-bar").style.background = `hsl(${boss.hue}, 100%, 50%)`;
}

function drawBoss(){
    const t = state.time;
    const color = `hsl(${boss.hue}, 100%, 50%)`;
    
    // Outer Rings
    ctx.lineWidth = 2;
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.3;
    for(let i=0; i<3; i++){
        ctx.beginPath();
        const r = boss.r + 15 + (i*10) + Math.sin(t*2+i)*5;
        ctx.arc(state.cx, state.cy, r, t*(i+1), t*(i+1) + Math.PI*1.5);
        ctx.stroke();
    }

    // Core
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 20;
    ctx.shadowColor = color;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(state.cx, state.cy, boss.r, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Geometric Center
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(state.cx, state.cy);
    ctx.rotate(t*2);
    ctx.fillRect(-10, -10, 20, 20);
    ctx.rotate(-t*4);
    ctx.strokeRect(-15, -15, 30, 30);
    ctx.restore();
    ctx.shadowBlur = 0;
}

function draw(){
    ctx.fillStyle="#02040a";
    ctx.fillRect(0,0,state.w,state.h);

    drawBoss();

    // Player (Facing Middle)
    const px = state.cx + Math.cos(player.ang)*player.r;
    const py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy - py, state.cx - px);

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(lookAngle);
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#fff";
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.moveTo(15,0); ctx.lineTo(-10,-7); ctx.lineTo(-10,7); ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;

    // Batch Draw Bullets
    ctx.beginPath();
    for(const b of bullets) { if(!b.p) { ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 4, 0, 7); } }
    ctx.fillStyle = "#ff3a3a"; ctx.fill();

    ctx.beginPath();
    for(const b of bullets) { if(b.p) { ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 2, 0, 7); } }
    ctx.fillStyle = "#00f2ff"; ctx.fill();

    // Draw Asteroids
    ctx.strokeStyle="#333";
    ctx.beginPath();
    for(const a of asteroids) { ctx.rect(a.x-7, a.y-7, 14, 14); }
    ctx.stroke();

    requestAnimationFrame(draw);
}

let last = performance.now();
function loop(t){ 
    const dt = Math.min(0.1, (t-last)/1000);
    last=t; 
    update(dt); 
    draw(); 
}
initLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
