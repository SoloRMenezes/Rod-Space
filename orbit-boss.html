<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>Orbit Boss</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#02050a;
    overflow:hidden;
    color:#fff;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:25px;width:100%;text-align:center;pointer-events:none;z-index:5;text-shadow: 0 0 10px rgba(0,242,255,0.5)}
  #centerMsg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,2,5,0.9);transition:opacity .3s;z-index:10; text-align: center;}
  .hidden{opacity:0;pointer-events:none}
  .stat{color:#00f2ff; font-weight:bold; font-size: 1.2rem}
  #hp-container{width:280px;height:4px;background:rgba(255,255,255,0.05);margin:12px auto;border-radius:2px;overflow:hidden;border: 1px solid rgba(0,242,255,0.2)}
  #hp-bar{height:100%;background:#00f2ff;width:100%;transition: width 0.3s;box-shadow: 0 0 8px #00f2ff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div style="letter-spacing:4px">SYSTEM: LVL <span id="lvl" class="stat">1</span> | DATA: <span id="scr" class="stat">0</span></div>
  <div id="hp-container"><div id="hp-bar"></div></div>
</div>
<div id="centerMsg">
    <div id="msg">PRESS [SPACE] OR TAP TO ENGAGE<br><small style="opacity:0.6; font-size:0.8rem; letter-spacing:1px">CLICK/TAP TO FLIP DIRECTION | AUTO-FIRE ENGAGED</small></div>
</div>

<script>
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const state={w:0,h:0,lvl:1,score:0,highScore:localStorage.getItem('orbit_hi')||0,running:false,started:false,time:0,cx:0,cy:0};
const player={ang:0, r:200, maxRadius:200, baseSpeed:0.8, currentSpeed:0.8, dir:1, lastShot:0, hitW: 35, hitH: 25};
const boss={hp:50, maxHp:50, r:50, fireT:0, hue:190};
const bullets=[], asteroids=[], stars=[];
let keyLocked = false;

const resize=()=>{
    canvas.width=state.w=innerWidth; canvas.height=state.h=innerHeight;
    state.cx=innerWidth/2; state.cy=innerHeight/2;
    const minDim = Math.min(state.w, state.h);
    player.maxRadius = (minDim / 2) - 40; 
    generateStars();
};

function generateStars(){
    stars.length = 0;
    for(let i=0; i<150; i++){
        stars.push({x: Math.random()*state.w, y: Math.random()*state.h, s: Math.random()*2, o: Math.random(), v: Math.random() * 0.5 });
    }
}

addEventListener("resize",resize); resize();

function handleInteraction() {
    if(!state.started) { state.started = true; state.running = true; document.getElementById("centerMsg").classList.add("hidden"); return; }
    if(!state.running) { location.reload(); return; }
    player.dir *= -1; 
}

addEventListener("keydown", (e) => { if((e.code==='Space' || e.code==='Enter') && !keyLocked) { e.preventDefault(); keyLocked = true; handleInteraction(); }});
addEventListener("keyup", (e) => { if(e.code==='Space' || e.code==='Enter') keyLocked = false; });
addEventListener("pointerdown", () => handleInteraction());

function spawnAsteroid(x, y, vx, vy, s, isFragment = false) {
    asteroids.push({x, y, vx, vy, s, isFragment, rot: Math.random()*6, rotV: (Math.random()-0.5)*3});
}

function initLevel(){
    boss.maxHp = 40 + (state.lvl*20); boss.hp = boss.maxHp;
    asteroids.length = 0;
    const count = 30 + Math.min(state.lvl * 5, 50); 
    for(let i=0; i<count; i++) {
        const a = Math.random()*Math.PI*2, d = player.maxRadius * 2 + Math.random()*600;
        spawnAsteroid(state.cx+Math.cos(a)*d, state.cy+Math.sin(a)*d, (Math.random()-0.5)*150, (Math.random()-0.5)*150, 10+Math.random()*12);
    }
}

// Check if a point is inside the rotated ship rectangle
function isInsideShip(px, py, ang, tx, ty) {
    const dx = tx - px, dy = ty - py;
    const rx = dx * Math.cos(-ang) - dy * Math.sin(-ang);
    const ry = dx * Math.sin(-ang) + dy * Math.cos(-ang);
    return (rx > -player.hitW/2 && rx < player.hitW/2 && ry > -player.hitH/2 && ry < player.hitH/2);
}

function update(dt){
    if(!state.running) return;
    state.time += dt;
    player.currentSpeed = player.baseSpeed + (state.lvl-1)*0.15 + (state.time * 0.02);
    player.ang += (player.currentSpeed * player.dir) * dt;
    player.r = (player.maxRadius * 0.9) + Math.sin(state.time * 0.6) * (player.maxRadius * 0.1);

    const px = state.cx + Math.cos(player.ang)*player.r;
    const py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy-py, state.cx-px);

    if(state.time - player.lastShot > 0.22){
        player.lastShot = state.time;
        bullets.push({x:px, y:py, vx:Math.cos(lookAngle)*1000, vy:Math.sin(lookAngle)*1000, p:true});
    }

    boss.fireT += dt;
    if(boss.fireT > Math.max(0.5, 2.2 - (state.lvl*0.25))){
        boss.fireT = 0;
        for(let i=0; i<8; i++){
            const a = (i/8)*Math.PI*2 + state.time;
            bullets.push({x:state.cx, y:state.cy, vx:Math.cos(a)*(150+Math.random()*150), vy:Math.sin(a)*(150+Math.random()*150), p:false});
        }
    }

    bullets.forEach((b,i) => {
        b.x += b.vx*dt; b.y += b.vy*dt;
        if(b.p){
            if((b.x-state.cx)**2 + (b.y-state.cy)**2 < boss.r**2){
                bullets.splice(i,1); boss.hp--; state.score+=25;
                if(boss.hp <= 0) { state.lvl++; initLevel(); }
            }
            asteroids.forEach((ast, j) => {
                if((b.x-ast.x)**2 + (b.y-ast.y)**2 < (ast.s+15)**2){
                    bullets.splice(i,1); state.score+=50;
                    if(!ast.isFragment) for(let k=0; k<3; k++) spawnAsteroid(ast.x,ast.y,(Math.random()-0.5)*300,(Math.random()-0.5)*300,5,true);
                    asteroids.splice(j,1);
                }
            });
        } else if(isInsideShip(px, py, lookAngle, b.x, b.y)) endGame();
        if(b.x<0||b.x>state.w||b.y<0||b.y>state.h) bullets.splice(i,1);
    });

    asteroids.forEach(a => {
        a.x += a.vx*dt; a.y += a.vy*dt;
        if(a.x<0||a.x>state.w) a.vx*=-1; if(a.y<0||a.y>state.h) a.vy*=-1;
        if(isInsideShip(px, py, lookAngle, a.x, a.y)) endGame();
    });

    boss.hue = 190 - (1 - boss.hp/boss.maxHp) * 190;
    document.getElementById("hp-bar").style.width = (boss.hp/boss.maxHp)*100 + "%";
    document.getElementById("lvl").innerText = state.lvl;
    document.getElementById("scr").innerText = state.score;
}

function endGame(){
    state.running = false;
    if(state.score > state.highScore){ state.highScore = state.score; localStorage.setItem('orbit_hi', state.score); }
    document.getElementById("msg").innerHTML = `CRITICAL FAILURE<br>SCORE: ${state.score} | BEST: ${state.highScore}<br><small style="opacity:0.6">TAP TO REBOOT</small>`;
    document.getElementById("centerMsg").classList.remove("hidden");
}

function drawStars(){
    ctx.fillStyle = "#fff";
    stars.forEach(s => { ctx.globalAlpha = s.o * Math.abs(Math.sin(state.time + s.x)); ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1;
}

function drawBoss(){
    const t = state.time, h = boss.hue;
    ctx.save(); ctx.translate(state.cx, state.cy); ctx.strokeStyle = `hsla(${h}, 100%, 50%, 0.3)`; ctx.rotate(t * 0.3);
    for(let i=0; i<8; i++){ ctx.rotate(Math.PI/4); ctx.strokeRect(boss.r + 10, -15, 10, 30); }
    ctx.rotate(-t * 0.8); ctx.strokeStyle = `hsl(${h}, 100%, 50%)`; ctx.lineWidth = 3;
    ctx.beginPath(); for(let i=0; i<6; i++){ const a = (i/6)*Math.PI*2; ctx.lineTo(Math.cos(a)*boss.r, Math.sin(a)*boss.r); }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = `hsla(${h}, 100%, 70%, ${0.2 + Math.sin(t*10)*0.1})`; ctx.beginPath(); ctx.arc(0,0, 20 + Math.sin(t*5)*5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawPlayer(px, py, ang){
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
    // Optional: Uncomment the next two lines to see the hitbox while debugging
    // ctx.strokeStyle = "rgba(0, 242, 255, 0.3)";
    // ctx.strokeRect(-player.hitW/2, -player.hitH/2, player.hitW, player.hitH);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-12, -10); ctx.lineTo(-8, 0); ctx.lineTo(-12, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#00f2ff"; ctx.beginPath(); ctx.arc(-10, 0, 4 + Math.sin(state.time*20)*2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function draw(){
    ctx.fillStyle="#02050a"; ctx.fillRect(0,0,state.w,state.h);
    drawStars();
    const px = state.cx + Math.cos(player.ang)*player.r, py = state.cy + Math.sin(player.ang)*player.r;
    const lookAngle = Math.atan2(state.cy-py, state.cx-px);
    drawBoss(); drawPlayer(px, py, lookAngle);
    ctx.beginPath(); bullets.forEach(b => { if(!b.p){ ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 4, 0, 7); }});
    ctx.fillStyle = "#ff3333"; ctx.fill();
    ctx.beginPath(); bullets.forEach(b => { if(b.p){ ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 3, 0, 7); }});
    ctx.fillStyle = "#00f2ff"; ctx.fill();
    asteroids.forEach(a => { ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot); ctx.strokeStyle="#4b5563"; ctx.lineWidth=2; ctx.strokeRect(-a.s, -a.s, a.s*2, a.s*2); ctx.restore(); });
    requestAnimationFrame(draw);
}

let last = performance.now();
function loop(t){ update(Math.min(0.1, (t-last)/1000)); last=t; draw(); requestAnimationFrame(loop); }
initLevel(); requestAnimationFrame(loop);
</script>
  <script src="assets/language-toggle.js?v=page-dock-2" defer></script>
</body>
</html>
