<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THEFT - Overhead Vault</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --accent-go: #22d3ee;
            --penalty-red: #ef4444;
            --p1-color: #f43f5e;
            --p2-color: #3b82f6;
            --p3-color: #10b981;
            --p4-color: #f59e0b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
        }

        /* --- Overhead Perspective Background --- */
        #vault-room {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            overflow: hidden;
        }

        .floor-grid {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            z-index: 2;
        }

        /* Searchlights - Small, bright, and dispersed */
        .flashlight {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(
                circle, 
                rgba(255, 255, 255, 0.3) 0%, 
                rgba(255, 255, 255, 0.1) 30%, 
                rgba(255, 255, 255, 0) 70%
            );
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: screen;
            will-change: transform;
        }

        /* Pedestal - Further reduced size */
        .wooden-base {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: 
                repeating-radial-gradient(circle at 50% 50%, #452c1e 0px, #3a2519 10px, #2d1d14 20px);
            border: 8px solid #1a120c;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.9),
                inset 0 0 40px rgba(0,0,0,0.7);
            z-index: 4;
        }

        /* Game Arena */
        #game-arena { 
            position: relative;
            z-index: 10; 
            visibility: hidden; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .diamond-container {
            width: 90px; height: 90px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; 
            z-index: 50;
        }

        #diamond-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
        .facet { transition: all 0.3s ease; }
        .facet-base { fill: #2c3e50; }
        .facet-side { fill: #34495e; }
        .facet-top { fill: #5d6d7e; }
        .facet-highlight { fill: rgba(255,255,255,0.2); }

        @keyframes shimmer { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        .shine { animation: shimmer 3s infinite ease-in-out; }

        body.go-state #diamond-svg { filter: drop-shadow(0 0 40px var(--accent-go)); }
        body.go-state .facet-base { fill: #22d3ee; }
        body.go-state .facet-side { fill: #67e8f9; }
        body.go-state .facet-top { fill: #a5f3fc; }
        body.go-state .facet-highlight { fill: rgba(255,255,255,0.7); }
        body.go-state .diamond-container { transform: scale(1.2) rotate(5deg); }

        /* Player Zones */
        .player-zone {
            position: absolute;
            width: 40vw; height: 40vw; max-width: 180px; max-height: 180px;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(8px);
            z-index: 200; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; overflow: hidden;
        }
        .player-zone.active { display: flex; }
        .p1 { bottom: 0; left: 0; border-top-right-radius: 100%; border-right: 6px solid var(--p1-color); border-top: 6px solid var(--p1-color); }
        .p2 { bottom: 0; right: 0; border-top-left-radius: 100%; border-left: 6px solid var(--p2-color); border-top: 6px solid var(--p2-color); }
        .p3 { top: 0; right: 0; border-bottom-left-radius: 100%; border-left: 6px solid var(--p3-color); border-bottom: 6px solid var(--p3-color); }
        .p4 { top: 0; left: 0; border-bottom-right-radius: 100%; border-right: 6px solid var(--p4-color); border-bottom: 6px solid var(--p4-color); }

        .score-value { font-size: 2.5rem; font-weight: 900; pointer-events: none; }
        .penalty-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--penalty-red); display: flex; justify-content: center; align-items: center;
            font-size: 5rem; font-weight: 900; opacity: 0; transition: opacity 0.1s; z-index: 3;
            pointer-events: none; color: white;
        }
        .penalty-active .penalty-overlay { opacity: 1; }

        /* Screens */
        #setup-screen, #win-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; gap: 1.2rem;
        }
        #win-modal { display: none; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(10px); }
        .menu-title { font-size: 4rem; font-weight: 900; color: var(--accent-go); margin: 0; }
        .menu-btn {
            background: #1e293b; color: white; border: 2px solid rgba(255,255,255,0.1);
            padding: 1rem 2.5rem; font-size: 1.5rem; font-weight: 800; border-radius: 1rem;
            cursor: pointer; transition: all 0.2s; min-width: 100px;
        }

        #hand-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 300; overflow: hidden; 
        }
        .cartoon-hand { 
            position: absolute; 
            width: 180px; height: 180px; 
            transform: translate(-50%, -50%) scale(0); 
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.7));
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="vault-room">
        <div class="floor-grid"></div>
        <div id="lights-layer"></div>
        <div class="wooden-base"></div>
    </div>

    <div id="setup-screen">
        <h1 class="menu-title">THEFT</h1>
        <p style="opacity: 0.6; font-weight: 800; letter-spacing: 2px; margin-bottom: 20px;">CHOOSE CREW SIZE</p>
        <div class="button-group" style="display: flex; gap: 1rem;">
            <button class="menu-btn" onclick="startGame(2)">2</button>
            <button class="menu-btn" onclick="startGame(3)">3</button>
            <button class="menu-btn" onclick="startGame(4)">4</button>
        </div>
    </div>

    <div id="hand-layer">
        <svg style="display:none">
            <symbol id="hand-shape" viewBox="0 0 200 200">
                <path d="M 100,160 C 70,160 50,140 50,110 L 45,60 C 45,50 55,50 55,60 L 60,105 L 65,30 C 65,20 75,20 75,30 L 80,100 L 90,20 C 90,10 100,10 100,20 L 105,100 L 115,30 C 115,20 125,20 125,30 L 130,105 L 140,70 C 140,60 150,60 150,70 L 145,110 C 145,140 130,160 100,160 Z" fill="currentColor" />
            </symbol>
        </svg>
        <div id="active-hand-container"></div>
    </div>

    <div id="zone-1" class="player-zone p1" data-key="z"><div id="score-1" class="score-value">0</div><div class="penalty-overlay">✕</div></div>
    <div id="zone-2" class="player-zone p2" data-key="m"><div id="score-2" class="score-value">0</div><div class="penalty-overlay">✕</div></div>
    <div id="zone-3" class="player-zone p3" data-key="p"><div id="score-3" class="score-value">0</div><div class="penalty-overlay">✕</div></div>
    <div id="zone-4" class="player-zone p4" data-key="q"><div id="score-4" class="score-value">0</div><div class="penalty-overlay">✕</div></div>

    <div id="game-arena">
        <div class="diamond-container" id="diamond-box">
            <svg id="diamond-svg" viewBox="0 0 100 100">
                <polygon class="facet facet-base" points="50,10 90,50 50,90 10,50" />
                <polygon class="facet facet-side" points="50,10 70,30 50,50 30,30" />
                <polygon class="facet facet-side" points="90,50 70,70 50,50 70,30" />
                <polygon class="facet facet-side" points="50,90 30,70 50,50 70,70" />
                <polygon class="facet facet-side" points="10,50 30,30 50,50 30,70" />
                <polygon class="facet facet-top" points="50,25 75,50 50,75 25,50" />
                <polygon class="facet facet-highlight shine" points="50,25 62.5,37.5 50,50 37.5,37.5" />
            </svg>
        </div>
    </div>

    <div id="win-modal">
        <h1 id="winner-text">HEIST COMPLETE!</h1>
        <button class="menu-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        const WIN_SCORE = 5;
        const PENALTY_DURATION = 1500;
        let isGoSignalActive = false, roundInProgress = false, gameActive = false;

        const players = {
            'z': { id: 1, score: 0, penalized: false, timer: null, active: false },
            'm': { id: 2, score: 0, penalized: false, timer: null, active: false },
            'p': { id: 3, score: 0, penalized: false, timer: null, active: false },
            'q': { id: 4, score: 0, penalized: false, timer: null, active: false }
        };

        const diamondBox = document.getElementById('diamond-box');
        const setupScreen = document.getElementById('setup-screen');
        const gameArena = document.getElementById('game-arena');
        const activeHandContainer = document.getElementById('active-hand-container');
        const lightsLayer = document.getElementById('lights-layer');

        function createFlashlights() {
            // Limited to 4-5 lights at once
            for(let i=0; i<5; i++) {
                const f = document.createElement('div');
                f.className = 'flashlight';
                // Initialize far off-screen
                f.style.left = '-300px'; 
                f.style.top = '-300px';
                lightsLayer.appendChild(f);
                // Stagger their initial start times
                setTimeout(() => animateFlashlight(f), i * 1500);
            }
        }

        function animateFlashlight(el) {
            // Logic to start off-screen and end off-screen
            const winW = 100; // vw
            const winH = 100; // vh
            const padding = 25; // How far off screen to go

            // Choose a side to start on (0:Top, 1:Right, 2:Bottom, 3:Left)
            const side = Math.floor(Math.random() * 4);
            let startX, startY, endX, endY;

            switch(side) {
                case 0: // Top
                    startX = Math.random() * winW; startY = -padding;
                    endX = Math.random() * winW; endY = winH + padding;
                    break;
                case 1: // Right
                    startX = winW + padding; startY = Math.random() * winH;
                    endX = -padding; endY = Math.random() * winH;
                    break;
                case 2: // Bottom
                    startX = Math.random() * winW; startY = winH + padding;
                    endX = Math.random() * winW; endY = -padding;
                    break;
                case 3: // Left
                    startX = -padding; startY = Math.random() * winH;
                    endX = winW + padding; endY = Math.random() * winH;
                    break;
            }

            const duration = 6000 + Math.random() * 6000;

            el.animate([
                { transform: `translate(${startX}vw, ${startY}vh)` },
                { transform: `translate(${endX}vw, ${endY}vh)` }
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            }).onfinish = () => animateFlashlight(el);
        }

        window.onload = createFlashlights;

        function startGame(count) {
            setupScreen.style.display = 'none';
            gameArena.style.visibility = 'visible';
            gameActive = true;
            if (count === 2) { players['z'].active = true; players['p'].active = true; }
            else if (count === 3) { players['z'].active = true; players['m'].active = true; players['p'].active = true; }
            else { Object.values(players).forEach(p => p.active = true); }
            Object.values(players).forEach(p => { if (p.active) document.getElementById(`zone-${p.id}`).classList.add('active'); });
            prepareRound();
        }

        function prepareRound() {
            if (!gameActive) return;
            roundInProgress = true;
            isGoSignalActive = false;
            document.body.classList.remove('go-state');
            diamondBox.style.transform = 'translate(0, 0) scale(1)';
            activeHandContainer.innerHTML = '';
            setTimeout(() => { if (roundInProgress) triggerGoSignal(); }, Math.random() * 3000 + 1000);
        }

        function triggerGoSignal() {
            isGoSignalActive = true;
            document.body.classList.add('go-state');
        }

        function handleAction(key) {
            if (!gameActive || !roundInProgress) return;
            const p = players[key];
            if (!p || !p.active) return;
            if (!isGoSignalActive) penalizePlayer(key);
            else if (!p.penalized) resolveRound(key);
        }

        function penalizePlayer(key) {
            const p = players[key];
            if (p.penalized) return;
            p.penalized = true;
            document.getElementById(`zone-${p.id}`).classList.add('penalty-active');
            clearTimeout(p.timer);
            p.timer = setTimeout(() => {
                p.penalized = false;
                document.getElementById(`zone-${p.id}`).classList.remove('penalty-active');
            }, PENALTY_DURATION);
        }

        function resolveRound(key) {
            roundInProgress = false;
            isGoSignalActive = false;
            const p = players[key];
            animateHand(p);
            setTimeout(() => {
                p.score++;
                document.getElementById(`score-${p.id}`).innerText = p.score;
                if (p.score >= WIN_SCORE) setTimeout(() => endMatch(p.id), 500);
                else setTimeout(prepareRound, 1000);
            }, 600);
        }

        function animateHand(player) {
            const winW = window.innerWidth, winH = window.innerHeight;
            let startX, startY, rotation;
            switch(player.id) {
                case 1: startX = 0; startY = winH; rotation = 45; break;
                case 2: startX = winW; startY = winH; rotation = -45; break;
                case 3: startX = winW; startY = 0; rotation = -135; break;
                case 4: startX = 0; startY = 0; rotation = 135; break;
            }
            const hand = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            hand.setAttribute("class", "cartoon-hand");
            hand.innerHTML = `<use href="#hand-shape" />`;
            hand.style.color = getComputedStyle(document.documentElement).getPropertyValue(`--p${player.id}-color`);
            hand.style.left = `${startX}px`; hand.style.top = `${startY}px`;
            activeHandContainer.appendChild(hand);
            
            requestAnimationFrame(() => {
                hand.style.transition = 'all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)';
                hand.style.left = `50%`; hand.style.top = `50%`;
                hand.style.transform = `translate(-50%, -50%) scale(1.4) rotate(${rotation}deg)`;
                setTimeout(() => {
                    diamondBox.style.transition = 'transform 0.4s cubic-bezier(0.55, 0.055, 0.675, 0.19)';
                    diamondBox.style.transform = `translate(${(startX-winW/2)*1.1}px, ${(startY-winH/2)*1.1}px) scale(0.1) rotate(${rotation}deg)`;
                    hand.style.transition = 'all 0.4s cubic-bezier(0.55, 0.055, 0.675, 0.19)';
                    hand.style.left = `${startX}px`; hand.style.top = `${startY}px`;
                    hand.style.transform = `translate(-50%, -50%) scale(0.5) rotate(${rotation}deg)`;
                }, 250);
            });
        }

        function endMatch(id) {
            gameActive = false;
            const modal = document.getElementById('win-modal');
            const txt = document.getElementById('winner-text');
            txt.innerText = `PLAYER ${id} GOT AWAY!`;
            txt.style.color = getComputedStyle(document.documentElement).getPropertyValue(`--p${id}-color`);
            modal.style.display = 'flex';
        }

        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (players[key]) handleAction(key);
        });

        document.querySelectorAll('.player-zone').forEach(z => {
            const key = z.getAttribute('data-key');
            z.addEventListener('touchstart', e => { e.preventDefault(); handleAction(key); }, {passive: false});
            z.addEventListener('mousedown', () => handleAction(key));
        });
    </script>
</body>
</html>
