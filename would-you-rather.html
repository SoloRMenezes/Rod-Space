        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
            overflow: hidden;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-enter {
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:active {
            transform: scale(0.97);
            background: rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
        }
    </style>
</head>

                    "Lose your virginity outdoors at night",
                    "Lose your virginity in a fancy hotel",
                    "Your crush is your first",
                    "A stranger is your first",
                    "Have amazing chemistry but bad technique on first time",
                    "Have okay chemistry but perfect technique"
                ]
            }
        };

        let currentCatId = null;
        let seenComboKeys = {}; // Tracks "idx1-idx2" strings
        let totalCombos = 200 * 199 / 2; // for 200 options

        // Load History
        const saved = localStorage.getItem('wyr_combos_history');
        if (saved) seenComboKeys = JSON.parse(saved);

        function startGame(id) {
            if (id === '18plus') {
                const pass = prompt("Enter password to access 18+ category:");
                if (pass !== "67676767") {
                    alert("Incorrect password. Access denied.");
                    return;
                }
            }

            currentCatId = id;
            if (!seenComboKeys[id]) seenComboKeys[id] = [];

            // Reset if all combinations were seen
            if (seenComboKeys[id].length >= totalCombos) {
                seenComboKeys[id] = [];
                saveHistory();
            }

            document.getElementById('category-tag').innerText = gameData[id].name;
            document.getElementById('home').classList.remove('active');
            document.getElementById('game').classList.add('active');
            nextCard();
        }

        function nextCard() {
            const options = gameData[currentCatId].options;
            const seen = seenComboKeys[currentCatId];

            if (seen.length >= totalCombos) {
                goHome();
                return;
            }

            // Find a unique pair that hasn't been shown
            let idx1, idx2, key;
            let attempts = 0;
            
            // We search for a pair that isn't in 'seen'
            // To ensure we don't hang, we'll try random picking first
            // If it's near the end of the pool, we'll brute-force search the remaining
            do {
                idx1 = Math.floor(Math.random() * options.length);
                idx2 = Math.floor(Math.random() * options.length);
                if (idx1 === idx2) continue;
                
                // Ensure idx1 is always smaller for a consistent key regardless of order
                const sorted = [idx1, idx2].sort((a, b) => a - b);
                key = `${sorted[0]}-${sorted[1]}`;
                attempts++;
                
                // If random is taking too long (pool getting empty), find first available
                if (attempts > 500) {
                    let found = false;
                    for (let i = 0; i < options.length; i++) {
                        for (let j = i + 1; j < options.length; j++) {
                            const testKey = `${i}-${j}`;
                            if (!seen.includes(testKey)) {
                                key = testKey;
                                [idx1, idx2] = [i, j];
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                }
            } while (seen.includes(key));

            // Save to history
            seen.push(key);
            saveHistory();

            // Randomize Sides for the UI
            const flip = Math.random() > 0.5;
            const topText = flip ? options[idx1] : options[idx2];
            const bottomText = flip ? options[idx2] : options[idx1];
            
            // Render
            document.getElementById('text-top').innerText = topText + "?";
            document.getElementById('text-bottom').innerText = bottomText + "?";
            document.getElementById('counter').innerText = `${seen.length} / ${totalCombos}`;

            // Animation
            const cardEl = document.getElementById('question-card');
            cardEl.classList.remove('card-enter');
            void cardEl.offsetWidth; 
            cardEl.classList.add('card-enter');
        }

        function handleVote() {
            const seenCount = seenComboKeys[currentCatId].length;
            if (seenCount >= totalCombos) {
                setTimeout(() => {
                    alert("Amazing! You've played all unique combinations in this category.");
                    goHome();
                }, 300);
            } else {
                nextCard();
            }
        }

        function saveHistory() {
            localStorage.setItem('wyr_combos_history', JSON.stringify(seenComboKeys));
            updateBadges();
        }

        function updateBadges() {
            Object.keys(gameData).forEach(id => {
                const count = seenComboKeys[id] ? seenComboKeys[id].length : 0;
                const badge = document.getElementById(`badge-${id}`);
                if (badge) {
                    if (count > 0 && count < totalCombos) {
                        badge.innerText = `${count} / ${totalCombos} PAIRS`;
                        badge.classList.add('text-white');
                    } else if (count >= totalCombos) {
                        badge.innerText = "ALL COMBOS SEEN";
                        badge.classList.remove('text-white');
                    } else {
                        // Show correct default combos for each badge
                        badge.innerText = `0 / ${totalCombos} PAIRS`;
                    }
                }
            });
        }

        function clearHistory() {
            seenComboKeys = {};
            localStorage.removeItem('wyr_combos_history');
            updateBadges();
        }

        function goHome() {
            document.getElementById('game').classList.remove('active');
            document.getElementById('home').classList.add('active');
            updateBadges();
        }

        updateBadges();
    </script>
</body>
</html>
