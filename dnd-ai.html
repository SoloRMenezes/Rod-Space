<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0804"><title>AI Dungeon Master</title>
<style>
:root{--bg:#0c0804;--panel:#191006;--card:#24170a;--gold:#d5ad2b;--text:#f4e7c7;--muted:#a68d65;--line:#573a18;--red:#cf4034;--green:#67d58b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 120% 55% at 50% 0,#342107,var(--bg) 60%);color:var(--text);font:16px system-ui,-apple-system,sans-serif}.top{min-height:68px;padding:12px clamp(16px,3vw,34px);display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid var(--gold);background:#130c05}.brand{font:950 18px Georgia,serif;color:var(--gold)}.status{font-size:11px;font-weight:900;letter-spacing:.1em;color:#ffad54}.status.live{color:var(--green)}button{font:inherit;cursor:pointer}.danger,.start,.switch{border:0;border-radius:10px;padding:11px 16px;font-weight:900}.danger{background:#3a1711;color:#ff8e83}.start{background:var(--gold);color:#111}.switch{background:#2b2116;color:var(--text);border:1px solid var(--line)}.start:disabled{opacity:.45;cursor:wait}.layout{width:min(1280px,calc(100% - 28px));margin:22px auto;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(310px,.7fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.story{min-height:520px;padding:clamp(24px,5vw,60px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 50% 35%,#38230c,#160e06 62%)}.eyebrow{color:var(--gold);font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.story h1{font:900 clamp(34px,6vw,72px)/.95 Georgia,serif;color:#f0c84a;margin:14px 0 22px}.narration{max-width:760px;font:clamp(18px,2.2vw,25px)/1.55 Georgia,serif}.choice-note{margin-top:28px;color:var(--muted);font-size:13px}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#0e0904;color:var(--text)}.side{display:grid;gap:16px;align-content:start}.head{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--gold);font-weight:950}.list{display:grid;gap:8px;padding:12px}.row{padding:12px;border:1px solid #3d2914;border-radius:10px;background:var(--card)}.rowline{display:flex;justify-content:space-between;gap:10px}.hp{color:var(--muted);font-size:12px;margin-top:4px}.dead{opacity:.55}.setup{max-width:680px;margin:12vh auto;padding:30px;text-align:center}.setup h1{color:var(--gold);font:900 38px Georgia,serif}.key-row{display:flex;gap:8px;margin:20px auto 10px;max-width:520px}.key-row input{flex:1;min-width:0;padding:13px;border:1px solid var(--line);border-radius:10px;background:#080503;color:#fff;font:inherit}.error{color:#ff8e83;margin-top:12px}.busy{display:none;margin-top:16px;color:var(--gold);font-weight:900}.busy.show{display:block}@media(max-width:800px){.layout{grid-template-columns:1fr}.story{min-height:420px}.top{align-items:flex-start}.top-actions{display:flex;gap:8px}.key-row{flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">🐉 AI DUNGEON MASTER</div><div id="connection" class="status">OPENING PARTY</div></div><div class="top-actions"><button id="start" class="start">BEGIN ADVENTURE</button><button class="danger" onclick="resetGame()">RESET</button></div></header>
<main id="app"><section class="setup"><h1>Waking the Dungeon Master…</h1></section></main>
<script src="party-lan.js"></script><script type="module" src="party-rooms.js"></script><script src="dnd-game.js"></script>
<script>
let state=DndGame.getState(),busy=false,roomReady=false;
const esc=(value='')=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
function render(){
 const app=document.getElementById('app'),scene=state?.scene||{},players=state?.players||[],monsters=(state?.monsters||[]).filter(monster=>Number(monster.cur)>0);
 document.getElementById('start').style.display=scene.narration?'none':'';
 if(!DndGame.hasKey()){app.innerHTML=`<section class="setup panel"><h1>Add your Gemini API key</h1><p>Like NextUp, it is saved only in this browser. It is never added to GitHub or sent to player phones.</p><div class="key-row"><input id="gemini-key" type="password" autocomplete="off" placeholder="Paste Gemini API key"><button class="start" onclick="saveKey()">SAVE KEY</button></div><div class="error" id="key-error"></div></section>`;return}
 if(!scene.narration){app.innerHTML=`<section class="setup panel"><h1>Your AI Dungeon Master is ready</h1><p>Players opening D&amp;D on their phones will join this party automatically.</p><button class="start" onclick="begin()" ${!roomReady?'disabled':''}>BEGIN ADVENTURE</button><div class="busy ${busy||!roomReady?'show':''}">${roomReady?'Gemini is creating the adventure…':'Opening the shared party…'}</div><p><button class="switch" onclick="changeKey()">CHANGE GEMINI KEY</button></p></section>`;return}
 app.innerHTML=`<div class="layout"><section class="panel story"><div class="eyebrow">Chapter ${Number(scene.chapter)||1} · ${esc(state.loc)} · ${esc(state.weath)}</div><h1>${esc(scene.title||'The Adventure')}</h1><div class="narration">${esc(scene.narration)}</div>${monsters.length?'<div class="choice-note">⚔️ Encounter active — players act from their phones.</div>':`<div class="choice-note">The party chooses on their phones:</div><div class="choices">${(scene.choices||[]).map((choice,index)=>`<div class="choice"><b>${index+1}.</b> ${esc(choice)}</div>`).join('')}</div>`}<div class="busy ${busy||state.aiBusy?'show':''}">Gemini is deciding what happens next…</div></section><aside class="side"><section class="panel"><div class="head">THE PARTY</div><div class="list">${players.length?players.map(player=>`<div class="row ${Number(player.currentHP)<=0?'dead':''}"><div class="rowline"><strong>${esc(player.name)}</strong><span>${Number(player.currentHP)<=0?'☠️ DEAD':player.acted?'✓ ACTED':'READY'}</span></div><div class="hp">${esc(player.race)} ${esc(player.className)} · ${Math.max(0,Number(player.currentHP)||0)} HP · ${(player.inventory||[]).length} items</div></div>`).join(''):'<div class="row">Waiting for phones to join…</div>'}</div></section>${monsters.length?`<section class="panel"><div class="head">ENCOUNTER</div><div class="list">${monsters.map(monster=>`<div class="row"><div class="rowline"><strong>${esc(monster.n)}</strong><span>${monster.cur}/${monster.hp} HP</span></div><div class="hp">${esc(monster.atk)}</div></div>`).join('')}</div></section>`:''}<section class="panel"><div class="head">RECENT EVENTS</div><div class="list">${(state.logs||[]).slice(0,6).map(log=>`<div class="hp">${esc(log.msg)}</div>`).join('')}</div></section></aside></div>`;
}
function saveKey(){const input=document.getElementById('gemini-key'),key=input?.value.trim();if(!key){document.getElementById('key-error').textContent='Paste a key first.';return}DndGame.setKey(key);render()}
function changeKey(){DndGame.setKey('');render()}
async function begin(){try{busy=true;render();await DndGame.continueAdventure('Begin a new adventure for the assembled party.')}catch(error){alert(error.message)}finally{busy=false;state=DndGame.getState();render()}}
function resetGame(){if(confirm('Start a new adventure with the same party?'))DndGame.reset()}
async function connect(){try{await DndGame.host(next=>{state=next;render()});roomReady=true;document.getElementById('connection').textContent='PARTY LIVE';document.getElementById('connection').classList.add('live');render()}catch(error){document.getElementById('connection').textContent='CONNECTION FAILED';alert(error.message)}}
document.getElementById('start').onclick=begin;render();connect();
</script>
</body></html>
