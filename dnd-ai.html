<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0804"><title>Dungeon Master</title>
<style>
:root{--bg:#0c0804;--panel:#171006e8;--card:#24170a;--gold:#d5ad2b;--text:#f4e7c7;--muted:#b39b76;--line:#684719;--green:#67d58b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c0804;color:var(--text);font:16px system-ui,-apple-system,sans-serif}.top{min-height:68px;padding:12px clamp(16px,3vw,34px);display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid var(--gold);background:#130c05}.brand{font:950 18px Georgia,serif;color:var(--gold)}.status{font-size:11px;font-weight:900;letter-spacing:.1em;color:#ffad54}.status.live{color:var(--green)}button{font:inherit;cursor:pointer}.danger,.start,.switch,.revive,.tie-choice{border:0;border-radius:10px;padding:11px 16px;font-weight:900}.danger{background:#3a1711;color:#ff8e83}.start,.tie-choice{background:var(--gold);color:#111}.switch,.revive{background:#2b2116;color:var(--text);border:1px solid var(--line)}.start:disabled{opacity:.45;cursor:wait}.layout{width:min(1380px,calc(100% - 28px));margin:22px auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.65fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.story{position:relative;isolation:isolate;min-height:660px;padding:clamp(26px,5vw,68px);display:flex;flex-direction:column;justify-content:end;background-size:cover;background-position:center;box-shadow:inset 0 -260px 180px #0b0603f2}.story:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#06040220 16%,#0b0704d6 70%,#0b0704 100%)}.story.rain:after{content:'';position:absolute;inset:0;z-index:-1;opacity:.28;background:repeating-linear-gradient(105deg,transparent 0 17px,#b9d8ff 18px 19px,transparent 20px 35px);animation:rain .45s linear infinite}.story.fog:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#cfd7d255,transparent 45%,#d9ddd855);filter:blur(18px);animation:fog 7s ease-in-out infinite alternate}.story.sunset:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(#e866223d,#5b183c2d)}.story.night:after{content:'';position:absolute;inset:0;z-index:-1;background:#07152a78}.eyebrow{color:#ffe071;font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 8px #000}.story h1{font:900 clamp(38px,6vw,78px)/.95 Georgia,serif;color:#f0c84a;margin:14px 0 18px;text-shadow:0 4px 22px #000}.narration{max-width:850px;font:clamp(18px,2.15vw,26px)/1.5 Georgia,serif;text-shadow:0 2px 8px #000}.choice-note{margin-top:22px;color:#dfc99f;font-size:13px}.side{display:grid;gap:16px;align-content:start}.head{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--gold);font-weight:950}.list{display:grid;gap:8px;padding:12px}.row{padding:12px;border:1px solid #3d2914;border-radius:10px;background:var(--card)}.rowline{display:flex;justify-content:space-between;gap:10px;align-items:center}.hp{color:var(--muted);font-size:12px;margin-top:4px}.downed{opacity:.72}.revive{padding:6px 9px;font-size:10px}.tie{display:grid;gap:8px;margin-top:16px}.tie-choice{text-align:left}.setup{max-width:680px;margin:12vh auto;padding:30px;text-align:center}.setup h1{color:var(--gold);font:900 38px Georgia,serif}.key-row{display:flex;gap:8px;margin:20px auto 10px;max-width:520px}.key-row input{flex:1;min-width:0;padding:13px;border:1px solid var(--line);border-radius:10px;background:#080503;color:#fff;font:inherit}.error{color:#ff8e83;margin-top:12px}.thinking{display:none;margin-top:18px;color:var(--gold);font-weight:900;align-items:center;gap:12px}.thinking.show{display:flex}.rune{width:28px;height:28px;border:3px solid #5c411b;border-top-color:#f0c84a;border-radius:50%;animation:spin .8s linear infinite}.countdown{color:#f0c84a;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rain{to{background-position:-18px 34px}}@keyframes fog{to{transform:translateX(3%)}}@media(max-width:800px){.layout{grid-template-columns:1fr}.story{min-height:520px}.top{align-items:flex-start}.top-actions{display:flex;gap:8px}.key-row{flex-direction:column}}
</style></head><body>
<header class="top"><div><div class="brand">🐉 DUNGEON MASTER</div><div id="connection" class="status">OPENING PARTY</div></div><div class="top-actions"><button id="start" class="start">BEGIN ADVENTURE</button><button class="danger" onclick="resetGame()">RESET</button></div></header><main id="app"><section class="setup"><h1>Waking the Dungeon Master…</h1></section></main>
<script src="party-lan.js"></script><script type="module" src="party-rooms.js"></script><script src="dnd-game.js"></script><script>
let state=DndGame.getState(),busy=false,roomReady=false,lastSpokenChapter=0,countdownTimer=0;
const esc=(value='')=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
function sceneArt(){const location=`${state.loc||''} ${state.scene?.title||''}`.toLowerCase(),weather=String(state.weath||'').toLowerCase();const image=/(cave|cavern|dungeon|underground|crystal)/.test(location)?'crystal-cavern.webp':/(ruin|tower|castle|shrine|temple|archway)/.test(location)?'ancient-ruins.webp':'enchanted-forest.webp';const mood=/(rain|storm)/.test(weather)?'rain':/(fog|mist)/.test(weather)?'fog':/(sunset|dusk|evening)/.test(weather)?'sunset':/(night|moon)/.test(weather)?'night':'';return{image,mood}}
function speakScene(scene){if(!scene?.narration||Number(scene.chapter)===lastSpokenChapter)return;lastSpokenChapter=Number(scene.chapter);clearInterval(countdownTimer);if(!('speechSynthesis'in window)){DndGame.startVoteTimer();return}speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(scene.narration);voice.rate=.94;voice.pitch=.92;voice.onend=()=>DndGame.startVoteTimer();voice.onerror=()=>DndGame.startVoteTimer();speechSynthesis.speak(voice)}
function render(){const app=document.getElementById('app'),scene=state?.scene||{},players=state?.players||[],monsters=(state?.monsters||[]).filter(monster=>Number(monster.cur)>0),votes=Object.values(state.votes||{}),art=sceneArt();document.getElementById('start').style.display=scene.narration?'none':'';
if(!DndGame.hasKey()){app.innerHTML=`<section class="setup panel"><h1>Add your story engine key</h1><p>It is saved only in this browser. It is never added to GitHub or sent to player phones.</p><div class="key-row"><input id="story-key" type="password" autocomplete="off" placeholder="Paste API key"><button class="start" onclick="saveKey()">SAVE KEY</button></div><div class="error" id="key-error"></div></section>`;return}
if(!scene.narration){app.innerHTML=`<section class="setup panel"><h1>Your Dungeon Master is ready</h1><p>Players opening D&amp;D on their phones will join this party automatically.</p><button class="start" onclick="begin()" ${!roomReady?'disabled':''}>BEGIN ADVENTURE</button><div class="thinking ${busy||!roomReady?'show':''}"><span class="rune"></span>${roomReady?'Creating the adventure…':'Opening the shared party…'}</div><p><button class="switch" onclick="changeKey()">CHANGE STORY KEY</button></p></section>`;return}
const tieChoices=state.voteTied?[...new Set(votes)].map(choice=>`<button class="tie-choice" onclick="pickTie('${encodeURIComponent(choice)}')">${esc(choice)}</button>`).join(''):'';
app.innerHTML=`<div class="layout"><section class="panel story ${art.mood}" style="background-image:url('assets/dnd/backgrounds/${art.image}')"><div class="eyebrow">Chapter ${Number(scene.chapter)||1} · ${esc(state.loc)} · ${esc(state.weath)}</div><h1>${esc(scene.title||'The Adventure')}</h1><div class="narration">${esc(scene.narration)}</div>${monsters.length?'<div class="choice-note">⚔️ Encounter active — each player chooses an action on their phone.</div>':state.voteTied?`<div class="choice-note">Votes are split. The Dungeon Master breaks the tie:</div><div class="tie">${tieChoices}</div>`:`<div class="choice-note">🗳️ ${votes.length}/${players.filter(p=>Number(p.currentHP)>0).length} players voted${state.voteDeadline?` · <span id="vote-time" class="countdown"></span>`:''}</div>`}<div class="thinking ${busy||state.aiBusy?'show':''}"><span class="rune"></span>The Dungeon Master is deciding what happens next…</div></section><aside class="side"><section class="panel"><div class="head">THE PARTY</div><div class="list">${players.length?players.map(player=>`<div class="row ${Number(player.currentHP)<=0?'downed':''}"><div class="rowline"><strong>${esc(player.name)}</strong><span>${Number(player.currentHP)<=0?`🩹 DOWNED <button class="revive" onclick="revive(${player.id})">REVIVE</button>`:player.acted?'✓ ACTED':'READY'}</span></div><div class="hp">${esc(player.race)} ${esc(player.className)} · ${Math.max(0,Number(player.currentHP)||0)} HP · ${(player.inventory||[]).length} items</div></div>`).join(''):'<div class="row">Waiting for phones to join…</div>'}</div></section>${monsters.length?`<section class="panel"><div class="head">ENCOUNTER</div><div class="list">${monsters.map(monster=>`<div class="row"><div class="rowline"><strong>${esc(monster.n)}</strong><span>${monster.cur}/${monster.hp} HP</span></div><div class="hp">${esc(monster.atk)}</div></div>`).join('')}</div></section>`:''}<section class="panel"><div class="head">RECENT EVENTS</div><div class="list">${(state.logs||[]).slice(0,7).map(log=>`<div class="hp">${esc(log.msg)}</div>`).join('')}</div></section></aside></div>`;
clearInterval(countdownTimer);if(state.voteDeadline){const tick=()=>{const el=document.getElementById('vote-time');if(el)el.textContent=`${Math.max(0,Math.ceil((state.voteDeadline-Date.now())/1000))}s`};tick();countdownTimer=setInterval(tick,500)}if(!state.aiBusy)speakScene(scene)}
function saveKey(){const input=document.getElementById('story-key'),key=input?.value.trim();if(!key){document.getElementById('key-error').textContent='Paste the key first.';return}DndGame.setKey(key);render()}function changeKey(){if(confirm('Replace the story engine key saved in this browser?')){DndGame.setKey('');speechSynthesis?.cancel();render()}}async function begin(){if(busy)return;busy=true;render();try{await DndGame.continueAdventure('Begin a new adventure with an immediate, interesting decision.')}catch(error){alert(error.message)}finally{busy=false;render()}}function pickTie(value){DndGame.resolveVote(decodeURIComponent(value),'The Dungeon Master').catch(error=>alert(error.message))}function revive(id){try{DndGame.revivePlayer(id)}catch(error){alert(error.message)}}function resetGame(){if(confirm('Reset the adventure for everyone?')){speechSynthesis?.cancel();lastSpokenChapter=0;DndGame.reset()}}document.getElementById('start').onclick=begin;DndGame.host(next=>{state=next;render()}).then(()=>{roomReady=true;document.getElementById('connection').textContent='PARTY LIVE';document.getElementById('connection').classList.add('live');render()}).catch(error=>{document.getElementById('connection').textContent='PARTY OFFLINE';alert(error.message)});render();
</script></body></html>
