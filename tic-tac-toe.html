<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #161b22, #0d1117 60%);
    color: white;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
}

.status {
    margin-bottom: 24px;
    font-size: 1.3rem;
    letter-spacing: 4px;
    opacity: 0.9;
    font-family: 'Rubik Mono One', system-ui, sans-serif;
}

.game {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 12px;
}

.cell {
    background: linear-gradient(145deg, #1c2128, #12161c);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 5rem;
    cursor: pointer;
    user-select: none;
    border-radius: 18px;
    transition: transform 0.15s ease, background 0.15s ease;
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 8px 18px rgba(0,0,0,0.6);
    font-family: 'Rubik Mono One', system-ui, sans-serif;
}

.cell:hover {
    transform: translateY(-2px);
    background: linear-gradient(145deg, #21262d, #161b22);
}

.cell.taken {
    cursor: default;
    transform: none;
}

.cell.taken:hover {
    background: linear-gradient(145deg, #1c2128, #12161c);
}

.cell:not(.taken):active {
    transform: scale(0.95);
}


.cell.x {
    color: #ff3e3e;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(255,62,62,0.4);
}

.cell.o {
    color: #3e8bff;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(62,139,255,0.4);
}



.win {
    color: #2ecc71;
    text-shadow: 0 0 12px rgba(46,204,113,0.6);
}
</style>
</head>
<body>

<div class="status" id="status">PLAYER X</div>

<div class="game" id="board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
</div>

<script>
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');

    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false;

    const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    function checkWin(player) {
        return wins.some(w => w.every(i => board[i] === player));
    }

    cells.forEach((cell, i) => {
        cell.addEventListener('click', () => {
            if (board[i] || gameOver) return;

            board[i] = current;
            cell.textContent = current;
            cell.classList.add('taken', current.toLowerCase());

            if (checkWin(current)) {
                status.textContent = `PLAYER ${current} WINS`;
                status.classList.add('win');
                gameOver = true;

                setTimeout(() => {
                    board = Array(9).fill(null);
                    cells.forEach(c => {
                        c.textContent = '';
                        c.classList.remove('taken');
                    });
                    current = 'X';
                    gameOver = false;
                    status.classList.remove('win');
                    status.textContent = 'PLAYER X';
                }, 5000);

                return;
            }

            if (!board.includes(null)) {
                status.textContent = 'DRAW';
                gameOver = true;
                return;
            }

            current = current === 'X' ? 'O' : 'X';
            status.textContent = `PLAYER ${current}`;
        });
    });
</script>

</body>
</html>
