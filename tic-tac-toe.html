<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe - Neon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #05070a;
    --x-color: #ff3e3e;
    --o-color: #3e8bff;
    --win-color: #2ecc71;
    --accent-1: #6a11cb;
    --accent-2: #2575fc;
}

body {
    margin: 0;
    background-color: var(--bg-color);
    color: white;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* --- Dynamic Nebula Background --- */
.nebula {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background: 
        radial-gradient(circle at 20% 30%, rgba(106, 17, 203, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(37, 117, 252, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 1) 0%, transparent 100%);
    animation: nebulaShift 10s ease-in-out infinite alternate;
}

@keyframes nebulaShift {
    0% { transform: scale(1); filter: hue-rotate(0deg); }
    100% { transform: scale(1.1); filter: hue-rotate(45deg); }
}

/* Glassmorphism Grid Overlay */
.grid-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black, transparent 90%);
    opacity: 0.5;
}

/* Floating Light Orbs */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    z-index: -1;
    opacity: 0.6;
    animation: moveOrb 20s infinite linear;
}

@keyframes moveOrb {
    0% { transform: translate(0, 0); }
    33% { transform: translate(30vw, 20vh); }
    66% { transform: translate(-20vw, 40vh); }
    100% { transform: translate(0, 0); }
}

/* --- Game UI --- */
.status {
    margin-bottom: 32px;
    font-size: 1.8rem;
    letter-spacing: 6px;
    font-family: 'Rubik Mono One', sans-serif;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
    z-index: 5;
}

.game-container {
    position: relative;
    z-index: 5;
    padding: 20px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 40px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}

.game {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 16px;
}

.cell {
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 4rem;
    cursor: pointer;
    user-select: none;
    border-radius: 20px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    font-family: 'Rubik Mono One', sans-serif;
    position: relative;
}

.cell:hover:not(.taken) {
    background: rgba(255, 255, 255, 0.15);
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255,255,255,0.1);
}

.cell:hover:not(.taken)::after {
    content: var(--current-turn);
    opacity: 0.2;
}

.cell.taken { cursor: default; }

.cell.x { color: var(--x-color); text-shadow: 0 0 20px var(--x-color); }
.cell.o { color: var(--o-color); text-shadow: 0 0 20px var(--o-color); }

.strike {
    position: absolute;
    background: var(--win-color);
    border-radius: 10px;
    display: none;
    z-index: 10;
    box-shadow: 0 0 30px var(--win-color);
}

.win-text {
    color: var(--win-color) !important;
    text-shadow: 0 0 30px var(--win-color);
}

.restart {
    margin-top: 40px;
    padding: 18px 36px;
    border-radius: 20px;
    background: white;
    color: black;
    font-family: 'Rubik Mono One', sans-serif;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px);
    z-index: 5;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.restart.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
.restart:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255,255,255,0.2); }
.home-screen { position:fixed;inset:0;z-index:30;background:#05070a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center; }
.home-screen h1 { font:900 clamp(3rem,12vw,6rem)/.9 'Rubik Mono One',sans-serif;margin:0;letter-spacing:-.06em; }
.home-screen p { color:#94a3b8;max-width:380px;line-height:1.6;margin:24px 0 32px; }
.mode-row { display:flex;gap:12px;flex-wrap:wrap;justify-content:center; }
.mode-btn,.home-btn { border:1px solid #334155;background:#111827;color:#fff;padding:14px 22px;border-radius:10px;font-weight:900;cursor:pointer; }
.mode-btn.primary { background:#fff;color:#05070a; }
.match-bar { position:fixed;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:8;font-weight:800;color:#94a3b8; }
.scoreboard { display:flex;gap:18px; }.scoreboard b{color:#fff}.home-btn{padding:9px 12px;background:#0f172a}
.cell.pop { animation:cellPop .22s ease-out; } @keyframes cellPop{0%{transform:scale(.45);opacity:.2}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@media(max-width:520px){.game{grid-template-columns:repeat(3,26vw);grid-template-rows:repeat(3,26vw);gap:10px}.game-container{padding:12px;border-radius:24px}.cell{font-size:3rem;border-radius:14px}.status{font-size:1.15rem;margin-bottom:22px}.match-bar{top:12px}}
</style>
</head>
<body style="--current-turn: 'X'">

<!-- Improved Visual Background -->
<div class="nebula"></div>
<div class="grid-overlay"></div>
<div class="orb" style="width: 400px; height: 400px; background: var(--accent-1); top: -100px; left: -100px;"></div>
<div class="orb" style="width: 300px; height: 300px; background: var(--accent-2); bottom: -50px; right: -50px; animation-delay: -5s;"></div>

<div class="home-screen" id="homeScreen"><h1>TIC TAC<br>TOE</h1><p>Quick local rounds or a match against the computer. First to line up three wins.</p><div class="mode-row"><button class="mode-btn primary" onclick="startMatch('cpu')">VS COMPUTER</button><button class="mode-btn" onclick="startMatch('local')">TWO PLAYERS</button></div></div>
<div class="match-bar"><button class="home-btn" onclick="goHome()">← HOME</button><div class="scoreboard"><span>X <b id="scoreX">0</b></span><span>DRAW <b id="scoreD">0</b></span><span>O <b id="scoreO">0</b></span></div></div>

<div class="status" id="status">PLAYER X</div>

<div class="game-container">
    <div class="strike" id="strike"></div>
    <div class="game" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
</div>

<button class="restart" id="restartBtn">PLAY AGAIN</button>

<script>
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');
    const strike = document.getElementById('strike');

    let board = Array(9).fill(null);
    let current = 'X';
    let gameOver = false, mode='local', scores={X:0,O:0,D:0},cpuThinking=false;

    const wins = [
        { combo: [0,1,2], type: 'h', pos: 55 },
        { combo: [3,4,5], type: 'h', pos: 181 },
        { combo: [6,7,8], type: 'h', pos: 307 },
        { combo: [0,3,6], type: 'v', pos: 55 },
        { combo: [1,4,7], type: 'v', pos: 181 },
        { combo: [2,5,8], type: 'v', pos: 307 },
        { combo: [0,4,8], type: 'd1' },
        { combo: [2,4,6], type: 'd2' }
    ];

    function drawStrike(win) {
        strike.style.display = 'block';
        if (win.type === 'h') {
            strike.style.width = '100%'; strike.style.height = '6px';
            strike.style.top = `${win.pos}px`; strike.style.left = '0';
            strike.style.transform = 'none';
        } else if (win.type === 'v') {
            strike.style.width = '6px'; strike.style.height = '100%';
            strike.style.left = `${win.pos}px`; strike.style.top = '0';
            strike.style.transform = 'none';
        } else if (win.type === 'd1') {
            strike.style.width = '140%'; strike.style.height = '6px';
            strike.style.top = '50%'; strike.style.left = '-20%';
            strike.style.transform = 'rotate(45deg)';
        } else if (win.type === 'd2') {
            strike.style.width = '140%'; strike.style.height = '6px';
            strike.style.top = '50%'; strike.style.left = '-20%';
            strike.style.transform = 'rotate(-45deg)';
        }
    }

    function place(i){if(board[i]||gameOver||cpuThinking&&current==='O')return;board[i]=current;const cell=cells[i];cell.textContent=current;cell.classList.add('taken',current.toLowerCase(),'pop');setTimeout(()=>cell.classList.remove('pop'),240);const win=wins.find(w=>w.combo.every(idx=>board[idx]===current));if(win){status.textContent=`${current} WINS`;status.classList.add('win-text');drawStrike(win);gameOver=true;scores[current]++;updateScores();restartBtn.classList.add('visible');return}if(!board.includes(null)){status.textContent='DRAW';gameOver=true;scores.D++;updateScores();restartBtn.classList.add('visible');return}current=current==='X'?'O':'X';document.body.style.setProperty('--current-turn',`'${current}'`);status.textContent=mode==='cpu'&&current==='O'?'COMPUTER':'PLAYER '+current;if(mode==='cpu'&&current==='O'){cpuThinking=true;setTimeout(cpuMove,420)}}
    function cpuMove(){if(gameOver)return;const open=board.map((v,i)=>v===null?i:null).filter(i=>i!==null);const winning=open.find(i=>{board[i]='O';const yes=wins.some(w=>w.combo.every(n=>board[n]==='O'));board[i]=null;return yes});const block=open.find(i=>{board[i]='X';const yes=wins.some(w=>w.combo.every(n=>board[n]==='X'));board[i]=null;return yes});const pick=winning??block??(board[4]===null?4:open[Math.floor(Math.random()*open.length)]);cpuThinking=false;place(pick)}
    cells.forEach((cell,i)=>cell.addEventListener('click',()=>place(i)));
    function updateScores(){scoreX.textContent=scores.X;scoreO.textContent=scores.O;scoreD.textContent=scores.D}
    function startMatch(nextMode){mode=nextMode;scores={X:0,O:0,D:0};updateScores();homeScreen.style.display='none';resetRound()}
    function goHome(){homeScreen.style.display='flex';resetRound()}
    function resetRound(){board=Array(9).fill(null);cells.forEach(c=>{c.textContent='';c.classList.remove('taken','x','o')});current='X';cpuThinking=false;document.body.style.setProperty('--current-turn',"'X'");gameOver=false;status.classList.remove('win-text');status.textContent='PLAYER X';restartBtn.classList.remove('visible');strike.style.display='none'}

    restartBtn.addEventListener('click', () => {
        resetRound();
    });
</script>
</body>
</html>
