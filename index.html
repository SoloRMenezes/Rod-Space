      // Dynamic states
      let searchQuery = "";
      let activeCategory = "all";
      let sortBy = "newest";

      // Persistent lists
      let favorites = [];
      let pinned = [];

      try {
        favorites = JSON.parse(localStorage.getItem("rod_space_favs")) || [];
        pinned = JSON.parse(localStorage.getItem("rod_space_pins")) || [];
      } catch (e) {
        favorites = [];
        pinned = [];
      }

      function saveStates() {
        localStorage.setItem("rod_space_favs", JSON.stringify(favorites));
        localStorage.setItem("rod_space_pins", JSON.stringify(pinned));
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        const toastMessage = document.getElementById("toastMessage");
        toastMessage.textContent = message;
        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.add("hidden");
        }, 3000);
      }

      function toggleFavorite(id, event) {
        event.stopPropagation();
        const index = favorites.indexOf(id);
        if (index > -1) {
          favorites.splice(index, 1);
        } else {
          favorites.push(id);
        }
        saveStates();
        render();
      }

      function togglePin(id, event) {
        event.stopPropagation();
        const index = pinned.indexOf(id);
        if (index > -1) {
          pinned.splice(index, 1);
        } else {
          if (pinned.length >= 3) {
            showToast("Maximum limit of 3 pinned items reached!");
            return;
          }
          pinned.push(id);
        }
        saveStates();
        render();
      }

      // Keyboard Listeners
      document.addEventListener("keydown", (e) => {
        const searchInput = document.getElementById("searchInput");
        if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      // DOM Node references
      const searchInput = document.getElementById("searchInput");
      const clearSearchBtn = document.getElementById("clearSearchBtn");
      const searchShortcut = document.getElementById("searchShortcut");
      const sortSelect = document.getElementById("sortSelect");
      const categoriesContainer = document.getElementById("categoriesContainer");
      const projectsSection = document.getElementById("projectsSection");

      // Set input event handlers
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        if (searchQuery) {
          clearSearchBtn.classList.remove("hidden");
          searchShortcut.classList.add("hidden");
        } else {
          clearSearchBtn.classList.add("hidden");
          searchShortcut.classList.remove("hidden");
        }
        render();
      });

      clearSearchBtn.addEventListener("click", () => {
        searchQuery = "";
        searchInput.value = "";
        clearSearchBtn.classList.add("hidden");
        searchShortcut.classList.remove("hidden");
        render();
      });

      sortSelect.addEventListener("change", (e) => {
        sortBy = e.target.value;
        render();
      });

      // Categories setup
      const CATEGORIES = [
        { id: "all", label: "All Works" },
        { id: "solo", label: "Solo Games" },
        { id: "party", label: "Party Games" },
        { id: "tool", label: "Tools" },
        { id: "favorites", label: "Starred ★" },
        { id: "pinned", label: "Pinned 📌" }
      ];

      function renderCategories() {
        categoriesContainer.innerHTML = "";
        CATEGORIES.forEach(cat => {
          const btn = document.createElement("button");
          const isActive = activeCategory === cat.id;
          btn.className = `relative rounded-full px-5 py-2 text-xs font-semibold uppercase tracking-wider transition-all duration-200 cursor-pointer border ${
            isActive
              ? "bg-blue-600 text-white border-blue-500 shadow-md shadow-blue-950/20"
              : "bg-[#161b22] border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700"
          }`;
          btn.textContent = cat.label;
          btn.onclick = () => {
            activeCategory = cat.id;
            renderCategories();
            render();
          };
          categoriesContainer.appendChild(btn);
        });
      }

      function getFilteredAndSorted() {
        let items = PROJECTS_DATA.filter(proj => {
          const isFav = favorites.includes(proj.id);
          const isPinned = pinned.includes(proj.id);

          if (activeCategory === "favorites") return isFav;
          if (activeCategory === "pinned") return isPinned;
          if (activeCategory === "solo") return proj.type === "solo";
          if (activeCategory === "party") return proj.type === "party";
          if (activeCategory === "tool") return proj.type === "tool";
          return true;
        });

        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase().trim();
          items = items.filter(proj =>
            proj.name.toLowerCase().includes(q) ||
            proj.description.toLowerCase().includes(q) ||
            proj.pill.toLowerCase().includes(q) ||
            (proj.tags && proj.tags.some(t => t.toLowerCase().includes(q)))
          );
        }

        items.sort((a, b) => {
          if (sortBy === "az") return a.name.localeCompare(b.name);
          if (sortBy === "za") return b.name.localeCompare(a.name);
          if (sortBy === "oldest") return new Date(a.date) - new Date(b.date);
          return new Date(b.date) - new Date(a.date);
        });

        return items;
      }

      function buildCardHTML(proj, isPinnedItem) {
        const isFav = favorites.includes(proj.id);
        const isPin = pinned.includes(proj.id);

        let pillStyles = "";
        if (proj.pill === "Game") {
          pillStyles = "bg-rose-500/10 text-rose-400 border border-rose-500/20";
        } else if (proj.pill === "Tool") {
          pillStyles = "bg-cyan-500/10 text-cyan-400 border border-cyan-500/20";
        } else {
          pillStyles = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        }

        const favClass = isFav ? "bg-amber-500/10 border-amber-500/30 text-amber-400" : "bg-[#0d1117] border-slate-800 text-slate-500 hover:text-slate-300";
        const pinClass = isPin ? "bg-blue-500/10 border-blue-500/30 text-blue-400" : "bg-[#0d1117] border-slate-800 text-slate-500 hover:text-slate-300";

        let tagsHTML = "";
        if (proj.tags && proj.tags.length > 0) {
          proj.tags.forEach(t => {
            const tagBg = t === "PC Only" ? "bg-rose-950/30 text-rose-400 border border-rose-500/10" : "bg-amber-950/30 text-amber-400 border border-amber-500/10";
            tagsHTML += `
              <span class="inline-flex items-center gap-1 rounded px-1.5 py-0.5 text-[9px] font-mono font-bold ${tagBg}">
                <i data-lucide="laptop" class="h-2.5 w-2.5"></i>
                ${t}
              </span>
            `;
          });
        }

        const launchBtnClass = isPin ? "bg-blue-600 text-white hover:bg-blue-500 shadow-md" : "bg-[#0d1117] text-slate-300 border border-slate-800 hover:border-slate-700 hover:bg-slate-900 hover:text-white";

        const formattedDate = new Date(proj.date).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });

        return `
          <article
            class="group relative flex flex-col h-full rounded-2xl bg-[#161b22] border p-6 transition-all duration-300 shadow-xl cursor-pointer hover:-translate-y-1 ${
              isPin ? 'border-blue-500/30 bg-gradient-to-b from-blue-950/10 to-[#161b22]' : 'border-slate-800 hover:border-blue-500/30'
            }"
            onclick="if (!event.target.closest('button')) { window.location.href = '${proj.url}' }"
          >
            <!-- Top Action Row -->
            <div class="flex items-center justify-between mb-4">
              <span class="inline-flex items-center rounded-lg px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider ${pillStyles}">
                ${proj.pill}
              </span>
              <div class="flex items-center gap-1.5 opacity-60 group-hover:opacity-100 transition-opacity">
                <button
                  onclick="toggleFavorite('${proj.id}', event)"
                  title="${isFav ? 'Remove from Favorites' : 'Mark as Favorite'}"
                  class="p-1.5 rounded-lg border text-xs cursor-pointer transition-colors ${favClass}"
                >
                  <i data-lucide="star" class="h-3.5 w-3.5 ${isFav ? 'fill-amber-400' : ''}"></i>
                </button>
                <button
                  onclick="togglePin('${proj.id}', event)"
                  title="${isPin ? 'Unpin Project' : 'Pin up to 3 projects'}"
                  class="p-1.5 rounded-lg border text-xs cursor-pointer transition-colors ${pinClass}"
                >
                  <i data-lucide="pin" class="h-3.5 w-3.5 ${isPin ? 'fill-blue-400' : ''}"></i>
                </button>
              </div>
            </div>

            <!-- Emojis and details -->
            <div class="flex items-start gap-4 flex-1">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#0d1117] border border-slate-800 shadow-inner text-2xl transition-transform group-hover:scale-110 duration-300 select-none">
                ${proj.icon}
              </div>
              <div class="min-w-0 flex-1">
                <h4 class="font-display text-base font-semibold text-white tracking-tight group-hover:text-blue-400 transition-colors line-clamp-1">
                  ${proj.name}
                </h4>
                <p class="mt-1 text-xs text-slate-500 leading-relaxed line-clamp-2">
                  ${proj.description}
                </p>
              </div>
            </div>

            <!-- Tag shelf -->
            ${tagsHTML ? `<div class="flex flex-wrap gap-1.5 mt-4">${tagsHTML}</div>` : ''}

            <!-- Launch Action Footer -->
            <div class="mt-5 pt-4 border-t border-slate-800/60 flex items-center justify-between">
              <span class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">
                ${formattedDate}
              </span>
              <a
                href="${proj.url}"
                class="inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold cursor-pointer transition-all ${launchBtnClass}"
              >
                <span>${proj.pill === "Tool" ? "Open" : "Play"}</span>
                <i data-lucide="chevron-right" class="h-3 w-3 transition-transform group-hover:translate-x-0.5"></i>
              </a>
            </div>
          </article>
        `;
      }

      function render() {
        const items = getFilteredAndSorted();
        
        if (items.length === 0) {
          projectsSection.innerHTML = `
            <div class="text-center py-20 border border-dashed border-slate-800 rounded-3xl bg-[#161b22]/20">
              <div class="text-4xl mb-4">🔍</div>
              <h3 class="font-display text-lg font-semibold text-slate-300">No projects found</h3>
              <p class="text-sm text-slate-500 mt-1 max-w-sm mx-auto">
                No matches for "${searchQuery}" or chosen category. Try adjusting your search query or reset filters.
              </p>
              <button
                onclick="searchQuery=''; activeCategory='all'; document.getElementById('searchInput').value=''; document.getElementById('clearSearchBtn').classList.add('hidden'); document.getElementById('searchShortcut').classList.remove('hidden'); renderCategories(); render();"
                class="mt-4 inline-flex items-center justify-center rounded-xl bg-blue-600 hover:bg-blue-500 px-4 py-2 text-xs font-semibold text-white transition-all border border-blue-500 shadow-md"
              >
                Clear all filters
              </button>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        const pinnedList = items.filter(p => pinned.includes(p.id));
        const regularList = items.filter(p => !pinned.includes(p.id));

        let html = "";

        // Pinned Shelf
        if (pinnedList.length > 0 && activeCategory !== "pinned") {
          html += `
            <div class="space-y-4">
              <div class="flex items-center gap-2 pb-2 border-b border-slate-800/80">
                <i data-lucide="pin" class="h-4 w-4 text-blue-500"></i>
                <h3 class="font-display text-xs font-bold tracking-widest text-slate-400 uppercase">
                  Pinned Projects (${pinnedList.length}/3)
                </h3>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                ${pinnedList.map(p => buildCardHTML(p, true)).join('')}
              </div>
            </div>
          `;
        }

        // Regular Shelf
        if (regularList.length > 0) {
          const showHeader = pinnedList.length > 0 && activeCategory !== "pinned";
          html += `
            <div class="space-y-4">
              ${showHeader ? `
                <div class="flex items-center gap-2 pb-2 border-b border-slate-800/80 pt-4">
                  <i data-lucide="grid" class="h-4 w-4 text-slate-500"></i>
                  <h3 class="font-display text-xs font-bold tracking-widest text-slate-500 uppercase">
                    All Experiments
                  </h3>
                </div>
              ` : ''}
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                ${regularList.map(p => buildCardHTML(p, false)).join('')}
              </div>
            </div>
          `;
        }

        projectsSection.innerHTML = html;
        lucide.createIcons();
      }

      // Initial Bootstrap
      renderCategories();
      render();
    </script>
  </body>
</html>
