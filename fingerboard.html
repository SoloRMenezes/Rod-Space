<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101411">
  <title>Two Fingers — Fingerboard Session</title>
  <style>
    :root{--night:#101411;--panel:#171e19eF;--paper:#f1f0e9;--muted:#a9b2aa;--lime:#c7ff45;--orange:#ff6b4a;--line:#ffffff32}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:Inter,Arial,sans-serif;touch-action:none;user-select:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;z-index:2;inset:max(13px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) auto max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .brand{display:flex;align-items:center;gap:10px;text-shadow:0 2px 15px #0009}.brand-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:var(--lime);color:#121710;font-weight:1000;font-size:21px;transform:rotate(-5deg)}.brand strong{font-size:14px;letter-spacing:.11em;text-transform:uppercase}.brand small{display:block;margin-top:3px;color:#e2e5dbb8;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
    .stats{display:flex;gap:8px}.stat{min-width:76px;padding:9px 12px;border:1px solid #ffffff28;border-radius:12px;background:#101511d9;backdrop-filter:blur(12px)}.stat b{display:block;font-size:21px;line-height:1}.stat small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    button{border:1px solid #ffffff38;border-radius:11px;background:#1b241e;color:var(--paper);padding:11px 14px;font:800 11px Inter,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}button:hover{border-color:var(--lime);background:#273226}button:active{transform:scale(.97)}button:disabled{cursor:wait;opacity:.72;transform:none}.primary{border-color:var(--lime);background:var(--lime);color:#151a12}.primary:hover{background:#d7ff77;color:#151a12}.icon{width:40px;height:40px;padding:0;background:#101511d9;font-size:17px}.actions{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right));top:max(63px,calc(env(safe-area-inset-top) + 54px));display:flex;gap:7px}
    .session{position:fixed;z-index:2;left:16px;bottom:max(15px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;pointer-events:none}.park-tag{padding:9px 12px;border:1px solid #ffffff32;border-radius:10px;background:#101511c9;backdrop-filter:blur(10px);font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.park-tag span{color:var(--lime);margin-right:7px}.controls{position:fixed;z-index:3;right:16px;bottom:max(15px,env(safe-area-inset-bottom));display:flex;gap:7px}.trick-btn{min-width:74px;text-align:center;border-color:#ffffff40;background:#101511d9}.trick-btn b{display:block;color:var(--lime);font-size:10px}.trick-btn small{font-size:9px;color:var(--muted);letter-spacing:.02em}
    #trick{position:fixed;z-index:2;top:22%;left:50%;transform:translateX(-50%) rotate(-2deg);font-size:clamp(30px,6vw,62px);font-weight:1000;text-align:center;text-transform:uppercase;text-shadow:0 3px 25px #000b;opacity:0;transition:opacity .12s;pointer-events:none}#trick.show{opacity:1}#trick small{display:block;font-size:.24em;letter-spacing:.13em;color:var(--lime)}
    .overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:20px;background:#0609068a;backdrop-filter:blur(9px)}.panel{width:min(720px,100%);max-height:92vh;overflow:auto;padding:clamp(22px,4vw,38px);border:1px solid #ffffff28;border-radius:24px;background:linear-gradient(145deg,#202a22f5,#111713f5);box-shadow:0 24px 90px #0009}.eyebrow{margin:0 0 11px;color:var(--lime);font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}h1{margin:0 0 13px;font-size:clamp(43px,9vw,76px);line-height:.84;letter-spacing:-.075em;text-transform:uppercase}h1 em{font-style:normal;color:var(--lime)}.lead{max-width:510px;margin:0 0 23px;color:#d3d8d0;font-size:14px;line-height:1.5}.menu-actions{display:flex;gap:9px;margin-top:17px}.menu-actions button{flex:1;min-height:46px}.credits{margin:20px 0 0;color:#929c93;font-size:10px;line-height:1.45;text-align:center}.menu-panel{width:min(490px,100%);padding:clamp(28px,5vw,42px);text-align:center}.menu-panel h1{margin:0 0 26px;font-size:clamp(48px,10vw,72px)}#start{width:100%;min-height:58px;font-size:13px}.map-block{margin-top:26px}.map-label{display:block;margin-bottom:10px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.map-name{margin:0;color:var(--paper);font-size:clamp(15px,4vw,19px);font-weight:850;letter-spacing:.06em;text-transform:uppercase}.hidden{display:none!important}
    @media(max-width:650px){.panel{max-height:88vh}.stats{gap:5px}.stat{min-width:61px;padding:8px}.stat b{font-size:18px}.actions{top:auto;bottom:68px;right:12px}.controls{right:12px;bottom:max(12px,env(safe-area-inset-bottom));gap:4px}.trick-btn{min-width:60px;padding:8px 6px}.session{left:12px;bottom:73px}.brand small{display:none}.overlay{padding:12px}.menu-panel{padding:30px 24px}.map-picker{grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}}
  </style>
</head>
<body>
  <div class="hud"><div class="brand"><div class="brand-mark">2</div><div><strong>Two Fingers</strong><small>Fingerboard session</small></div></div><div class="stats"><div class="stat"><b id="score">0</b><small>Score</small></div><div class="stat"><b id="best">0</b><small>Best</small></div></div></div>
  <div class="actions"><button class="icon" id="pause" aria-label="Pause">Ⅱ</button><button class="icon" id="sound" aria-label="Toggle sound">♪</button></div>
  <div id="trick"><span></span><small></small></div>
  <div class="session"><div class="park-tag"><span>LIVE PARK</span><b id="park-label">Dartford</b></div></div>
  <div class="controls"><button class="trick-btn" id="ollie"><b>OLLIE</b><small>front → back</small></button><button class="trick-btn" id="nollie"><b>NOLLIE</b><small>back → front</small></button><button class="trick-btn" id="flip"><b>FLIP</b><small>in air</small></button></div>
  <div class="overlay" id="intro"><section class="panel menu-panel"><h1>Two<br><em>Fingers.</em></h1><button class="primary" id="start" disabled>Loading parks…</button><div class="map-block"><span class="map-label" id="park-label">Connected park</span><strong class="map-name" id="park-name">Dartford · Finsbury · Gravesend</strong></div><p class="credits">Models by artfletch · CC BY 4.0.</p></section></div>
  <div class="overlay hidden" id="gameover"><section class="panel"><p class="eyebrow">Session complete</p><h1>Run<br><em>over.</em></h1><p class="lead" id="final"></p><div class="menu-actions"><button class="primary" id="again">Run it back</button><button onclick="location.href='/'">Rod Space</button></div></section></div>
  <div class="overlay hidden" id="paused"><section class="panel"><p class="eyebrow">Take a breather</p><h1>Paused.</h1><div class="menu-actions"><button class="primary" id="resume">Keep skating</button><button onclick="location.href='/'">Rod Space</button></div></section></div>
  <script type="module" src="./fingerboard-3d.js?v=connected-parks-mouse-lock"></script>
  <script src="rod-space-app-menu.js"></script>
</body>
</html>
